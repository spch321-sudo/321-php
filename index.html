後陪他去找專業協助。"],["p","第三個偏差，是把 1:20「無論是生是死」講成生死由神決定，所以不必看醫生、不必吃藥。主權在神，不等於放棄神所賜的醫治；身體被好好照顧，基督一樣在其中顯大。第 2 章保羅說以巴弗提病得幾乎要死，「然而神憐恤他」。"],["p","第四個偏差，是把 1:18「這有何妨」講成動機不重要，或叫被同工嫉妒、排擠的人「不要計較，閉嘴就好」。保羅先分辨了，也說出那是苦楚；他放手的是審判別人的心，不是放棄分辨，更不是叫人忍受傷害。"],["p","第五個偏差，是把「活著就是基督」講成真正屬靈的人不該有自己的需要和感受，或把這一章講成「保羅好偉大，我們要像他」。中心換了，人沒有消失；而這一章的主詞是神：他動了善工，他必成全，基督之靈供應，基督在身體上顯大。"],["d",["「活著就是基督」和 321 的無己，是不是要我把自己的需要和感受都消滅？","不是。無己的定義要以 2:5--8 為準：基督虛己的時候，本有神的形像，知道自己是誰；他是自己主動給出，被迫的不叫虛己，叫受害。所以無己不是沒有自己，是不以自己為中心；不是自我消滅，是自我給出。看看保羅：他承認有苦楚，第 2 章他還說以巴弗提病好了，「免得我憂上加憂」，第 3 章他說「應當防備」。他有感受，會分辨，說得出需要，也設得了界線。如果你常覺得自己不該存在、不配有需要，那不是無己，那需要被安慰、被醫治，必要時尋求輔導的協助（全卷立場見 ISS00_2）。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：病床旁的那一句「活著沒意思，只會拖累你們」。很多家庭都聽過長輩這樣說，我們常常急著打斷：不要亂講。可是 1:24 給了另一種回答的方式：先坐下來聽他說完，然後很具體地告訴他，你活著，對我是要緊的；說出一件他還在給這個家的東西，哪怕只是一句吃飽了沒有。若他反覆說想死，那不只是心情，請陪他一起告訴醫生和輔導。"],["p","第二個問題：同工之間的「面子」和「搶位子」。華人教會很少當面吵，常常是不說話、另組一個群組。1:15--18 讓我們看見一條路：可以分辨，可以在對的場合把問題說出來；但是不讓那個人坐在我心裡的中心，每天反覆播放。可以問：這一週我想起他，比想起基督多嗎？若那件事已經是傷害或欺壓，那就不只是面子，請找一位信得過的牧者一起處理。"],["h","七、活出321——活著的內容換成一個人"],["p","走到這裡，我們才把國度321空中團契常說的「焦點在耶穌，不在自己、不在別人、不在環境」接上去。環境是鍊子，別人是嫉妒的傳道人，自己是生死的去留；保羅的眼睛三次都轉回基督。"],["p","耶穌是我的榜樣：主在客西馬尼園說：「我心裡甚是憂傷，幾乎要死」（太 26:38），他沒有假裝不苦，卻把去留交給父。保羅為腓立比人留下，是從他身上學來的；下一章，保羅要把這一位往下走的樣子完整地唱出來。"],["p","聖經是我的準則：讀 1:21 一定讀到 1:24--25，這不是技巧，是對經文的順服；我們不從經文裡挑自己想聽的半句。"],["p","聖靈是我的引導：保羅說他是被「耶穌基督之靈的幫助」供應著走過去的。哪一個人需要我留下來陪他，哪一個為難我的人要先放手、哪一件事要說出來，求聖靈給我那雙有眼睛的愛。"],["p","讓耶穌作王：這一章要人讓出三個位置。處境的主詞，讓給福音；審判人心的座位，讓給神；生死的決定權，也讓給他，承認這條命是他的，所以更要好好守住。"],["p","讓耶穌得著一切的榮耀：保羅的禱告收在「叫榮耀稱讚歸與神」，他的盼望收在「總叫基督在我身上照常顯大」。病床上被好好陪伴的人，被看見的是那一位叫人活下去的主。"],["p","建立屬神的體系：教會是天國放在這座城裡的一塊領土。讓每一位住院的、喪親的、說過不想活的弟兄姊妹都有人知道、有人輪流探望、有人陪他就醫；讓同工在帶領的人不在的時候，照樣朝同一個方向站著。"],["h","八、四種心，聽見同一封信"],["p","驕傲型的心，聽到 1:15 會很快想到別人：對，就是那個搶功勞的人。可是請再聽一次那一句「這有何妨呢」。你看得很清楚，這沒有錯；問題是，那個人已經坐在你心裡的中心多久了？把審判的座位讓出來，不是輸，是讓神作神。"],["p","恐懼型的心，最怕的是那一場還沒有判的案子：檢查報告、裁員名單、孩子的前途。保羅也在等判決，他求的不是結果，是「沒有一事叫我羞愧」。你可以誠實地怕，也可以禱告：主啊，結果在你手上，求你叫基督在我身上照常顯大。"],["p","羞恥型的心，覺得自己是教會的負擔：沒有恩賜，常生病，只會麻煩人。請聽 1:1：在基督耶穌裡的眾聖徒，你就在那個「眾」字裡面；也請聽 1:7，連坐監的保羅都說腓立比人與他一同得恩。被需要的，不只是能做事的人。"],["p","受傷型的心，也許你讀到 1:23 的時候，心裡有一句「我也想離開」。請不要一個人扛這一句。保羅留下來，不是因為日子變輕了，是因為有人需要他；我們也需要你。若那個念頭已經很具體，請在今天告訴一位信得過的人，讓我們陪你找到醫生、輔導和危機支援。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上用 1:20 禱告：主啊，今天無論順不順，總叫基督在我身上照常顯大；並把一件你最想自己作主的事，指名交給他。"],["p","第二，找出你手上那一條「鍊子」：一張病床、一份辭不掉的工作、一位長期要照顧的家人。記下一個因為這條鍊子才出現在你身邊的人，為他的名字禱告一次。"],["p","第三，這七天，每當你發現自己又在想那個為難你的人，就記下時間；先誠實說「這是在為難我」，再問 1:10 的那個問題：在這件事裡，甚麼才是真正要緊的？"],["p","第四，選定一天，去看或打電話給一位正在生死之間、或在低谷裡的人：病床上的長輩、喪親的朋友、說過「好累」的同事。先聽他說完，再告訴他一句：你活著，對我是要緊的。"],["p","第五，在小組裡排一張探望與陪診的名單，並讓每一位組員都知道當地的危機支援電話和輔導管道，抄在手機裡。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：那在我心裡動了善工的，必成全這工；我的生命不會爛尾。"],["p","我宣告：我的處境不是故事的主詞，別人的惡意也不是；基督究竟被傳開了。"],["p","我宣告：我活著就是基督；生死的主權在神，我的日子交在他手中。"],["p","我宣告：我在肉身活著是要緊的；我要為別人的長進和喜樂活下去。"],["d",["家人或朋友對我說「不想活了」，我當下該說甚麼、做甚麼？","第一，先不要慌，也不要急著糾正他的想法，坐下來聽他說完。可以直接、溫和地問：你是想到要結束自己的生命嗎？直接問不會把念頭放進他心裡，反而讓他知道可以說。第二，告訴他你在乎他，像 1:24 那樣說：你活著，對我是要緊的；不要說「你要有信心」「想想你的家人」這種會讓他更羞愧的話。第三，不讓他一個人，若他已經有具體的計畫或工具，請立刻陪他就醫，或打當地的緊急電話與危機支援。第四，當天就聯絡一位可以一起承擔的同工或家人，你也不必一個人扛。第五，接下來幾週持續探望。這就是禁卒在監門口聽見的那一句：不要傷害自己，我們都在這裡。"]],["h","十、結語"],["p","我們回到呂底亞家裡。信讀完第一章，油燈還亮著，以巴弗提把羊皮紙捲起來，說：後面還很長。可是那一晚，一屋子曾經被鬼附、被鞭打、想過去死的人，已經聽見了最要緊的一句：一個在鍊子底下的人，為他們選擇留下來。"],["p","可是這一課的焦點，不在保羅多勇敢，也不在我們學會說「活著就是基督」。焦點在保羅留下來的那個樣子是從哪裡學來的。他說，離世好得無比，然而為你們，我留下；下一章他要告訴腓立比人，有一位本來就在父的榮耀裡，好得無比，卻為我們下來，一直走到十字架。你不必更佩服保羅，只要更認識保羅所活的那一位。"],["p","我們一起低頭禱告。那在我們心裡動了善工的父神，謝謝你必成全這工。赦免我們常把處境和別人當作生命的中心。為那些心裡很累、不想再活下去的人，求你差人到他們身邊，讓他們知道他們活著是要緊的；也給我們眼睛和腳，這一週去陪一位在病床旁、在低谷裡的人。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰比較看得開，是讓每一個人說出手上的那條鍊子、心裡的那個人，也說出這一週要去陪的那一位；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是鎖、活、稱。席上可能有正在病床旁的家屬、剛喪親的人，也可能有心裡有輕生念頭、還沒說出口的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：開工完工的都是神；焦點不在環境、不在別人；1:21--23 一定讀到 1:24--25。"],["n","1. ★ 說一次你「走不開」的經驗：陪家人住院、一份辭不掉的工作。那段時間，身邊出現過哪一個原本不會遇見的人？"],["n","2. ★★★ 保羅說死了的益處是「與基督同在」，結論卻是「為你們更是要緊的」。請用一句話說：為甚麼停在 1:21 讀這一段，會讀出完全相反的意思？"],["n","3. ★★ 1:18 保羅對動機不純的人說「這有何妨」，加拉太書卻對傳別的福音的人一步不讓。請說出這兩種處境的分別，各舉一個今天的例子。"],["n","4. ★★ 腓立比是羅馬的駐防城，保羅說要像天國的公民一樣過日子。你的公司或社區有哪一條「憲法」和福音最不一樣？"],["m","帶領提醒：讀 1:21--26 時請一口氣讀完六節，不停在 1:21 或 1:23。碰到輕生或喪親的分享，不追問細節，不說教，會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出手上的那條鍊子、心裡被誰佔了中心，並說出這一週要去陪的那一個人。"],["t","【看】看見自己"],["n","5. ★★★ 說出你手上的那一條鍊子（病床、工作、照顧），或一個佔據你心裡中心的人（不必說名字）。這一週你想起他，比想起基督多嗎？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:6 和 1:20 兩遍，第二遍把「你們」「我」換成你自己的名字。讀完說一句：你聽見神對你的哪一件事說，我必成全？"],["t","【想】想通關卡"],["n","7. ★★★ 你的眼睛轉不回基督，卡在哪裡：怕那個結果、放不下那個人、覺得自己是負擔，還是真的很累？選一個說出來，不必解釋。"],["t","【講】說出口"],["n","8. ★★ 請對右手邊的人說：「你在肉身活著，對我們是要緊的。」聽的人只回一句「謝謝你，我聽見了」，不給建議，然後換人。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要去陪的那一個人：名字或關係、星期幾、在哪裡、做哪一件事（探病、一頓飯、一通電話）。若那個需要被陪的人就是你自己，改寫下你要告訴的那一位信得過的人和哪一天。"],["m","帶領提醒：這一化可能碰到輕生的念頭、重病、喪親、長期無望感或被同工傷害的經驗。不追問細節，不說教，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」。若有人說出想死的念頭，不在組裡討論，會後單獨關心，當天確認他的安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天用 1:20 禱告、一次探望、一張小組的陪伴名單、一個要帶的人。"],["n","10. ★★ 我們的小組有沒有一張探望與陪診的名單？說出這個月一位需要被輪流探望的人，和你可以負責的那一天、那一件事。"],["n","11. ★ 說出一位因為信主被為難的人，這一週哪一天你要為他指名禱告，並站在他旁邊說一句話？"],["n","12. ★★ 帶領的人不在的時候，你的小組還朝同一個方向站嗎？說出這一週你可以補上的一件小事，和找誰一起做。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：你活著，對神和對我都是要緊的。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一個人坐監等判決，不知道會活還是會死。第二句，他說活著的內容是耶穌，還說為了朋友的需要，他選擇活下去。第三句，所以你的生命也是要緊的，有一位先為你留下來了。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心別人」這類答案。探望有輕生念頭的人，不必一個人扛；不追問細節，不說教，會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要去陪的那一個人是誰。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位正在病床上的人，求主賜他好的醫治與照顧，叫基督在他身上照常顯大；一位心裡很累、不想再活下去的人，求主差人到他身邊；一位因為信主被為難的人，求主叫他站立得穩，不怕驚嚇。"],["p","散會以前，確認紙上寫了三樣：要去陪的那一個人、你手上的那一條鍊子、你的那個「2」。下次帶來對。"]]},"2":{"no":2,"vol":"《321腓立比書講義》第二課·腓立比書第二章","title":"抄下這首歌的人——心、空、光","chars":5222,"min":60,"deep":8,"dchars":1791,"tchars":1297,"blocks":[["h","一、抄下這首歌的人"],["p","弟兄姊妹平安。我叫提摩太。這兩年，我常坐在羅馬一間租來的屋子裡。屋裡總有一個兵，一條鍊子的另一頭，鎖在保羅的手腕上。保羅寫信，多半是用口說的，旁邊的人一句一句寫下來。那一天他說到腓立比，說到友阿蝶和循都基兩位姊妹不和，停了很久，然後慢慢說：「你們當以基督耶穌的心為心」（2:5）。"],["p","他接著往下說，說得比平常慢：「他本有神的形像，不以自己與神同等為強奪的；反倒虛己，取了奴僕的形像，成為人的樣式」（2:6–7）。說到「奴僕」兩個字，我想起了路司得。我母親是信主的猶太人，父親是希臘人；在會堂裡我不夠猶太，在街上我又不夠希臘。是保羅經過那裡，說要帶我同去。路加後來這樣記：「在那裡有一個門徒，名叫提摩太，是信主之猶太婦人的兒子，他父親卻是希臘人。」（徒 16:1）"],["p","這些年，他待我像兒子。他沒有把我當成跟班，倒常讓我站到前面去。腓立比教會出生的那幾天，我在；哥林多鬧得最兇的時候，他打發我去，還寫信說：「他在主裡面，是我所親愛、有忠心的兒子。」（林前 4:17）那一天聽他口述基督往下走的七步，我才懂：他待我的樣子，是從一位主那裡學來的。"],["p","然後他說到我。他說：「但你們知道提摩太的明證；他興旺福音，與我同勞，待我像兒子待父親一樣。」（2:22）寫信的人寫到自己的名字，是會停一下的。我注意到他沒有說「他服事我」，他說「與我同勞」：兩個人並肩，一起服事福音。"],["p","以上是想像。經文沒有告訴我們那天是誰執筆，只告訴我們這封信的第一句：「基督耶穌的僕人保羅和提摩太寫信給凡住腓立比、在基督耶穌裡的眾聖徒」（1:1）。可是有一件事不是想像：寫下全本新約最高的一首基督之歌時，保羅身邊坐著一個被他當兒子待的年輕人。這一章的道理，提摩太親眼看過它長在一個人身上。"],["p","這一課我們走完腓立比書第二章，用三個字：心、空、光。照書信三問，先問第一問：腓立比人遇到甚麼？這是一間很愛主、很肯奉獻的教會，可是第四章點了兩個名字：「我勸友阿蝶和循都基，要在主裡同心。」（4:2）好人也會吵架，而且常常吵在最熱心的地方。第二章，就是寫給這樣一間教會的。"],["d",["2:6–11 是保羅自己寫的，還是他引用早期教會的一首詩歌？","兩種看法都有學者支持。主張引用的人說：這一段用關係代名詞起頭，句子排成整齊的詩行，像是腓立比人早就會唱的歌；主張保羅自寫的人說：保羅本來就會用詩的語言寫基督，而「且死在十字架上」那一行打破了節奏，正是保羅的手筆。本講義認為兩種看法不必互相排斥：就算保羅引用了一首歌，他也是把它放進自己的信裡，又親手加上十字架那一行，所以它就是保羅要說的話，也是聖靈默示的經文。這件事不該影響你的信心；反而提醒我們，教會在新約寫成以前就已經在唱耶穌是主了。詳見本章議題頁。"]],["h","二、保羅先打開抽屜：意念相同"],["p","保羅要勸人和好，第一句卻不是命令：「所以，在基督裡若有甚麼勸勉，愛心有甚麼安慰，聖靈有甚麼交通，心中有甚麼慈悲憐憫」（2:1）。四個「若有」，原文的語氣更接近「既然有」。他不是在問他們有沒有，是在點名四樣他們早就嘗過的東西：基督、愛、聖靈、憐憫，全是從上面來的。沒有源頭的合一，只能靠壓；有源頭的合一，才會長。"],["p","接著是四個「相同」：「你們就要意念相同，愛心相同，有一樣的心思，有一樣的意念，使我的喜樂可以滿足。」（2:2）「意念」原文是 φρονέω，不是意見，是心思朝著的方向。同工對詩歌、預算、裝潢可以意見不同，卻仍然朝著同一個方向。合一不是意見相同，是心思朝著同一位。那一位是誰，保羅到第五節才說。"],["p","然後是病情：「凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強。」（2:3）「結黨」原是城邦選舉裡為自己拉票、鋪路的字；「虛浮的榮耀」是空加上榮耀，外面亮，裡面空。這兩樣都不一定是甚麼大罪，常常只是同工會上一句「這件事是我先提的」，或家族群組裡默默記著誰出了錢、誰沒出。"],["p","藥方的「看」字，原文是算帳的字。「看別人比自己強」不是要你相信每個人都比你能幹，或你一文不值；算的是次序：在我的眼睛裡，你的需要排在前面。一位醫生半夜被叫去看急診，他看病人比自己強，不是承認病人比他會開刀，是把病人的需要排在自己的睡眠前面。"],["p","第四節還有一個最小、也最要緊的字：「各人不要單顧自己的事，也要顧別人的事。」（2:4）原文多放了一個「也」。保羅沒有叫人不顧自己，他叫人不要只顧自己。這一個字，先替後面整首歌把一條歪路堵住了。讀完這四節，該問的不是「我要怎樣看輕自己」，是「我的眼睛最近一直盯著誰的事」。"],["d",["「各人看別人比自己強」，是要我承認每一個人都比我好、比我能幹嗎？","不是。這裡的「看」原文是算帳、評估的字，算的是次序，不是能力。保羅不是要你對自己說謊，假裝自己甚麼都不會；那樣反而違背了「不要看自己過於所當看的」那一份誠實。他是要你在關係裡，把別人的需要排在你的方便前面。一位很會講道的長老，可以清楚知道自己有講台的恩賜，卻在同工會上先聽完一位年輕同工的意見。下一節的「也」字也在這裡：顧別人的事，不是不顧自己的事。謙卑不是把自己縮小，是把眼睛從自己身上移開一點。"]],["h","三、原文亮光：本有、虛己、所以"],["p","保羅沒有接著列規條，他唱了一首歌。請先不要想自己，讓這首歌唱完，一直唱到萬膝跪拜。歌分兩半：前一半主詞是基督，一步一步往下走；後一半主詞換成神，一步一步往上抬。"],["p","第一個原文字：ὑπάρχων，「本有」。「他本有神的形像，不以自己與神同等為強奪的」（2:6）。這是現在分詞，意思是一直是：從來是，現在也是。歌的第一句不是往下，是身分。他沒有身分危機。「強奪的」，是伸手去抓、抓住不放的東西；既然他一直是，本講義取這個讀法：他不是沒有，是不抓。這使我們想起伊甸園裡蛇的話：「你們便如神能知道善惡。」（創 3:5）亞當本來不是神，卻伸手要如神；基督本來與神同等，卻不伸手抓住。腓立比書沒有明說亞當，這是我們讀到的對照。321 說驕傲是離開本位抓住權力，謙卑是放下權力回到本位；全本聖經裡，這兩句最精準的經文就是這一節。"],["p","第二個原文字：ἐκένωσεν，「虛己」，字面是倒空。前面還有一個 ἑαυτὸν，他自己。是他自己倒空，不是被人倒空；第八節「自己卑微」又是一個「自己」。他倒空了甚麼？保羅沒有列清單，他說怎麼倒：「取了奴僕的形像」。取了，是加上，不是減去：加上人性，不是減去神性。這是教父與改教家的讀法，本講義採用；各家讀法見議題頁。"],["p","然後他一步一步往下走：「既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。」（2:8）只說「死」還不夠低，保羅要說是哪一種死。腓立比是羅馬駐防城，城裡的羅馬公民不會被釘十字架，那是給奴隸和叛亂的人的死法。保羅對這一城的人說：你們的主，死在那裡。往下七步，停在十字架，這是全卷地勢最低的地方。"],["p","第三個原文字：διὸ，「所以」。「所以，神將他升為至高，又賜給他那超乎萬名之上的名」（2:9）。第八節最後一個字是十字架，第九節第一個字是所以；全卷最低和最高的地方，中間只隔這一個字。而且主詞換人了：往下的路是他自己走的，往上的路是神把他抬上去的。"],["p","接著保羅化用了以賽亞書：「萬膝必向我跪拜；萬口必憑我起誓。」（賽 45:23）在以賽亞書，說這話的是耶和華，前面才說：「因為我是神，再沒有別神。」（賽 45:22）一個嚴守獨一神信仰的猶太人，把只屬耶和華的敬拜歸給了耶穌：「無不口稱『耶穌基督為主』，使榮耀歸與父神。」（2:11）在腓立比，「主」是凱撒的稱號。而這首歌的最後一個字是「父」：連得到的榮耀，他都歸給了父。歌，唱完了。那我呢？保羅的回答不是一套方法，是兩個人。"],["d",["基督「虛己」的時候，倒空了甚麼？耶穌在地上的時候還是神嗎？","是。2:6 的「本有」是現在分詞，意思是一直是：他從來是神，在地上也是。保羅沒有說他倒空了甚麼，只說怎樣倒空：「取了奴僕的形像」。教父和改教家因此說，虛己是加上人性，不是減去神性。十九世紀有一種虛己論，說基督在地上暫時放下了全知、全能等神的屬性；本講義陳列但不採用，因為它和「本有」不合。另有一種自限說，認為屬性都在，只是他自願不獨立使用，完全倚靠父和聖靈；這可以和古典讀法並存。他倒空的是 2:6 那種「抓住不放」的姿態，不是神的本質。所以那位死在十字架上的，就是萬膝要向他跪拜的主。全卷立場見 ISS00_2。"]],["d",["「無不屈膝」「無不口稱」是不是說，到最後每一個人都會得救？","這兩節是化用以賽亞書 45 章的主權宣告：全受造界，天上、地上、地底下，沒有一處例外，都要承認耶穌基督是主。可是經文沒有說每一個屈膝的人都是甘心敬拜、因此得救的人；承認他的主權，和因信歸向他，是兩件事。所以本講義不採普救論。另一方面也要小心另一頭：保羅寫這一句是為了敬拜，不是為了威脅。不要拿它回家對不信的家人說「你以後還是要跪」，那會把福音變成一場要贏的辯論。比較好的回應，是每天為家人指名禱告，求主讓他們有一天也甘心口稱耶穌為主。詳見本章議題頁。"]],["h","四、做成、發光、澆奠，和兩個學會了的人"],["p","歌唱完，保羅說：「就當恐懼戰兢做成你們得救的工夫。」（2:12）這一句常被讀成兩頭：做不好就會掉下去，或反正神會作、等著就好。兩頭都只讀了半句。下一節說：「因為你們立志行事都是神在你們心裡運行，為要成就他的美意。」（2:13）兩節在原文是同一個句子。「做成」是做到底、活出來，不是做了才得到；連你心裡「想要和好」的那一點心意，都是神放進去的，所以可以放膽去做。「恐懼戰兢」是敬畏與認真，不是怕被丟掉。「你們」是複數：救恩要在一群人的關係裡活出來，第四章那兩位姊妹的和好，就是它的樣子。"],["p","「凡所行的，都不要發怨言，起爭論」（2:14）。可是「怨言」這個字把我們帶回曠野，這使我們想起摩西的話：「你們的怨言不是向我們發的，乃是向耶和華發的。」（出 16:8）曠野的怨言是不信。所以這一節禁止的，是對神的不信和背後的嘀咕，不是對不公的申訴。看見同工受欺負、帳目不清，把它帶到該處理的地方，那是愛。第四章保羅也沒有叫兩位姊妹閉嘴，他請第三個人「幫助這兩個女人」。這樣的一群人，保羅說「好像明光照耀」（2:15）。夜越黑，星星越清楚。"],["p","「我以你們的信心為供獻的祭物，我若被澆奠在其上，也是喜樂」（2:17）。澆奠是獻祭時最後倒在祭物上的那一杯酒。祭壇上的主角是他們的信心，保羅只是那一杯酒。可是他用的是「若」，生死的主權在神；同一封信裡他說：「然而，我在肉身活著，為你們更是要緊的。」（1:24）他不是想死，是不怕把自己用上。"],["p","第一個學會了的人是提摩太：「因為我沒有別人與我同心，實在掛念你們的事。」（2:20）「同心」原文是同一個魂。「掛念」和第四章「一無掛慮」是同一個字，在這裡卻是美德：愛人的人一定會牽掛，問題是有沒有帶到神面前。接著是全本新約對「有己」最短的定義：「別人都求自己的事，並不求耶穌基督的事。」（2:21）提摩太就是第四節活出來的樣子：顧別人的事，就是求耶穌基督的事。"],["p","第二個是以巴弗提。教會派他送禮物來，他留下來照顧保羅。「他是我的兄弟，與我一同做工，一同當兵」（2:25）。他病得幾乎要死，最難過的卻是「你們聽見他病了」。保羅沒有醫好他，也沒有說他信心不夠，只說：「他實在是病了，幾乎要死；然而神憐恤他，不但憐恤他，也憐恤我，免得我憂上加憂。」（2:27）寫「要靠主常常喜樂」的人，坦白說他會憂。然後保羅做的是送他回家，吩咐教會「要尊重這樣的人」（2:29）。教會對押上性命的人，要接待、照顧，不是把他再推回前線。"],["d",["「恐懼戰兢做成你們得救的工夫」，是不是說我做得不夠就會失去救恩？","不是。請把 2:12 和 2:13 一口氣讀完：「做成」是因為「神在你們心裡運行」。保羅沒有說「做成救恩，好叫你們得救」；「做成」的原文是做到底、活出來，把已經在你裡面的救恩，在生活裡一路活到完成。1:6 也說「必成全這工」，成全的主詞是神。「恐懼戰兢」在保羅書信裡是敬畏與認真，像一個人捧著一件很貴重的東西，不敢輕忽，不是怕被丟掉。所以軟弱跌倒的時候，不要先懷疑自己還算不算得救，先回到那位在你裡面動工的神面前認罪，再起來走下一步。恩典與行為的關係，回指加拉太書立場二；全卷立場見 ISS00_4。"]],["d",["我看見教會裡有不公平、帳目不清或有人被傷害，說出來算不算「發怨言」？","不算。2:14 的「怨言」把我們帶回曠野，那是以色列人對神的不信：不信他會給水給糧，在背後嘀咕。對不公的申訴不是這一種。實際上可以這樣做：第一，先向主禱告，分辨自己的動機，是為了真相與保護人，還是為了出一口氣。第二，直接找該處理的人說，像當事人、小組長、牧者，或教會的申訴管道，不在背後傳。第三，若牽涉性騷擾、暴力或傷害，先保護受害的人，必要時尋求專業或法律協助。保羅自己在 4:3 請第三個人去幫助兩位姊妹：合一是把問題帶進主裡處理，不是藏起來。屬靈權柄的分寸，回指哥林多後書立場三。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把「虛己」和「無己」講成自我否定：我不可以有需要，不能累，不能說不，我的感受都是「己」，要對付掉。基督往下走以前，經文先說「他本有神的形像」；2:4 那個「也」字沒有叫人不顧自己；寫這一章的保羅會說「免得我憂上加憂」。把憂鬱、自我厭惡、不敢拒絕當成無己，是把病當成美德。"],["p","第二個偏差，是用「看別人比自己強」和「要無己」，叫人對領袖、配偶或長輩無條件順服，被控制、被打也不可以說。兩個「自己」說得很清楚：是他自己倒空、自己卑微，沒有一個人有權柄去倒空別人。被迫的不叫虛己，叫受害。那需要的是保護和被聽見。"],["p","第三個偏差，是把第九節的「所以」講成升遷的策略：先低頭，以後就會被抬高；這一次讓了，神會讓你被看見。為了被高舉而謙卑，仍然是有己，只是把抓的手藏在背後。往上的那一段，主詞是神，時間也在他手中。"],["p","第四個偏差，是把 2:12 和 2:13 拆開讀：只讀前一節，就活在失去救恩的恐懼裡；只讀後一節，就甚麼都不必做，不必和好，不必改變。兩節一起讀：神在裡面運行，所以我們放膽活出來；「那在你們心裡動了善工的，必成全這工」（1:6）。"],["p","第五個偏差，是拿 2:14「不要發怨言」叫受委屈的人閉嘴，把提出問題的人說成破壞合一，把 2:2「意念相同」講成所有人意見都要一樣。曠野的怨言是對神的不信，不是對不公的申訴；合一是把問題帶進主裡處理，不是把問題藏起來，要求表面和諧。"],["d",["有人對我說「你就是還有己，所以才會痛苦」，要我更順服，我該怎麼辦？","請先聽清楚：經文說基督是「自己」倒空、「自己」卑微，沒有一個人有權柄替你倒空你。被迫的不叫虛己，叫受害。如果你在家裡被打、在職場被欺壓、在教會被人用屬靈的話控制，你的痛苦不是因為還有己，你需要的是保護和被聽見。實際上，第一，若有立即的危險，先保護自己和孩子，必要時撥打當地的緊急電話。第二，找一位信得過的人說出來，像另一位牧者、輔導或社工。第三，你可以設界線，保羅也說「應當防備」。組長若在組裡聽見這樣的事，不追問細節，不要求原諒，會後單獨關心，必要時協助尋求專業協助。饒恕與受害者的分寸，回指哥林多後書立場四；全卷立場見 ISS00_2。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：忍讓被當成無己。很多華人家庭裡，總有一個最會吞下去的人：長女、長媳，或那位甚麼事都說「好，我來」的姊妹。她從小聽的是吃虧就是佔便宜、以和為貴，信主以後又聽到「要無己」，於是更不敢開口。請聽第四節的「也」，再聽保羅說「免得我憂上加憂」。她需要的不是更多的倒空，是先被提醒：她在基督裡是被愛的，她的需要也可以說出來。"],["p","第二個問題：面子和排名。我們不一定在會議裡拉票，卻很在意名字排第幾：海報上誰的名字在前面，謝詞裡有沒有提到我，婚宴上坐哪一桌，家族群組裡誰出錢最多。這就是「虛浮的榮耀」，空的，卻很重。2:6 那位本有神的形像的主不抓，我們卻為一個座位抓了二十年。我們不是要假裝不在乎，是要問：我抓著的這一點面子，值得讓一位弟兄姊妹排到我心裡的後面嗎？"],["h","七、活出321——倒空了的人，仍然知道自己是誰"],["p","歌唱完了，兩個人也看過了，我們才把國度321空中團契常說的「無己」接上去，而且用這首歌替它定一個準：無己不是沒有自己，是不以自己為中心；不是自我消滅，是自我給出。基督虛己的時候，完全知道自己是誰；我們無己，也是因為知道自己在基督裡是誰：是「聖徒」（1:1），是「天上的國民」（3:20）。越確知自己是誰，越不需要抓，手越空得出來，往第四節的方向，為了別人。"],["p","耶穌是我的榜樣：全本新約，沒有一句比 2:5 更直接。約翰記下這顆心的現場：「耶穌知道父已將萬有交在他手裡」（約 13:3），然後「就離席站起來，脫了衣服，拿一條手巾束腰」（約 13:4）。先知道自己是誰，才拿起手巾。"],["p","聖經是我的準則：次序不能倒。先讓 2:6–11 唱完，才講無己；先讀完 2:13，才講做成得救的工夫。"],["p","聖靈是我的引導：「立志」和「行事」都是神在心裡運行。哪一件事該鬆手，哪一件事該說出口，哪一段關係需要界線，求聖靈給你分辨。"],["p","讓耶穌作王：「無不口稱『耶穌基督為主』」，就是把「中心」那個位置還給他：我的意見、我的功勞、我的面子，都不是主。也要看清另一面：讓耶穌作王，不是讓某一位領袖、配偶或長輩坐上那個位置，替你決定你沒有聲音。"],["p","讓耶穌得著一切的榮耀：「使榮耀歸與父神」和「耶穌基督為主」在同一節。往下走的人不必替自己爭名；名是神賜的，記帳的不是人。"],["p","建立屬神的體系：帶門徒像保羅帶提摩太，最後是兩個並肩為福音作奴僕的人，這是 321 的「3」；同工像以巴弗提，一同做工、一同當兵，這是「5」，有人累倒了，接他回家、讓他休息；衝突有路可走，請一位信得過的第三者來幫助，不讓嘀咕在背後發酵，也不叫受委屈的人閉嘴。"],["h","八、四種心，手裡還抓著甚麼"],["p","驕傲型的心，抓得最緊：抓位子、抓功勞、抓「我是對的」，表面很客氣，心裡一直在排名次。這一章只問你一句：那位本有神的形像的，都不抓了，你手裡那一點，真的有那麼要緊嗎？"],["p","恐懼型的心，不是不想放，是怕一放手就甚麼都沒有了：位置被拿走、意見沒人聽、在這裡不再被需要。請回到 2:9 的主詞：往上的那一段是神作的。你的位置不在你抓得多緊，在他記得你。"],["p","羞恥型的心，常常是那個從來不爭、也不敢要的人。你早就認定自己不配有需要，把縮小當成謙卑。可是基督往下走，是從「本有」出發的；你也有一個不必用表現換來的身分：你是蒙愛的聖徒。從這裡出發的給出，才是自由的。"],["p","受傷型的心，也許你曾被人用「要無己」「要順服」壓過，在家裡、職場或教會。今天請聽清楚：你的痛苦不是因為「還有己」，被迫的不叫虛己。你不必勉強原諒，也不必立刻回到那個人身邊。若你正處在危險裡，請告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上用 2:6–11 禱告，慢慢唱到「耶穌基督為主」時停下來，說出今天最想抓住的一件事，然後說：主啊，你是主，這件事交給你。"],["p","第二，在一個你習慣抓住的地方鬆手一次：同工會或公司會議上，把一次功勞說出同工的名字；家族群組裡先問一句「這一次誰最需要幫忙」。"],["p","第三，在一個你習慣不敢說的地方開口一次：對一位信得過的人說出你真實的累，或對一個超過負荷的要求溫和地說「這一次我不行」。"],["p","第四，像提摩太那樣顧一個人的事：選一位病人、守在病床旁的家人，或一位累倒的同工，這一週打一通電話、送一頓飯，或陪他跑一次醫院。"],["p","第五，像保羅帶提摩太那樣，邀請一位年輕的弟兄姊妹和你一起服事一次，讓他站前面，你在旁邊陪他。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：耶穌基督本有神的形像，自己倒空，自己卑微，順服至死；神將他升為至高，他是主。"],["p","我宣告：我在基督裡是蒙愛的聖徒，是天上的國民；我知道自己是誰，所以我不必抓。"],["p","我宣告：立志行事都是神在我心裡運行；我不活在怕裡，我要放膽把救恩活出來。"],["p","我宣告：我不要單顧自己的事，也要顧別人的事；我也可以誠實說出我的需要。"],["d",["我習慣甚麼都說好，這一週要怎樣溫和地說出一次「這一次我不行」？","先從小的、安全的地方開始。第一，選一件具體的事：一個超過你負荷的服事排班、一次加班、一個你其實沒有力氣赴的約。第二，先在主面前說一遍，告訴他你為甚麼累，求他讓你知道，說不不等於不愛。第三，用一句簡短、不道歉過度的話：謝謝你想到我，這一次我不行，下一次我再看看。第四，說完以後，對方若不高興，那是他的感受，不是你的罪。保羅會說「免得我憂上加憂」，以巴弗提病倒了也被送回家休養；知道自己的限度，也是以基督耶穌的心為心的一部分。"]],["h","十、結語"],["p","我們回到羅馬那間屋子。信寫完了，以巴弗提要帶它回腓立比。幾年以後，保羅又一次坐監，最後一封信是寫給提摩太的，裡面說：「我現在被澆奠，我離世的時候到了。」（提後 4:6）那個從路司得被帶走的年輕人，學會的不是怎樣崇拜一位使徒，是怎樣以基督耶穌的心為心。"],["p","可是這一課的焦點，不在保羅多會帶人，也不在提摩太多忠心，更不在我們學會說「無己」。焦點在那首歌裡的那一位：他本有神的形像，自己倒空，自己卑微，一直走到十字架；所以，神將他升為至高。你不必更佩服誰，也不必更看輕自己，只要更愛這一位主。"],["p","我們一起低頭禱告。天父，謝謝你差你的兒子，本有神的形像，卻取了奴僕的形像，為我們死在十字架上。赦免我們一直在抓：抓位子、抓功勞、抓「我是對的」。也求你扶起那些被要求倒空、快要碎了的人，讓他們知道自己在你裡面是蒙愛的，保守他們的安全。求你在我們心裡運行，使我們立志行事，都為成就你的美意。我們口稱耶穌基督為主，願榮耀歸與你。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最謙卑，是讓每一個人說出一隻自己一直抓著的手，也說出這一週要空出手去顧的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是心、空、光。席上可能有一直在抓的人，也可能有被要求倒空、快要碎了的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：基督往下走之前先有身分；2:12 和 2:13 要一起讀；怨言不是申訴。"],["n","1. ★ 說一個你小時候和兄弟姊妹、表兄弟或同學搶東西的記憶：搶的是甚麼？最後是誰讓了？"],["n","2. ★★★ 基督往下走之前，經文先說「他本有神的形像」。請用一句話說：為甚麼一個確知自己是誰的人，比較不需要抓？"],["n","3. ★★ 只讀 2:12 會變成甚麼樣的信仰？只讀 2:13 又會變成甚麼樣的信仰？兩節一起讀，你聽到的是甚麼？"],["n","4. ★★ 曠野裡對神的怨言，和對不公平的申訴，差別在哪裡？請各舉一個教會或職場裡的例子。"],["m","帶領提醒：讀 2:6–11 時請一口氣讀到「使榮耀歸與父神」，先不要討論自己。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一隻自己一直抓著的手，或一句一直不敢說的話，並從「我在基督裡是誰」出發，說出這一週要鬆手和開口的地方。"],["t","【看】看見自己"],["n","5. ★★★ 說出最近一次你心裡在排名次或抓功勞的場合：哪一天、在哪裡、和誰？或者說出最近一次你很想說不，卻說了好的時刻。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:6 和 3:20 兩遍，第二遍讀完說一句：神在基督裡給了你一個甚麼身分？"],["t","【想】想通關卡"],["n","7. ★★★ 你放不開那隻手，或說不出那句話，卡在哪裡：怕被看輕、怕失去位置、覺得說需要就是不屬靈，還是曾被人用「無己」壓過？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我在基督裡是蒙愛的，所以這一週我不必抓；我也可以說出我的需要。」右手邊的人只回一句「主知道你是誰」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要鬆手的一件事和開口的一件事：各是對誰、星期幾、在哪裡、要說的第一句話是甚麼。"],["m","帶領提醒：無己不是沒有自己。這一化可能碰到家庭傷害、屬靈控制或長期憂鬱的經驗；不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」。若有人說出正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天用 2:6–11 禱告、說出一位同工的功勞、顧一個人的事、帶一個人一起服事。"],["n","10. ★★ 說出這一週你要把功勞說出他名字的那一位同工或家人，在哪一個場合、哪一天說，要說的那一句話是甚麼。"],["n","11. ★★ 說出一位正躺在病床上、或累倒了的人，這一週哪一天你要打電話、送飯或去探望他？要約誰一起去？"],["n","12. ★ 像保羅帶提摩太那樣，說出一位你這個月要邀請一起服事的年輕弟兄姊妹，是哪一項服事，哪一天讓他站前面。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：耶穌往下走到十字架，是為了他。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，耶穌本來就是神，卻沒有抓住自己的地位，反而取了奴僕的形像，死在十字架上。第二句，所以神把他升為至高，他是主。第三句，因為他，你不必一直抓，也不必把自己縮到沒有，你在神面前是被愛的。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更謙卑」這類答案；正在耗竭的組員，鼓勵他這一週先休息，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要鬆開的那一隻手是甚麼，要顧的那一個人是誰。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位正躺在病床上或守在病床旁的人，求神像憐恤以巴弗提那樣憐恤他；一位服事累到快撐不住的同工，求主給他休息；一位被要求「無己」而不敢說話的人，求主讓他知道自己在基督裡是誰，並為他預備安全的幫助。"],["p","散會以前，確認紙上寫了三樣：要鬆手的那一件事、要開口的那一句話、你的那個「2」。下次帶來對。"]]},"3":{"no":3,"vol":"《321腓立比書講義》第三課·腓立比書第三章","title":"只准留一行的履歷表——帳本、跑道、國籍","chars":5194,"min":60,"deep":8,"dchars":1772,"tchars":1383,"blocks":[["h","一、只准留一行的履歷表"],["p","弟兄姊妹平安。我先問你一個問題，在心裡回答就好：如果你的履歷表只准留一行，其餘全部刪掉，你會留哪一行？是那一張畢業證書，是做了十五年的職位，是孩子考上的學校，還是在教會服事的年數？"],["p","再問第二個問題，這一題比較難：那一行如果明天被刪掉了，你還是你嗎？有一位弟兄退休那天，同事替他辦了歡送會，輪流說他的成就。回到家，他把車停進車庫，坐在駕駛座上很久沒有下車。他後來說，名片收進抽屜以後，他不知道怎樣向別人介紹自己。"],["p","腓立比書第三章，就是一個人把自己的履歷表攤開，一行一行刪掉的過程。可是他刪完以後，不是坐在車裡發呆，是站起來開始跑。這一課用三個詞走完這一章：帳本、跑道、國籍。"],["p","可是帳本還沒打開，保羅先寫了一句很溫柔的話：「弟兄們，我還有話說，你們要靠主喜樂。」（3:1）「靠主」原文是「在主裡」。喜樂有一個地址，不在順境裡，在主裡。他說同樣的話再寫一次，於你們卻是妥當，「妥當」原意是腳踩上去不會滑的地面。好老師不怕重複，因為偷喜樂的賊不只來一次。"],["p","果然下一節語氣急轉：「應當防備犬類，防備作惡的，防備妄自行割的。」（3:2）有人說這裡縫進了另一封信，本講義照一封信讀，理由見議題頁。只要記住一句：保羅說到喜樂，就想起會偷走喜樂的人。書信三問的第一問：有一批教師教外邦信徒，信耶穌還不夠，要先受割禮，才算真正屬神。"],["p","「犬類」很重，要讀準。這不是罵猶太人，寫的人兩節以後就說自己是「希伯來人所生的希伯來人」（3:5）。這也不是罵所有和我們意見不同的人，同一章對看法不同的弟兄，保羅說「神也必以此指示你們」（3:15）。他防備的只有一種教導：在基督以外，另加一個得救的條件。所以他重新定義割禮：「因為真受割禮的，乃是我們這以神的靈敬拜、在基督耶穌裡誇口、不靠著肉體的。」（3:3）請記住最後那個「靠」字，帳本就是從這個字打開的。"],["d",["3:1 才說喜樂，3:2 就說防備犬類，這是不是兩封信被拼在一起？","學者確實有兩信說、三信說，認為 3:2 以下是另一封論戰信。可是沒有任何一份抄本支持分割，現存抄本都是今天這一封信的樣子；全卷字彙從頭貫穿到尾，3:20--21 又把第二章基督之歌的字唱回來。本講義照一封信讀。語氣急轉不難懂：一位父親在門口對孩子說「好好玩」，看見巷口一輛陌生的車，馬上加一句「不要跟陌生人走」，沒有人會說這是兩封信。這個判斷不影響任何一節的解經。本講義的全卷立場見 ISS00_6。"]],["h","二、保羅的帳本：七項資產搬進負債欄"],["p","「其實，我也可以靠肉體；若是別人想他可以靠肉體，我更可以靠著了。」（3:4）要比肉體？保羅比他們都多。他攤開履歷：「我第八天受割禮；我是以色列族、便雅憫支派的人，是希伯來人所生的希伯來人。就律法說，我是法利賽人；」（3:5）「就熱心說，我是逼迫教會的；就律法上的義說，我是無可指摘的。」（3:6）"],["p","一共七項。前四項是生來就有的：第八天受割禮、以色列族、便雅憫支派、希伯來人所生的希伯來人。後三項是自己掙來的：最嚴謹的法利賽人、熱心到逼迫教會、律法上的義沒有人挑得出毛病。這七項都不是壞東西。割禮是神設立的，律法是神賜的。問題在那個字：靠。"],["p","今天這張履歷換個名字照樣存在。教會版是：牧師世家、神學院畢業、詩班唱了二十年。職場版是：名校、外商、年資。家長群組版是：孩子考上哪一間。最刺眼的是第六項：逼迫教會，當年是功勞，如今是他一生最痛的事。熱心可以真誠地錯。"],["p","然後帳本翻開了：「只是我先前以為與我有益的，我現在因基督都當作有損的。」（3:7）「有益」「有損」是會計的字。原文的利益是複數，一項一項排在資產欄；虧損卻是單數，七項整欄搬過去，併成一筆。接著他說：「不但如此，我也將萬事當作有損的，因我以認識我主基督耶穌為至寶。」（3:8）範圍從七項擴大到萬事，理由只有一個：認識基督的價值高過一切。"],["p","再下一句，他用了希臘文裡最粗的字之一：「我為他已經丟棄萬事，看作糞土，為要得著基督」（3:8）。σκύβαλα（skybala），可以指丟給狗的殘渣，也可以指糞便。可是這不是叫人看輕讀書、工作、家庭；糞土的比較只在這些東西和基督放上同一個天平、要搶基督位置的時候成立。一張文憑掛在書房牆上是恩典，掛在寶座上就是糞土。「得著」就是第七節「有益」那個字變成動詞：資產欄清空了，只剩下一個名字。"],["p","帳本結算在第九節：「並且得以在他裡面，不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義」（3:9）。「信基督的義」有兩種讀法：我們對基督的信，或基督自己順服到死的信實；落點一樣：義不是自己的。保羅脫下自己縫了三十年的義袍，穿上神白白給的那一件。書信三問的第二問有了答案：在神面前站得住，只有一個根據，就是在基督裡被找著。"],["d",["保羅把萬事看作糞土，那我還要拼學業、拼工作、顧家庭嗎？","要。σκύβαλα 是一個比較，不是一份清單。保羅丟棄的，是他拿來在神面前「靠」的東西，是 3:9 那個自己的義；同一封信 4:8 還叫人思念可敬的、公義的事。讀書、工作、愛家都是基督徒的本分。分辨的問題只有兩個：第一，它有沒有成為我在神面前站得住的根據？第二，當它和跟隨基督衝突的時候，我願不願意付代價放下？為了服事冷落家人，不叫丟棄萬事，叫逃避責任。也請不要對剛失業的人說「反正是糞土」，那是輕看他的失落；先承認失去是真的痛，再陪他看見，在基督裡他仍然站得住。無己的全卷立場見 ISS00_2。"]],["d",["「信基督的義」如果是「基督的信實」，那我自己的信心還算數嗎？","算數，而且你可以更安心。原文 διὰ πίστεως Χριστοῦ 有兩種讀法：一種是我們對基督的信，和合本這樣譯；一種是基督自己的信實，就是 2:8 存心順服的忠信。本講義以第一種為主，也承認第二種很美。請留意同一節的後半「因信神而來的義」，明明說的是人的信，所以不論哪一種讀法，人的信都在這節裡。兩讀的共同點才是重點：義不是自己的。你的信不是換取義的錢幣，是伸手領受的那一隻手；你得救的根基在基督的順服上，比你的信心穩。加拉太書講義第 2 章在加 2:16 已並陳兩讀，本卷一致；全卷立場見 ISS00_9。"]],["h","三、原文亮光：算、追、往前伸"],["p","帳算完了，保羅站起來跑。先聽第十節的次序：「使我認識基督，曉得他復活的大能，並且曉得和他一同受苦，效法他的死」（3:10）。先是復活的大能，然後才是受苦。先被復活的生命充滿，才有力氣一同走進苦難。「效法他的死」原文是被模成他死的形狀，和基督「本有神的形像」同字根。第十一節的「或者」是謙卑，不是懷疑。這一段有三個原文字。"],["p","第一個字：ἡγέομαι（hēgeomai），算。第七、第八節的「當作」「看作」，三次都是它。第七節是完成式，大馬士革路上算好了；第八節是現在式，今天還這樣算。這個字第二章已經見過：「各人看別人比自己強」（2:3）的「看」，基督「不以自己與神同等為強奪的」（2:6）的「以」，都是它。基督先怎樣算他的權利，保羅才學會怎樣算他的資歷。生命的改變，常常不是先從行為開始，是先換一把尺。"],["p","第二個字：διώκω（diōkō），追。「這不是說我已經得著了，已經完全了；我乃是竭力追求，或者可以得著基督耶穌所以得著我的。」（3:12）「竭力追求」的「追」，就是第六節「逼迫教會」的那個字。從前他追教會，現在追基督。後半句同一個動詞一次主動、一次被動：我想抓住，因為我已經被抓住了。像學騎腳踏車的孩子，爸爸在後面抓著座椅，孩子才敢用力踩。神先抓住我，我才竭力抓住他，這是恩典與追求的次序。"],["p","第三個字：ἐπεκτεινόμενος（epekteinomenos），往前伸。「我只有一件事，就是忘記背後，努力面前的」（3:13）。「努力面前的」原文疊了兩個字首，是賽跑的人到了最後幾步，把胸口往終點線伸出去的樣子；現在分詞，一路都向前傾著。努力不是咬牙苦撐，是重心放到前面去了。「向著標竿直跑，要得神在基督耶穌裡從上面召我來得的獎賞。」（3:14）跑道的終點不是一面獎牌，是一張臉。基督，是我的標竿。"],["p","「忘記背後」最常被用錯，所以要問：背後是甚麼？就是第五、第六節那張履歷，是保羅自己最引以為傲的獎盃。忘記背後，是不再回頭欣賞它，也不再拿它當倚靠。保羅也沒有失憶：「我原是使徒中最小的，不配稱為使徒，因為我從前逼迫神的教會。」（林前 15:9）他記得，只是那件事不再定義他。所以這一節不可以拿來對受過傷的人說：過去的就不要再提了。被家暴、被屬靈領袖傷害過的人，身後不是獎盃，是別人加給他的傷。不被過去定義，和否認過去發生過，是兩件事；前一件是福音的自由，後一件會造成第二次傷害。"],["p","「所以我們中間，凡是完全人總要存這樣的心」（3:15）。剛說自己沒有完全，怎麼又說完全人？第十二節是到了終點，第十五節是成熟。成熟的記號，正是知道自己還沒有到。所以 321 說的得勝者，不是已經完全的屬靈精英，是竭力追求、向著標竿直跑的人。跌倒了怎麼辦？「然而，我們到了甚麼地步，就當照著甚麼地步行。」（3:16）「行」原是排成隊伍前進的字：不必跑得一樣快，但在同一條隊伍裡，從跌倒的那一步再往前一步。"],["d",["保羅說「或者我也得以從死裡復活」，連他都沒有把握，我怎麼敢說自己得救？","這個「或者」不是懷疑。同一封信 1:6 說神「必成全這工」，3:9 說義是從神來的，3:20--21 說我們等候救主，他要改變我們卑賤的身體，保羅對終局說得很有把握。εἴ πως 是謙卑的語氣：他確信神的信實，卻不把復活當成自己可以掌握的成就，像被邀赴宴的人說但願我趕得上，不是懷疑主人。他不確定的是走向復活的路徑，殉道或活到主來，不是神會不會成全。所以你可以像保羅一樣，既有把握，又謙卑：有把握，所以不必害怕；謙卑，所以不會停下來。若這種害怕已經影響睡眠和生活，也請找牧者或專業的人談一談。全卷立場見 ISS00_4。"]],["d",["我小時候在家裡受過很深的傷，有人勸我「忘記背後」，我做不到，是不是我沒有信心？","不是。請先聽清楚：3:13 的背後，在上下文是 3:4--8 保羅自己的資歷與成就，是他引以為傲的東西，不是別人加給他的傷，這一節本來就不是對你說的。保羅自己也記得逼迫過教會。你還會痛，不表示你不肯往前跑。可以這樣走：第一，若現在仍有危險，先保護自己的安全，必要時聯絡當地的緊急求助管道。第二，找一位信得過的人說出來，牧者、輔導或社工都可以；傷需要被聽見。第三，饒恕可以先在神面前慢慢開始，和好需要對方真實的悔改與安全，兩件事不必綁在一起。組長若在組裡聽到這樣的事，不追問細節、不要求原諒，會後單獨關心，必要時協助尋求專業協助。饒恕與受害者的分寸，回指哥林多後書立場四。"]],["h","四、天上的國民：殖民城裡的一塊地"],["p","標竿很遠，保羅說，先看前面跑的人：「弟兄們，你們要一同效法我，也當留意看那些照我們榜樣行的人。」（3:17）說這句話的人剛說自己還沒有得著，他要人效法的是一個方向，不是一個完美的人。你小組裡剛信主的那一位，正看著你怎樣跑。"],["p","然後保羅寫到一半停下來：「因為有許多人行事是基督十字架的仇敵。我屢次告訴你們，現在又流淚地告訴你們」（3:18）。第二節他說應當防備，這裡他一面寫一面哭：清楚說出真相，同時為那些人流淚。這些人歡迎基督的祝福，只是不要他的十字架：「他們的結局就是沉淪；他們的神就是自己的肚腹。他們以自己的羞辱為榮耀，專以地上的事為念。」（3:19）「肚腹」不是說吃飯有罪，是凡事以滿足自己為中心。"],["p","於是保羅說到國籍：「我們卻是天上的國民，並且等候救主，就是主耶穌基督從天上降臨。」（3:20）請聽這個「卻」。「國民」原文 πολίτευμα（politeuma），是一個城邦的公民團體。使徒行傳講義第 16 章講過，腓立比是羅馬的駐防城，城裡住著退伍的羅馬老兵，照羅馬的法律過日子，雖然離羅馬很遠。腓立比，是羅馬放在馬其頓的一塊領土；教會，是天國放在腓立比的一塊領土。"],["p","天上的國民沒有撤離，在所住的城裡上班、繳稅、為城求平安；分別在於最後的忠誠。地上的要求和天上的主衝突的時候，我們知道，自己的護照是哪一國發的。"],["p","最後一節，請帶到病床旁邊去讀：「他要按著那能叫萬有歸服自己的大能，將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似。」（3:21）這個會老、會病的身體，不是被丟掉，是被改變。「卑賤」和基督「自己卑微」同一個字根：基督先走進我們卑賤的形狀，為要把我們帶進他榮耀的形狀。書信三問的第三問落在今天：你所在的那一間教會，就是天國放在你那座城裡的一塊地。"],["d",["既然「我們卻是天上的國民」，基督徒還要不要關心社會、參與公共的事？","要。πολίτευμα 的圖畫本身就是答案：腓立比是羅馬的殖民城，那裡的羅馬公民沒有撤離馬其頓，他們在當地生活、做生意、守秩序，正是在那裡活出羅馬的樣子。先知也叫被擄的人「要為那城求平安，為那城禱告耶和華」（耶 29:7）。所以天上的國民可以上班、繳稅、關心鄰舍的苦難；分別在於最後的忠誠。這節經文不替任何國家、政黨或移民的選擇背書，講台也不替弟兄姊妹下政治結論。把自己的立場講成天國標準，反而是 3:19「專以地上的事為念」的另一種樣子。本講義的全卷立場見 ISS00_1。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 3:2 的「犬類」罵猶太人，或拿來罵別的宗派、別的宗教、跟我們意見不同的人。保羅自己是希伯來人所生的希伯來人，他防備的是要外邦信徒受割禮才能得救的教導，不是一個民族。教會史上反猶的罪，正從這種讀法開始。"],["p","第二個偏差，是只學「應當防備」，不學「流淚地告訴你們」。在群組裡點名冷嘲熱諷，還說保羅也很兇。保羅的嚴厲是醫生的嚴厲，不是為了吵贏。只有防備沒有眼淚，會訓練出很會分辨、卻不會愛人的人。"],["p","第三個偏差，是用「忘記背後」叫受傷的人壓抑創傷、否認傷害、立刻放下。上下文的背後，是保羅自己的資歷與成就，不是別人加給他的傷。反過來也不可以：傷害人的一方不能拿這一節說「我已經忘記背後了，你也不要再翻舊帳」，用來逃避認錯、道歉與賠償。保羅到老都說自己逼迫過神的教會。"],["p","第四個偏差，是把「看作糞土」講成基督徒要看輕讀書、工作、家庭，或叫人為了服事冷落家人。糞土是一個比較，好東西搶了基督的位置、成為人靠的對象時，才是糞土。"],["p","第五個偏差，是把 3:15「凡是完全人」講成教會裡有一群已經到了的屬靈精英，分出得勝者與一般信徒；或把竭力追求變成業績表，讓自責的人更不敢休息。保羅的竭力，是被基督先得著的回應，不是為了被接納。得勝者以 3:12--14 為準，是還在跑的人。"],["d",["我常常跌倒、讀經禱告時斷時續，這樣還算得上 321 說的「得勝者」嗎？","算，只要你還在跑道上。321 的得勝者以 3:12--14 為準：不是已經完全的屬靈精英，是竭力追求、向著標竿直跑的人。建立了許多教會的保羅，仍說自己還沒有得著。3:15 的「完全人」是成熟的人，成熟的記號正是知道自己還沒有到。各傳統對「完全」的說法，本講義並陳，全卷立場見 ISS00_4。對你最實際的是 3:16：到了甚麼地步，就照著甚麼地步行。禱告斷了三天，第四天再開口。跌倒了，不是從起點重跑，是從跌倒的那一步再往前一步。你被基督抓住，不是因為你跑得好，是因為他先伸了手。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：學歷與面子，常常是華人家庭裡的割禮。過年回家，親戚第一句問的是在哪裡上班、孩子讀哪一間。保羅沒有叫我們不讀書，他叫我們問：在神面前，我是不是還靠著它？父親可以為孩子考上好學校感恩，卻不必讓錄取通知書替全家在親戚面前站得住。反向的履歷也一樣：被裁員就抬不起頭，仍是同一把尺，只是量出負數。在基督裡被找著的人，兩把尺都可以放下。"],["p","第二個問題：兩本護照和一張飯桌。華人教會裡坐著拿不同護照、政治看法相反的弟兄姊妹，選舉一到，群組裡的話越來越冷。有人用「天上的國民」叫人甚麼都不要管；有人反過來，把自己的政治立場說成天國公民的標準答案，看法不同的就成了「十字架的仇敵」。保羅說的是忠誠的次序。兩位立場不同的弟兄姊妹，可以同坐一張飯桌，為同一座城禱告，因為他們的護照，最後是同一國發的。"],["h","七、活出321——被抓住的人，才跑得動"],["p","走到這裡，才把國度321空中團契常說的那句話接上去：改變觀點，就改變觀念。它的根在 3:8，而這個算法，是基督在 2:6 先算過一次。"],["p","耶穌是我的榜樣：他是第一位向著標竿直跑的人。他「就定意向耶路撒冷去」（路 9:51），不回頭欣賞加利利的群眾和神蹟。他也是流著淚說出真相的人，「看見城，就為它哀哭」（路 19:41）。"],["p","聖經是我的準則：次序不可倒過來。讀 3:13 要讀回 3:4--8，讀 3:2 要讀到 3:18。"],["p","聖靈是我的引導：真受割禮的人是「以神的靈敬拜」的人；存別樣的心時，「神也必以此指示你們」。哪一張獎盃還放在寶座上，求聖靈指示我。"],["p","讓耶穌作王：讓出兩個位置。一個是自己的義那個位置，驕傲最後的地盤是覺得自己在神面前站得住；一個是跑道裁判的位置。可以自己檢查：這一週，我在哪一件事上還在當自己和別人的審判官？"],["p","讓耶穌得著一切的榮耀：保羅放下七樣東西，帳本最後只剩一個名字。不亮出履歷的人，讓人看見的是比履歷更寶貴的主。"],["p","建立屬神的體系：3:15--17 是一群人一起跑，不是一個人的獨跑。321 改變觀念八大步驟的後四步在這裡落地：神也必指示，是修正；照著甚麼地步行，是反覆；一同效法我，是繁殖。團契要問：這裡可以誠實說「我還沒有到」而不被淘汰嗎？"],["h","八、四種心，在跑道上的四種姿勢"],["p","驕傲型的心，跑幾步就回頭欣賞，再看後面的人不順眼。服事年資、奉獻、神學訓練，被忽略時馬上翻出來。這一章只問你一句：如果那一行明天被刪掉了，你在神面前還站得住嗎？保羅比你多七項，他全部搬進了負債欄。"],["p","恐懼型的心，不敢跑，因為怕跑錯，怕跌倒，怕到最後不夠格。一讀到「或者」兩個字就睡不著。請聽 3:12 的後半句：你是被基督耶穌得著的。像那個學騎車的孩子，後座有人抓著；你跌倒了，不是被淘汰，是一個被抓住的人再站起來。"],["p","羞恥型的心，身後不是獎盃，是一張反向的履歷：被裁員、孩子沒讀書、信主以前做過的事。你認定自己沒資格上跑道。可是保羅身後也有一項，逼迫教會。那件事他記得，卻不再是他的名字；義不是你自己縫的，是神給的。"],["p","受傷型的心，也許你一聽到「忘記背後」就很難受，因為曾經有人拿這四個字叫你閉嘴。這一節說的不是你的傷。你不必假裝那件事沒有發生，也不必今天就放下。傷需要被說出來、被聽見，有時需要專業的陪伴；若你仍在危險裡，請先告訴一位信得過的人，讓人陪你找到安全。跑道上的人可以停下來讓人包紮；召你的主，復活的身體上還帶著釘痕。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，拿一張紙做一次帳：寫下你最引以為傲的三樣東西，然後問自己一句，如果它們明天都不見了，我在神面前還站得住嗎？站得住，靠的就是基督；站不住，那三樣就是我的割禮。"],["p","第二，挑一個你習慣先亮出資歷的場合：同學會、家長群組、公司會議、同工會。這一次刻意不說，把那三十秒用來問對方一句近況。"],["p","第三，每天早上讀 3:12--14，向主說：我還沒有到，謝謝你先抓住了我；晚上讀 3:20--21，為自己會累的身體感恩。"],["p","第四，想一位你心裡已經替他貼上標籤的人：為他禱告三次，只求一件事：讓我看見他的時候，眼裡先有淚，不先有分數。"],["p","第五，在小組或服事團隊裡選一位剛起步的人，約他一次，讓他看見你怎樣讀經、怎樣禱告、怎樣處理一件難事。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我先前以為與我有益的，我現在因基督都當作有損的；我以認識我主基督耶穌為至寶。"],["p","我宣告：我在神面前站得住，不是靠自己因律法而得的義，是靠神所賜、在基督裡的義。"],["p","我宣告：我是被基督耶穌得著的人，所以我竭力追求；我還沒有到，但我向著標竿直跑。"],["p","我宣告：我是天上的國民，我等候救主從天上降臨，他要把我這卑賤的身體改變成榮耀的形狀。"],["d",["「寫下最引以為傲的三樣東西」這個練習，具體要怎麼做才不會流於形式？","四個步驟，約二十分鐘。第一，拿一張紙，左邊寫有益，右邊寫有損；左邊寫下三樣你最常拿出來的東西，要具體：不是寫事業，是寫我是部門裡最早升主管的。第二，每一樣旁邊寫一個場合：上一次你急著讓人知道它，是在哪裡、對誰說的。第三，逐項問一句：如果它明天不見了，我在神面前還站得住嗎？把答案誠實寫下來。第四，用 3:8 禱告，把這三樣一項一項說出來，交在主手裡。這個練習不是叫你丟掉它們，是把它們從寶座搬回書架。若寫出來的是失敗與羞愧，也一樣交出來；若是別人加給你的傷，不必在這張紙上處理，請找信得過的人談。"]],["h","十、結語"],["p","我們回到那一位坐在車裡的弟兄。後來他每週五晚上載青少年回家。有個孩子問他：叔叔你以前做甚麼的？他想了很久說：我以前很忙，現在才剛起跑，前面有人在等我。"],["p","可是這一課的焦點，不在那位弟兄放得多瀟灑，也不在保羅多捨得。焦點在第十二節那個被動語態：基督耶穌先得著了他。在保羅算帳以前，基督已經先算過一次：他本有神的形像，卻不抓住不放，往下走到十字架。保羅放下七樣，為要得著基督；基督放下的多得多，為要得著保羅，也得著了你。你不必更佩服保羅，只要更認識他所認識的那一位。"],["p","我們一起低頭禱告。從上面召我們的父神，我們承認，心裡常收著一張履歷，被忽略的時候就拿出來；也承認，有時拿著別人的錯當作分數，眼裡沒有淚。謝謝你，在我們還沒有伸手以前，基督耶穌已經先抓住了我們。求你保護那些身後背著傷的人，讓他們被聽見、被好好陪伴；也讓我們這一週放下回頭欣賞的眼光，向著標竿再跑一步，好叫後面的人看得見你。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰的履歷比較好看，是讓每一個人說出一樣自己還靠著的東西，也說出這一週往前跑的那一步；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是帳本、跑道、國籍。席上可能有剛失業或退休、覺得自己一無所有的人，也可能有身後背著很深的傷、曾被人用「忘記背後」叫他閉嘴的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：犬類防備的是一種教導；帳本是換一把尺，義不是自己的；背後是自己的獎盃，得勝者是還在跑的人。"],["n","1. ★ 如果你的履歷表只准留一行，你會留哪一行？說出來，再說一個你上一次很想讓別人知道它的場合。"],["n","2. ★★ 保羅說「犬類」的時候，自己是希伯來人所生的希伯來人。他防備的到底是甚麼？今天甚麼會變成加在基督以外的割禮？"],["n","3. ★★★ 「當作」這個字先落在基督身上（2:6），才落在保羅身上（3:7）。請說說：為甚麼生命的改變常常不是先從行為開始，而是先換一把尺？"],["n","4. ★★ 3:13 的「背後」在上下文是指甚麼？請說出不被過去定義和否認過去發生過的分別。"],["m","帶領提醒：談到 3:2 時，不讓任何人說輕看猶太人或別的宗派的話；談到糞土時，留意席上剛失去工作的人，不說「反正是糞土」。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一樣自己還靠著的東西，在「基督耶穌所以得著我的」裡聽見神怎樣看他，並說出這一週往前跑的那一步。"],["t","【看】看見自己"],["n","5. ★★★ 說出一樣具體的東西：學歷、職位、孩子的表現、教會裡的位置，或一張反向的履歷。上一次它被人忽略，是在甚麼場合、對著誰？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:12 兩遍，第二遍讀到「基督耶穌所以得著我的」時，把「我」換成你自己的名字。讀完說一句：你聽見神怎樣看你？"],["t","【想】想通關卡"],["n","7. ★★★ 你放不下那一樣，或不敢往前跑，卡在哪裡：怕被看不起、怕跌倒、覺得不夠格，還是身後有一個還沒被聽見的傷？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我還沒有到，可是基督耶穌已經得著了我。」右手邊的人只回一句「你是被他抓住的人」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你往前跑的那一步：星期幾、在哪一個場合、要刻意不亮出哪一樣，改成問對方哪一句關心的話。若你身後是別人加給你的傷，改寫下你要告訴的那一位信得過的人和哪一天。"],["m","帶領提醒：這一化可能碰到家庭傷害、被屬靈領袖傷害、失業或長期無望感的經驗。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也絕不說「忘記背後吧」。若有人說出仍處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一次做帳、一位要為他流淚的人、一個你要帶的人。"],["n","10. ★★ 說出這一週哪一天、在哪裡，你要坐下來做那一張帳。下次願意的人帶來分享其中一樣。"],["n","11. ★ 說出一位你心裡已經替他貼上標籤的人（可以只說關係），這一週你要為他禱告哪三天、每一次求的那一句是甚麼？"],["n","12. ★★ 3:17 說要留意看照榜樣行的人。說出一位跑在你前面、你這個月要去向他學一件事的人，和你要問他的那一個問題。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天、在哪裡，你要向他分享：你不必靠履歷在神面前站得住。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，有一個人履歷好得沒人比得上，後來說這些全比不上認識耶穌。第二句，因為耶穌先抓住了他，他不必再靠成績站得住，可以放心往前跑。第三句，你也不必靠履歷證明自己，有一位主先伸手要抓住你。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更謙卑」「我會往前看」這類答案；若那位要關心的人曾傷害組員，不勉強接近。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週往前跑的那一步是甚麼。"],["p","然後彼此代禱，為三種人指名禱告：一位失去職位或健康的人，求主讓他知道在基督裡就站得住；一位背著很深的傷的人，求主保護他、讓他被聽見；一位你已經放棄的親人，求主給你為他流淚的心。"],["p","散會以前，確認紙上寫了三樣：那一張帳要在哪一天做、要為他流淚的那一個人、你的那個「2」。下次帶來對。"]]},"4":{"no":4,"vol":"《321腓立比書講義》第四課·腓立比書第四章","title":"學會了的知足——樂、足、香","chars":5103,"min":60,"deep":8,"dchars":1782,"tchars":1359,"blocks":[["h","一、知足常樂，差在哪裡"],["p","弟兄姊妹平安。知足常樂，這四個字，我們從小聽到大。公司裁員那一天，同事在茶水間拍拍你的肩膀，說的也是這一句：想開一點，知足常樂。意思很清楚：把想要的放低一點，心就不會那麼苦。"],["p","這句話有它的道理。可是今天，我想請你把它和保羅的一句話並排放：「我無論在甚麼景況都可以知足，這是我已經學會了。」（4:11）聽起來很像，其實差了三個地方。第一是次序：俗語說知足才能常樂，知足在前、樂在後；保羅剛好倒過來，先說「你們要靠主常常喜樂」（4:4），喜樂有一個源頭，知足是後來學會的。第二是源頭：俗語的知足，靠自己把慾望壓低；保羅的知足靠一個人：「我靠著那加給我力量的，凡事都能做。」（4:13）第三是對象：俗語的知足，常常是說給別人聽的，叫窮的人別抱怨，叫受委屈的人別出聲；保羅的知足，是他自己在鎖鍊裡學的，而且他說他「也知道怎樣處豐富」（4:12）。"],["p","這一課用三個字走完這一章：樂、足、香。"],["p","先用書信三問的第一問：腓立比人遇到甚麼？寫信的人在羅馬軟禁，一條鎖鍊，一頭在他手上，一頭在羅馬兵手上。收信的教會，是在河邊的禱告會和一間監牢裡出生的；本系列使徒行傳講義第 16 章講過呂底亞和那位禁卒。這間教會很會奉獻，可是裡面兩位同工開始不說話，外面有逼迫，家裡沒有一個是有餘的。他們最需要的，不是一句「想開一點」。"],["p","保羅這一章的第一句是這樣起頭的：「我所親愛、所想念的弟兄們，你們就是我的喜樂，我的冠冕。我親愛的弟兄，你們應當靠主站立得穩。」（4:1）一節只有一個命令：站穩。站在哪裡？「靠主」，原文是「在主裡」。俗語的知足沒有地址；保羅的知足有一個地址。"],["d",["「知足常樂」這句俗語，基督徒還可以說嗎？它和聖經的知足有衝突嗎？","可以說，聖經也說「敬虔加上知足的心便是大利了」（提前 6:6）。問題不在這句話，在我們怎樣用它。第一，它沒有源頭：俗語靠自己把慾望壓低，保羅靠的是那加給他力量的主，所以他在飢餓裡也撐得住。第二，它常常用錯方向：說給別人聽，叫受委屈的人別出聲、叫窮的人別抱怨。保羅的知足是對自己說的，而且他也知道怎樣處豐富，該開口的時候會開口。所以下一次你想對別人說這四個字，先問自己：我是在陪他，還是在叫他閉嘴？若是陪他，不如問一句：你最近最掛心的是甚麼？"]],["h","二、兩個「我勸」和一個幫手"],["p","「我勸友阿蝶和循都基，要在主裡同心。」（4:2）一封要在全教會面前念出來的信，點了兩位姊妹的名字。她們不是壞人。保羅說她們「在福音上曾與我一同勞苦」（4:3），那個字和 1:27 的「齊心努力」同一個字根，是運動場上並肩競技的隊友。"],["p","請仔細聽原文：Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ，「我勸友阿蝶，我也勸循都基」，一人一個「我勸」。保羅沒有在信裡審案，沒有說誰對誰錯，也沒有說為了合一，大家都不要再提了。他要的是 τὸ αὐτὸ φρονεῖν ἐν κυρίῳ，在主裡同心；這個「心」字，就是 2:5「以基督耶穌的心為心」的那個字。意思是：把你們的問題，搬到基督的心這塊地上，重新談。"],["p","然後他請了第三個人：「我也求你這真實同負一軛的，幫助這兩個女人」（4:3）。這個人是誰，議題頁有整理。「幫助」是 συλλαμβάνου，一起抓住，像兩個漁夫一起把網拉上船。他不替任何一方打仗。"],["p","這裡要說清楚。第二章說「不要發怨言」，那是曠野裡對神的不信，不是對不公的申訴。所以 4:2 不可以拿來對提出問題的人說：不要再吵了，要合一。保羅的做法剛好相反：他公開承認問題存在，再請一位雙方都信得過的人進來。若事情牽涉傷害或不公，需要的是公平的處理與保護，不是一句要同心。合一不是把問題藏到地毯底下，是大家一起，把問題帶進主裡處理。"],["p","這一節最後還有一句：「他們的名字都在生命冊上。」（4:3）在勸人和好的時候提生命冊，不是威脅說再吵名字就被塗掉，是提醒她們：你們兩個人的名字，本來就寫在同一本冊上。知足常樂說的是我的心情；保羅說的是，我們的名字在誰的手裡。"],["d",["教會裡兩位同工吵架了，而我剛好兩邊都熟，要怎樣做那一位「同負一軛的」？","可以照保羅的樣子分四步。第一，不選邊：先分別和兩個人各談一次，只聽，不帶話、不轉述，也不在群組裡評論。第二，分清楚性質：若只是做事方式不同、性格摩擦，可以邀兩個人在一個安靜的地方一起坐下來，各說事實與感受，再一起回到「在主裡同心」，問一句：基督的心會怎樣看這件事？第三，若牽涉傷害、欺負、金錢或權力的不公，這就不是你一個人能處理的，要帶到教會清楚、公平的管道，請牧者或長執介入，先保護受傷的人。第四，給時間：問題不一定一次談完。你的角色是一起抓住那張網，不是當法官，也不是當和事佬把事情壓下去。"]],["h","三、原文亮光：掛慮、把守、算進去"],["p","接著是全卷最有名的一句：「你們要靠主常常喜樂。我再說，你們要喜樂。」（4:4）先聽「靠主」。喜樂不是一種心情，是一個地址；環境會變，你住在誰裡面不會變，所以可以「常常」。可是常常喜樂，不是常常笑。同一封信裡，保羅寫到十字架的仇敵，說「現在又流淚地告訴你們」（3:18）；以巴弗提病得幾乎要死，他說神憐恤他，「免得我憂上加憂」（2:27）。所以請不要拿 4:4 對一位剛送走父親的人說：聖經叫你要喜樂。那是把一個邀請變成一根鞭子。喜樂可以和眼淚，坐在同一張椅子上。"],["p","下一節是：「當叫眾人知道你們謙讓的心。主已經近了。」（4:5）「謙讓」是 τὸ ἐπιεικὲς，不堅持每一樣權利都要拿到。「主已經近了」，不是叫我們去算日子；是說主就在身邊，所以那件爭到底的事沒有那麼重要，下一句的掛慮，也可以說給他聽。"],["p","第一個字在 4:6：μηδὲν μεριμνᾶτε，應當一無掛慮。可是保羅在第二章稱讚提摩太：「因為我沒有別人與我同心，實在掛念你們的事。」（2:20）「掛念」和「掛慮」，原文是同一個字。同一個字，在第二章是美德，在第四章是要交出去的；差別不在有沒有感覺，在有沒有帶到神面前。保羅的解藥寫得很具體：「只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」（4:6）是說出來，不是吞下去。俗語叫人想開一點，保羅叫人說出來。"],["p","這裡我必須說得很清楚。如果你正在受焦慮症、憂鬱症的折磨，那不是你信心的成績單，是一種需要治療的病。看醫生、吃藥、接受諮商，和禱告並不衝突；以巴弗提生病，保羅沒有說他信心不足。若有人對你說多禱告就好、不用看醫生，那是把 4:6 用錯了。你可以一邊把它告訴神，一邊告訴一位信得過的人，去找專業的幫助。"],["p","第二個字在 4:7：φρουρήσει，保守。這是一個軍事用語，駐軍把守。腓立比是羅馬駐防城，腓立比人一聽就懂。「神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。」（4:7）請留意次序：經文沒有說問題會先解決，它說心先被把守。處境還沒有變，心門口已經有人站崗。被守住的人仍然會計畫、會求醫、會找人商量，只是不再被恐懼追著跑。"],["p","第三個字在 4:8：λογίζεσθε，思念，這是一個記帳的字，算進去。保羅開的清單，第一項是「真實的」，不是「愉快的」。所以這不是正向思考；是不假裝沒事，同時不讓帳本上只剩下壞帳。下一節接著說：「這些事你們都要去行，賜平安的神就必與你們同在。」（4:9）第七節是神的平安守著你，第九節是賜平安的神親自來了。"],["d",["我在吃抗焦慮或抗憂鬱的藥，這是不是表示我的信心不夠？可以停藥改成多禱告嗎？","吃藥不是信心不夠。焦慮症、憂鬱症是需要治療的病，和高血壓、糖尿病一樣，需要醫生、藥物，有時也需要諮商；就醫與禱告不衝突。保羅自己說「免得我憂上加憂」（2:27），主耶穌在客西馬尼也說他心裡甚是憂傷，幾乎要死。神常常藉著醫生和藥物照顧人。所以請不要自己停藥，也不要因為有人說多禱告就好而停藥；停藥或減藥一定要和你的醫生討論。你可以一邊照 4:6 把所要的告訴神，一邊按時回診。若你曾經有過傷害自己的念頭，請今天就告訴一位信得過的人，並聯絡你的醫生或當地的求助專線。"]],["d",["照 4:6 禱告具體要怎麼做？為甚麼我一禱告就在腦子裡繞圈子？","可以照經文裡的三個字，寫在紙上做。第一是「禱告」：先對神說你是誰、他是誰，例如：主，你在我身邊。第二是「祈求」：把掛慮一件一件寫出來，每一件只寫事實，不寫猜測，例如：星期五要回公司開會，我怕被資遣；接著寫你要的：求你讓我有清楚的頭腦，也預備下一份工作。第三是「感謝」：寫一件今天可以感謝的小事，不必大，一頓熱飯、一通電話都算。寫完，對主說：這幾件交給你了。明天若又想起來，不必自責，再交一次就好。若一件事已經壓了你兩個禮拜，這張紙也可以拿給牧者或諮商師看。"]],["h","四、或飽足，或飢餓"],["p","知足常樂，常常是沒有缺過的人說的。保羅不是。「我並不是因缺乏說這話；我無論在甚麼景況都可以知足，這是我已經學會了。」（4:11）「知足」是 αὐτάρκης，當時斯多葛哲學家最愛的一個字：修練到不需要任何外物，保羅借了這個字，卻換了它的心：哲學家的自足靠自己，保羅的知足靠主。最安慰人的是「學會了」，ἔμαθον。知足是一門課，不是一個開關。還在為房貸、病痛擔心的人，不必因為還沒學會而責備自己；你正在上課。"],["p","下一節把課本打開：「我知道怎樣處卑賤，也知道怎樣處豐富；或飽足，或飢餓；或有餘，或缺乏，隨事隨在，我都得了秘訣。」（4:12）「得了秘訣」是 μεμύημαι，當時神秘宗教的入門用語。那個秘訣不是一個方法，是一個人：「我靠著那加給我力量的，凡事都能做。」（4:13）有的古卷在這裡多了「基督」兩個字，和合本跟著較早的抄本，意思不變。「凡事」就是上一節那張清單：飽足、飢餓、有餘、缺乏。這不是一張夢想清單，是一張處境清單。4:13 是知足的力量，不是必勝的保證；落榜的學生、生意倒了的弟兄，讀這一節讀得最準。"],["p","還有更深的一層。4:12「處卑賤」是 ταπεινοῦσθαι，和 2:8「自己卑微」是同一個動詞：「既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。」（2:8）基督往下走，神將他升為至高；保羅往下走，主加給他力量。保羅在監牢裡學會的，就是基督走過的那個形狀。這是俗語和福音最大的不同：知足常樂叫人自己退一步；福音告訴你，那一位先走到最低處的主，就在低處等你。"],["p","知足，也不是說我不需要任何人。保羅接著說：「然而，你們和我同受患難原是美事。」（4:14）他收下餽送，又說：「我並不求甚麼餽送，所求的就是你們的果子漸漸增多，歸在你們的帳上。」（4:17）他在乎的是給的人自己。他把這筆錢叫作「極美的香氣」（4:18），這使我們想起出埃及記壇上的祭。腓立比人以為自己在寄錢，保羅說，你們是在向神獻祭。這是這一章的第三個字：香。"],["p","然後是一節常被用錯的應許：「我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。」（4:19）這不是投資公式。哥林多後書說馬其頓的教會「在極窮之間還格外顯出他們樂捐的厚恩」（林後 8:2），腓立比就是其中一間。這是寫給一間已經奉獻到很窮的教會的；說的是「所需用的」，不是「所想要的」。這是父親對孩子的承諾，不是銀行的利息表。"],["p","最後是問安：「在凱撒家裡的人特特地問你們安。」（4:22）不是皇帝的親戚，是皇宮裡的奴僕、管家、文書。鎖鍊鎖住了保羅，卻沒有鎖住福音，它一路走進了皇帝的家。全卷從「那在你們心裡動了善工的，必成全這工」（1:6）開始，到「願主耶穌基督的恩常在你們心裡！」（4:23）結束；原文是「與你們的靈同在」。一個戴著鎖鍊的人，用恩收尾。"],["d",["考試或比賽以前，可以拿 4:13 來禱告嗎？如果還是失敗了，是不是神沒有聽？","可以禱告，但要禱告對的東西。你可以求主讓你平靜、盡力發揮，也可以求他讓你考上；只是 4:13 的「凡事」不是一張夢想清單，是 4:12 那張處境清單：飽足、飢餓、有餘、缺乏。所以這一節最真實的禱告是：主，不管結果怎樣，我都要靠你站得住。落榜、輸球，不表示神沒有聽，也不表示你信心不夠；保羅寫這一節的時候正戴著鎖鍊，他所說的力量，就是在不如意裡仍然不離開主的力量。若你真的失敗了，那正是 4:13 最準的時候：今天你加給我的力量，夠我面對這個結果，也夠我明天再站起來。"]],["d",["我奉獻了，生活還是缺乏，4:19 的應許是不是落空了？","先把這一節放回它的上下文。4:19 是寫給一間已經奉獻到「極窮」的教會的，他們把最後一點積蓄包進餽送裡，送給一個坐監的人；保羅沒有說你們這樣投資，將來會發財，他說的是「所需用的」，不是「所想要的」。而且就在上兩節，他說「我並不求甚麼餽送」（4:17）。所以奉獻不是買保險，也不是放高利貸；它是獻給神的香氣。神應許的是父親的照顧，有時是一份工作，有時是一位弟兄送來的米。若你現在真的缺乏，請不要不好意思讓小組知道，保羅也讓腓立比人知道他的需要；肢體彼此供應，往往就是 4:19 應驗的方式。若有人以奉獻換祝福為由向你施壓，你可以溫和而堅定地拒絕。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 4:13 講成考試、比賽、生意的必勝口號：靠主凡事都能做，所以你一定考上、一定贏。「凡事」是 4:12 的飽足、飢餓、有餘、缺乏；講成口號，落榜和倒閉的人就只剩下一個結論：我信心不夠。經文被講反了。"],["p","第二個偏差，是把 4:6 和 4:4 講成量信心的尺：還在焦慮就是不信，憂鬱就是不夠喜樂，多禱告就好、不必看醫生、可以停藥；或對喪親的人說，聖經叫你常常喜樂。保羅自己會憂上加憂；4:6 是出口，不是罰單；就醫、吃藥、諮商與禱告不衝突。"],["p","第三個偏差，是把 4:19 講成奉獻換富足：今天奉獻，神明天加倍還你。它是寫給一間奉獻到極窮的教會，應許的是所需用的，而且保羅自己說他並不求甚麼餽送。把奉獻講成投資，是把敬拜變成交易。"],["p","第四個偏差，是用 4:2 壓制申訴：對受了委屈、指出問題的人說「不要再吵，要合一」，或要求兩方當眾和好。保羅一人一個「我勸」，不偏袒，還請第三個人來幫助；牽涉傷害或不公，要的是公平的處理與保護。"],["p","第五個偏差，是用 4:11 叫人認命：叫被拖欠工資的人不要爭，叫處在危險裡的人忍一忍、要知足。保羅在腓立比也曾說「我們是羅馬人，並沒有定罪」（徒 16:37），他知道甚麼時候要為公義開口。知足是心不被處境綁架，不是對不公沉默。"],["d",["知足是不是表示，我不可以要求加薪、不可以為被拖欠的工資維權？","不是。知足是心不被處境綁架，不是對不公沉默。保羅說他知道怎樣處卑賤，也知道怎樣處豐富；他在腓立比被不經審判就打了，第二天就說「我們是羅馬人，並沒有定罪」（徒 16:37），要官府自己來領他們出去。所以你可以照正當的程序要求合理的待遇，可以為被拖欠的工資申訴，也可以離開一個不安全的環境。知足檢驗的不是你有沒有爭取，而是：爭取不到的時候，你的喜樂和身分會不會跟著垮掉？知足的人可以安靜，也可以開口，因為他的地址不在那一份薪水上。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：報喜不報憂。我們從小學會，家醜不可外揚，心裡苦不要掛在臉上；看精神科，怕被說是想不開，吃藥要藏在包包最裡層。於是掛慮在心裡繞了一百圈，臉上還在笑。4:6 給的路正好相反：把所要的「告訴神」，一件一件說出來；一間健康的小組，是一個人說出「我在吃藥」以後，大家不是急著給建議，而是說：謝謝你告訴我們，我們陪你。"],["p","第二個問題：愛拚才會贏，和認命。華人社會有兩種很熟悉的聲音。一種是拚：多讀一點、多賺一點，把 4:13 貼在書桌前，當成神替我加油的口號。另一種是認命：命中有時終須有，窮就窮，知足常樂。這兩種聲音看起來相反，其實都把神放在旁邊：一種要神幫我贏，一種覺得神也改變不了甚麼。保羅兩樣都不是。他會為羅馬公民的權利開口，也會在缺乏裡安然；他的「足」不放在處境上，放在那加給他力量的主身上。"],["h","七、活出321——基督是我的力量"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。全卷四個字：活、心、跑、足；走到這一章是「足」。基督是我的生命、我的心、我的標竿，到這裡，基督是我的力量。"],["p","耶穌是我的榜樣：保羅學會的「處卑賤」，是基督先走過的路。主耶穌禁食以後也餓了，一生沒有枕頭的地方，也謙卑地收下婦女們「用自己的財物供給」（路 8:3）；在客西馬尼，他說「我心裡甚是憂傷，幾乎要死」（太 26:38），沒有把憂傷吞下去，而是流淚禱告。這就是 4:6 的樣子。"],["p","聖經是我的準則：先讓 4:12 把那張處境清單念完，才讀 4:13；先讀 4:17「我並不求甚麼餽送」，才讀 4:19。次序對了，經文才不會被拿去替成功或替壓迫背書。"],["p","聖靈是我的引導：哪一件掛慮今晚要說給神聽，哪一件要說給一位朋友聽、甚至要約一次門診；求聖靈給我們分辨的心。"],["p","讓耶穌作王：讓出「處境的主人」那個位子。我想決定自己甚麼時候可以喜樂、要多少才算夠、誰對誰錯由我來判；4:5「主已經近了」，就是把這個位子還給他。4:19 保羅說的是「我的神」，不是我的存款。讓耶穌得著一切的榮耀：談錢的那一段，保羅用「願榮耀歸給我們的父神，直到永永遠遠。阿們！」（4:20）收尾。我們學會的知足，不是自己的修養，見證裡最大的名字不是自己。"],["p","建立屬神的體系：4:3 那一位「真實同負一軛的」，是 321「235」裡那個「2」的樣子。一個健康的體系，要有幾件具體的東西：同工起衝突時，有一位雙方都信得過的第三人可以請進來，也有清楚、公平的申訴管道；有人陷在焦慮與憂鬱裡，教會知道怎樣陪他，也備好可以轉介的醫師與諮商名單；在醫院、學校、公司上班的弟兄姊妹，被差遣成為今天的凱撒家裡的人。"],["h","八、四種心，各把喜樂寄放在哪裡"],["p","驕傲型的心，把喜樂寄放在自己的本事上：有餘的時候覺得是我能幹，看見同工吵架，急著判誰對誰錯，好讓自己站在對的那一邊。這一章對你說：「凡事都能做」的前面是「靠著那加給我力量的」；保羅學會的是處卑賤，是基督往下走的那個形狀。"],["p","恐懼型的心，把喜樂寄放在明天上：明天的帳單、明天的報告、明天孩子的成績。掛慮繞了一百圈，卻不敢說出來。4:6 不是叫你不怕，是叫你說：一件一件告訴神，也告訴一位信得過的人。說出來的那一刻，駐軍就在心門口站崗了。"],["p","羞恥型的心，把喜樂寄放在別人的眼光上：吃藥不敢讓小組知道，覺得自己還在焦慮，就不配站在教會裡。請聽 4:3：她們的名字都在生命冊上，名字寫上去是神的恩典，不是你表現的分數。你還在學，不是不及格。"],["p","受傷型的心，也許曾經在教會提出一件不公平的事，卻被說成破壞合一；也許在喪禮後聽見有人說，要常常喜樂。這一章不是要你把眼淚擦乾才能來。今天你不必勉強笑，也不必假裝那件事沒有發生；若你身處危險、或已經很久睡不著、吃不下，請先告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["d",["我剛失去親人，怎麼也喜樂不起來，是不是表示我不夠屬靈？","不是。請你允許自己哭。4:4 說「靠主」常常喜樂，喜樂的源頭是主，不是要你擠出笑臉；寫這一節的保羅也會流淚，也會憂上加憂；主耶穌站在拉撒路的墳前，「耶穌哭了」（約 11:35）。在這段日子，靠主喜樂可能只是很小的一件事：在哭的時候知道主在旁邊，在睡不著的夜裡對他說一句話。若有人對你說「要常常喜樂」「哭就是不信」，那是用錯了這一節，你不必背著這句話。讓小組陪你吃飯、陪你辦後事。若哀傷已經很久，讓你沒辦法吃、睡、上班，也可以找哀傷輔導或醫生，這同樣是神的照顧。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，拿一張紙，寫下現在最讓你掛慮的三件事，一件一行。每天睡前照 4:6 的次序，一件一件說給神聽：先說事實，再說你要的，最後說一件今天可以感謝的小事。"],["p","第二，若其中一件已經壓得你睡不著、吃不下超過兩個禮拜，這一週就把這張紙拿給一位信得過的人看，並且約一次門診或諮商。禱告和求助，可以在同一個禮拜發生。"],["p","第三，若你身邊有兩位彼此不說話的同工，而他們都信得過你，這一週不選邊、不傳話，先為兩個人各禱告一次，再約其中一位吃一頓飯，只聽，不判。"],["p","第四，檢查你的「足」在哪裡：打開購物車刪掉一樣其實不需要的東西，同時寫下一件你已經有、卻很久沒有為它感謝的東西，為它謝恩。"],["p","第五，為一位宣教士或福音同工做一件具體的事：回一封他的代禱信，或轉一筆奉獻。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我的喜樂有一個地址，是在主裡；處境會變，我住在誰裡面不會變。"],["p","我宣告：我不把掛慮吞下去，我要一件一件告訴神；我也可以求助，看醫生不是不信。"],["p","我宣告：我還在學知足；或飽足，或飢餓，那加給我力量的主，夠我走完今天。"],["p","我宣告：我所需用的，我的神必照他榮耀的豐富使我充足；我給出去的，是獻給他的香氣。"],["h","十、結語"],["p","我們回到那四個字：知足常樂。下一次有人對你說這一句，你不必反駁他。只是你心裡可以多加幾個字：不是知足才常樂，是靠主常常喜樂，然後在主裡一點一點學會知足。"],["p","這一課的焦點，不在我們能不能修練到甚麼都不要，也不在保羅有多堅強。焦點在那一位加給人力量的主：他先往下走，取了奴僕的形像，自己卑微，以至於死在十字架上；所以你在最低處的時候，他不是遠遠地替你加油，他就在那裡。你不必更佩服保羅，你只要更認識那一位，一直加給人力量的主。"],["p","我們一起低頭禱告。加給我們力量的主，謝謝你先走到最低處，在那裡等我們。求你赦免我們把喜樂寄放在處境上，也赦免我們用一句要同心、要知足，叫受委屈的人閉嘴。求你用出人意外的平安把守我們的心懷意念；保守正在焦慮、憂鬱裡的弟兄姊妹，讓他們敢說出來，也找到好的幫助；安慰正在流淚的人。教我們在飽足和飢餓裡都學會知足，也讓你的福音走進我們的家、公司和病房。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最知足，是讓每一個人說出自己的喜樂寄放在哪裡、心裡繞最多圈的那一件掛慮，以及這一週要走的一步；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是樂、足、香。席上可能有正在治療焦慮或憂鬱的人，也可能有剛失業、剛喪親的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：喜樂的源頭是主，不是處境；4:6 的掛慮要說出來，不是吞下去；4:13 的「凡事」包括飢餓和缺乏。"],["n","1. ★ 你最常聽見誰對你說「知足常樂」？在甚麼情況下說的？你聽了是輕鬆，還是更委屈？"],["n","2. ★★★ 請用自己的話說出：保羅的知足和「知足常樂」差在哪三個地方？"],["n","3. ★★ 「掛念」（2:20）和「掛慮」（4:6）是同一個字。為甚麼在第二章是美德、在第四章卻要交出去？"],["n","4. ★★ 先讀 4:12，再讀 4:13。讀完以後，你會怎樣對一位剛落榜或剛被裁員的朋友解釋「凡事都能做」？"],["m","帶領提醒：第一題輕鬆帶；討論 4:6 時，不在組裡評論任何人吃藥或看醫生的事，若有人主動提起，只說謝謝你告訴我們。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己的喜樂寄放在哪裡，說出心裡繞最多圈的那一件掛慮，並寫下這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 你的喜樂最近寄放在哪裡：業績、孩子的成績、身體檢查報告，還是某一個人的臉色？說出最近一次因為它而整天沉著臉的那一天。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:6–7 兩遍，第二遍把「你們」換成你自己的名字。你聽見神要怎樣把守你的心懷意念？"],["t","【想】想通關卡"],["n","7. ★★★ 那一件在你心裡繞最多圈的掛慮，你為甚麼一直沒有說出來？是怕被說不屬靈、怕沒面子，還是不知道能說給誰聽？不必說細節。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我還在學知足；我的喜樂要搬回主裡，這一週我要把……說給神聽。」右手邊的人只回「主在你身邊」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一步：哪一晚、用甚麼方式把那件掛慮一件一件告訴神；若它已經壓了你超過兩個禮拜，再寫下你要告訴的那一位人的名字，或要預約門診的日子。"],["m","帶領提醒：這一化可能碰到焦慮、憂鬱、喪親、失業或長期無望感。不追問細節，不要求任何人原諒誰或和好，不對正在流淚的人說「你要有信心」或「要常常喜樂」；若有人說出曾有傷害自己的念頭或正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一次幫助、一份香氣、一個要帶的人。"],["n","10. ★★ 你身邊有沒有兩個彼此不說話、而且都信得過你的人？不必說名字，只說這一週哪一天、用甚麼方式去聽其中一位說話，只聽不判。"],["n","11. ★ 說出一位你們教會差出去的宣教士或福音同工的名字，這一週哪一天，你要回他一封信、轉一筆奉獻，或在小組裡為他禱告？"],["n","12. ★★ 說出一位在醫院、學校、公司或公家機關上班的弟兄姊妹的名字，這一週你要為他禱告哪一件具體的事？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、正在缺乏或正在掛慮的那一個人。當場說出他的名字，說出這一週哪一天你要約他吃飯，並向他分享：那加給人力量的主就在近處。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我們常說知足常樂，可是我發現聖經說的剛好倒過來，是先在主裡喜樂，再慢慢學會知足。第二句，寫這句話的保羅戴著鎖鍊、也會流淚，他說他靠著那加給他力量的，在飽足和飢餓裡都撐得住。第三句，所以我心裡的掛慮不必吞下去，可以一件一件說給神聽，我也可以去找人幫忙。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多禱告」這類答案；牽涉同工衝突時，不在組裡點名、不評論誰對誰錯。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要交給神的那一件掛慮是甚麼，或我要去幫助的那一個人是誰。"],["p","然後彼此代禱，為三種人指名禱告：一位正在吃藥治療焦慮或憂鬱、卻不敢讓教會知道的人，求主讓他在這裡被接納；一位剛失業或落榜的人，求主加給他力量；一位正在流淚、剛失去親人的人，求主親自安慰。"],["p","散會以前，確認紙上寫了三樣：要說給神聽的掛慮、要去幫助或要約吃飯的人、你的那個「2」。下次帶來對。"]]}}}</script>

<script>/* ===== 321腓立比書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;

}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);

  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}

function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 4;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 每章三點：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="腓立比書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">活 · 心 · 跑 · 足</p></div>`;
}

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];

}

/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){

    const el = $('#lesDl' + n); if (!el) return;

  });
}

/* ═══════ ① 真人語音 ═══════ */
const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';

const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* 讀音修正：只改送去語音的字，畫面上的字完全不動。
   「地」在天地、地球、地是……應讀 ㄉㄧˋ，語音引擎常誤讀成輕聲的 ㄉㄜ˙；
   換成同音的「帝」就讀得對（聽起來一模一樣）。要再加字就往這張表加。 */
const TTS_SAY = [
  [/天地/g, '天帝'],
  [/地球/g, '帝球'],
  [/地是/g, '帝是'],
];

/* 朗讀前的文字整理 */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"], link[rel="icon"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '朗讀中',
      artist: '321腓立比書講義',
      album: '國度321空中團契',
      artwork: ic ? [{ src: ic, sizes:'180x180', type:'image/png' }] : [],
    });
    navigator.mediaSession.setActionHandler('play',  () => { if (SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopSpeak());
    navigator.mediaSession.setActionHandler('previoustrack', () => spkStep(-1));
    navigator.mediaSession.setActionHandler('nexttrack',     () => spkStep(1));
    navigator.mediaSession.setActionHandler('seekbackward',  () => spkStep(-1));
    navigator.mediaSession.setActionHandler('seekforward',   () => spkStep(1));
  } catch(e){}
}
/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3) plFetch(k);
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if ((PL.try[k] || 0) >= 3){              // 這一段真的抓不到，跳過去，不要卡住整課
      PL.i = k; SPK.i = k; return plPlay(k + 1);
    }
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  a.src = URL.createObjectURL(b);
  a.onended = () => {
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}
    PL.cur = 1 - PL.cur;
    plPlay(k + 1);
  };
  a.onerror = () => { if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];
  if (nb){ const nx = els[1 - PL.cur];
    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  playSegs(chunks.map(t => ({ t })), title);
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function stopSpeak(){
  SPK.tok++; SPK.on = false; SPK.pause = false; SPK.buffering = false;
  PL = null;
  try { audioPair().forEach(a => { a.pause(); a.onended = null; a.onerror = null; }); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  spkClear();
  drawBar();
}
function plCurEl(){ const els = audioPair(); return els[PL ? PL.cur : 0]; }
function togglePause(){
  const a = plCurEl();
  if (SPK.pause){ const p = a.play(); if (p && p.catch) p.catch(() => {}); SPK.pause = false; }
  else { a.pause(); SPK.pause = true; }
  drawBar();
}
/* 往前／往後跳一句 */
function spkStep(d){
  if (!PL) return;
  const k = Math.max(0, Math.min(PL.segs.length - 1, PL.i + d));
  try { plCurEl().pause(); plCurEl().onended = null; } catch(e){}
  PL.i = k; SPK.pause = false;
  plPump(); plPlay(k);
}
function drawBar(){
  let el = $('#spkbar');

  if (!el){
    el = document.createElement('div'); el.id = 'spkbar'; el.className = 'spkbar';
    document.body.appendChild(el);
  }
  const st = SPK.buffering ? `<span class="pv">緩衝中…</span>`
    : SPK.total ? `<span class="pv">${(SPK.i || 0) + 1}/${SPK.total}</span>` : '';
  const follow = PL && PL.lesson
    ? `<button class="${S.set.follow === 0 ? '' : 'on'}" title="自動捲動"
         onclick="toggleFollow()">${S.set.follow === 0 ? '⇕' : '⇳'}</button>` : '';
  el.innerHTML = `<span class="dot"></span><b>${esc(SPK.title)}</b>${st}
    <button onclick="spkStep(-1)" title="上一句">⏮</button>
    <button onclick="togglePause()">${SPK.pause ? '▶' : '⏸'}</button>
    <button onclick="spkStep(1)" title="下一句">⏭</button>${follow}
    <button onclick="stopSpeak()">✕</button>`;
}
function toggleFollow(){
  S.set.follow = S.set.follow === 0 ? 1 : 0; save(); drawBar();

/* ── 標示正在讀的那一句，並且捲到它 ── */

function spkMark(seg){

(function(){

/* 依句號切句；HTML 標籤不會被切斷，句末的引號跟著前一句走 */
const EN_SENT = false;
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;

/* ===== 全螢幕模式：講台提詞機 ＋ 小組帶領 ===== */
let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // 教學講義逐字稿
    const s = (D.lesson || {})[n];
    // 「想更深」是備而不用的問答，不上提詞機
    F.pages = s ? telePages(s.blocks.filter(b => b[0] !== 'd')) : outlinePages(n);
    F.total = (s ? s.min : 40) * 60;
    F.left = F.total;
    // 標題列只放主標題，副標題太長會擠成兩行
    $('#ftitle').textContent = '《' + (s ? s.title.split('——')[0] : meta(n).t) + '》';
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = '《' + meta(n).t + '》';
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = '第' + n + '章 · 小組';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}
function fClose(){
  F = null; clearInterval(FT); FT = null;
  document.documentElement.setAttribute('data-tele', '0');
  $('#full').classList.remove('on'); keepAwake(false);
}
async function keepAwake(on){
  try {
    if (on && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen');
    else if (WAKE) { WAKE.release(); WAKE = null; }
  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // 稿中的停頓 ＝ 換頁
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', '經文　' + p[1]], ['p', p[2]]] }));
  ps.push({ blocks:[['h','結論'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'① 破冰　10 分鐘', q:m.grp[0], tip:'讓每個人都說一句。組長先說自己的。' });
  ps.push({ sec:900, ttl:'② 經文共讀　15 分鐘', q:'「' + m.mv.t + '」　' + m.mv.r,
            tip:'逐人讀本章核心經文。讀完，先安靜三十秒，不急著解釋。' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'③ 討論　第 ' + (i + 2) + ' 題', q,
    tip: i === 1 ? '這是最深的一題。組長先說自己的。不要追問細節；若有人哭，停下來為他禱告，不要接著問下一題。'
       : i === 3 ? '請小組成員在第七天問他一次。' : '' }));
  ps.push({ sec:900, ttl:'④ 操練與代禱　15 分鐘', q:m.prac.main,
            tip:'一人只選一項。彼此指定第七天要問的同伴，然後為彼此禱告。' });
  return ps;
}
function fDraw(){
  if (!F) return;
  const p = F.pages[F.i], b = $('#fbody');
  if (F.tele){
    b.className = 'fbody tele';
    b.innerHTML = p.blocks.map(x =>
      x[0] === 'h' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 's' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 't' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'm' ? `<p class="pause">${esc(x[1])}</p>` :
      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">停　<b>${x[1]}</b>　秒</p>` :
      `<p>${esc(x[1])}</p>`).join('');
  } else {
    b.className = 'fbody live';
    b.innerHTML = `<h5>${esc(p.ttl)}</h5><p class="qq">${esc(p.q)}</p>` +
      (p.tip ? `<div class="tipbox"><b>💡 帶領提醒</b><br>${esc(p.tip)}</div>` : '');
    F.left = p.sec;
  }
  b.scrollTop = 0;
  $('#frail').style.width = ((F.i + 1) / F.pages.length * 100) + '%';
  $('#fplay').textContent = F.run ? '暫停' : '繼續';
  fClock();
}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('已經是最後一段'); return; }
  F.i = i; fDraw();
}
$('#fx').onclick = () => { if (confirm('結束這個模式嗎？')) fClose(); };
$('#fprev').onclick = () => fGo(-1);
$('#fnext').onclick = () => fGo(1);
$('#fplay').onclick = () => { F.run = !F.run; $('#fplay').textContent = F.run ? '暫停' : '繼續'; };
$('#fA').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); };
if ($('#fLang')) $('#fLang').onclick = toggleSC;
document.addEventListener('keydown', e => {
  if (!F) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fGo(1); }
  if (e.key === 'ArrowLeft') fGo(-1);
  if (e.key === 'Escape') fClose();
});

/* ===== 搜尋 ===== */
function vSearch(){
  setTitle('搜尋', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">搜尋</p>
    <input class="sbox" id="sq" placeholder="經節、原文、關鍵字…（例：2:5、無己、χαρά）" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">搜尋四章講義、教學講義逐字稿、重點節解經、原文軌跡與爭議地圖。</p></div>`;
  if (q.length >= 1){
    const hit = (t) => t && t.indexOf(q) >= 0;
    const mk = (t) => esc(t).split(esc(q)).join('<mark>' + esc(q) + '</mark>');
    let r = '';
    // 經節
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">經文　${vs.length}</h3>`;
      vs.slice(0, 15).forEach(v => r += `<button class="chrow" onclick="openV('${v[0]}')">
        <span class="chn">${esc(v[0])}</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(v[1])}</b></span></button>`);
      if (vs.length > 15) r += `<p class="xs muted">（只顯示前 15 筆）</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">我的畫線　${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 40))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 30))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">解經　${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 38))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 章
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(hit) || c.grp.some(hit) || c.safe.some(hit) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">講義　${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // 教學講義逐字稿
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // 想更深是一問一答
        const p = parts.find(hit);
        if (p) { ls.push([k, p]); break; }
      }
    });
    if (ls.length){ r += `<h3 class="sec">教學講義　${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">
        <span class="chn">${String(x[0]).padStart(2,'0')}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(x[1].slice(0, 44))}${x[1].length > 44 ? '…' : ''}</b></span></button>`);
      if (ls.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 軌跡
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">原文軌跡　${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">原</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)}　·　${mk(t.ins)}</span></span></button>`); }
    // 爭議
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">爭議　${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">羅 ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">找不到「${esc(q)}」。試試經節（2:5）、原文（χαρά）或關鍵字（無己、喜樂、知足）。</p>`;
  }
  return h;
}
