生活</td><td>全卷第一個命令</td></tr><tr><td>πολιτεύεσθε</td><td>politeuesthe</td><td>作公民、過城邦生活</td><td>不是一般的「行」</td></tr><tr><td>στήκετε ἐν ἑνὶ πνεύματι</td><td>stēkete en heni pneumati</td><td>在一個靈裡站立</td><td>軍事站陣</td></tr><tr><td>μιᾷ ψυχῇ συναθλοῦντες</td><td>mia psychē synathlountes</td><td>以一個魂一同奮鬥</td><td>同一隊的運動員</td></tr><tr><td>τῇ πίστει τοῦ εὐαγγελίου</td><td>tē pistei tou euangeliou</td><td>為福音的信仰</td><td>爭的是福音，不是自己</td></tr></table>","gram":"<p><strong>Μόνον（Monon） 放在全卷第一個命令的最前面。</strong>保羅剛說完自己是去是留都不知道，接著說：不論如何，只要一件事。命令的動詞不是保羅常用的 περιπατέω（peripateō），而是 πολιτεύεσθε（politeuesthe）——由 πόλις（polis） 而來，「作城邦的公民、過公民的生活」。在一座以羅馬公民權為榮的駐防城裡，這個字一出口，人人都聽得懂。3:20 πολίτευμα（politeuma） 會把這個字講完：「我們卻是天上的國民」（3:20）。</p><p>ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ἀκούω（hina eite elthōn kai idōn hymas eite apōn akouō）：保羅在不在場，他們都要一樣。στήκετε（stēkete） 是軍事語言，站住陣地；ἐν ἑνὶ πνεύματι（en heni pneumati） 與 μιᾷ ψυχῇ（mia psychē） 平行，前者可能指聖靈（如弗 2:18 的「一個聖靈」），也可能指一個心志；和合本譯「同有一個心志」。συναθλοῦντες（synathlountes） 是 σύν（syn） 加上 ἀθλέω（athleō），競技場上同一隊的運動員，4:3 用同一個字形容友阿蝶和循都基曾「與我一同勞苦」。</p>","exp":"<p>〔背景〕徒 16:12（使徒行傳講義第 16 章）</p><p>使徒行傳介紹腓立比，只用了一句話：「也是羅馬的駐防城」（徒 16:12）。居民多是退伍軍人的後代，用羅馬的法律，講羅馬的話，以身為羅馬公民為榮。保羅自己在那裡被打之後，也是亮出「我們是羅馬人」（徒 16:37）的身分。這群人最懂甚麼叫「公民」。</p><p>「只要你們行事為人與基督的福音相稱」（1:27）。和合本的「行事為人」，原文是「像公民一樣過日子」。腓立比是羅馬放在馬其頓的一塊領土；教會是天國放在腓立比的一塊領土。這是 321「建立屬神的體系」在全本新約最直接的經文之一：體系不是一套組織，是一群照著另一個國度的憲法過日子的人。這個國度的憲法，就是「基督的福音」。</p><p>「同有一個心志，站立得穩，為所信的福音齊心努力」（1:27）。公民不是一個人當的，是一群人一起當的。「齊心努力」是同一隊的運動員：同一隊的人可以有不同的位置，卻不能各踢各的球門。保羅特別寫這一句，是因為這間教會裡開始有人各踢各的（2:3；4:2）。合一不是沒有意見，是朝同一個方向：福音。</p><p>最值得注意的是那一句「或來見你們，或不在你們那裡」（1:27）。保羅在不在場，他們都要一樣。一間教會的成熟，不是看領袖在的時候有多熱鬧，是看領袖不在的時候，大家還是不是朝同一個方向站著。這是 321 說的屬靈體系：不倚靠一個人，倚靠同一位主。</p><p>注意這個命令的根據。保羅不是說「你們要努力配得上，才能成為公民」，而是說「你們已經是公民，就照這個身分過日子」。身分在先，行事在後；這也是全卷講無己的次序——先知道自己屬於哪一國，才知道為了這一國可以放下甚麼。</p>"},{"a":28,"z":28,"star":1,"grk":"<p lang=\"grc\">καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ἐστὶν αὐτοῖς ἔνδειξις ἀπωλείας, ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,</p>","lit":"<p>並且在任何事上都不被敵對者驚嚇——這對他們是滅亡的明證，對你們卻是得救的明證，而且這是出於神；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ πτυρόμενοι ἐν μηδενὶ</td><td>mē ptyromenoi en mēdeni</td><td>在任何事上都不被驚嚇</td><td>受驚的馬</td></tr><tr><td>τῶν ἀντικειμένων</td><td>tōn antikeimenōn</td><td>那些敵對的</td><td>外面的逼迫者</td></tr><tr><td>ἔνδειξις ἀπωλείας</td><td>endeixis apōleias</td><td>滅亡的明證</td><td>法庭上的證據</td></tr><tr><td>καὶ τοῦτο ἀπὸ θεοῦ</td><td>kai touto apo theou</td><td>而且這是出於神</td><td>得救的源頭</td></tr></table>","gram":"<p><strong>πτυρόμενοι（ptyromenoi） 在新約只出現這一次</strong>，原用在戰場上受驚亂竄的馬。與 1:27 的 στήκετε（stēkete） 正好相反：一個站穩，一個驚跑。ἥτις ἐστὶν αὐτοῖς ἔνδειξις ἀπωλείας（hētis estin autois endeixis apōleias）, ὑμῶν δὲ σωτηρίας（hymōn de sōtērias） 是一組對比：同一件事——信徒的不懼怕——對敵人是滅亡的徵兆，對信徒是得救的徵兆。ἔνδειξις（endeixis） 是法庭上的「證據」。καὶ τοῦτο ἀπὸ θεοῦ（kai touto apo theou） 的 τοῦτο（touto） 是中性，指整件事（得救連同這份不懼怕），不是單指「信心」。SBLGNT 在 1:28 開了括號，到 1:29 末才收。</p>","exp":"<p>「凡事不怕敵人的驚嚇」（1:28）。腓立比的外面有逼迫——拜皇帝、拜城神的社會，不會放過一群不肯拜的人。保羅沒有叫他們去打敵人，只叫他們不要被嚇跑。站著不動，本身就是見證。</p><p>「這是證明他們沉淪，你們得救都是出於神」（1:28）。信徒在逼迫中的平靜，對旁觀的人是一個信號：這群人的根不在這裡。保羅加上「都是出於神」，把功勞從信徒身上拿走：不怕不是因為你們勇敢，是因為神在你們裡面動了善工（1:6）。</p><p>今天的華人信徒，面對的逼迫多半不是監獄，是家族的壓力、職場的冷眼、社群的嘲笑。1:28 給的不是反擊的策略，是站立的姿勢：不必驚慌，也不必報復，因為得救是出於神，不是出於我們能不能贏這一場辯論。</p><p>不懼怕也不等於不在乎安全。保羅在別處也會避開危險、也會上訴；1:28 說的是不被驚嚇到放棄信仰，不是叫人留在傷害裡不求保護。</p>"},{"a":29,"z":30,"star":2,"grk":"<p lang=\"grc\">ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),</p><p lang=\"grc\">τὸν αὐτὸν ἀγῶνα ἔχοντες οἷον εἴδετε ἐν ἐμοὶ καὶ νῦν ἀκούετε ἐν ἐμοί.</p>","lit":"<p>因為為了基督的緣故，這已經恩賜給你們：不只是信入他，也是為他受苦，</p><p>有著同樣的爭戰，就是你們在我身上看見過的，現在也在我身上聽見的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑμῖν ἐχαρίσθη</td><td>hymin echaristhē</td><td>已經恩賜給你們</td><td>χάρις 的動詞</td></tr><tr><td>τὸ εἰς αὐτὸν πιστεύειν</td><td>to eis auton pisteuein</td><td>信入他</td><td>信心是恩賜</td></tr><tr><td>τὸ ὑπὲρ αὐτοῦ πάσχειν</td><td>to hyper autou paschein</td><td>為他受苦</td><td>與信並列</td></tr><tr><td>τὸν αὐτὸν ἀγῶνα ἔχοντες</td><td>ton auton agōna echontes</td><td>有著同樣的爭戰</td><td>ἀγῶνα：競技、角力</td></tr></table>","gram":"<p><strong>ἐχαρίσθη（echaristhē） 是 χαρίζομαι（charizomai） 的不定過去式被動，字根就是 χάρις（charis）。</strong>保羅用「恩賜」這個字，連接兩個不定詞：οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν（ou monon to eis auton pisteuein alla kai to hyper autou paschein）。τὸ ὑπὲρ Χριστοῦ（to hyper Christou） 先說了一半，被插入的 οὐ μόνον（ou monon）……ἀλλὰ καὶ（alla kai） 打斷，再用 ὑπὲρ αὐτοῦ（hyper autou） 補完——又是一個想到一半的句子。</p><p>1:30 τὸν αὐτὸν ἀγῶνα ἔχοντες（ton auton agōna echontes） 是分詞，接回 1:27 的主詞。ἀγῶνα（agōna） 是競技、角力，與 1:27 συναθλοῦντες（synathlountes） 同屬運動場的字彙。οἷον εἴδετε ἐν ἐμοὶ καὶ νῦν ἀκούετε ἐν ἐμοί（hoion eidete en emoi kai nyn akouete en emoi）：兩個 ἐν ἐμοὶ（en emoi） 平行，「看見」指保羅在腓立比的遭遇，「聽見」指他現在在羅馬的捆鎖。</p>","exp":"<p>〔背景〕徒 16:19--24（使徒行傳講義第 16 章）</p><p>「你們的爭戰，就與你們在我身上從前所看見、現在所聽見的一樣」（1:30）。腓立比人「看見」過甚麼？使徒行傳講義第 16 章講過：使女的主人揪住保羅和西拉，官長剝了他們的衣裳，「打了許多棍，便將他們下在監裡」（徒 16:23）。那一夜，有人親眼看見保羅的背被打開。十年後他們又「聽見」保羅在羅馬坐監。他們自己的苦，是和使徒同一場爭戰。</p><p>「因為你們蒙恩，不但得以信服基督，並要為他受苦」（1:29）。保羅把受苦放在「蒙恩」底下，和「信服基督」並列。這不是說苦難本身是好東西，也不是說神喜歡看人痛；而是說：<strong>為基督受苦，是與基督同行的一部分</strong>，受苦的人不是被神遺棄，是被算為配得上這份同行。這節說的是「為他」受的苦——因為跟從基督而遭遇的逼迫。</p><p>所以這一節不可以拿來美化一切痛苦，更不可以用來叫病人放棄治療、叫受虐的人留在危險裡、或叫人不要申訴不公。病痛需要醫治，不公需要處理；保羅自己在腓立比也亮出羅馬公民的身分，要求官長親自來領他出去（徒 16:37）。</p><p>第 1 章到這裡收住：一個在捆鎖中的人，把感謝、禱告、生死、公民的身分，都寫給一群和他打同一場仗的人。他們是同一隊的運動員，同一場爭戰的戰友。下一章，保羅要告訴他們，這一隊要用甚麼樣的心一起跑：「你們當以基督耶穌的心為心」（2:5）。</p>"}],"2":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,</p><p lang=\"grc\">πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,</p>","lit":"<p>所以，若有甚麼勸勉在基督裡，若有甚麼愛的安慰，若有甚麼靈的團契，若有甚麼心腸和憐憫，</p><p>你們要使我的喜樂滿足，好叫你們思想同一件事，有同一的愛，同一個魂，思想那一件事，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εἴ τις οὖν</td><td>Ei tis oun</td><td>所以，若有甚麼</td><td>四次「若有」：不是懷疑，是「既然有」</td></tr><tr><td>παράκλησις ἐν Χριστῷ</td><td>paraklēsis en Christō</td><td>在基督裡的勸勉</td><td>源頭一：基督</td></tr><tr><td>παραμύθιον ἀγάπης</td><td>paramythion agapēs</td><td>愛的安慰</td><td>源頭二：愛</td></tr><tr><td>κοινωνία πνεύματος</td><td>koinōnia pneumatos</td><td>靈的團契</td><td>源頭三：聖靈；κοινωνία 追蹤</td></tr><tr><td>σπλάγχνα καὶ οἰκτιρμοί</td><td>splanchna kai oiktirmoi</td><td>心腸與憐憫</td><td>源頭四：從腹中發出的溫柔</td></tr><tr><td>πληρώσατέ μου τὴν χαρὰν</td><td>plērōsate mou tēn charan</td><td>你們要使我的喜樂滿足</td><td>主要動詞，原文放在句首</td></tr><tr><td>σύμψυχοι</td><td>sympsychoi</td><td>同魂的</td><td>本章四個 ψυχή 複合字的第一個</td></tr><tr><td>τὸ ἓν φρονοῦντες</td><td>to hen phronountes</td><td>思想那一件事</td><td>φρονέω 一節兩次</td></tr></table>","gram":"<p><strong>2:1 是四個條件子句排成一列。</strong>Εἴ τις οὖν（Ei tis oun） 起頭，接著 εἴ τι（ei ti）、εἴ τις（ei tis）、εἴ τις（ei tis），一共四個「若有」。這是希臘文的第一類條件句，說話的人假定條件是真的，意思接近「既然有」。保羅不是在問腓立比人有沒有，他是在點名四個他們都嘗過的源頭：παράκλησις ἐν Χριστῷ（paraklēsis en Christō）、παραμύθιον ἀγάπης（paramythion agapēs）、κοινωνία πνεύματος（koinōnia pneumatos）、σπλάγχνα καὶ οἰκτιρμοί（splanchna kai oiktirmoi）。基督、愛、聖靈、憐憫——合一的資源，全都從上面來。</p><p>主要動詞在 2:2 的句首：πληρώσατέ μου τὴν χαρὰν（plērōsate mou tēn charan），不定過去命令式，「你們要把我的喜樂填滿」。和合本照中文語序把它放到句末。填滿的方法是一個 ἵνα（hina） 子句，裡面四個片語說同一件事：τὸ αὐτὸ φρονῆτε（to auto phronēte）、τὴν αὐτὴν ἀγάπην ἔχοντες（tēn autēn agapēn echontes）、σύμψυχοι（sympsychoi）、τὸ ἓν φρονοῦντες（to hen phronountes）。φρονέω（phroneō） 在一節裡出現兩次，是全卷十次的開端；σύμψυχοι（sympsychoi） 是「同一個魂」，本章接著還有 εὐψυχῶ（eupsychō）、ἰσόψυχον（isopsychon） 和 2:30 的 τῇ ψυχῇ（tē psychē）。</p><blockquote><p>φρονέω（phroneō） 不是「意見」，是心思的方向、看事情的角度。τὸ αὐτὸ φρονῆτε（to auto phronēte） 與 4:2 勸兩位姊妹 τὸ αὐτὸ φρονεῖν（to auto phronein） 是同一個片語——2:2 的藥方，就是寫給 4:2 那兩個人的。</p></blockquote>","exp":"<p>腓立比教會遇到甚麼？不是異端，也不是窮。這是一間很愛保羅、很肯奉獻的教會，「從頭一天直到如今」（1:5）都與他同工。可是第 4 章點了兩個名字：「我勸友阿蝶和循都基，要在主裡同心」（4:2）。好人也會吵架，而且常常吵在最熱心的地方。第 2 章就是為這樣的教會寫的。</p><p>保羅開的藥方，第一步不是規條。「所以，在基督裡若有甚麼勸勉」（2:1）——他先提醒他們手裡已經有甚麼：基督的勸勉、愛的安慰、聖靈的交通、心中的慈悲。像一個人要和好，先打開抽屜，看看裡面放了甚麼。合一不是管理出來的，是從這四個源頭流出來的。沒有源頭的合一，只能靠壓；有源頭的合一，才能長。</p><p>接著是四個「相同」：意念相同、愛心相同、一樣的心思、一樣的意念。聽起來像要每個人想法都一樣。其實 φρονέω（phroneō） 指的是心思朝著哪裡。兩個人可以對裝潢、詩歌、預算有不同意見，卻仍然朝著同一個方向。<strong>合一不是意見相同，是心思同一個方向。</strong>那個方向是誰，2:5 會說出來：基督耶穌的心。</p><p>最動人的是保羅的理由：「使我的喜樂可以滿足」（2:2）。一個坐監的人，喜樂還缺一角，缺的不是自由，是一群他所愛的人不和。這是喜樂在本章第一次出現。保羅的喜樂不在環境，在人。今天每一間很愛主、同工卻開始互相看不順眼的華人教會，都可以在這兩節找到自己的位置：資源都在，只是忘了打開。</p>"},{"a":3,"z":4,"star":3,"grk":"<p lang=\"grc\">μηδὲν κατʼ ἐριθείαν μηδὲ κατὰ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,</p><p lang=\"grc\">μὴ τὰ ἑαυτῶν ἕκαστοι σκοποῦντες ἀλλὰ καὶ τὰ ἑτέρων ἕκαστοι</p>","lit":"<p>凡事不按著自私的野心，也不按著空洞的榮耀，而是以謙卑的心思，彼此算別人比自己超越，</p><p>各人不要只看自己的事，而是各人也要看別人的事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κατʼ ἐριθείαν</td><td>kat' eritheian</td><td>按著自私的野心</td><td>原指受雇拉票；1:17「結黨」同字</td></tr><tr><td>κενοδοξίαν</td><td>kenodoxian</td><td>空洞的榮耀</td><td>κενός＋δόξα；與 2:7 同字根</td></tr><tr><td>τῇ ταπεινοφροσύνῃ</td><td>tē tapeinophrosynē</td><td>以謙卑的心思</td><td>「低」與「心思」兩條線交會</td></tr><tr><td>ἡγούμενοι</td><td>hēgoumenoi</td><td>算為、看作</td><td>ἡγέομαι 全卷第一次</td></tr><tr><td>ὑπερέχοντας ἑαυτῶν</td><td>hyperechontas heautōn</td><td>比自己超越</td><td>看重，不是自貶</td></tr><tr><td>σκοποῦντες</td><td>skopountes</td><td>注目、看顧</td><td>3:14 σκοπὸν 的同字根</td></tr><tr><td>ἀλλὰ καὶ τὰ ἑτέρων</td><td>alla kai ta heterōn</td><td>而是也要看別人的</td><td>καί：也</td></tr></table>","gram":"<p><strong>2:3 沒有動詞。</strong>μηδὲν κατʼ ἐριθείαν μηδὲ κατὰ κενοδοξίαν（mēden kat' eritheian mēde kata kenodoxian）——「不按著……也不按著……」，動詞要從 2:2 帶下來。兩個否定，接一個 ἀλλὰ（alla） 轉正面：τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν（tē tapeinophrosynē allēlous hēgoumenoi hyperechontas heautōn）。</p><p>ἐριθεία（eritheia） 原是受雇的工作，後來在希臘政治裡指拉票、結派、為自己的前途經營人脈；1:17 那些「出於結黨」傳基督的人，用的就是它。κενοδοξία（kenodoxia） 由 κενός（kenos） 與 δόξα（doxa） 合成，前者是空，後者是榮耀：裡面是空的榮耀。<strong>請記住這個「空」字。</strong>四節以後，2:7 的 ἐκένωσεν（ekenōsen） 是同一個字根：人想把空的榮耀裝進自己，基督卻把滿的自己倒出來。</p><p>ταπεινοφροσύνη（tapeinophrosynē） 把 ταπεινός（tapeinos） 的「低」與 φρονέω（phroneō） 的「心思」合成一個字。在希臘羅馬的倫理裡，「低」是奴隸的性格，不是美德；新約把它翻成了基督徒的第一個品格。ἡγούμενοι（hēgoumenoi） 是 ἡγέομαι（hēgeomai） 在全卷第一次出現，下一次是 2:6 基督「不以為」，再來是 2:25 與 3:7–8 的「當作」。一個動詞，串起人看人、基督看權利、保羅看資歷。</p><blockquote><p>◆ 2:4 μὴ τὰ ἑαυτῶν ἕκαστοι σκοποῦντες ἀλλὰ καὶ τὰ ἑτέρων ἕκαστοι（mē ta heautōn hekastoi skopountes alla kai ta heterōn hekastoi）：μὴ（mē）……ἀλλὰ（alla） 之後多了一個 καὶ（kai），「也」。和合本譯得精準：「不要<strong>單</strong>顧……<strong>也</strong>要顧」。保羅禁止的是「只」看自己，沒有禁止看自己。σκοποῦντες（skopountes） 是注目、盯著看，3:14 的 σκοπὸν（標竿）是同一個字根：你一直盯著看的，就是你的標竿。</p></blockquote>","exp":"<p>「凡事不可結黨，不可貪圖虛浮的榮耀」（2:3）。腓立比的問題，原文說得更清楚：一種是為自己經營，一種是追逐空殼。前者在會議裡拉票，後者在台上要掌聲。兩者都不一定犯了甚麼明顯的罪，卻都把自己放在中心。2:21 會給「有己」一個最短的定義：「別人都求自己的事，並不求耶穌基督的事」（2:21）。</p><p>解藥是：「只要存心謙卑，各人看別人比自己強」（2:3）。這一句最常被讀歪。它不是說別人的能力都比你好，也不是要你相信自己一文不值。ἡγέομαι（hēgeomai） 是一個算帳的字，算的是次序：在我的眼睛裡，你的需要排在前面。一位醫術高明的醫生，看病人「比自己強」，不是承認病人比他會開刀，是把病人的需要放在自己的休息之前。</p><p>所以 2:4 那個「也」字非常要緊：「各人不要單顧自己的事，也要顧別人的事」（2:4）。<strong>保羅沒有叫人不顧自己。</strong>他叫人不要只顧自己。321 說無己，常常有人誤聽成「我不可以有需要」——這一節先把這條路堵住了。無己不是沒有自己，是不以自己為中心；一個不顧自己身體、情緒、家人的人，不是更屬靈，是失去了平衡，也很快沒有東西可以給別人。2:27 保羅自己就坦白說出他的憂愁。</p><p>那「空洞的榮耀」與四節以後的「虛己」，在原文是同一個字根。人的病，是想用空的東西把自己填滿；基督的路，是把滿的自己倒出來給人。這兩節是 2:5–11 的問題，基督之歌是答案。讀到這裡，該問的不是「我要怎樣看輕自己」，是「我的眼睛最近一直盯著誰的事」。</p>"},{"a":5,"z":6,"star":3,"grk":"<p lang=\"grc\">τοῦτο φρονεῖτε ἐν ὑμῖν ὃ καὶ ἐν Χριστῷ Ἰησοῦ,</p><p lang=\"grc\">ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ,</p>","lit":"<p>這個你們要在你們中間思想，就是那也在基督耶穌裡的；</p><p>他一直存在於神的形式裡，卻不把與神同等這件事算為要抓住不放的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τοῦτο φρονεῖτε ἐν ὑμῖν</td><td>touto phroneite en hymin</td><td>這個你們要在你們中間思想</td><td>現在命令式；ὑμῖν 複數</td></tr><tr><td>ὃ καὶ ἐν Χριστῷ Ἰησοῦ</td><td>ho kai en Christō Iēsou</td><td>也在基督耶穌裡的</td><td>省略句，兩讀</td></tr><tr><td>ὃς</td><td>hos</td><td>他</td><td>關係代名詞起頭：詩歌的口吻</td></tr><tr><td>ἐν μορφῇ θεοῦ ὑπάρχων</td><td>en morphē theou hyparchōn</td><td>一直存在於神的形式裡</td><td>現在分詞：一直是</td></tr><tr><td>οὐχ ἁρπαγμὸν ἡγήσατο</td><td>ouch harpagmon hēgēsato</td><td>不算為要抓的</td><td>ἡγέομαι 第二次</td></tr><tr><td>τὸ εἶναι ἴσα θεῷ</td><td>to einai isa theō</td><td>與神同等</td><td>冠詞不定詞，回指 μορφῇ θεοῦ</td></tr></table>","gram":"<p><strong>◆ 基督之歌的詩行骨架（2:6–11）。</strong>2:5 是引言，2:6 用關係代名詞 ὃς（hos） 起頭——和西 1:15、提前 3:16 一樣，是早期教會詩歌的口吻。全歌分兩節：前半主詞是基督，一路往下；後半主詞換成神，一路往上。</p><blockquote><p><strong>往下七步（主詞：基督）</strong></p><p>① ἐν μορφῇ θεοῦ ὑπάρχων（en morphē theou hyparchōn）——本有神的形像</p><p>② οὐχ ἁρπαγμὸν ἡγήσατο（ouch harpagmon hēgēsato）——不以與神同等為強奪的</p><p>③ ἀλλὰ ἑαυτὸν ἐκένωσεν（alla heauton ekenōsen）——反倒虛己</p><p>④ μορφὴν δούλου λαβών（morphēn doulou labōn）——取了奴僕的形像</p><p>⑤ ἐν ὁμοιώματι ἀνθρώπων γενόμενος（en homoiōmati anthrōpōn genomenos）——成為人的樣式</p><p>⑥ ἐταπείνωσεν ἑαυτὸν（etapeinōsen heauton）——自己卑微</p><p>⑦ γενόμενος ὑπήκοος μέχρι θανάτου（genomenos hypēkoos mechri thanatou）——存心順服，以至於死；θανάτου δὲ σταυροῦ（thanatou de staurou）——且死在十字架上</p><p><strong>διὸ（dio）——所以</strong></p><p><strong>往上三步（主詞：神）</strong></p><p>① ὑπερύψωσεν（hyperypsōsen）——神將他升為至高</p><p>② ἐχαρίσατο αὐτῷ τὸ ὄνομα（echarisato autō to onoma）——賜給他超乎萬名之上的名</p><p>③ πᾶν γόνυ κάμψῃ（pan gony kampsē）……πᾶσα γλῶσσα ἐξομολογήσηται（pasa glōssa exomologēsētai）——萬膝跪拜、萬口承認</p></blockquote><p>2:5 τοῦτο φρονεῖτε ἐν ὑμῖν ὃ καὶ ἐν Χριστῷ Ἰησοῦ（touto phroneite en hymin ho kai en Christō Iēsou） 是省略句，後半沒有動詞。讀法有二：一、倫理讀法：「你們要存的心，就是基督耶穌裡的那心」（和合本、多數中英譯本），基督是榜樣；二、處境讀法：「你們彼此之間要這樣想，正如在基督耶穌裡的人該有的想法」，ἐν Χριστῷ（en Christō） 指信徒的身分（Käsemann 等）。本講義判斷：兩讀不必對立——榜樣不是外面的模型，是我們已經在其中的那一位。ἐν ὑμῖν（en hymin） 是複數，「在你們中間」：基督的心是一群人一起長出來的。</p><p>2:6 ἐν μορφῇ θεοῦ ὑπάρχων（en morphē theou hyparchōn）：ὑπάρχων（hyparchōn） 是現在分詞，「一直是」；μορφή（morphē） 指表現內在本質的形式，不是可以換掉的外貌（2:7 的 σχήματι（schēmati） 才是外貌）。οὐχ ἁρπαγμὸν ἡγήσατο（ouch harpagmon hēgēsato）：ἁρπαγμός（harpagmos） 新約只見於此，有兩讀——要伸手去搶的（他本來沒有），或已經有、卻抓住不放、拿來為自己用的。既然 ὑπάρχων（hyparchōn） 說他一直是，本講義取第二讀：<strong>他不是沒有，是不抓。</strong>ἡγήσατο（hēgēsato） 與 2:3 ἡγούμενοι（hēgoumenoi） 同一個動詞：基督怎樣「看」他的權利，信徒就怎樣「看」彼此。</p>","exp":"<p>「你們當以基督耶穌的心為心」（2:5）。全本新約，「耶穌是我的榜樣」沒有比這一句更直接的命令。可是保羅沒有接著列出一張行為清單，他唱了一首歌。因為榜樣不是一套技巧，是一個人；要學他的心，先要看他是誰。所以次序很重要：<strong>先讓這首歌唱完，唱到萬膝跪拜，我們的功課才在末端接上去。</strong></p><p>歌的第一句是身分：「他本有神的形像，不以自己與神同等為強奪的」（2:6）。他沒有身分危機。他一直知道自己是誰，所以不需要抓住甚麼來證明。這使我們想起伊甸園：蛇對人說「你們便如神能知道善惡」（創 3:5）。亞當本來不是神，卻伸手要如神；基督本來與神同等，卻不伸手抓住。一個是不該抓的偏要抓，一個是可以抓的卻放手。（腓立比書沒有明說亞當，這是我們讀到的對照。）</p><p>321 說：驕傲是離開本位抓住權力，謙卑是放下權力回到本位。全本聖經裡，這兩句話最精準的經文就是 2:6。驕傲的人不一定大聲，常常只是抓得很緊——抓住位子、抓住發言權、抓住「我是對的」。謙卑也不是假裝自己沒有，基督明明「本有」；謙卑是有，卻不拿來為自己用。</p><p>這裡有一條很重要的線，一定要先拉直：<strong>基督放手，是因為他知道自己是誰，不是因為他不知道。</strong>所以學基督的心，不是從懷疑自己開始，是從確知自己開始——在基督裡蒙愛、蒙召，是「聖徒」（1:1），是「天上的國民」（3:20）。一個人越確知自己是誰，越不需要抓；越不需要抓，手越空得出來去愛。保羅寫這段全本新約最高的基督論，是因為兩位姊妹吵架了。最高的神學，是為最實際的關係寫的。</p>"},{"a":7,"z":8,"star":3,"grk":"<p lang=\"grc\">ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος</p><p lang=\"grc\">ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·</p>","lit":"<p>反而把自己倒空，取了奴僕的形式，成為在人的樣式裡；並且在外貌上被看出像一個人，</p><p>他使自己降卑，成了順服的，直到死，而且是十字架的死。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀλλὰ ἑαυτὸν ἐκένωσεν</td><td>alla heauton ekenōsen</td><td>反而把自己倒空</td><td>ἑαυτὸν 放在動詞前：是他自己</td></tr><tr><td>μορφὴν δούλου λαβών</td><td>morphēn doulou labōn</td><td>取了奴僕的形式</td><td>倒空的方式：取了</td></tr><tr><td>ἐν ὁμοιώματι ἀνθρώπων γενόμενος</td><td>en homoiōmati anthrōpōn genomenos</td><td>成為在人的樣式裡</td><td>真實的人</td></tr><tr><td>σχήματι εὑρεθεὶς ὡς ἄνθρωπος</td><td>schēmati heuretheis hōs anthrōpos</td><td>外貌上被看出像人</td><td>和合本移到 2:8 句首</td></tr><tr><td>ἐταπείνωσεν ἑαυτὸν</td><td>etapeinōsen heauton</td><td>使自己降卑</td><td>又一個 ἑαυτὸν；4:12 同一個動詞</td></tr><tr><td>γενόμενος ὑπήκοος μέχρι θανάτου</td><td>genomenos hypēkoos mechri thanatou</td><td>成了順服的，直到死</td><td>2:30 以巴弗提也 μέχρι θανάτου</td></tr><tr><td>θανάτου δὲ σταυροῦ</td><td>thanatou de staurou</td><td>而且是十字架的死</td><td>全卷地勢最低點</td></tr></table>","gram":"<p><strong>◆ 2:7 ἀλλὰ ἑαυτὸν ἐκένωσεν（alla heauton ekenōsen）：反倒虛己。</strong>ἀλλὰ（alla） 接 2:6 的 οὐχ（ouch）：「不抓住，反倒……」。ἑαυτὸν（heauton） 放在動詞前面，強調：倒空的是他自己，而且是他自己倒空的——反身代名詞，主動語態，不是被人倒空。κενόω（kenoō） 字面是「使空」，與 2:3 κενοδοξίαν（kenodoxian）、2:16 εἰς κενὸν（eis kenon） 同一個字根。保羅沒有說基督倒空了「甚麼」；他用兩個分詞說明倒空的方式：μορφὴν δούλου λαβών（morphēn doulou labōn）、ἐν ὁμοιώματι ἀνθρώπων γενόμενος（en homoiōmati anthrōpōn genomenos）。</p><p>「基督倒空了甚麼？」各家讀法有三：</p><blockquote><p><strong>一、古典讀法</strong>（教父、改教家）：倒空的方式就是「取了奴僕的形像」（2:7）——<strong>加上人性，不是減去神性</strong>。他倒空的是 2:6 那種「抓住不放」的姿態，不是神的本質。</p><p><strong>二、虛己論</strong>（十九世紀德國、英國的 kenotic 神學）：基督在地上暫時放下全知、全能、無所不在等屬性。本講義陳列，不採用：與 2:6 現在分詞 ὑπάρχων（hyparchōn）「一直是」不合，也使「神的形像」可以被脫下。</p><p><strong>三、自限說</strong>：神性的屬性都在，但基督自願不獨立使用，完全倚靠父與聖靈行事。這是溫和的讀法，與古典讀法可以並存。</p><p>本講義採古典讀法：λαβών（labōn） 是「取了」——<strong>虛己是加法，不是減法</strong>；他本有神的形像，又取了奴僕的形像。</p></blockquote><p>兩個 μορφή（morphē） 互相對照：2:6 的 ἐν μορφῇ θεοῦ（en morphē theou） 與 2:7 的 μορφὴν δούλου（morphēn doulou）。他取的不只是「人」的形像，是「奴僕」的——人裡面最低的一級。ἐν ὁμοιώματι ἀνθρώπων（en homoiōmati anthrōpōn） 說他是真實的人；καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος（kai schēmati heuretheis hōs anthrōpos） 在 SBLGNT 屬 2:7 末，和合本照中文語氣放到 2:8 句首「既有人的樣子」，不是分節不同，只是片語歸屬不同。</p><p>2:8 ἐταπείνωσεν ἑαυτὸν（etapeinōsen heauton） 又是一個 ἑαυτὸν（heauton）：降卑也是他自己的動作。γενόμενος ὑπήκοος μέχρι θανάτου（genomenos hypēkoos mechri thanatou） 之後，θανάτου δὲ σταυροῦ（thanatou de staurou） 重複「死」字再往下壓一層——這一行打破了詩的節奏，許多學者認為是保羅在詩歌裡親手加上的。ταπεινόω（tapeinoō） 這個動詞，到 4:12 ταπεινοῦσθαι（tapeinousthai） 再出現：保羅「知道怎樣處卑賤」，學的正是這條路。</p>","exp":"<p>「反倒虛己，取了奴僕的形像，成為人的樣式」（2:7）。永遠的神子，成了奴僕；擁有一切的，取了最低的形像。這不是一次降級的意外，是一連串自由的選擇：「就自己卑微，存心順服，以至於死，且死在十字架上」（2:8）。往下七步，一步比一步低，最後停在十字架——全卷地勢圖的最低點。十字架是羅馬處死奴隸與叛亂者的刑罰，腓立比是羅馬駐防城，城裡的公民是免受這種刑罰的；保羅卻對他們說，你們的主死在那裡。</p><p>這一段經文最需要小心。<strong>基督虛己的時候，沒有停止是神，也沒有忘記自己是誰。</strong>約翰福音寫耶穌洗門徒的腳之前，先寫：「耶穌知道父已將萬有交在他手裡」（約 13:3）。知道，所以能彎腰。而且他是「自己」倒空、「自己」卑微——兩個 ἑαυτὸν（heauton）。耶穌說：「沒有人奪我的命去，是我自己捨的」（約 10:18）。<strong>被迫的不叫虛己，叫受害。</strong>一個在家裡被打、在職場被欺壓、在教會被操控的人，他的痛苦不是「還有己」，也不是他需要更多的虛己；他需要的是保護，是被聽見。</p><p>那麼 321 說的「無己」是甚麼？以這兩節為準：<strong>無己不是沒有自己，是不以自己為中心；不是自我消滅，是自我給出。</strong>基督給出自己，是朝著一個方向——2:4 的方向，為了別人。無己的人仍然有分辨（1:9–10），仍然可以說出需要——保羅自己說「免得我憂上加憂」（2:27）；仍然可以設界線——「應當防備犬類」（3:2）。把憂鬱、自我厭惡、不敢拒絕誤認成無己，是把病當成美德；那需要的是醫治與陪伴，不是稱讚。</p><p>「舊人有己」被治死的，是那個以自己為中心的舊生命（羅 6:6），不是神所造的人格、情感與恩賜。基督取了人的樣式，沒有取消人性，反而把人性抬到最高。這一段的落點不在「倒空了多少」，在「為誰倒空」。讀完的人，應當更確知自己在基督裡是誰，所以更自由地去愛——而不是更看輕自己。</p>"},{"a":9,"z":9,"star":2,"grk":"<p lang=\"grc\">διὸ καὶ ὁ θεὸς αὐτὸ ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,</p>","lit":"<p>因此神也把他升到至高，並且恩賜給他那超越一切名的名，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὸ καὶ ὁ θεὸς</td><td>dio kai ho theos</td><td>因此神也</td><td>主詞換人</td></tr><tr><td>ὑπερύψωσεν</td><td>hyperypsōsen</td><td>升到至高</td><td>新約只此一次；ὑπέρ＋ὑψόω</td></tr><tr><td>ἐχαρίσατο</td><td>echarisato</td><td>恩賜</td><td>χάρις 的動詞：名是白白給的</td></tr><tr><td>τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα</td><td>to onoma to hyper pan onoma</td><td>超越一切名的名</td><td>就是 2:11 的 κύριος</td></tr></table>","gram":"<p><strong>2:9 是全歌的轉軸，只有一個字：διὸ（dio）。</strong>2:8 的最後一個字是 σταυροῦ（staurou），2:9 的第一個字是「所以」。全卷地勢圖的最低點（2:8）與最高點（2:11）之間，就隔著這一個字。</p><p>διὸ καὶ ὁ θεὸς（dio kai ho theos）：主詞換人了。2:6–8 的動詞，主詞都是基督——他不抓、他倒空、他取、他降卑；2:9–11 的動詞，主詞是神。往下的路是基督自己走的；往上的路，是神把他抬上去的。</p><p>ὑπερύψωσεν（hyperypsōsen） 是 ὑψόω（hypsoō） 加上 ὑπέρ（hyper），「升高到超過」，新約只在這裡出現。ἐχαρίσατο（echarisato） 是 χάρις（charis） 的動詞，「白白地賜給」：連父給子的名，都用恩典的字。τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα（to onoma to hyper pan onoma） 是甚麼名？2:11 說出來：κύριος（kyrios），七十士譯本用來翻譯神聖名的那個字。</p>","exp":"<p>〔弗〕弗 1:20--22（以弗所書講義第 1 章）</p><p>「所以，神將他升為至高，又賜給他那超乎萬名之上的名」（2:9）。以弗所書講義第 1 章講過同一幅圖：神使基督從死裡復活，坐在右邊，「遠超過一切執政的、掌權的、有能的、主治的」（弗 1:21），「又將萬有服在他的腳下」（弗 1:22）。以弗所書從寶座往下看，腓立比書從十字架往上看；兩卷書指著同一位坐在最高處的主。</p><p>這個「所以」很容易被讀成一套策略：先低頭，才能被抬高；謙卑是升遷的捷徑。可是基督往下走的時候，沒有和神談條件。他走到十字架，是真的死了，不是演給人看的低姿態。<strong>為了被高舉而謙卑，仍然是有己</strong>——只是把抓的手藏在背後。</p><p>耶穌說：「凡自高的，必降為卑；自卑的，必升為高」（路 14:11）。這不是因果的機關，是神的性情：他看顧往下走的人。321 說謙卑戰勝驕傲、反敗為勝；腓立比書在這裡加了一個註腳——<strong>得勝的路是往下走的，往上的那一段，主詞是神。</strong>所以往下走的人不必自己爬上來，也不必替自己爭名。名，是神「賜」的。一個在團契裡默默做事、從沒有被看見的人，讀到這一節，可以放心：記帳的不是人。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">ἵνα ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων,</p><p lang=\"grc\">καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.</p>","lit":"<p>好叫在耶穌的名裡，每一個膝都屈下，天上的、地上的和地底下的，</p><p>並且每一個舌頭都承認：耶穌基督是主，歸於父神的榮耀。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν τῷ ὀνόματι Ἰησοῦ</td><td>en tō onomati Iēsou</td><td>在耶穌的名裡</td><td>最高的名，落在一個人的名字上</td></tr><tr><td>πᾶν γόνυ κάμψῃ</td><td>pan gony kampsē</td><td>每一個膝都屈下</td><td>化用賽 45:23</td></tr><tr><td>ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων</td><td>epouraniōn kai epigeiōn kai katachthoniōn</td><td>天上的、地上的、地底下的</td><td>三界：全受造界</td></tr><tr><td>πᾶσα γλῶσσα ἐξομολογήσηται</td><td>pasa glōssa exomologēsētai</td><td>每一個舌頭都承認</td><td>公開宣認</td></tr><tr><td>κύριος Ἰησοῦς Χριστὸς</td><td>kyrios Iēsous Christos</td><td>耶穌基督是主</td><td>新約最早的信經之一</td></tr><tr><td>εἰς δόξαν θεοῦ πατρός</td><td>eis doxan theou patros</td><td>歸於父神的榮耀</td><td>全歌的最後一個字是「父」</td></tr></table>","gram":"<p><strong>2:10–11 是一個 ἵνα（hina） 目的子句：神高舉他，是為了這一幕。</strong>ἐν τῷ ὀνόματι Ἰησοῦ（en tō onomati Iēsou）——「超乎萬名之上的名」，落在一個在拿撒勒長大的人的名字上。</p><p>πᾶν γόνυ κάμψῃ（pan gony kampsē） 與 πᾶσα γλῶσσα ἐξομολογήσηται（pasa glōssa exomologēsētai） 兩句平行，是化用賽 45:23：「萬膝必向我跪拜；萬口必憑我起誓」（賽 45:23）。保羅沒有標明是引用（腓立比書全卷沒有明文引用舊約），但羅 14:11 明文引了同一節，希臘文作 κάμψει πᾶν γόνυ（kampsei pan gony） 與 ἐξομολογήσεται（exomologēsetai）。在以賽亞書的上下文，說話的是耶和華：「因為我是神，再沒有別神」（賽 45:22）——這是舊約最強烈的獨一神宣告。<strong>以賽亞書只歸給耶和華的敬拜，保羅毫不猶豫地歸給了那位虛己的耶穌。</strong></p><p>ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων（epouraniōn kai epigeiōn kai katachthoniōn） 是三個複數屬格，可以指位格（天使、人、死人與邪靈），也可以概括全受造界；重點是沒有一處例外。ὅτι κύριος Ἰησοῦς Χριστὸς（hoti kyrios Iēsous Christos） 是新約最早的信經之一（羅 10:9；林前 12:3）；κύριος（kyrios） 正是七十士譯本翻譯神聖名的字。最後 εἰς δόξαν θεοῦ πατρός（eis doxan theou patros）：子被高舉，不與父爭榮耀，反而歸給父。</p><blockquote><p>普救論的問題：「無不屈膝」「無不口稱」是說人人都要得救嗎？屈膝與口稱是宣認與歸服，經文沒有說每一個屈膝的人都是甘心的敬拜者；本講義不在此展開，見本章議題頁。</p></blockquote>","exp":"<p>「叫一切在天上的、地上的，和地底下的，因耶穌的名無不屈膝」（2:10）。歌唱到這裡，鏡頭拉到最遠：天上、地上、地底下，一個也沒有漏。那位曾經「自己卑微」的人，現在是萬膝跪拜的對象。全卷最低的 2:8 和最高的 2:11，只隔三節。</p><p>這兩節最驚人的，是保羅借用的那句話。以賽亞書裡，耶和華說「萬膝必向我跪拜」（賽 45:23），前面才說「我是神，再沒有別神」（賽 45:22）。一個嚴守獨一神信仰的猶太人，把這句只屬於耶和華的話，放在耶穌身上。他沒有寫一篇論文證明耶穌是神，他直接把以色列只獻給神的敬拜，獻給了耶穌。而且這位被敬拜的，正是那位倒空自己、死在十字架上的人。<strong>神的榮耀，原來長得像十字架。</strong></p><p>「無不口稱『耶穌基督為主』，使榮耀歸與父神」（2:11）。321 的兩個核心，在這一節並排出現：讓耶穌作王——「耶穌基督為主」；讓耶穌得一切榮耀——「使榮耀歸與父神」。兩者不衝突：子得榮耀，榮耀就歸父。在腓立比這座羅馬城，「主」是凱撒的稱號。教會口稱耶穌為主，等於宣告：最高的權柄不在羅馬。</p><p>現在，歌唱完了，321 的無己才可以接上去。我們要學的那顆心，不是一個失敗者的心，是那位萬膝都要向他跪拜的主的心。往下走不是消失，是神的路；無己不是沒有，乃是進入無限、活出無限——這句話的經文根據，就是 2:9 的「所以」。讀完基督之歌的人，該是更愛這位主，而不是更佩服自己學得多像。今天在家裡彎腰、在職場讓功、在病床旁守夜的人，跟隨的是一位已經坐在最高處的主。</p>"},{"a":12,"z":13,"star":3,"grk":"<p lang=\"grc\">Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,</p><p lang=\"grc\">θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.</p>","lit":"<p>所以，我親愛的，正如你們一向順服，不要只像在我同在的時候，而是如今在我不在的時候更是如此，要帶著懼怕和戰兢，把你們自己的救恩做到底；</p><p>因為神就是那在你們裡面運行的，使你們既願意、又行出來，為了他的美意。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὥστε</td><td>Hōste</td><td>所以</td><td>從基督之歌推出來</td></tr><tr><td>ὑπηκούσατε</td><td>hypēkousate</td><td>你們順服了</td><td>接 2:8 ὑπήκοος</td></tr><tr><td>μετὰ φόβου καὶ τρόμου</td><td>meta phobou kai tromou</td><td>帶著懼怕和戰兢</td><td>敬畏與認真</td></tr><tr><td>τὴν ἑαυτῶν σωτηρίαν</td><td>tēn heautōn sōtērian</td><td>你們自己的救恩</td><td>複數：一群人的救恩</td></tr><tr><td>κατεργάζεσθε</td><td>katergazesthe</td><td>做到底</td><td>現在命令式：持續活出來</td></tr><tr><td>θεὸς γάρ ἐστιν ὁ ἐνεργῶν</td><td>theos gar estin ho energōn</td><td>因為神就是那運行的</td><td>θεὸς 放句首</td></tr><tr><td>καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν</td><td>kai to thelein kai to energein</td><td>既願意、又行出來</td><td>兩個都在神的運行裡</td></tr><tr><td>ὑπὲρ τῆς εὐδοκίας</td><td>hyper tēs eudokias</td><td>為了他的美意</td><td>目的在神</td></tr></table>","gram":"<p><strong>◆ 2:12 與 2:13 是一個句子，必須一起讀。</strong>Ὥστε（Hōste） 把基督之歌接到教會：基督「存心順服」（2:8 ὑπήκοος（hypēkoos）），你們也「常順服」（ὑπηκούσατε（hypēkousate））。μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου（mē hōs en tē parousia mou monon alla nyn pollō mallon en tē apousia mou）：保羅不在，正是考驗的時候。</p><p>κατεργάζεσθε（katergazesthe） 是 ἐργάζομαι（ergazomai） 加上「到底」的字首，「做到完成、做出結果」，不是「為了得到而做」。受詞 τὴν ἑαυτῶν σωτηρίαν（tēn heautōn sōtērian） 的 ἑαυτῶν（heautōn） 是複數，「你們自己的」——上下文是 2:1–4 的合一，救恩要在一群人的關係裡活出來。μετὰ φόβου καὶ τρόμου（meta phobou kai tromou） 在保羅書信是敬畏與認真（林前 2:3；林後 7:15；弗 6:5），不是怕被丟棄。</p><blockquote><p>2:13 用 γάρ（gar） 給出理由，而且把 θεὸς（theos） 放在句首：θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν（theos gar estin ho energōn en hymin）。兩節形成對照——你們 κατεργάζεσθε（向外做到底），因為神 ἐνεργῶν ἐν ὑμῖν（在裡面運行）。καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν（kai to thelein kai to energein）：連「想要」都是神運行出來的，連「行出來」也是；ἐνεργέω（energeō） 在一節裡出現兩次。ὑπὲρ τῆς εὐδοκίας（hyper tēs eudokias）：一切為了他的美意。神在裡面作，我們在外面活。</p></blockquote>","exp":"<p>「就當恐懼戰兢做成你們得救的工夫」（2:12）。這一句常被讀成兩種極端。一種說：得救了還要自己努力做，做不好就會掉下去——於是一生活在失去救恩的恐懼裡。另一種說：反正都是神作的，我們等著就好。兩種讀法都犯了同一個錯：<strong>只讀了半句。</strong></p><p>下一節緊接著說：「因為你們立志行事都是神在你們心裡運行，為要成就他的美意」（2:13）。保羅沒有說「做成救恩，好叫你們得救」；他說的是「做成」——把已經在你裡面的，活到底、活出來。像一位老師把種子交給學生，學生要澆水、拔草、守著它；可是讓種子發芽的生命，從來不是學生造的。第 1 章已經給了保證：「那在你們心裡動了善工的，必成全這工」（1:6）。加拉太書講義、以弗所書講義都講過，得救本乎恩；腓立比書說，恩典不會讓人閒著，恩典會使人動起來。</p><p>「恐懼戰兢」不是驚慌。保羅說他到哥林多時也是「又軟弱，又懼怕，又甚戰兢」（林前 2:3），那是一個知道事情很重、不敢輕忽的人。敬畏神的人不是怕神把他丟掉，是怕自己辜負了這麼大的愛。</p><p>還要注意「你們」。這不是一個人關起門來的靈修計畫，是一群人一起把救恩的樣子活出來——在第 2 章的上下文，就是不結黨、看別人比自己強，就是第 4 章兩位姊妹的和好。321 說「用心靠聖靈，不要用腦靠自己」，2:13 是最好的說明：連「想要和好」那一點心意，都是神放進去的。所以人可以放膽去做，因為做的力量不是從自己來。</p>"},{"a":14,"z":16,"star":2,"grk":"<p lang=\"grc\">Πάντα ποιεῖτε χωρὶς γογγυσμῶν καὶ διαλογισμῶν,</p><p lang=\"grc\">ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ἄμωμα μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ</p><p lang=\"grc\">λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.</p>","lit":"<p>凡事都要做，沒有嘀咕，也沒有爭辯，</p><p>好叫你們成為無可指摘、純一不雜的，作神無瑕疵的兒女，在一個彎曲又扭曲的世代中間；你們在他們中間顯出來，好像世界裡的光體，</p><p>持守著生命的道，叫我在基督的日子有可誇的，就是我沒有徒然奔跑，也沒有徒然勞苦。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>χωρὶς γογγυσμῶν καὶ διαλογισμῶν</td><td>chōris gongysmōn kai dialogismōn</td><td>沒有嘀咕和爭辯</td><td>曠野的字</td></tr><tr><td>ἄμεμπτοι καὶ ἀκέραιοι</td><td>amemptoi kai akeraioi</td><td>無可指摘、純一不雜</td><td>外人看與裡面是</td></tr><tr><td>τέκνα θεοῦ ἄμωμα</td><td>tekna theou amōma</td><td>神無瑕疵的兒女</td><td>祭物的字</td></tr><tr><td>γενεᾶς σκολιᾶς καὶ διεστραμμένης</td><td>geneas skolias kai diestrammenēs</td><td>彎曲悖謬的世代</td><td>化用申 32:5</td></tr><tr><td>φωστῆρες ἐν κόσμῳ</td><td>phōstēres en kosmō</td><td>世界裡的光體</td><td>天上的星</td></tr><tr><td>λόγον ζωῆς ἐπέχοντες</td><td>logon zōēs epechontes</td><td>持守／舉起生命的道</td><td>兩讀</td></tr><tr><td>οὐκ εἰς κενὸν ἔδραμον</td><td>ouk eis kenon edramon</td><td>我沒有徒然奔跑</td><td>κενός 又一次；3:14 的跑</td></tr></table>","gram":"<p><strong>2:14 的 Πάντα（Panta） 放在句首：「凡事」。</strong>χωρὶς γογγυσμῶν καὶ διαλογισμῶν（chōris gongysmōn kai dialogismōn）：γογγυσμός（gongysmos） 是個擬聲字，低聲的嘀咕；七十士譯本在出埃及記 16 章、民數記 14 章，用這個字根寫以色列人在曠野向神發怨言。διαλογισμός（dialogismos） 是內心的盤算、爭辯，也可以是疑惑。</p><p>2:15 連用三個形容：ἄμεμπτοι（外人無可指責）、ἀκέραιοι（未摻雜的，像純酒、純金）、ἄμωμα（無瑕疵，獻祭牲畜的字）。μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης（meson geneas skolias kai diestrammenēs） 化用申 32:5 摩西之歌的字句：「這乖僻彎曲的世代」（申 32:5）。在申命記，彎曲的世代是以色列自己，「就不是他的兒女」；在這裡反過來——神的兒女住在彎曲的世代中間。</p><p>φωστῆρες（phōstēres） 是「光體」，七十士譯本創 1:14 用來指日月星辰。2:16 λόγον ζωῆς ἐπέχοντες（logon zōēs epechontes） 的 ἐπέχω（epechō） 有兩讀：「持守」（緊握不放）或「舉起、遞出」（和合本「表明出來」）。兩讀可以合在一起：握得住的人，才舉得起來。οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα（ouk eis kenon edramon oude eis kenon ekopiasa）：κενός（kenos） 在本章第三次出現（2:3、2:7、2:16）；「跑」預告第 3 章的標竿。</p>","exp":"<p>「凡所行的，都不要發怨言，起爭論」（2:14）。這一句在教會裡常被拿來叫人閉嘴：你對教會有意見，就是發怨言。可是原文的字，把我們帶回曠野。以色列人出埃及以後，向摩西、亞倫發怨言，摩西說：「你們的怨言不是向我們發的，乃是向耶和華發的」（出 16:8）。曠野的怨言，是不信——不信那位分開紅海的神會給水、給糧。</p><p>所以 2:14 禁止的，是對神的不信與背後的嘀咕，<strong>不是對不公的申訴</strong>。看見同工被欺負、帳目不清、有人受傷，把它說出來、帶到該處理的地方，不是發怨言，是愛。保羅自己在第 4 章示範了怎樣處理衝突：他點名勸兩位姊妹，又說「我也求你這真實同負一軛的，幫助這兩個女人」（4:3）。合一是把問題帶進主裡處理，不是把問題藏起來。</p><p>這樣的人，保羅說是「在這彎曲悖謬的世代作神無瑕疵的兒女」（2:15）。摩西之歌裡，彎曲的是神的百姓；如今在基督裡，神的兒女被放進彎曲的世界當中，「好像明光照耀」（2:15）。星星不必大聲，夜越黑，它越清楚。</p><p>光從哪裡來？「將生命的道表明出來」（2:16）。321 說聖經是我的準則——準則不只是讀的，是要被舉起來給世界看的。一間不嘀咕、不鬥爭、有問題就在主裡處理的教會，本身就是一盞燈。保羅說，這樣他在基督的日子就可以誇口，「我沒有空跑，也沒有徒勞」（2:16）。</p>"},{"a":17,"z":18,"star":1,"grk":"<p lang=\"grc\">ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·</p><p lang=\"grc\">τὸ δὲ αὐτὸ καὶ ὑμεῖς χαίρετε καὶ συγχαίρετέ μοι.</p>","lit":"<p>然而即使我被澆奠在你們信心的祭物和事奉之上，我也喜樂，並且與你們眾人一同喜樂；</p><p>同樣，你們也要喜樂，並且與我一同喜樂。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σπένδομαι</td><td>spendomai</td><td>我被澆奠</td><td>現在式；提後 4:6 同字</td></tr><tr><td>ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ</td><td>epi tē thysia kai leitourgia</td><td>在祭物和事奉之上</td><td>主祭是他們的信心</td></tr><tr><td>χαίρω καὶ συγχαίρω</td><td>chairō kai synchairō</td><td>我喜樂，並一同喜樂</td><td>喜樂追蹤</td></tr><tr><td>χαίρετε καὶ συγχαίρετέ μοι</td><td>chairete kai synchairete moi</td><td>你們要喜樂，並與我一同喜樂</td><td>交錯回應</td></tr></table>","gram":"<p><strong>2:17 用的是祭壇的語言。</strong>ἀλλὰ εἰ καὶ σπένδομαι（alla ei kai spendomai）：「即使我正被澆奠」，現在式，條件句——保羅說的是可能，不是預言。σπένδω（spendō） 是獻祭時把酒倒在祭物上或旁邊（這使我們想起民 28:7 的奠祭）；提後 4:6 保羅用同一個字說自己的末後：「我現在被澆奠，我離世的時候到了」（提後 4:6）。</p><p>ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν（epi tē thysia kai leitourgia tēs pisteōs hymōn）：主祭是腓立比人的信心與事奉，保羅只是倒在上面的那一杯酒。接著四個喜樂的字排成交錯：χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν（chairō kai synchairō pasin hymin）／τὸ δὲ αὐτὸ καὶ ὑμεῖς χαίρετε καὶ συγχαίρετέ μοι（to de auto kai hymeis chairete kai synchairete moi）。我喜樂、我與你們同樂；你們也喜樂、你們與我同樂。</p>","exp":"<p>「我以你們的信心為供獻的祭物，我若被澆奠在其上，也是喜樂」（2:17）。這是一幅很安靜的畫：祭壇上的主角是腓立比人的信心，保羅只是最後倒上去的那一點酒。酒倒下去，就看不見了，只留下香氣。一個使徒把自己看成配角，這正是 2:3「看別人比自己強」的樣子。</p><p>這兩節不是在美化死亡。保羅用的是「若」，生死的主權仍在神手裡；同一封信裡，他也說「我在肉身活著，為你們更是要緊的」（1:24），並且盼望很快去看他們（2:24）。他不是想死，是不怕把自己用上。</p><p>最後的回音最美：「你們也要照樣喜樂，並且與我一同喜樂」（2:18）。坐監的人邀請自由的人一起喜樂。喜樂在這裡不是一種心情，是一種關係——同一個祭壇上的人，一起歡喜。被倒出去的人不覺得虧，因為他看見祭物蒙悅納。</p>"},{"a":19,"z":21,"star":2,"grk":"<p lang=\"grc\">Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.</p><p lang=\"grc\">οὐδένα γὰρ ἔχω ἰσόψυχον ὅστις γνησίως τὰ περὶ ὑμῶν μεριμνήσει,</p><p lang=\"grc\">οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ Ἰησοῦ Χριστοῦ.</p>","lit":"<p>我在主耶穌裡盼望很快打發提摩太到你們那裡，好叫我知道你們的事，也能心裡振奮。</p><p>因為我沒有一個同魂的人，會真誠地掛念你們的事；</p><p>因為眾人都尋求自己的事，不是耶穌基督的事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ</td><td>Elpizō de en kyriō Iēsou</td><td>我在主耶穌裡盼望</td><td>計畫放在主裡</td></tr><tr><td>εὐψυχῶ</td><td>eupsychō</td><td>心裡振奮</td><td>好的魂；新約只此一次</td></tr><tr><td>ἰσόψυχον</td><td>isopsychon</td><td>同魂的</td><td>新約只此一次</td></tr><tr><td>γνησίως</td><td>gnēsiōs</td><td>真誠地</td><td>親生的、正牌的</td></tr><tr><td>μεριμνήσει</td><td>merimnēsei</td><td>會掛念</td><td>與 4:6「掛慮」同一個字</td></tr><tr><td>τὰ ἑαυτῶν ζητοῦσιν</td><td>ta heautōn zētousin</td><td>尋求自己的事</td><td>回扣 2:4 τὰ ἑαυτῶν</td></tr></table>","gram":"<p><strong>2:19 Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ（Elpizō de en kyriō Iēsou），2:24 πέποιθα δὲ ἐν κυρίῳ（pepoitha de en kyriō）</strong>——提摩太這一段，頭尾都有「在主裡」。保羅的行程表，寫在主裡面。</p><p>本章有四個帶 ψυχή（psychē） 的字，兩個在這裡：κἀγὼ εὐψυχῶ（我也心裡振奮）、ἰσόψυχον（同魂的人），前有 2:2 σύμψυχοι（sympsychoi），後有 2:30 τῇ ψυχῇ（tē psychē）。ἰσόψυχον（isopsychon） 新約只此一次，字面是「魂的分量相等」。γνησίως（gnēsiōs） 是「親生的、正牌的」，提前 1:2 稱提摩太為 γνησίῳ τέκνῳ（gnēsiō teknō）。</p><p>μεριμνήσει（merimnēsei） 是未來式，「會掛念」。這個字到 4:6 變成禁令：μηδὲν μεριμνᾶτε（mēden merimnate），「應當一無掛慮」。同一個字，在 2:20 是美德，在 4:6 是要交託的——差別不在有沒有這份牽掛，在牽掛往哪裡去。</p><p>2:21 οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν（hoi pantes gar ta heautōn zētousin）, οὐ τὰ Ἰησοῦ Χριστοῦ（ou ta Iēsou Christou）：τὰ ἑαυτῶν（ta heautōn） 回扣 2:4 μὴ τὰ ἑαυτῶν（mē ta heautōn）；對照組從「自己的／別人的」換成「自己的／耶穌基督的」。</p>","exp":"<p>基督之歌唱完，保羅沒有再講一段道理，他介紹了兩個人。第一個是提摩太。「因為我沒有別人與我同心，實在掛念你們的事」（2:20）。「同心」原文是同一個魂——提摩太心裡掛的，就是保羅心裡掛的。</p><p>「掛念」這個字值得停一下。第 4 章說「應當一無掛慮」（4:6），用的是同一個字。保羅在這裡稱讚提摩太的，正是他後來叫人交託的。可見牽掛本身不是罪，一個愛人的人一定會牽掛；問題是牽掛有沒有被帶到神面前。情緒不是信心的敵人，壓抑才常常是。</p><p>接著是全本新約對「有己」最短的定義：「別人都求自己的事，並不求耶穌基督的事」（2:21）。這句話很重，大概不是說羅馬城裡沒有一個好基督徒，而是保羅在找一個能長途跋涉、去處理腓立比難題的人時，身邊的人各有各的理由。有己不一定是壞，常常只是「我的事比較要緊」。</p><p>2:4 說「也要顧別人的事」，2:21 說「求耶穌基督的事」——兩句合起來，就是提摩太：顧別人的事，就是求耶穌基督的事。愛主的人，最後會落在愛人上。321 說人比事重要、關係比東西重要；保羅最在乎的，是派一個真心牽掛他們的人去。</p>"},{"a":22,"z":22,"star":2,"grk":"<p lang=\"grc\">τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.</p>","lit":"<p>但他經過考驗的品格，你們是知道的：他像兒子對父親一樣，與我一同為福音作奴僕服事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὴν δὲ δοκιμὴν αὐτοῦ</td><td>tēn de dokimēn autou</td><td>他經過考驗的品格</td><td>試金石驗過的</td></tr><tr><td>ὡς πατρὶ τέκνον</td><td>hōs patri teknon</td><td>像兒子對父親</td><td>321 的 3：屬靈父母兒女</td></tr><tr><td>σὺν ἐμοὶ</td><td>syn emoi</td><td>與我一同</td><td>不是「服事我」</td></tr><tr><td>ἐδούλευσεν</td><td>edouleusen</td><td>作奴僕服事</td><td>與 2:7 δούλου 同字根</td></tr></table>","gram":"<p><strong>2:22 是一個文法拐了彎的句子。</strong>τὴν δὲ δοκιμὴν αὐτοῦ（tēn de dokimēn autou） 放在句首：δοκιμή（dokimē） 是金屬經過試驗後證明是真的，「驗過的品格」。接著 ὅτι ὡς πατρὶ τέκνον（hoti hōs patri teknon）——讀者以為下面會說「像兒子服事父親那樣，他服事了我」，保羅卻改口：σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον（syn emoi edouleusen eis to euangelion），「他與我一同，為福音作奴僕」。</p><p>這個轉彎很有意思：保羅不讓提摩太成為「服事我的人」，兩個人一起服事福音。ἐδούλευσεν（edouleusen） 是 δουλεύω（douleuō），與 2:7 μορφὴν δούλου（morphēn doulou） 同字根，也與 1:1「基督耶穌的僕人」（δοῦλοι（douloi））呼應——基督取了奴僕的形像，他的僕人也一起作奴僕。εἰς τὸ εὐαγγέλιον（eis to euangelion） 是全卷福音追蹤的一站。</p>","exp":"<p>〔背景〕徒 16:1--3（使徒行傳講義第 16 章）</p><p>使徒行傳講義第 16 章講過提摩太怎樣加入：保羅在路司得遇見他，他母親是信主的猶太人，父親是希臘人，「路司得和以哥念的弟兄都稱讚他」（徒 16:2）。緊接著，保羅就帶著他過到馬其頓，到了腓立比。所以腓立比教會出生的那幾天——呂底亞、使女、半夜唱詩的禁卒——提摩太都在。保羅說「你們知道」，因為他們親眼看過。</p><p>「他興旺福音，與我同勞，待我像兒子待父親一樣」（2:22）。這是 321 的「3」：屬靈父母與兒女。可是原文那個轉彎提醒我們，屬靈父子不是佔有，不是「我帶出來的人就是我的人」。保羅寫信的第一句就把他並列：「基督耶穌的僕人保羅和提摩太」（1:1）。父親與兒子，最後是兩個並肩的僕人。</p><p>提摩太的「明證」是時間驗出來的。十年前他還是一個被稱讚的年輕人，十年後他是保羅唯一放心派出去的人。品格不是一次表現，是一路走過來、被試過、仍然是真的。這正是基督之歌落地的地方：基督取了奴僕的形像，提摩太就在一個坐監的老人身邊，一起作奴僕。今天每一位帶門徒的人，最後要問的不是「他聽不聽我」，是「他是不是和我一起，服事了福音」。</p>"},{"a":23,"z":24,"star":1,"grk":"<p lang=\"grc\">τοῦτον μὲν οὖν ἐλπίζω πέμψαι ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ ἐξαυτῆς·</p><p lang=\"grc\">πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.</p>","lit":"<p>所以這個人，我盼望一看清我的事要如何，就立刻打發他去；</p><p>但我在主裡深信，我自己也必很快來到。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὡς ἂν ἀφίδω</td><td>hōs an aphidō</td><td>一看清</td><td>不確定的時間</td></tr><tr><td>ἐξαυτῆς</td><td>exautēs</td><td>立刻</td><td>等結果一出來</td></tr><tr><td>πέποιθα δὲ ἐν κυρίῳ</td><td>pepoitha de en kyriō</td><td>但我在主裡深信</td><td>完成式：已經定下的把握</td></tr></table>","gram":"<p><strong>2:23–24 用 μὲν（men）……δὲ（de） 對照兩個計畫。</strong>τοῦτον μὲν οὖν ἐλπίζω πέμψαι（touton men oun elpizō pempsai）——「這個人，我盼望打發他去」；πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι（pepoitha de en kyriō hoti kai autos tacheōs eleusomai）——「但我在主裡深信，我自己也要快去」。</p><p>ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ（hōs an aphidō ta peri eme） 是不定時間的子句，「等我一看清我的事」——保羅自己也不知道判決何時下來。πέποιθα（pepoitha） 是完成式，表示已經定下、持續的把握；它和 2:19 的 ἐλπίζω（elpizō） 一樣，都放在「在主裡」。不知道日期，卻知道把握放在哪裡。</p>","exp":"<p>這兩節讀起來像一份行程表，其實是一位等判決的人的心。「我一看出我的事要怎樣了結」（2:23）——他不知道自己會被釋放，還是被處死。可是同一口氣，他又說：「我靠著主自信我也必快去」（2:24）。</p><p>不確定與信心，在同一個人身上並存。保羅沒有假裝自己知道結局，也沒有被結局綁住。他的計畫寫得很具體——先派提摩太，等消息，自己隨後就來——可是每一步都放在「在主裡」。這不是一種消極的「看神怎麼安排」，是積極地做計畫，同時把計畫交在主手中。</p><p>第 1 章他說「我既然這樣深信，就知道仍要住在世間」（1:25），這裡又說「我也必快去」。一個在監裡的人，心裡惦記的是一間遠方的教會。他的盼望不是逃出去，是見到他們。人比事重要——連他自己的案子，都排在他們的後面。</p>"},{"a":25,"z":26,"star":2,"grk":"<p lang=\"grc\">Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,</p><p lang=\"grc\">ἐπειδὴ ἐπιποθῶν ἦν πάντας ὑμᾶς καὶ ἀδημονῶν διότι ἠκούσατε ὅτι ἠσθένησεν.</p>","lit":"<p>然而我算為必須打發以巴弗提到你們那裡去，他是我的弟兄、同工、同袍，又是你們的使者，和供應我需要的事奉者，</p><p>因為他一直切切想念你們眾人，並且極其難過，因為你們聽見他病了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀναγκαῖον δὲ ἡγησάμην</td><td>Anankaion de hēgēsamēn</td><td>然而我算為必須</td><td>ἡγέομαι 本章第三次</td></tr><tr><td>συνεργὸν καὶ συστρατιώτην</td><td>synergon kai systratiōtēn</td><td>同工和同袍</td><td>321 的 5：屬靈戰友</td></tr><tr><td>ἀπόστολον</td><td>apostolon</td><td>被差遣的人</td><td>教會的使者，不是使徒職分</td></tr><tr><td>λειτουργὸν τῆς χρείας μου</td><td>leitourgon tēs chreias mou</td><td>供應我需要的事奉者</td><td>祭司事奉的字</td></tr><tr><td>ἐπιποθῶν</td><td>epipothōn</td><td>切切想念</td><td>1:8 保羅想念他們同一個字</td></tr><tr><td>ἀδημονῶν</td><td>adēmonōn</td><td>極其難過</td><td>客西馬尼的字</td></tr></table>","gram":"<p><strong>2:25 Ἀναγκαῖον δὲ ἡγησάμην（Anankaion de hēgēsamēn）：ἡγέομαι（hēgeomai） 又出現了。</strong>2:3 看別人比自己強、2:6 基督不以為強奪，2:25 保羅「算為必須」打發以巴弗提回去——把他留在身邊對保羅有利，送回去對腓立比人有益，保羅選了後者。ἡγησάμην（hēgēsamēn） 是書信的不定過去式：寫信時的決定，讀信時已經成了事實。</p><p>以巴弗提有五個稱呼。前三個朝向保羅，一個比一個更緊密：τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου（ton adelphon kai synergon kai systratiōtēn mou）——弟兄、同工、同袍，後兩個帶著「同」字首。後兩個朝向教會：ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου（hymōn de apostolon kai leitourgon tēs chreias mou）。ἀπόστολον（apostolon） 在這裡是「被差遣的人」，不是十二使徒的職分；λειτουργὸν（leitourgon） 是祭司事奉的字，與 2:17 λειτουργίᾳ（leitourgia）、2:30 λειτουργίας（leitourgias） 串成一條線：送禮物來，也是一種獻祭。</p><p>2:26 ἐπιποθῶν ἦν（epipothōn ēn） 是迂說式，「一直在想念」；ἀδημονῶν（adēmonōn） 是極深的困擾，福音書寫耶穌在客西馬尼「憂愁起來，極其難過」（太 26:37），用的就是這個字的不定詞 ἀδημονεῖν（adēmonein）。</p>","exp":"<p>第二個人是以巴弗提。他是腓立比教會派來送禮物、留下來照顧保羅的人。保羅給他的稱呼一口氣五個：「他是我的兄弟，與我一同做工，一同當兵」（2:25），又是教會所差遣、供給保羅需用的。這是 321 的「5」：屬靈戰友。同工是一起做事，同袍是一起挨打——在監獄門口送飯，本身就是一場仗。</p><p>他難過的理由很特別：「他很想念你們眾人，並且極其難過，因為你們聽見他病了」（2:26）。他病得幾乎要死，最難過的卻是「你們在為我擔心」。這是 2:4 活生生的樣子——自己躺在病床上，心裡掛的是別人的心。</p><p>「極其難過」這個字，福音書用在客西馬尼的耶穌身上。耶穌會極其難過，以巴弗提也會；保羅坦白寫出來，沒有說他屬靈不夠。<strong>深的情緒不是信心的失敗，是愛的代價。</strong>一個人越愛，越會掛心；教會不必要求這樣的人假裝沒事，而是像保羅一樣，看見他的難處，替他安排回家的路。</p><p>保羅「想必須」送他回去——ἡγέομαι（hēgeomai） 這個動詞又出現了。2:3 看別人比自己強，2:6 基督不以為強奪，2:25 保羅把一個對自己很有用的戰友送走。一個字，從基督走到保羅的決定裡。</p>"},{"a":27,"z":28,"star":2,"grk":"<p lang=\"grc\">καὶ γὰρ ἠσθένησεν παραπλήσιον θανάτῳ ἀλλὰ ὁ θεὸς ἠλέησεν αὐτόν, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.</p><p lang=\"grc\">σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.</p>","lit":"<p>他確實病了，近乎死亡；然而神憐憫了他，不但是他，也憐憫了我，免得我憂愁上加憂愁。</p><p>所以我更加急切地打發他去，好叫你們再看見他就可以喜樂，我也可以少些憂愁。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>παραπλήσιον θανάτῳ</td><td>paraplēsion thanatō</td><td>近乎死亡</td><td>病得真的很重</td></tr><tr><td>ὁ θεὸς ἠλέησεν αὐτόν</td><td>ho theos ēleēsen auton</td><td>神憐憫了他</td><td>康復歸給神的憐憫</td></tr><tr><td>λύπην ἐπὶ λύπην</td><td>lypēn epi lypēn</td><td>憂愁上加憂愁</td><td>使徒的坦白</td></tr><tr><td>σπουδαιοτέρως</td><td>spoudaioterōs</td><td>更加急切地</td><td>比較級</td></tr><tr><td>ἀλυπότερος</td><td>alypoteros</td><td>少些憂愁</td><td>比較級：不是沒有憂愁</td></tr></table>","gram":"<p><strong>2:27 καὶ γὰρ ἠσθένησεν παραπλήσιον θανάτῳ（kai gar ēsthenēsen paraplēsion thanatō）：「他確實病了」。</strong>καὶ γὰρ（kai gar） 加強語氣，承認 2:26 那個傳言是真的；παραπλήσιον θανάτῳ（paraplēsion thanatō）「靠近死亡」。ἀλλὰ ὁ θεὸς ἠλέησεν αὐτόν（alla ho theos ēleēsen auton）——康復的主詞是神，動詞是「憐憫」，沒有提到任何神蹟的手段。</p><p>οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ（ouk auton de monon alla kai eme）：神的憐憫一次照顧了兩個人。ἵνα μὴ λύπην ἐπὶ λύπην σχῶ（hina mē lypēn epi lypēn schō）——「免得我有憂愁上的憂愁」：坐監是一層，失去戰友會是第二層。2:28 兩個比較級：σπουδαιοτέρως（更加急切）、ἀλυπότερος（比較少憂愁）——保羅沒有說他從此不憂，他說「少些」。地勢圖把 2:27 標在平地（26）：不是谷底，也不是山頂，是一段真實的、會累的路。</p>","exp":"<p>「他實在是病了，幾乎要死；然而神憐恤他」（2:27）。這一句有兩件事值得注意。第一，保羅沒有醫好他。使徒行傳記載過保羅身上的手巾能治病，可是這裡沒有神蹟，只有一個病得很重的同工，和一句「神憐恤他」。醫治的主權在神，不在使徒的手；神可以用神蹟，也可以用時間、休養與照顧。保羅也沒有說以巴弗提病了是因為信心不足。</p><p>第二，保羅說出了自己的感受：「免得我憂上加憂」（2:27）。寫「要靠主常常喜樂」的同一個人，在同一封信裡承認他會憂。喜樂和憂愁不是互相取消的；喜樂可以和眼淚同在。今天有些弟兄姊妹身陷焦慮症、憂鬱症，那是需要治療的病，就醫、吃藥、尋求專業諮商與禱告並不衝突；保羅這一節給了他們一個說出來的許可。</p><p>「所以我越發急速打發他去，叫你們再見他，就可以喜樂，我也可以少些憂愁」（2:28）。保羅沒有說「我就不憂愁了」，他說「少些」。這是一個很誠實的屬靈人：他知道自己的心還有重量，也知道怎樣讓別人的喜樂減輕它。<strong>無己的人仍然可以說出自己的需要</strong>——保羅在這裡就說了。</p><p>神的憐憫也很具體：「不但憐恤他，也憐恤我」（2:27）。神看見病床上的人，也看見床邊那個擔心的人。在病床旁守候的家人與同工，讀到這一節可以知道：你的憂愁，神也算在憐憫裡。</p>"},{"a":29,"z":30,"star":1,"grk":"<p lang=\"grc\">προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,</p><p lang=\"grc\">ὅτι διὰ τὸ ἔργον Χριστοῦ μέχρι θανάτου ἤγγισεν, παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.</p>","lit":"<p>所以你們要在主裡帶著一切喜樂接待他，並且要看重這樣的人；</p><p>因為他為了基督的工作，近到死地，把性命押上去，為要補足你們向我事奉中所缺的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μετὰ πάσης χαρᾶς</td><td>meta pasēs charas</td><td>帶著一切喜樂</td><td>喜樂追蹤</td></tr><tr><td>ἐντίμους ἔχετε</td><td>entimous echete</td><td>要看重</td><td>不是崇拜，是珍惜</td></tr><tr><td>μέχρι θανάτου ἤγγισεν</td><td>mechri thanatou ēngisen</td><td>近到死地</td><td>與 2:8 μέχρι θανάτου 相同</td></tr><tr><td>παραβολευσάμενος τῇ ψυχῇ</td><td>paraboleusamenos tē psychē</td><td>把性命押上去</td><td>賭徒的字</td></tr><tr><td>ὑστέρημα</td><td>hysterēma</td><td>缺欠</td><td>不是責備，是不能親到</td></tr></table>","gram":"<p><strong>2:30 有一個藏在字裡的呼應。</strong>διὰ τὸ ἔργον Χριστοῦ μέχρι θανάτου ἤγγισεν（dia to ergon Christou mechri thanatou ēngisen）：μέχρι θανάτου（mechri thanatou） 與 2:8 基督「以至於死」完全相同。基督順服 μέχρι θανάτου（mechri thanatou），以巴弗提為基督的工作也走到 μέχρι θανάτου（mechri thanatou）。</p><p>παραβολευσάμενος τῇ ψυχῇ（paraboleusamenos tē psychē） 是本章最生猛的字：這個動詞是賭桌上的語言，「把全部押下去」。後來亞歷山大城有一群在瘟疫中照顧病人、埋葬死者的弟兄，就被稱為「押上性命的人」。ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας（hina anaplērōsē to hymōn hysterēma tēs pros me leitourgias）：「缺欠」不是責備他們不夠，是他們不能親自到場，以巴弗提替全教會補上。</p>","exp":"<p>「故此，你們要在主裡歡歡樂樂地接待他，而且要尊重這樣的人」（2:29）。保羅替以巴弗提預先鋪了路：他提早回家，會不會被人說是半途而廢？保羅說，不，要尊重他。</p><p>為甚麼？「因他為做基督的工夫，幾乎至死，不顧性命」（2:30）。「幾乎至死」與基督之歌的「以至於死」是同一個片語。第 2 章從基督走到以巴弗提：基督為我們走到死，以巴弗提為基督的工作走到死的邊緣。基督的心，就這樣活在一個送禮物、生了重病的普通同工身上。</p><p>但這不是鼓勵人不顧身體地拚命。以巴弗提沒有去找死，是在服事中遇上了病；神憐恤他，保羅送他回家休養。把性命押上去的人，教會要做的是接待、尊重、照顧，不是把他再推回前線。第 2 章最後的問題不是「我能為主拚多少」，是「我願不願意以基督耶穌的心為心，像提摩太、像以巴弗提那樣，為別人的事放上自己」。</p>"}],"3":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.</p>","lit":"<p>至於其餘的，我的弟兄們，你們要在主裡喜樂。把同樣的事寫給你們，對我不是麻煩，對你們卻是穩妥。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τὸ λοιπόν</td><td>To loipon</td><td>至於其餘的、此外</td><td>不一定是「最後」；4:8 又用了一次</td></tr><tr><td>χαίρετε ἐν κυρίῳ</td><td>chairete en kyriō</td><td>你們要在主裡喜樂</td><td>現在式命令：一直喜樂；4:4 再說一次</td></tr><tr><td>τὰ αὐτὰ γράφειν</td><td>ta auta graphein</td><td>寫同樣的事</td><td>「同樣的事」指甚麼，是合編說的焦點</td></tr><tr><td>οὐκ ὀκνηρόν</td><td>ouk oknēron</td><td>不麻煩、不嫌煩</td><td>ὀκνηρός：懶得做、嫌累</td></tr><tr><td>ἀσφαλές</td><td>asphales</td><td>穩妥、安全</td><td>不會滑倒的地面</td></tr></table>","gram":"<p><strong>3:1 是全卷完整性爭議的震央：一句溫柔的 χαίρετε ἐν κυρίῳ（chairete en kyriō），下一節突然變成三聲 Βλέπετε（Blepete）。</strong></p><p><strong>合編說</strong>認為語氣轉得太急：Τὸ λοιπόν（To loipon） 像是「最後」，信好像要結束了，3:2 卻開出一段嚴厲的論戰；4:10--20 的謝函又放在信末，好像收了禮物很久才道謝。於是有<strong>兩信說</strong>（第 1--2 章加第 4 章是一封，3:2--4:3 是另一封）與<strong>三信說</strong>（4:10--20 謝函、1:1--3:1 與 4:4--9 的勸勉信、3:2--4:3 的論戰信）。坡旅甲寫給腓立比人的信提到保羅給他們寫過「書信」（複數），也常被引為旁證。</p><p><strong>一封信的理由</strong>更重：全卷沒有任何抄本是分開流傳的；Τὸ λοιπόν（To loipon） 在保羅筆下常是「此外、至於其餘的」，4:8 又用一次，可見不等於收尾。全卷字彙從頭貫穿到尾：喜樂 χαρά（chara） 與 χαίρω（2:18 與 3:1 都是 χαίρετε（chairete））、思想 φρονέω（2:5；3:15、19；4:2）、團契 κοινωνία（1:5；3:10）、以 syn 起頭的「同」字串（3:17 Συμμιμηταί（Symmimētai）；3:21 σύμμορφον（symmorphon））。最有力的是 2:6--11 與 3:20--21 用同一組字：μορφῇ（morphē） 對 σύμμορφον（symmorphon），σχήματι（schēmati） 對 μετασχηματίσει（metaschēmatisei），ὑπάρχων（hyparchōn） 對 ὑπάρχει（hyparchei），ἐταπείνωσεν（etapeinōsen） 對 ταπεινώσεως（tapeinōseōs），κύριος Ἰησοῦς Χριστὸς（kyrios Iēsous Christos） 對 κύριον Ἰησοῦν Χριστόν（kyrion Iēsoun Christon）。第 3 章是第 2 章的回聲，不是另一封信。本講義照一封信讀。</p><p>τὰ αὐτὰ γράφειν（ta auta graphein）「寫同樣的事」可往前指「喜樂」，也可往後指下面的警告。ἀσφαλές（asphales） 是穩當的地面：重複不是囉嗦，是給腳一塊不滑的地方。</p>","exp":"<p><strong>「弟兄們，我還有話說，你們要靠主喜樂。」（3:1）保羅說到喜樂，就想起會偷走喜樂的人。</strong></p><p>一位父親在門口對孩子說：「好好玩，開心一點。」話才出口，就看見巷口停著一輛陌生的車，他立刻加一句：「但是，不要跟陌生人走。」語氣變了，愛沒有變。3:1 到 3:2 就是這樣的轉彎。學者為這個轉彎爭論了兩百年，有人說這裡縫進了另一封信；但抄本沒有給我們第二封信，給我們的是同一位作者、同一組字、同一個心。<strong>3:2 的嚴厲，是為了保護 3:1 的喜樂。</strong></p><p>「靠主喜樂」不是心情好，是一個地址。原文是「在主裡」：喜樂有一個住處。保羅在第 1 章被捆鎖，在第 2 章面對可能被澆奠，到第 3 章他仍說「在主裡喜樂」——因為環境不是喜樂的地址，主才是。這也是為甚麼下面會有警告：凡是把人從「在主裡」搬到「在肉體裡」的教導，都是偷喜樂的賊。</p><p>「我把這話再寫給你們，於我並不為難，於你們卻是妥當。」（3:1）好老師不怕重複。華人教會常嫌主日學的課「又是那一套」，保羅卻說同樣的真理多講一次，你們的腳就多站穩一分。重複不是因為聽眾笨，是因為賊不只來一次。</p><p>這一章的焦點是「基督是我的標竿」。標竿在前面，但起跑前，保羅先畫了一條線：喜樂在主裡，安全在主裡。這兩件事放在一起，第 3 章的跑步才不會跑偏。</p>"},{"a":2,"z":3,"star":3,"grk":"<p lang=\"grc\">Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.</p><p lang=\"grc\">ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,</p>","lit":"<p>你們要看清那些狗，要看清那些作惡的工人，要看清那切割。</p><p>因為我們才是那割禮，就是那些以神的靈事奉、在基督耶穌裡誇口、不在肉體裡倚靠的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Βλέπετε</td><td>Blepete</td><td>你們要看清</td><td>三次重複；現在式命令：一直留意</td></tr><tr><td>τοὺς κύνας</td><td>tous kynas</td><td>那些狗</td><td>猶太人罵外邦人的話，被保羅翻轉</td></tr><tr><td>τοὺς κακοὺς ἐργάτας</td><td>tous kakous ergatas</td><td>作惡的工人</td><td>自稱為神做工，做的卻是壞工</td></tr><tr><td>τὴν κατατομήν</td><td>tēn katatomēn</td><td>那切割</td><td>和 περιτομή 押韻：割禮變成了亂砍</td></tr><tr><td>ἡ περιτομή</td><td>hē peritomē</td><td>那割禮</td><td>真割禮是一群人：「我們」</td></tr><tr><td>πνεύματι θεοῦ λατρεύοντες</td><td>pneumati theou latreuontes</td><td>以神的靈事奉</td><td>λατρεύω：聖殿裡的敬拜</td></tr><tr><td>οὐκ ἐν σαρκὶ πεποιθότες</td><td>ouk en sarki pepoithotes</td><td>不在肉體裡倚靠</td><td>完成式分詞：倚靠已成習慣</td></tr></table>","gram":"<p><strong>3:2 三個 Βλέπετε（Blepete） 排成一行，三個受詞各有冠詞，指的是同一群人的三張臉：狗、壞工人、切割者。</strong></p><p>τοὺς κύνας（tous kynas） 在猶太人口中是罵外邦人的話：不潔、在門外、吃剩食。保羅把這個字翻轉過來，丟回給那些要外邦信徒受割禮的人——<strong>他們以為外邦人在門外，其實是他們自己站在了恩典的門外。</strong>τοὺς κακοὺς ἐργάτας（tous kakous ergatas） 是反諷：這些人很勤快，到處「做工」，林後 11:13 也用同類的字說「行事詭詐」的工人。</p><p>第三個字是全段的文字遊戲：τὴν κατατομήν（tēn katatomēn） 與 3:3 的 ἡ περιτομή（hē peritomē） 只差一個介系詞字首。字首 peri 是「環切」，是立約的記號；字首 kata 是「砍下去」，成了毀傷肉體的亂砍，這使我們想起利 21:5 禁止祭司在肉上用刀劃。保羅不肯把他們的做法叫作「割禮」，因為脫離了基督的割禮，只剩下一把刀。這和加 5:12 保羅說「恨不得那攪亂你們的人把自己割絕了」（加 5:12）的激烈是同一種語氣。</p><p>3:3 以 γάρ（gar） 給理由，ἡμεῖς γάρ ἐσμεν ἡ περιτομή（hēmeis gar esmen hē peritomē） 把「我們」放在句首強調。後面三個分詞共用一個冠詞 οἱ（hoi），是同一群人的三個記號：πνεύματι θεοῦ λατρεύοντες（敬拜靠的是靈）、καυχώμενοι ἐν Χριστῷ Ἰησοῦ（誇口的對象是基督）、οὐκ ἐν σαρκὶ πεποιθότες（倚靠的不是肉體）。這正是羅 2:29「真割禮也是心裡的，在乎靈，不在乎儀文」（羅 2:29）的同一條線。</p>","exp":"<p>〔加〕加 5:2--12（加拉太書講義第 5 章）</p><p><strong>「應當防備犬類，防備作惡的，防備妄自行割的。」（3:2）這是全卷最兇的一句話，也最容易被讀歪。</strong></p><p>先說它<strong>不是</strong>甚麼。它不是罵猶太人：寫這句話的人，兩節之後就說自己是「希伯來人所生的希伯來人」（3:5）。它也不是罵所有跟我們意見不同的人：同一封信裡，保羅對那些出於嫉妒傳基督的人說「基督究竟被傳開了」（1:18），對看法不同的弟兄說「神也必以此指示你們」（3:15）。3:2 針對的只有一件事：<strong>要外邦信徒受割禮才能得救的教導</strong>。本系列加拉太書講義第 5 章講過同一場仗：「若受割禮，基督就與你們無益了。」（加 5:2）把基督加上割禮，等於把基督減掉。</p><p>為甚麼這麼兇？因為這不是口味之爭，是福音的生死。一位醫生對病人的家屬可以很溫和，但看見有人要往點滴瓶裡加東西，他會大聲喝止。保羅的嚴厲，是醫生的嚴厲，不是仇人的嚴厲；到 3:18 他談到十字架的仇敵時，是「流淚地」說的。</p><p>這一節也是 321「無己」最好的護欄。無己的人仍然有分辨，仍然可以說應當防備。看別人比自己強（2:3），不等於任何教導都照單全收；以基督的心為心（2:5），也包括知道甚麼東西會把人從基督身邊拉走。會說「不」的愛，才是保護人的愛。</p><p>3:3 把真割禮重新定義成三個記號：以神的靈敬拜、在基督耶穌裡誇口、不靠著肉體。今天的「割禮」可能不是一把刀，而是一張成績單、一個宗派身分、一套屬靈表現。問自己：我在主面前站得住，靠的是基督，還是我身上那個記號？</p>"},{"a":4,"z":6,"star":2,"grk":"<p lang=\"grc\">καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·</p><p lang=\"grc\">περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,</p><p lang=\"grc\">κατὰ ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.</p>","lit":"<p>雖然我也有在肉體裡的倚靠。若有別人以為可以在肉體裡倚靠，我更是；</p><p>論割禮是第八天的，出於以色列的族類，便雅憫的支派，出於希伯來人的希伯來人，按律法是法利賽人，</p><p>按熱心是逼迫教會的，按那在律法裡的義，成了無可指摘的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πεποίθησιν</td><td>pepoithēsin</td><td>倚靠、自信</td><td>名詞；與 3:3 的 πεποιθότες 同字根</td></tr><tr><td>ἐγὼ μᾶλλον</td><td>egō mallon</td><td>我更是</td><td>沒有動詞，短促有力</td></tr><tr><td>περιτομῇ ὀκταήμερος</td><td>peritomē oktaēmeros</td><td>論割禮，第八天的</td><td>照律法（利 12:3），不是成年才改宗的</td></tr><tr><td>Ἑβραῖος ἐξ Ἑβραίων</td><td>Hebraios ex Hebraiōn</td><td>出於希伯來人的希伯來人</td><td>語言與家教都守住了傳統</td></tr><tr><td>κατὰ νόμον Φαρισαῖος</td><td>kata nomon Pharisaios</td><td>按律法是法利賽人</td><td>最嚴謹的一派</td></tr><tr><td>κατὰ ζῆλος διώκων τὴν ἐκκλησίαν</td><td>kata zēlos diōkōn tēn ekklēsian</td><td>按熱心逼迫教會</td><td>διώκω：3:12、14 再出現</td></tr><tr><td>ἄμεμπτος</td><td>amemptos</td><td>無可指摘的</td><td>外在守法的紀錄無人能挑</td></tr></table>","gram":"<p><strong>3:5--6 是一張七項的履歷表：四項是生來就有的，三項是自己掙來的。</strong></p><p>前四項沒有動詞，一個接一個：περιτομῇ ὀκταήμερος（第八天受割禮，照利 12:3，證明他生在守約的家）、ἐκ γένους Ἰσραήλ（以色列的族類）、φυλῆς Βενιαμίν（便雅憫支派，出了第一位王掃羅，保羅的希伯來名字正是掃羅）、Ἑβραῖος ἐξ Ἑβραίων（希伯來人中的希伯來人：雖生在大數，家裡仍守希伯來語與傳統）。後三項以三個 κατὰ（kata） 排成平行句：κατὰ νόμον Φαρισαῖος（kata nomon Pharisaios）、κατὰ ζῆλος διώκων τὴν ἐκκλησίαν（kata zēlos diōkōn tēn ekklēsian）、κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος（kata dikaiosynēn tēn en nomō genomenos amemptos）。這是修辭上的漸強，最後一項最驚人。</p><p>διώκων（diōkōn） 是本章的伏筆：3:12、14 保羅說「我追」，用的是同一個字 διώκω（diōkō）。從前他追的是教會，現在他追的是基督。ἄμεμπτος（amemptos） 指外在的守法紀錄，與 2:15 盼望腓立比人「無可指摘」同一個字；它說的是人眼裡的紀錄，不是說保羅自認在神面前無罪。</p><p>3:4 的 Εἴ τις δοκεῖ ἄλλος（Ei tis dokei allos） 是條件句，保羅先接受對方的遊戲規則：要比肉體？好，ἐγὼ μᾶλλον（egō mallon）。他不是不能比，是比贏了以後才說這些不算。</p>","exp":"<p>〔加〕加 2:15--21（加拉太書講義第 2 章）</p><p><strong>「其實，我也可以靠肉體；若是別人想他可以靠肉體，我更可以靠著了。」（3:4）保羅打開了他的保險箱。</strong></p><p>那些要人受割禮的教師會說：你們外邦人不懂律法，要聽我們的。保羅回答：論出身、論學歷、論熱心、論紀錄，你們沒有一樣比得過我。這不是炫耀，是先把牌全部攤在桌上，好叫人看清楚下一節他要丟掉的是甚麼。一個從沒擁有過的人說「這些不重要」，不太有說服力；一個全都有過的人說「這些不算」，人才會停下來聽。</p><p>這張履歷今天換個名字照樣存在：牧師世家、第三代基督徒、神學院畢業、在教會服事二十年、從來沒有缺過一次聚會。這些都是好東西，保羅的七項也都是好東西——割禮是神設立的，律法是神賜的，熱心本身不是罪。問題不在東西本身，在那個字：「靠」。本系列加拉太書講義第 2 章講過保羅對彼得說的話：人稱義「乃是因信耶穌基督」（加 2:16）；同一個人在這裡，把他可以拿來「靠」的一項一項列出來。</p><p>最刺眼的一項是「逼迫教會」。保羅把它列在「熱心」底下，當年它是功勞，如今回頭看是他一生最痛的事（林前 15:9）。人的熱心可以真誠，也可以真錯；熱心不能證明方向是對的。</p><p>有人問：「我是無可指摘的」（3:6），難道保羅信主前良心從不不安嗎？這是議題頁的一題。至少這一節說明，他不是因為守不住律法、活得很失敗才轉向基督；他是在最成功的時候被基督攔住的。福音不只是給失敗者的拐杖，也是給成功者的一面鏡子。</p>"},{"a":7,"z":8,"star":3,"grk":"<p lang=\"grc\">Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.</p><p lang=\"grc\">ἀλλὰ μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου διʼ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι σκύβαλα ἵνα Χριστὸν κερδήσω</p>","lit":"<p>但那些曾經對我是利益的，這些我已經因為那基督算作虧損。</p><p>不但如此，誠然，我也算萬事是虧損，因為認識基督耶穌我的主那超越的價值；因他我已經虧損了萬事，並且算它們為糞土，好叫我賺得基督，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἅτινα ἦν μοι κέρδη</td><td>hatina ēn moi kerdē</td><td>那些曾是我的利益的</td><td>複數：一項一項的資產</td></tr><tr><td>ἥγημαι</td><td>hēgēmai</td><td>我已經算作</td><td>完成式：當年算好，至今不改</td></tr><tr><td>ζημίαν</td><td>zēmian</td><td>虧損</td><td>單數：全部合併成一筆損失</td></tr><tr><td>μενοῦνγε</td><td>menounge</td><td>不但如此、誠然</td><td>三個小詞連成一個加強語</td></tr><tr><td>ἡγοῦμαι</td><td>hēgoumai</td><td>我算作</td><td>現在式，3:8 兩次：今天仍這樣算</td></tr><tr><td>τὸ ὑπερέχον τῆς γνώσεως</td><td>to hyperechon tēs gnōseōs</td><td>認識的超越價值</td><td>與 2:3 ὑπερέχοντας 同字</td></tr><tr><td>σκύβαλα</td><td>skybala</td><td>糞土</td><td>丟給狗的殘渣、糞便；極粗的字</td></tr><tr><td>Χριστὸν κερδήσω</td><td>Christon kerdēsō</td><td>我賺得基督</td><td>回到 3:7 的「利益」：帳本結算</td></tr></table>","gram":"<p><strong>3:7--8 是一本帳：κέρδη（kerdē）「利益」與 ζημίαν（zēmian）「虧損」是會計用語，動詞 ἡγέομαι（hēgeomai）「算作」用了三次。</strong></p><p>3:7 的 ἅτινα ἦν μοι κέρδη（hatina ēn moi kerdē） 是複數，一項一項列在資產欄；ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν（tauta hēgēmai dia ton Christon zēmian） 卻把它們合成單數的一筆「虧損」。ἥγημαι（hēgēmai） 是完成式：在大馬士革路上那一刻算好了，到寫信時仍是這個結論。3:8 換成兩個現在式 ἡγοῦμαι（hēgoumai）：<strong>不是當年一時衝動，今天仍然這樣算。</strong>範圍也擴大了：從「那些」擴大到 πάντα（panta）「萬事」。</p><p>ἡγέομαι（hēgeomai） 是全卷的一條線。2:3「各人看別人比自己強」用 ἡγούμενοι（hēgoumenoi）；2:6 基督「不以自己與神同等為強奪的」用 ἡγήσατο（hēgēsato）；這裡保羅用 ἥγημαι（hēgēmai） 與 ἡγοῦμαι（hēgoumai）。基督怎樣「看」他的權利，保羅就怎樣「看」他的資歷。更妙的是 τὸ ὑπερέχον（to hyperechon）「超越的價值」：2:3 叫人看別人 ὑπερέχοντας（hyperechontas）「比自己強」，用的是同一個字根。</p><p>σκύβαλα（skybala） 是希臘文裡很粗的一個字，可指餵狗的殘渣，也可指糞便；保羅選它，是故意要嚇人一跳。3:8 末尾 Χριστὸν κερδήσω（Christon kerdēsō） 用動詞 κερδαίνω（kerdainō） 回到 3:7 的 κέρδη（kerdē）：資產欄清空了，只剩下一個名字。1:21 說「死了就有益處」，「益處」也是 κέρδος（kerdos）。μενοῦνγε（menounge） 由三個小詞合成，像是說「不，還要更多」。</p>","exp":"<p><strong>「我也將萬事當作有損的，因我以認識我主基督耶穌為至寶。」（3:8）改變觀點，從一個字開始：算。</strong></p><p>想像一位珠寶商，一生收集了七顆寶石。有一天他看見一顆無價的珍珠，於是變賣一切去買它（太 13:46 的比喻）。他沒有說那七顆寶石是假的，他只是說：和這一顆相比，它們都不算甚麼。保羅的帳本就是這樣：3:5--6 的七項沒有變成假貨，是被一個更大的價值重新估價了。</p><p>321 說「改變觀點就改變觀念」。保羅的生命改變，不是先從行為開始，是從「算」開始——他換了一把尺。從前的尺是「我比別人多甚麼」，現在的尺是「我認識基督多少」。尺一換，資產欄和負債欄就對調了。這也是為甚麼這個字在第 2 章先出現：<strong>學會像基督那樣看自己的權利，才學得會像保羅這樣看自己的資歷。</strong></p><p>那麼，基督徒要看輕學歷、事業、家庭嗎？不是這樣讀的。保羅丟棄的是拿來「靠」、拿來換取在神面前的地位的東西；他沒有叫人不讀書、不工作、不顧家，同一封信還叫人思念「可敬的、公義的」事（4:8）。糞土的比較只在一個地方成立：當它們與基督放在同一個天平上，要搶基督的位置的時候。一個博士學位放在書架上是恩典，放在神的寶座上就是糞土。</p><p>「為要得著基督」（3:8）是帳本的結算。保羅不是一個損失慘重的人，而是一個做了一生最好交易的人。他用「看作糞土」描寫的，不是苦行的悲壯，而是發現至寶的喜樂；這與 3:1 的「靠主喜樂」是同一顆心。</p><p>今天的我們可以照樣做一次帳：把我最引以為傲的三樣東西寫下來，再問一句——如果它們明天都不見了，我在神面前還站得住嗎？站得住，靠的就是基督；站不住，那三樣就是我的割禮。</p>"},{"a":9,"z":9,"star":3,"grk":"<p lang=\"grc\">καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,</p>","lit":"<p>並且被發現在他裡面，不是有我自己那出於律法的義，而是那藉著基督之信的義，就是那出於神、基於信的義，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εὑρεθῶ ἐν αὐτῷ</td><td>heurethō en autō</td><td>被發現在他裡面</td><td>與 2:7 εὑρεθεὶς 同字：基督被發現有人的樣子</td></tr><tr><td>ἐμὴν δικαιοσύνην τὴν ἐκ νόμου</td><td>emēn dikaiosynēn tēn ek nomou</td><td>我自己出於律法的義</td><td>ἐμὴν 放前面強調：「我的」</td></tr><tr><td>διὰ πίστεως Χριστοῦ</td><td>dia pisteōs Christou</td><td>藉著基督的信</td><td>兩讀：信基督／基督的信實</td></tr><tr><td>τὴν ἐκ θεοῦ δικαιοσύνην</td><td>tēn ek theou dikaiosynēn</td><td>出於神的義</td><td>來源是神，不是我</td></tr><tr><td>ἐπὶ τῇ πίστει</td><td>epi tē pistei</td><td>基於信</td><td>末尾再說一次「信」</td></tr></table>","gram":"<p><strong>3:9 是一個對照句：μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου（mē echōn emēn dikaiosynēn tēn ek nomou），ἀλλὰ τὴν διὰ πίστεως Χριστοῦ（alla tēn dia pisteōs Christou）——兩種義，兩個來源。</strong></p><p>這一節的爭議在 διὰ πίστεως Χριστοῦ（dia pisteōs Christou）。屬格 Χριστοῦ（Christou） 有兩種讀法：</p><p><strong>受格屬格</strong>：「對基督的信」，基督是信的對象。和合本「信基督的義」、多數中英譯本與改教家都這樣讀；理由是本節末尾 ἐπὶ τῇ πίστει（epi tē pistei） 顯然是人的信，保羅也常明說「信入基督」（加 2:16 的 εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν（eis Christon Iēsoun episteusamen））。</p><p><strong>主格屬格</strong>：「基督的信實」，基督自己的忠信、順服到死。近代 Hays 等學者主張此讀；在腓立比書裡它有一個很美的呼應——2:8 基督「存心順服，以至於死」，γενόμενος ὑπήκοος（genomenos hypēkoos） 正是基督信實的樣子。若照此讀，本節是「藉著基督的信實……基於我們的信」，一個說基督，一個說我們，並不重複。</p><p>加 2:16 的 διὰ πίστεως Ἰησοῦ Χριστοῦ（dia pisteōs Iēsou Christou） 是同一個爭議，加拉太書講義已並陳兩讀。本講義經文照和合本，採受格讀法為主，並承認主格讀法與 2:8 的呼應。<strong>兩種讀法都說：義不是自己的。</strong>前後兩個「義」也成對照：ἐμὴν δικαιοσύνην（我的）對 τὴν ἐκ θεοῦ δικαιοσύνην（出於神的）。εὑρεθῶ（heurethō） 是被動假設語氣：在審判的那一天，我被找到時是在「他裡面」——2:7 的 εὑρεθεὶς（heuretheis） 說基督被發現有人的樣子，3:9 說我被發現在基督裡面。</p>","exp":"<p>〔加〕加 2:15--21（加拉太書講義第 2 章）</p><p><strong>「不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義。」（3:9）這一節換掉的，不是行為，是衣服。</strong></p><p>想像一個人要去見王。他身上穿的是自己一針一線縫的禮服，縫了三十年，針腳整齊，從沒有人挑得出毛病（3:6「無可指摘」）。可是到了宮門，侍衛遞給他另一件袍子：這是王為你預備的。他必須脫下自己那件，才穿得上王給的。保羅說，他在那一天要「被發現在他裡面」，身上不是自己的義，是神的義。</p><p>本系列加拉太書講義第 2 章講過這一題：「義若是藉著律法得的，基督就是徒然死了。」（加 2:21）腓立比書沒有加拉太書那麼激烈，卻更個人——加拉太書講的是外邦人該不該受割禮，腓立比書講的是「我」最得意的那件衣服。</p><p>「信基督的義」是我們對基督的信，還是基督的信實？兩種讀法學者都有，議題頁並陳。講台上不必辯論，因為兩者落點相同：一個說「我信他」，一個說「他忠信」，都把焦點從我身上移到基督身上。若讀成基督的信實，這一節就與 2:8 相連：那位「存心順服，以至於死」（2:8）的基督，他的順服成了我的義。若讀成我的信，信也不是另一種功勞，只是伸出手接那件袍子。</p><p>這對一個常常自責、覺得自己不夠好的人是好消息：你在神面前的地位，不建立在你今天的表現上。這對一個很有成就、很少失敗的人也是好消息：你不必再背著那件縫了三十年的禮服，你可以脫下來，休息了。</p>"},{"a":10,"z":11,"star":2,"grk":"<p lang=\"grc\">τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ κοινωνίαν παθημάτων αὐτοῦ, συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,</p><p lang=\"grc\">εἴ πως καταντήσω εἰς τὴν ἐξανάστασιν τὴν ἐκ νεκρῶν.</p>","lit":"<p>為要認識他，和他復活的大能，和他苦難的團契，被模成與他的死同形，</p><p>若是或許我能抵達那出於死人中的復活。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τοῦ γνῶναι αὐτὸν</td><td>tou gnōnai auton</td><td>為要認識他</td><td>目的不定詞；認識的對象是人，不是知識</td></tr><tr><td>τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ</td><td>tēn dynamin tēs anastaseōs autou</td><td>他復活的大能</td><td>先說復活</td></tr><tr><td>κοινωνίαν παθημάτων αὐτοῦ</td><td>koinōnian pathēmatōn autou</td><td>他苦難的團契</td><td>κοινωνία：1:5 合夥福音同一字</td></tr><tr><td>συμμορφιζόμενος</td><td>symmorphizomenos</td><td>被模成同形</td><td>μορφή 字根：2:6--7 的「形像」</td></tr><tr><td>εἴ πως</td><td>ei pōs</td><td>若是或許</td><td>謙卑的語氣，不是懷疑</td></tr><tr><td>τὴν ἐξανάστασιν</td><td>tēn exanastasin</td><td>那出來的復活</td><td>新約只此一見；加了 ἐξ 字首</td></tr></table>","gram":"<p><strong>3:10 的次序很不尋常：先說復活的大能，後說受苦與死——不是先苦後甘，是先得力量，才走得進苦難。</strong></p><p>τοῦ γνῶναι αὐτὸν（tou gnōnai auton） 是目的不定詞，接在 3:8--9 之後：丟棄萬事、得著基督，為的是「認識他」。後面的兩個 καὶ（kai） 是解釋性的：認識他，就是認識 τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ（tēn dynamin tēs anastaseōs autou） 與 κοινωνίαν παθημάτων αὐτοῦ（koinōnian pathēmatōn autou）。兩個名詞共用一個冠詞的結構，使「復活的大能」與「苦難的團契」像一枚硬幣的兩面。κοινωνίαν（koinōnian） 是全卷的追蹤字：1:5 腓立比人在福音上「同心合意」，原是這個字；這裡是與基督在苦難上合夥。</p><p>συμμορφιζόμενος（symmorphizomenos） 是現在被動分詞，是 SBLGNT 原檔未標 Strong 的字，字根是 μορφή（morphē）：2:6 基督「本有神的形像」、2:7「取了奴僕的形像」都用這個字根；3:21 的 σύμμορφον（symmorphon） 又回來。基督取了我們的形狀，我們被模成他死的形狀，最後被改成他榮耀的形狀。被動語態說明：模成是神在我們身上做的。</p><p>3:11 εἴ πως καταντήσω（ei pōs katantēsō） 是謙卑的條件語氣，不是懷疑得救。τὴν ἐξανάστασιν（tēn exanastasin） 在新約只出現這一次，字首 ἐξ（ex） 強調「從死人中出來」：保羅盼望的不是一般的復活，是跟在基督後面，從死人中走出來。</p>","exp":"<p><strong>「使我認識基督，曉得他復活的大能，並且曉得和他一同受苦，效法他的死。」（3:10）丟棄萬事，換來的是一段關係。</strong></p><p>保羅已經認識基督三十年了，還說「使我認識基督」。認識一個人不是一次的事：結婚三十年的夫妻，仍會在病床旁第一次真正認識對方。保羅要的不是更多神學知識，是更深地與這一位同行，連他的苦難也一起走。</p><p>次序值得留意：先是復活的大能，才是一同受苦。基督徒不是靠咬緊牙關忍受苦難；是先被復活的生命充滿，才有力量與基督一同受苦。一位在病床上的弟兄說：「我不是不痛，是痛的時候知道祂在。」這就是苦難的團契——不是苦難本身有價值，而是在苦難裡與基督相交。</p><p>「效法他的死」原文是「被模成他死的形狀」，與 2:6--8 用同一個字根。第 2 章基督往下走：取了奴僕的形像，順服至死；第 3 章保羅說，我也願意被模成這個形狀。這就是腓立比書「往下」與「往上」的對照：3:10 往下，3:11 往上；正如 2:8 之後緊接著 2:9「所以，神將他升為至高」（2:9）。往上的那一段，主詞是神。</p><p>「或者我也得以從死裡復活」（3:11）的「或者」，不是保羅對得救沒把握——他在 1:6 才說過神「必成全這工」（1:6）。這是一個人在神面前的謙卑：我不把復活當成自己的成就，我只是向那裡跑去。下一節馬上解釋：「這不是說我已經得著了。」</p>"},{"a":12,"z":12,"star":2,"grk":"<p lang=\"grc\">Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφʼ ᾧ καὶ κατελήμφθην ὑπὸ Χριστοῦ</p>","lit":"<p>不是說我已經拿到了，或已經被完全了；但我追，看能不能抓住，因為我也是被基督（耶穌）抓住的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οὐχ ὅτι</td><td>Ouch hoti</td><td>不是說</td><td>保羅先擋住誤會</td></tr><tr><td>ἤδη ἔλαβον</td><td>ēdē elabon</td><td>已經拿到了</td><td>不定過去式</td></tr><tr><td>ἤδη τετελείωμαι</td><td>ēdē teteleiōmai</td><td>已經被完全了</td><td>完成式被動：已經到了終點</td></tr><tr><td>διώκω</td><td>diōkō</td><td>我追</td><td>3:6 逼迫教會的同一個字</td></tr><tr><td>καταλάβω</td><td>katalabō</td><td>抓住</td><td>字首 kata 加強：牢牢抓住</td></tr><tr><td>κατελήμφθην ὑπὸ Χριστοῦ</td><td>katelēmphthēn hypo Christou</td><td>我被基督抓住了</td><td>被動；未標號字；cu89t 註腳「所要我得的」</td></tr></table>","gram":"<p><strong>3:12 用兩個主動、一個被動，把成聖的次序寫清楚：我追、我想抓住，因為我先被基督抓住了。</strong></p><p>Οὐχ ὅτι（Ouch hoti） 先擋住一個可能的誤會：3:10--11 說得那麼高，會不會有人以為保羅已經到了？他用兩個 ἤδη（ēdē） 否認：ἤδη ἔλαβον（已經拿到了）、ἤδη τετελείωμαι（已經被完全了）。τετελείωμαι（teteleiōmai） 是 τελειόω（teleioō） 的完成式被動，字根 τέλος（telos） 是終點：「已經跑到終點」。這個字和 3:15 的 τέλειοι（teleioi） 同字根，兩者的關係下兩段處理。</p><p>διώκω δὲ εἰ καὶ καταλάβω（diōkō de ei kai katalabō）：διώκω（diōkō） 正是 3:6 διώκων τὴν ἐκκλησίαν（diōkōn tēn ekklēsian） 的同一個字。從前逼迫，如今追求；能量沒有變，對象換了。καταλάβω（katalabō） 與 κατελήμφθην（katelēmphthēn） 是同一個動詞 καταλαμβάνω（katalambanō） 的主動與被動，形成文字遊戲：<strong>我想抓住，因為我已被抓住。</strong>ἐφʼ ᾧ（eph' hō） 可讀作「因為」，也可讀作「所為的那個」：cu89t 正文作「基督耶穌所以得著我的」，註腳另譯「所要我得的」。兩者都說，起點在基督。κατελήμφθην（katelēmphthēn） 是 SBLGNT 原檔未標 Strong 的字，抽字時要特別核對。</p>","exp":"<p><strong>「這不是說我已經得著了，已經完全了；我乃是竭力追求，或者可以得著基督耶穌所以得著我的。」（3:12）一個跑了三十年的人，說自己還在路上。</strong></p><p>這一節是給屬靈領袖的鏡子。寫這句話的人，建立了半個羅馬帝國的教會，寫了新約將近一半的書信，在監裡還帶人信主——他說：我還沒有到。教會裡最危險的人，不是軟弱的人，是覺得自己已經到了的人；他不再學，不再被勸，也不再需要恩典。</p><p>「竭力追求」的「追」，就是 3:6「逼迫教會」的那個字。一個從前用全部熱情追殺基督徒的人，現在用同樣的熱情追求基督。神沒有把保羅的熱心消滅，是把它轉了方向。這給許多個性強、衝勁大的人一個安慰：你的性格不必被壓扁，它需要的是被基督得著，換一個方向跑。</p><p>最重要的是後半句：「基督耶穌所以得著我的」。追求的起點不是我，是基督先在大馬士革路上把我抓住。一個在急流中被救生員抓住的孩子，會用盡全力抓住救生員的手臂——他用力，是因為已經被抓住了，不是為了被抓住。這就是成聖與恩典的次序：神先，我後；神抓住我，我才竭力抓住他。</p><p>321 說要「成為得勝者」。照這一節，得勝者不是已經完全的屬靈精英，是知道自己還沒到、所以繼續跑的人。若有人說「我們這一群才是得勝者，你們還不是」，3:12 第一個不同意。</p>"},{"a":13,"z":14,"star":3,"grk":"<p lang=\"grc\">ἀδελφοί, ἐγὼ ἐμαυτὸν οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,</p><p lang=\"grc\">κατὰ σκοπὸν διώκω εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>弟兄們，我不算自己已經抓住了；但一件事：一面忘記那些在背後的，一面向那些在前面的伸展自己，</p><p>我照著目標追，朝向神在基督耶穌裡往上的呼召的獎品。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐ λογίζομαι</td><td>ou logizomai</td><td>我不算</td><td>SBLGNT οὐ；WH 作 οὔπω「還沒有」</td></tr><tr><td>ἓν δέ</td><td>hen de</td><td>但一件事</td><td>省略動詞；SBLGNT 原檔誤標為 ἐν</td></tr><tr><td>τὰ μὲν ὀπίσω ἐπιλανθανόμενος</td><td>ta men opisō epilanthanomenos</td><td>一面忘記背後</td><td>現在分詞：持續地不回頭</td></tr><tr><td>τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος</td><td>tois de emprosthen epekteinomenos</td><td>一面伸向前面</td><td>賽跑者身體前傾</td></tr><tr><td>κατὰ σκοπὸν διώκω</td><td>kata skopon diōkō</td><td>照著目標追</td><td>σκοπός：終點線上的標記</td></tr><tr><td>τὸ βραβεῖον</td><td>to brabeion</td><td>獎品</td><td>林前 9:24 賽跑的獎賞</td></tr><tr><td>τῆς ἄνω κλήσεως</td><td>tēs anō klēseōs</td><td>往上的呼召</td><td>獎賞台上主持人的召喚</td></tr></table>","gram":"<p><strong>3:13 有一處經文鑑別，一個被誤標的字，和一組 μὲν（men）……δὲ（de） 的平行句。</strong></p><p><strong>經文鑑別</strong>：SBLGNT 作 ἐγὼ ἐμαυτὸν οὐ λογίζομαι κατειληφέναι（我不認為自己已經抓住了）；WH 等抄本傳統作 οὔπω（我還沒有認為）。兩讀意思相近，οὔπω（oupō） 多一層「到現在還沒」的時間感，可能是抄寫者受 3:12 兩個 ἤδη（ēdē） 影響而改；和合本「我不是以為」跟 SBLGNT。本講義照 SBLGNT。λογίζομαι（logizomai） 是會計字，與 3:7--8 的 ἡγέομαι（hēgeomai） 同一條「算」的線：保羅連自己的進度也照實算帳。</p><p>ἓν δέ（hen de） 省略了動詞，「但一件事——」語氣急促，像跑者喘著氣說話。SBLGNT 原檔把這個 ἓν（一）誤標為介系詞 ἐν（在）的 Strong，grc_src 已修回；這正是全章的鑰句，一個重音就分出「一件事」和「在」。</p><p>τὰ μὲν ὀπίσω ἐπιλανθανόμενος（ta men opisō epilanthanomenos） 與 τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος（tois de emprosthen epekteinomenos） 是 μὲν（men）……δὲ（de） 的對稱句，兩個現在分詞都掛在 3:14 的主要動詞 διώκω（diōkō） 底下：忘記與伸展是跑步的兩個姿勢，不是兩件分開的事。ἐπεκτεινόμενος（epekteinomenos） 是雙重字首的複合字，畫出跑者在終點前把胸膛伸出去的樣子。「背後」在上下文指的是 3:4--8 那張帳本：保羅自己的資歷與成就。κατὰ σκοπὸν（kata skopon） 的 σκοπός（skopos） 是終點的標記，與 3:17 σκοπεῖτε（skopeite）「留意看」同字根；τῆς ἄνω κλήσεως（tēs anō klēseōs） 的 ἄνω（anō）「往上」是全卷「往上」的一站。</p>","exp":"<p><strong>「我只有一件事，就是忘記背後，努力面前的，向著標竿直跑」（3:13--14）——要忘記的，是保羅自己的獎盃。</strong></p><p>這一節常被用錯，所以要先讀清楚上下文。「背後」是甚麼？就是 3:5--6 那張履歷：第八天受割禮、法利賽人、熱心、無可指摘。保羅要忘記的，是他最引以為傲的東西，是會讓他停下來、回頭欣賞的獎盃。一位奧運選手若在最後一圈回頭看自己剛才超過了幾個人，他就會慢下來。</p><p>所以這一節<strong>不是</strong>對受傷的人說「過去的事就不要再提了」。一位被家暴、被性侵、被教會領袖傷害的弟兄姊妹，他的「背後」不是他的成就，是別人加在他身上的傷；3:13 沒有要他壓抑、否認或立刻放下。分清楚兩件事：<strong>「不被過去定義」與「否認過去發生過」</strong>。前者是福音的自由，後者會造成第二次傷害。傷需要被說出來、被聽見、被處理，有時需要專業的陪伴；饒恕與醫治的路，本講義回指哥林多後書立場四。保羅自己也沒有「忘記」他逼迫過教會，他在多封信裡提起（林前 15:9；提前 1:13），只是那件事不再定義他。</p><p>「忘記」在聖經裡常常不是失憶，而是不再讓它支配現在。神說不再記念我們的罪，不是神失憶了，是不再拿它來對付我們。保羅忘記背後，也不是記不起自己的履歷，是不再拿它當跑道上的倚靠。</p><p>「我只有一件事」。許多人的生命被十件事拉扯，最後一件也沒跑完。保羅把一生收成一件：向著標竿直跑。標竿是甚麼？是「神在基督耶穌裡從上面召我來得的獎賞」（3:14）。這就是本章的焦點：<strong>基督是我的標竿</strong>。獎賞不是獎牌，是那位召我的主自己；跑道的終點不是一個成就，是一個面孔。</p>"},{"a":15,"z":16,"star":1,"grk":"<p lang=\"grc\">ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·</p><p lang=\"grc\">πλὴν εἰς ὃ ἐφθάσαμεν, τῷ αὐτῷ στοιχεῖν</p>","lit":"<p>所以我們凡是成熟的，要思想這件事；若你們在甚麼事上另有想法，這個神也必向你們啟示；</p><p>只是我們已經到達了哪裡，就照著同一個排成行列走。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὅσοι οὖν τέλειοι</td><td>hosoi oun teleioi</td><td>所以凡是成熟的</td><td>τέλειος：成年、成熟</td></tr><tr><td>τοῦτο φρονῶμεν</td><td>touto phronōmen</td><td>讓我們思想這件事</td><td>勸勉假設語氣；φρονέω 回到 2:5</td></tr><tr><td>ἑτέρως φρονεῖτε</td><td>heterōs phroneite</td><td>另有想法</td><td>保羅容許不同</td></tr><tr><td>ἀποκαλύψει</td><td>apokalypsei</td><td>必啟示</td><td>未來式：神會處理</td></tr><tr><td>ἐφθάσαμεν</td><td>ephthasamen</td><td>我們已經到達了</td><td>不定過去式</td></tr><tr><td>στοιχεῖν</td><td>stoichein</td><td>排成行列走</td><td>軍隊行進的字</td></tr></table>","gram":"<p><strong>3:15 的 τέλειοι（teleioi） 與 3:12 的 τετελείωμαι（teteleiōmai） 同字根，看似矛盾：保羅剛說自己還沒「完全」，立刻又說「我們中間凡是完全人」。</strong></p><p>關鍵在字義。3:12 的 τετελείωμαι（teteleiōmai） 是完成式，指「已經抵達終點」；3:15 的 τέλειοι（teleioi） 是形容詞，在希臘文裡常指「成年的、成熟的」，林前 2:6、14:20 都這樣用，與嬰孩相對。所以兩節不矛盾：<strong>成熟人的標記，正是知道自己還沒到終點。</strong>保羅也許帶一點反諷，對那些自以為已經完全的人說：真正成熟的，該這樣想。</p><p>τοῦτο φρονῶμεν（touto phronōmen） 是勸勉假設語氣，保羅把自己也放進去。φρονέω（phroneō） 是全卷的線：2:2「意念相同」、2:5「以基督耶穌的心為心」、4:2「同心」，這裡是第 3 章的站點，3:19 還有反面的一站。καὶ εἴ τι ἑτέρως φρονεῖτε（kai ei ti heterōs phroneite）：保羅容許次要的事上有不同，交給神 ἀποκαλύψει（apokalypsei）。3:16 στοιχεῖν（stoichein） 原是軍隊排成行列前進的字，加 5:25 也用它說「靠聖靈行事」；SBLGNT 在此只有 στοιχεῖν（stoichein），RP 多了「照同一規矩、存同一心」，和合本跟批判本。</p>","exp":"<p><strong>「所以我們中間，凡是完全人總要存這樣的心。」（3:15）完全在這裡的意思，是成熟。</strong></p><p>基督徒能在今生完全嗎？各傳統的回答不同：改革宗說成聖是一生漸進的；衛斯理宗與聖潔運動講「完全的愛」；凱錫克運動講得勝生活；中國教會有「得勝者」的傳統。這些在議題頁與全卷立場四並陳。這兩節本身給了一個很實際的定義：成熟的人知道自己還沒到，所以繼續跑；跌倒了，就「到了甚麼地步，就當照著甚麼地步行」（3:16）。</p><p>保羅的牧養也很寬：「若在甚麼事上存別樣的心，神也必以此指示你們。」（3:15）他剛剛在 3:2 很嚴厲，這裡卻很溫和——福音的核心不能讓，其餘的事可以等神親自教導。一位成熟的牧者知道哪些是要防備的，哪些是可以等候的。</p><p>3:16 的「行」原是行軍排隊的字。不必每個人跑一樣快，但要在同一條隊伍裡。這是 321 改變觀念八大步驟的後段：修正、反覆，照著已經學到的去活，再往前一步。</p>"},{"a":17,"z":17,"star":1,"grk":"<p lang=\"grc\">Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·</p>","lit":"<p>弟兄們，你們要一同成為效法我的人，也要定睛看那些這樣行走的，正如你們有我們作模樣。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Συμμιμηταί μου γίνεσθε</td><td>Symmimētai mou ginesthe</td><td>要一同成為效法我的人</td><td>新約只此一見；字首 syn：一起效法</td></tr><tr><td>σκοπεῖτε</td><td>skopeite</td><td>定睛看</td><td>與 3:14 σκοπὸν 同字根</td></tr><tr><td>τύπον</td><td>typon</td><td>模樣、印記</td><td>蓋印留下的痕跡</td></tr></table>","gram":"<p><strong>3:17 的 Συμμιμηταί（Symmimētai） 是新約只出現一次的字：不是「各人效法我」，是「一起效法我」。</strong></p><p>字首 syn 把「效法」變成群體的行動，與全卷的「同」字串連在一起（1:7 同得恩典、2:17--18 同喜樂、2:25 同做工同當兵、3:10 同受苦）。保羅說「效法我」，緊接著說 σκοπεῖτε τοὺς οὕτω περιπατοῦντας（skopeite tous houtō peripatountas）：要定睛看那些這樣行的人。σκοπεῖτε（skopeite） 與 3:14 的 σκοπὸν（skopon） 同字根：先定睛看終點的標竿，再定睛看跑在前面的人。2:4 的 σκοποῦντες（skopountes）「顧別人的事」也是同一字根。</p><p>τύπον（typon） 原指蓋印或敲打留下的痕跡。καθὼς ἔχετε τύπον ἡμᾶς（kathōs echete typon hēmas） 用複數 ἡμᾶς（hēmas）：榜樣不只保羅一人，還有提摩太、以巴弗提（2:19--30）。περιπατοῦντας（peripatountas） 是「行走」，3:18 立刻用同一個動詞說到另一群人，形成鮮明對照。</p>","exp":"<p><strong>「弟兄們，你們要一同效法我，也當留意看那些照我們榜樣行的人。」（3:17）信仰是看得見的。</strong></p><p>這句話聽起來很大膽：誰敢說「效法我」？但保羅剛剛說過自己還沒有得著、還在跑（3:12--13）。所以他叫人效法的，不是一個已經完全的人，是一個正在跑的方向：把資歷算作有損、向著標竿直跑。學徒跟師傅學木工，學的不只是師傅的成品，更是師傅怎樣處理一塊有節的木頭。</p><p>而且保羅不要大家只看他。第 2 章他剛介紹過提摩太與以巴弗提，一個像兒子待父親，一個與他一同做工、一同當兵——321 的 235 在腓立比書是三個真實的人。保羅說：去看那些這樣行的人。這是 321 八大步驟的最後一步：繁殖。生命是從一個人傳到一個人，從一群人傳到一群人。</p><p>今天的教會也需要問：我們的青年人看得見誰？一間教會若只有講台上的道理，沒有生活裡的榜樣，福音就只剩下聲音。反過來，每一位跟隨主的人也在被看著——不是要我們完美，是要我們誠實地在跑道上。</p>"},{"a":18,"z":19,"star":2,"grk":"<p lang=\"grc\">πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,</p><p lang=\"grc\">ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.</p>","lit":"<p>因為有許多人行走——我屢次對你們說過他們，現在也哭著說——是基督的十字架的仇敵，</p><p>他們的終局是滅亡，他們的神是那肚腹，他們的榮耀在他們的羞恥裡，就是那些思想地上之事的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κλαίων λέγω</td><td>klaiōn legō</td><td>我哭著說</td><td>現在分詞：一面說一面流淚</td></tr><tr><td>τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ</td><td>tous echthrous tou staurou tou Christou</td><td>基督十字架的仇敵</td><td>不是敵視基督，是敵視十字架的路</td></tr><tr><td>τὸ τέλος ἀπώλεια</td><td>to telos apōleia</td><td>終局是滅亡</td><td>τέλος：與 3:12、15 同字根</td></tr><tr><td>ἡ κοιλία</td><td>hē koilia</td><td>肚腹</td><td>口腹與慾望</td></tr><tr><td>τὰ ἐπίγεια φρονοῦντες</td><td>ta epigeia phronountes</td><td>思想地上的事</td><td>φρονέω 的反面一站</td></tr></table>","gram":"<p><strong>3:18 的句子被一個插入語打斷：οὓς πολλάκις ἔλεγον ὑμῖν（hous pollakis elegon hymin）, νῦν δὲ καὶ κλαίων λέγω（nyn de kai klaiōn legō）——保羅寫到一半，哭了。</strong></p><p>主句是 πολλοὶ γὰρ περιπατοῦσιν（polloi gar peripatousin）……τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ（tous echthrous tou staurou tou Christou）。中間插入的 κλαίων λέγω（klaiōn legō） 是現在分詞加現在式：不是「我曾經哭」，是「我現在一面寫一面哭」。保羅對仇敵的語氣，是眼淚，不是咒罵。</p><p>3:19 四個描寫排成一串：ὧν τὸ τέλος ἀπώλεια（hōn to telos apōleia）、ὧν ὁ θεὸς ἡ κοιλία（hōn ho theos hē koilia）、ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν（hē doxa en tē aischynē autōn）、οἱ τὰ ἐπίγεια φρονοῦντες（hoi ta epigeia phronountes）。這群人是誰，學者看法不一：有人認為仍是 3:2 的割禮派（「肚腹」指飲食條例，「羞辱」指割禮的部位）；更多人認為是另一群放縱的人，把恩典當作放縱的藉口，以口腹慾望為神。後者與「十字架的仇敵」較合：他們不反對基督的名，反對的是十字架往下走的路。</p><p>τὸ τέλος（to telos） 與 3:12 的 τετελείωμαι（teteleiōmai）、3:15 的 τέλειοι（teleioi） 同字根：成熟人的終點是獎賞，他們的終點是滅亡。τὰ ἐπίγεια φρονοῦντες（ta epigeia phronountes） 是 φρονέω（phroneō） 的反面一站，2:10 的 ἐπιγείων（epigeiōn） 也回來了；3:20 立刻用 ἐν οὐρανοῖς（en ouranois） 對照。這是全卷地勢的低谷。</p>","exp":"<p><strong>「我屢次告訴你們，現在又流淚地告訴你們」（3:18）——保羅說到敵人，是哭著說的。</strong></p><p>這是讀 3:2 的鑰匙。同一位使徒，可以很嚴厲地說「防備犬類」，也可以流著淚說到十字架的仇敵。嚴厲與眼淚不矛盾：父母對走偏的孩子，會大聲喝止，夜裡也會哭。今天的教會若只剩下批判，沒有眼淚，就不像保羅了；若只剩下眼淚，不敢說錯是錯，也不像保羅。</p><p>「十字架的仇敵」不一定是反對基督教的人，他們可能就在教會裡。他們歡迎基督的祝福，卻拒絕基督的十字架；喜歡 2:9 的高舉，不要 2:8 的往下。「他們的神就是自己的肚腹」（3:19）：人生的方向由慾望決定，吃、喝、享受、成功，凡事以滿足自己為中心。這正是 2:21「別人都求自己的事」的極端。</p><p>「他們以自己的羞辱為榮耀，專以地上的事為念。」（3:19）他們誇耀的，正是該羞愧的。這面鏡子也照我們：我常常思念的是甚麼？如果一個人的手機打開，全是地上的事，他的國籍可能早已悄悄換了。下一節，保羅就要說到國籍。</p><p>還要留意這些人的結局：「他們的結局就是沉淪」（3:19）。保羅說這句話不是幸災樂禍，是為他們流淚。一個看見朋友把車開向斷崖的人，會大聲喊，也會心痛。今天面對走偏的人，我們的語氣常常只剩下兩種：冷漠或憤怒。保羅給了第三種：清楚地說出真相，同時為他們哭。</p>"},{"a":20,"z":21,"star":3,"grk":"<p lang=\"grc\">ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,</p><p lang=\"grc\">ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι αὑτῷ τὰ πάντα.</p>","lit":"<p>因為我們的公民團體存在於諸天之中，我們也從那裡熱切等候一位救主，就是主耶穌基督，</p><p>他要把我們卑賤的身體改變形狀，成為與他榮耀的身體同形，是照著他能使萬有都服從自己的那運作。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸ πολίτευμα</td><td>to politeuma</td><td>公民團體、國籍</td><td>與 1:27 πολιτεύεσθε 同字根</td></tr><tr><td>ἐν οὐρανοῖς ὑπάρχει</td><td>en ouranois hyparchei</td><td>存在於諸天</td><td>與 2:6 ὑπάρχων 同字：本來就是</td></tr><tr><td>σωτῆρα</td><td>sōtēra</td><td>救主</td><td>羅馬皇帝也被稱為救主</td></tr><tr><td>ἀπεκδεχόμεθα</td><td>apekdechometha</td><td>熱切等候</td><td>伸長脖子等</td></tr><tr><td>μετασχηματίσει</td><td>metaschēmatisei</td><td>改變形狀</td><td>與 2:7 σχήματι 同字根</td></tr><tr><td>τὸ σῶμα τῆς ταπεινώσεως ἡμῶν</td><td>to sōma tēs tapeinōseōs hēmōn</td><td>我們卑賤的身體</td><td>與 2:8 ἐταπείνωσεν 同字根</td></tr><tr><td>σύμμορφον</td><td>symmorphon</td><td>同形的</td><td>與 2:6--7 μορφή、3:10 同字根</td></tr><tr><td>ὑποτάξαι</td><td>hypotaxai</td><td>使服從</td><td>萬有都歸服他</td></tr></table>","gram":"<p><strong>3:20--21 是第 3 章的山峰，也是 2:6--11 基督之歌的回聲：同一組字，從基督身上搬到了我們身上。</strong></p><p>3:20 以 γάρ（gar） 接上 3:19，ἡμῶν（hēmōn） 放在句首與「他們」對照：他們思念地上，我們的 τὸ πολίτευμα（to politeuma） 在天上。πολίτευμα（politeuma） 是城邦的公民團體，也可指殖民地的僑民組織。腓立比是羅馬的駐防城（徒 16:12），居民享有羅馬公民權，用羅馬法律；保羅在那裡被打時正是以羅馬人的身分抗議（徒 16:37）。1:27 πολιτεύεσθε（politeuesthe） 是同一個字根。ὑπάρχει（hyparchei） 與 2:6 的 ὑπάρχων（hyparchōn） 同字：我們的國籍「本來就在」天上。σωτῆρα（sōtēra） 是羅馬皇帝的稱號之一，保羅把這個頭銜給了主耶穌基督。</p><p>3:21 的字彙幾乎全從第 2 章搬來：μετασχηματίσει（metaschēmatisei） 對 2:7 σχήματι（schēmati）；τῆς ταπεινώσεως（tēs tapeinōseōs） 對 2:8 ἐταπείνωσεν（etapeinōsen）；σύμμορφον（symmorphon） 對 2:6--7 μορφῇ（morphē） 與 μορφὴν（morphēn）；τῆς δόξης αὐτοῦ（tēs doxēs autou） 對 2:11 εἰς δόξαν θεοῦ πατρός（eis doxan theou patros）；ὑποτάξαι αὑτῷ τὰ πάντα（hypotaxai hautō ta panta） 對 2:10 πᾶν γόνυ κάμψῃ（pan gony kampsē）；κύριον Ἰησοῦν Χριστόν（kyrion Iēsoun Christon） 對 2:11 κύριος Ἰησοῦς Χριστὸς（kyrios Iēsous Christos）。<strong>基督取了我們卑賤的形狀，為要把我們改成他榮耀的形狀。</strong>這也是全卷完整性最有力的內證之一。</p>","exp":"<p><strong>「我們卻是天上的國民，並且等候救主，就是主耶穌基督從天上降臨。」（3:20）腓立比是羅馬放在馬其頓的一塊領土；教會是天國放在腓立比的一塊領土。</strong></p><p>腓立比人很懂這句話。他們的城在馬其頓，法律、語言、身分卻屬於羅馬；許多人一生沒去過羅馬，卻以羅馬公民自豪。保羅說：你們還有一個更高的公民身分。教會就像一座大使館，地址在腓立比，主權屬於天上。這是 321「建立屬神的體系」在新約最直接的經文：在地上活出天國的法律與文化。</p><p>天上的國民不是不顧地上的人。保羅自己就善用羅馬公民權保護福音（徒 16:37）；基督徒仍納稅、仍守法、仍愛自己的城市。分別在於最終的忠誠：當地上的要求與天上的主衝突時，我們知道自己的護照是哪一國的。基督徒與地上國家的關係，在議題頁展開。</p><p>「他要按著那能叫萬有歸服自己的大能，將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似。」（3:21）這是對病床旁的人最大的安慰。這個會老、會病、會痛的身體，不是被丟掉，是被改變。卑賤的身體——保羅用的字，正是 2:8 基督「自己卑微」的字根。基督先走進我們卑賤的形狀，為要把我們帶進他榮耀的形狀。</p><p>這也回到全卷的「往下」與「往上」：3:21 前半往下，後半往上；往上的主詞是基督的大能，不是我們。這一章從帳本開始，到身分結束：保羅把資歷算作有損，換來的是天上的國籍；忘記背後的獎盃，等候的是從天上降臨的主。<strong>基督是我的標竿</strong>，也是我的終局；跑到最後，迎接我們的是一位救主。</p>"}],"4":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.</p>","lit":"<p>所以，我的弟兄們，被愛的、被渴想的，我的喜樂和冠冕，你們要這樣在主裡站立，被愛的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὥστε</td><td>hōste</td><td>所以、因此</td><td>把 3:20--21 天上的國民整個接過來</td></tr><tr><td>ἐπιπόθητοι</td><td>epipothētoi</td><td>被渴想的</td><td>與 1:8 ἐπιποθῶ 同字根；新約只此一處</td></tr><tr><td>χαρὰ καὶ στέφανός μου</td><td>chara kai stephanos mou</td><td>我的喜樂和冠冕</td><td>στέφανος 是賽跑得勝者的花冠</td></tr><tr><td>οὕτως στήκετε</td><td>houtōs stēkete</td><td>要這樣站立</td><td>現在式命令：一直站著</td></tr><tr><td>ἐν κυρίῳ</td><td>en kyriō</td><td>在主裡</td><td>站的地方，不是站的力氣</td></tr><tr><td>ἀγαπητοί</td><td>agapētoi</td><td>親愛的</td><td>一節之內出現兩次，前後包住命令</td></tr></table>","gram":"<p><strong>4:1 只有一個命令 στήκετε（stēkete），前後卻包了五個稱呼：ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι（adelphoi mou agapētoi kai epipothētoi），χαρὰ καὶ στέφανός μου（chara kai stephanos mou），最後再補一個 ἀγαπητοί（agapētoi）。</strong></p><p>ὥστε（hōste） 是推論詞，指向前面：3:20 說「我們卻是天上的國民」（3:20），3:21 說主要改變我們卑賤的身體——「所以」，要站穩。οὕτως（houtōs） 也往回指：照著 3:17 所說的榜樣，照著等候救主的那種姿態站。第 4 章因此不是另起爐灶，是第 3 章跑道的終點線上，保羅回頭對隊友說的話。</p><p>στήκετε（stēkete） 在全卷出現兩次，另一次在 1:27：ὅτι στήκετε ἐν ἑνὶ πνεύματι（hoti stēkete en heni pneumati）。兩處把 1:27--4:1 框成一大段勸勉；1:27 是「同有一個心志」地站，4:1 是 ἐν κυρίῳ（en kyriō） 地站。現在式命令，意思是持續站住，不是一時站起來。</p><p>στέφανός（stephanos） 是運動會頒給得勝者的花冠，不是王冠；它接著 3:14「向著標竿直跑」（3:14）的跑道意象。保羅說腓立比人就是他的花冠——他賽跑的獎品，是一群人。帖前 2:19 對帖撒羅尼迦人也說同樣的話。</p>","exp":"<p><strong>「我所親愛、所想念的弟兄們，你們就是我的喜樂，我的冠冕。我親愛的弟兄，你們應當靠主站立得穩。」（4:1）一個命令，用五句愛包起來。</strong></p><p>保羅要下的命令很短：站穩。但他先叫他們「親愛的」，再說「所想念的」，再說「我的喜樂」「我的冠冕」，最後又叫一聲「親愛的」。這不是客套。下一節他要點名兩位吵架的姊妹，全教會都會聽見；在說難聽的話之前，他先讓每一個人知道：你們是我所愛的。勸勉若不是從愛出來，聽的人只聽見責備；先被愛的人，才聽得進「站穩」。</p><p>「站立得穩」不是原地不動。羅馬軍隊的陣式，最怕的是有人退出自己的位置，一個缺口就讓整排潰散。腓立比滿城都是退伍軍人的後代，他們懂這個字。以弗所書講義第 6 章講過「還能站立得住」（弗 6:13）——那是面對仇敵的站；腓立比書的站，是面對彼此的站：不離開自己的位置，也不去搶別人的位置。這正是 321 所說的「回到本位」。</p><p>站在哪裡？「靠主」，原文是「在主裡」。站得穩的秘訣不是腿力，是地面。站在自己的資歷上（3:4--6）會滑倒，站在別人的肯定上會被推倒；站在主裡，地是不動的。</p><p>「你們就是我的喜樂，我的冠冕」——後半句值得每一位帶領人的人停下來想一想。保羅一生的獎品不是著作、會堂、頭銜，是一群他所愛、也會讓他頭痛的人。321 說「人比事重要」，保羅的冠冕上沒有一件事，全是人的名字。下兩節，那些名字就出現了。</p>"},{"a":2,"z":3,"star":3,"grk":"<p lang=\"grc\">Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.</p><p lang=\"grc\">ναὶ ἐρωτῶ καὶ σέ, γνήσιε σύζυγε, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.</p>","lit":"<p>我勸友阿蝶，我也勸循都基，要在主裡想同一件事。</p><p>是的，我也求你，真實的同軛者，要幫助她們；她們曾在福音上與我一同競技，連同革利免和我其餘的同工，他們的名字在生命冊上。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ</td><td>Euodian parakalō kai Syntychēn parakalō</td><td>我勸友阿蝶，我也勸循都基</td><td>一人一個「我勸」，不偏袒</td></tr><tr><td>τὸ αὐτὸ φρονεῖν</td><td>to auto phronein</td><td>想同一件事</td><td>與 2:2、2:5 同一個動詞 φρονέω</td></tr><tr><td>ναὶ ἐρωτῶ καὶ σέ</td><td>nai erōtō kai se</td><td>是的，我也求你</td><td>從勸兩個人，轉向請第三個人</td></tr><tr><td>γνήσιε σύζυγε</td><td>gnēsie syzyge</td><td>真實同負一軛的</td><td>呼格；或為人名「瑟蘇古」</td></tr><tr><td>συλλαμβάνου αὐταῖς</td><td>syllambanou autais</td><td>一起抓住、幫助她們</td><td>現在式中間語態命令：持續地幫</td></tr><tr><td>συνήθλησάν μοι</td><td>synēthlēsan moi</td><td>與我一同競技</td><td>與 1:27 συναθλοῦντες 同字：同一隊的運動員</td></tr><tr><td>ἐν βίβλῳ ζωῆς</td><td>en biblō zōēs</td><td>在生命冊上</td><td>名字的歸屬，不是表現的評分</td></tr></table>","gram":"<p><strong>4:2 的字序是全卷最公平的一句：Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ（Euodian parakalō kai Syntychēn parakalō）——兩個名字，兩個動詞，不共用一個「我勸」。</strong></p><p>希臘文大可以寫成「我勸友阿蝶和循都基」，一個動詞管兩個受詞；保羅卻重複 παρακαλῶ（parakalō），一人一個。這是刻意的平衡：他沒有說誰對誰錯，沒有先勸其中一位，也沒有讓任何一位覺得自己是「主要被勸的那個」。</p><p>勸的內容是 τὸ αὐτὸ φρονεῖν ἐν κυρίῳ（to auto phronein en kyriō）。φρονέω（phroneō） 是全卷的鑰字：2:2 ἵνα τὸ αὐτὸ φρονῆτε（hina to auto phronēte），2:5 τοῦτο φρονεῖτε ἐν ὑμῖν ὃ καὶ ἐν Χριστῷ Ἰησοῦ（touto phroneite en hymin ho kai en Christō Iēsou）。4:2 幾乎逐字重複 2:2，再加上 ἐν κυρίῳ（en kyriō）。整首基督之歌（2:6--11）原來是為這一句預備的：兩位姊妹要「想同一件事」，而那件事就是基督往下走的心。</p><p>4:3 的 ναὶ（nai） 是加強語氣，轉向一位單數的「你」：γνήσιε σύζυγε（gnēsie syzyge）。σύζυγος（syzygos） 字面是「同一個軛下的」。這人是誰，各家說法：以巴弗提（他正要帶信回去）、路加、提摩太、腓立比教會的監督之一，或者 Σύζυγος（Syzygos） 就是人名，γνήσιε（gnēsie） 是文字遊戲——「名副其實的同軛者」。新約與當時文獻都找不到以此為名的人，本講義存而不論：保羅知道是誰，腓立比人也知道。</p><p>συλλαμβάνου（syllambanou） 是現在式中間語態命令，「一起抓住」，路 5:7 用來說別船的人來幫忙拉網。συνήθλησάν（synēthlēsan） 與 1:27 συναθλοῦντες（synathlountes） 同字——兩位姊妹不是旁觀者，是在福音上與保羅同隊競技的人。女同工的地位，本講義回指哥林多前書立場二與加拉太書立場四。ἐν βίβλῳ ζωῆς（en biblō zōēs） 這使我們想起出 32:32 摩西所說「從你所寫的冊上塗抹我的名」（出 32:32），也見路 10:20、啟 3:5。</p>","exp":"<p>〔背景〕徒 16:13--15（使徒行傳講義第 16 章）</p><p><strong>「我勸友阿蝶和循都基，要在主裡同心。」（4:2）一封要在全教會朗讀的信，點了兩個名字。</strong></p><p>腓立比教會是從一群婦女開始的。使徒行傳講義第 16 章講過那個安息日：保羅出城到河邊，「我們就坐下對那聚會的婦女講道」（徒 16:13），賣紫色布的呂底亞頭一個信主，她的家成了教會聚會的地方（徒 16:40）。十年後，在這間由婦女開頭的教會裡，有兩位婦女不和了。她們可能就是河邊那一群裡的人，經文沒有說，我們不必猜；經文說的是：「她們在福音上曾與我一同勞苦」，而且「他們的名字都在生命冊上」（4:3）。好人也會吵架，而且同工吵得最兇。</p><p>保羅怎樣處理？三件事。第一，他一人一個「我勸」，不偏袒。他沒有在信裡審案，因為他不在現場，也因為兩個人都是他所愛的同伴。第二，他沒有叫她們閉嘴，沒有說「為了合一，大家不要再提了」；他說「要在主裡同心」——把問題帶進主裡面，在基督的心這個共同的地基上重新談。第三，他請第三個人：「我也求你這真實同負一軛的，幫助這兩個女人」（4:3）。</p><p>這一節常被用錯。有人把「同心」講成「有意見就是不屬靈」「發現同工的問題不要講出來」，甚至對受傷的一方說「不要再吵了，要合一」。那不是 4:2--3。保羅的做法是公開承認問題存在，請一位雙方都信任的人進來「幫助」——這個字是一起抓住、一起拉網。合一不是把問題藏到地毯底下，是大家一起把問題帶進主裡處理。若問題涉及傷害與不公，需要的是公平的處理與保護，不是一句「要同心」。</p><p>那位「真實同負一軛的」是誰，我們不知道，但他的位置我們知道：321 的「235」裡那個「2」——屬靈的同伴。教會裡最寶貴的人之一，是吵架的兩邊都願意讓他進來的人。他不替任何一方打仗，他和兩邊一起負軛。今天很多教會缺的不是講道的人，是這樣一位肯蹲下來「幫助她們」的同伴。</p>"},{"a":4,"z":5,"star":2,"grk":"<p lang=\"grc\">Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.</p><p lang=\"grc\">τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·</p>","lit":"<p>你們要在主裡常常喜樂；我要再說，你們要喜樂。</p><p>你們的謙讓要被眾人知道。主近了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Χαίρετε ἐν κυρίῳ πάντοτε</td><td>Chairete en kyriō pantote</td><td>要在主裡常常喜樂</td><td>現在式命令；3:1 已說過一次</td></tr><tr><td>πάλιν ἐρῶ</td><td>palin erō</td><td>我要再說</td><td>未來式：預料有人會問「在監裡還喜樂？」</td></tr><tr><td>τὸ ἐπιεικὲς ὑμῶν</td><td>to epieikes hymōn</td><td>你們的謙讓</td><td>不堅持自己的權利；林後 10:1 用來說基督</td></tr><tr><td>γνωσθήτω πᾶσιν ἀνθρώποις</td><td>gnōsthētō pasin anthrōpois</td><td>要讓眾人知道</td><td>不只在教會裡，是對所有人</td></tr><tr><td>ὁ κύριος ἐγγύς</td><td>ho kyrios engys</td><td>主近了</td><td>沒有動詞；時間與空間兩讀</td></tr></table>","gram":"<p><strong>Χαίρετε ἐν κυρίῳ πάντοτε（Chairete en kyriō pantote） 是命令語氣，不是祝福語；保羅自己知道這句話難聽懂，所以補一句 πάλιν ἐρῶ（palin erō）。</strong></p><p>3:1 已經寫過 χαίρετε ἐν κυρίῳ（chairete en kyriō），接著說 τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν（ta auta graphein hymin emoi men ouk oknēron）——「我把這話再寫給你們，於我並不為難」（3:1）。4:4 果然再寫，而且一節之內說兩次。πάλιν ἐρῶ（palin erō） 是未來式，像預先回答一個質疑：一個戴著鎖鍊的人，憑甚麼叫人喜樂？答案在 ἐν κυρίῳ（en kyriō）：喜樂有一個地址。</p><p>τὸ ἐπιεικὲς（to epieikes） 是中性形容詞當名詞用。ἐπιεικής（epieikēs） 在希臘文裡指一個有權利卻不硬要的人：法官判案時不死扣條文，而顧到人情與公平。林後 10:1 保羅說 διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ（dia tēs praytētos kai epieikeias tou Christou），和合本譯「基督的溫柔、和平」（林後 10:1）。所以 4:5 上接 4:2--3：兩位姊妹若各讓一步，正是這個字。</p><p>ὁ κύριος ἐγγύς（ho kyrios engys） 沒有動詞，前後都沒有連接詞，可以往兩邊讀。時間讀法：主快來了（3:20「等候救主」），所以不必為權利爭到底。空間讀法：主就在旁邊，這使我們想起「耶和華便與他們相近」（詩 145:18），所以下一節不必掛慮。兩讀並不互斥；本講義認為保羅讓這句話同時向前、向後說話，而它最直接的落點是 4:6。</p>","exp":"<p><strong>「你們要靠主常常喜樂。我再說，你們要喜樂。」（4:4）喜樂不是心情，是一個地址。</strong></p><p>寫這句話的人在軟禁中，身邊有兵看守，有人故意傳基督來加增他的苦楚（1:17），前途是無論是生、是死。他不是在順境裡教人樂觀。他說「靠主」，原文是「在主裡」：喜樂不是從環境長出來的，是從一位主那裡流出來的。環境會變，地址不變；所以可以「常常」。</p><p>但「常常喜樂」不是常常笑。同一封信裡，保羅說他「現在又流淚地告訴你們」（3:18），說以巴弗提病了，「免得我憂上加憂」（2:27）。喜樂可以和眼淚同在。所以這一節不能拿來對一位剛喪親的人說「聖經叫你要喜樂」——那是把命令當成鞭子。命令是邀請：在最深的地方，你仍屬於一位不會離開你的主。</p><p>緊接著是「當叫眾人知道你們謙讓的心」（4:5）。喜樂和謙讓放在一起，並不奇怪：一個喜樂建立在主裡的人，不需要每一次都贏。他可以放下一些權利，因為他的安全感不在那些權利上。這是 321「謙卑是放下權力回到本位」在日常生活裡的樣子，而且要讓「眾人」——包括教會外的鄰舍與同事——都看得見。</p><p>「主已經近了」，不是叫人去算日子。主來的日子近，所以爭到底的事沒那麼重要；主就在身邊，所以下一節的掛慮可以說出來。這四個字是一座橋：從謙讓走到禱告。</p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">μηδὲν μεριμνᾶτε, ἀλλʼ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετʼ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·</p><p lang=\"grc\">καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>甚麼都不要掛慮，而是在每一件事上，藉著禱告和祈求，帶著感謝，使你們所求的被神知道；</p><p>而神那超過一切理解的平安，必在基督耶穌裡駐守你們的心和你們的思想。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μηδὲν μεριμνᾶτε</td><td>mēden merimnate</td><td>甚麼都不要掛慮</td><td>與 2:20 提摩太「掛念」同一個字</td></tr><tr><td>ἀλλʼ ἐν παντὶ</td><td>all' en panti</td><td>而是在每一件事上</td><td>「甚麼都不」對「每一件都」</td></tr><tr><td>τῇ προσευχῇ καὶ τῇ δεήσει</td><td>tē proseuchē kai tē deēsei</td><td>藉著禱告和祈求</td><td>一般的禱告與具體的懇求</td></tr><tr><td>μετʼ εὐχαριστίας</td><td>met' eucharistias</td><td>帶著感謝</td><td>感謝陪著祈求，不是取代祈求</td></tr><tr><td>γνωριζέσθω</td><td>gnōrizesthō</td><td>要被說出來、使之知道</td><td>現在式被動命令</td></tr><tr><td>ἡ ὑπερέχουσα πάντα νοῦν</td><td>hē hyperechousa panta noun</td><td>超過一切理解的</td><td>與 2:3、3:8 同一個 ὑπερέχω</td></tr><tr><td>φρουρήσει</td><td>phrourēsei</td><td>必駐守、把守</td><td>軍事用語；腓立比是駐防城</td></tr><tr><td>τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν</td><td>tas kardias hymōn kai ta noēmata hymōn</td><td>你們的心和你們的思想</td><td>心與意念都被保守</td></tr></table>","gram":"<p><strong>4:6 用兩個極端字做對照：μηδὲν μεριμνᾶτε（mēden merimnate），ἀλλʼ ἐν παντὶ（all' en panti）——甚麼都不要掛慮，而是在每一件事上禱告。</strong></p><p>μεριμνᾶτε（merimnate） 是現在式命令，可以讀作「不要一直掛慮下去」。這個動詞本身不是罪：2:20 保羅稱讚提摩太 γνησίως τὰ περὶ ὑμῶν μεριμνήσει（gnēsiōs ta peri hymōn merimnēsei），和合本譯「實
