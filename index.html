在掛念你們的事」（2:20），同一個字。差別不在有沒有這份心，在這份心往哪裡去：留在心裡翻來覆去，就成了掛慮；帶到神面前，就成了代求。主耶穌在山上也說 μὴ μεριμνᾶτε（太 6:25）。</p><p>出路由四個詞組成：τῇ προσευχῇ（向神的禱告）、τῇ δεήσει（具體的懇求）、μετʼ εὐχαριστίας（帶著感謝）、τὰ αἰτήματα ὑμῶν（你們所要的，複數，一件一件）。主要動詞 γνωριζέσθω（gnōrizesthō） 是被動命令：「讓它們被神知道」。神當然早知道；這個動詞要的是我們把它說出口，不是向神報告新聞。</p><p>4:7 以 καὶ（kai） 開頭，是結果，不是條件：平安不是等問題解決才來。ἡ ὑπερέχουσα πάντα νοῦν（hē hyperechousa panta noun） 用的是 ὑπερέχω（hyperechō）——2:3 叫人看別人 ὑπερέχοντας ἑαυτῶν（hyperechontas heautōn），3:8 說認識基督 τὸ ὑπερέχον（to hyperechon）。φρουρήσει（phrourēsei） 是軍事字，林後 11:32 用來說大馬士革的官「把守」城門。腓立比是「羅馬的駐防城」（徒 16:12），城裡人天天看見駐軍守門；保羅說，神的平安要在你們的心門口站崗。受詞有兩個：τὰς καρδίας（tas kardias） 和 τὰ νοήματα（ta noēmata），心與思想都在保守之內。</p>","exp":"<p><strong>「應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」（4:6）解藥不是吞下去，是說出來。</strong></p><p>「一無掛慮」最容易被讀成一道禁令：你若還在擔心，就是信心不夠。可是保羅自己會擔心。他說「為眾教會掛心的事，天天壓在我身上」（林後 11:28），他坦白說以巴弗提病了，若不是神憐恤，他要「憂上加憂」（2:27）。他稱讚提摩太「實在掛念你們的事」（2:20），用的正是 4:6 同一個字。所以 4:6 不是叫人沒有感覺，是告訴人感覺該往哪裡去：不要讓它在心裡繞圈，要「將你們所要的告訴神」——一件一件，具體地說，連同感謝一起說。</p><p>這一點對今天的教會非常要緊。焦慮症、憂鬱症是需要治療的病，不是信心的成績單。就醫、吃藥、接受專業諮商，與禱告並不衝突，正如以巴弗提病了，保羅沒有說他信心不足，也沒有說他不該接受照顧。對一位正在受焦慮折磨的弟兄姊妹說「你多禱告就好了，不用看醫生」，是把 4:6 用錯了。4:6 給的是一條出口，不是一張罰單。</p><p>然後是應許：「神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。」（4:7）請注意次序——經文沒有說問題會先解決，而是說心先被保守。寫信的人門外就站著羅馬兵；他說，神的平安也像駐軍，站在你的心門口，不讓掛慮衝進來佔領。那平安「出人意外」，因為它不靠理解處境：處境還沒有改變，心已經被守住了。</p><p>被保守的不只是心，也有「意念」。321 說「用心靠聖靈不要用腦靠自己」，這裡讓我們看見它的真意：不是不用腦，是讓腦也住進平安的保護之下。一個被平安守住的人，仍然會計畫、會求醫、會找人商量，只是他不再被恐懼驅趕。下一節，保羅就要告訴我們，被守住的意念該想甚麼。</p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·</p>","lit":"<p>此外，弟兄們，凡是真實的，凡是可敬的，凡是公義的，凡是清潔的，凡是可愛的，凡是有美名的，若有甚麼德行，若有甚麼稱讚，這些你們要算進去。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τὸ λοιπόν</td><td>To loipon</td><td>此外、末了</td><td>3:1 用過一次；轉入收尾的勸勉</td></tr><tr><td>ὅσα ἐστὶν ἀληθῆ</td><td>hosa estin alēthē</td><td>凡是真實的</td><td>六個 ὅσα 的第一個</td></tr><tr><td>σεμνά</td><td>semna</td><td>可敬的、莊重的</td><td>值得尊敬的</td></tr><tr><td>ἁγνά</td><td>hagna</td><td>清潔的</td><td>沒有摻雜的</td></tr><tr><td>προσφιλῆ</td><td>prosphilē</td><td>可愛的</td><td>討人喜歡的；新約只此一處</td></tr><tr><td>εὔφημα</td><td>euphēma</td><td>有美名的</td><td>說出來好聽的；新約只此一處</td></tr><tr><td>εἴ τις ἀρετὴ</td><td>ei tis aretē</td><td>若有甚麼德行</td><td>希臘倫理學的核心字</td></tr><tr><td>ταῦτα λογίζεσθε</td><td>tauta logizesthe</td><td>這些要算進去</td><td>現在式命令；會計用字</td></tr></table>","gram":"<p><strong>4:8 是六個 ὅσα（hosa） 加兩個 εἴ τις（ei tis），最後只有一個動詞：ταῦτα λογίζεσθε（tauta logizesthe）。</strong></p><p>六個形容詞都是中性複數：ἀληθῆ（alēthē）、σεμνά（semna）、δίκαια（dikaia）、ἁγνά（hagna）、προσφιλῆ（prosphilē）、εὔφημα（euphēma）。其中 προσφιλῆ（prosphilē） 與 εὔφημα（euphēma） 在新約只出現這一次；ἀρετὴ（aretē） 在保羅書信也只此一處，那是希臘哲學講「美德」的核心字。保羅借用了腓立比街坊都聽得懂的道德語言，表示世人所公認的美好，信徒不必排斥；但它們要被放進 4:7「在基督耶穌裡」的框架裡來衡量。</p><p>λογίζεσθε（logizesthe） 是本章追蹤字的站點。λογίζομαι（logizomai） 原是會計字：計算、記入帳上。3:13 保羅說 ἐγὼ ἐμαυτὸν οὐ λογίζομαι κατειληφέναι（egō emauton ou logizomai kateilēphenai），我不以為自己已經得著了。全卷「看、算、想」三條線——ἡγέομαι（hēgeomai）、λογίζομαι（logizomai）、φρονέω（phroneō）——在這一節會合：你把甚麼算進心裡，你就會成為甚麼樣的人。</p><p>Τὸ λοιπόν（To loipon） 在 3:1 已出現過一次，有學者據此主張第 3 章以後是另一封信的開頭；本講義在第 3 章已交代全卷完整性的討論，這裡只指出：Τὸ λοιπόν（To loipon） 在保羅筆下常是「此外」的轉折，不一定是「最後一句」。</p>","exp":"<p><strong>「凡是真實的……這些事你們都要思念。」（4:8）第一個字是「真實的」。</strong></p><p>4:8 常被拿來當「正向思考」的經文：只想好的，壞事就不會發生；心想就會事成。這不是保羅的意思。清單的第一項是「真實的」——不是「愉快的」，也不是「順利的」。真實包括 3:18 的眼淚、2:27 的病、1:17 的惡意。思念真實的事，就是不假裝沒事；面對現實，再把現實放在神面前看。吸引力法則叫人用意念操控結果；4:8 叫人用意念對準神所看重的事。</p><p>「思念」原文是一個會計字：算進去、記入帳上。我們每天的心思都在記帳——記下別人的冒犯、記下自己的失敗、記下網路上一則又一則的壞消息。保羅說，你要選擇記甚麼。不是不記壞帳，而是不要讓帳本上只剩壞帳。可敬的、公義的、清潔的、可愛的、有美名的——這些在你的家、你的教會、甚至在不信主的同事身上，都找得到，只是我們很少把它們記下來。</p><p>這一節緊接在 4:7 之後：平安守住了心懷意念，意念就要開始做功課。321 說「改變觀點就能改變觀念」，3:7--8 保羅把自己的資歷從資產欄搬到負債欄；4:8 則教我們每天在帳本上記下甚麼。一個人長期把甚麼算進心裡，他就會長成甚麼樣子。</p><p>兩位不和的姊妹若照這一節做，會發生甚麼？她們會開始在對方身上找「可敬的」「可愛的」，而不只記得對方說錯的那一句話。4:8 不是一節孤立的金句，它是 4:2 的處方之一。</p>"},{"a":9,"z":9,"star":1,"grk":"<p lang=\"grc\">ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθʼ ὑμῶν.</p>","lit":"<p>那些你們也學了、也領受了、也聽見了、也在我身上看見了的，這些你們要去行；而那平安的神將與你們同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐμάθετε καὶ παρελάβετε</td><td>emathete kai parelabete</td><td>你們學了、領受了</td><td>老師傳授、學生接過來</td></tr><tr><td>ἠκούσατε καὶ εἴδετε</td><td>ēkousate kai eidete</td><td>你們聽見了、看見了</td><td>從話語到生活</td></tr><tr><td>ἐν ἐμοί</td><td>en emoi</td><td>在我身上</td><td>四個動詞都以保羅為教材</td></tr><tr><td>ταῦτα πράσσετε</td><td>tauta prassete</td><td>這些要去行</td><td>現在式命令：持續地做</td></tr><tr><td>ὁ θεὸς τῆς εἰρήνης</td><td>ho theos tēs eirēnēs</td><td>賜平安的神</td><td>4:7 是神的平安，4:9 是平安的神</td></tr></table>","gram":"<p><strong>4:8 以 ταῦτα λογίζεσθε（tauta logizesthe） 收尾，4:9 以 ταῦτα πράσσετε（tauta prassete） 收尾：兩個 ταῦτα（tauta） 排成一對，從「想」走到「做」。</strong></p><p>四個不定過去式動詞兩兩成組：ἐμάθετε καὶ παρελάβετε（emathete kai parelabete） 是教導與傳承，παρελάβετε（parelabete） 是保羅講傳承的專門字；ἠκούσατε καὶ εἴδετε（ēkousate kai eidete） 是耳聞與目睹。四個動詞共用一個 ἐν ἐμοί（en emoi）：保羅自己就是教材。這接續 3:17「你們要一同效法我」（3:17）。</p><p>4:7 說 ἡ εἰρήνη τοῦ θεοῦ（hē eirēnē tou theou），4:9 說 ὁ θεὸς τῆς εἰρήνης（ho theos tēs eirēnēs）。屬格倒過來，從禮物走到賜禮物的那一位：4:7 平安保守你，4:9 平安的神與你同在。一個應許比前一個更大。</p>","exp":"<p><strong>「這些事你們都要去行，賜平安的神就必與你們同在。」（4:9）想對了，還要走出來。</strong></p><p>321 的「改變觀念八大步驟」，在這一節排得很清楚：所「學習」的、所「領受」的、所「聽見」的，是資訊；所「看見」的，是一個活生生的榜樣；最後是「去行」——實踐。腓立比人不是從講義學信仰的，是從一個在他們城裡被打、被關、半夜唱詩的人身上學的。信仰的傳承需要話語，也需要一個看得見的生命。</p><p>保羅敢說「在我身上」，不是因為他完全。3:12 他才說過「這不是說我已經得著了，已經完全了」（3:12）。他敢說，是因為他把自己追求的方向攤開給人看：他怎樣把資歷當作有損的，怎樣在捆鎖中喜樂，怎樣處理教會裡的不和。榜樣不是完美，是透明。林前 11:1 說得更準：「你們該效法我，像我效法基督一樣。」（林前 11:1）效法的終點永遠是基督，不是傳道人本身。</p><p>應許也往前推了一步。4:7 說神的平安保守你；4:9 說平安的神與你同在。前者是禮物，後者是送禮物的那一位親自來。照著做的人，得的不只是平安的感覺，是一位同行的神。</p>"},{"a":10,"z":11,"star":2,"grk":"<p lang=\"grc\">Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφʼ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.</p><p lang=\"grc\">οὐχ ὅτι καθʼ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·</p>","lit":"<p>而我在主裡大大地喜樂了，因為如今你們終於又開花了，為我著想；你們本來就在著想，只是沒有機會。</p><p>不是說我照著缺乏而說，因為我已經學會了，在我所處的景況中都是自足的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐχάρην δὲ ἐν κυρίῳ μεγάλως</td><td>Echarēn de en kyriō megalōs</td><td>我在主裡大大地喜樂了</td><td>不定過去式：收到餽送那一刻</td></tr><tr><td>ἀνεθάλετε</td><td>anethalete</td><td>你們又開花了</td><td>植物發芽、重新開花的字</td></tr><tr><td>τὸ ὑπὲρ ἐμοῦ φρονεῖν</td><td>to hyper emou phronein</td><td>為我著想的心</td><td>全卷鑰字 φρονέω 用在奉獻上</td></tr><tr><td>ἠκαιρεῖσθε</td><td>ēkaireisthe</td><td>你們沒有機會</td><td>字根 καιρός：時機不對</td></tr><tr><td>καθʼ ὑστέρησιν</td><td>kath' hysterēsin</td><td>照著缺乏</td><td>不是因為缺乏才這樣說</td></tr><tr><td>ἔμαθον</td><td>emathon</td><td>我學會了</td><td>不定過去式：一段經歷的成果</td></tr><tr><td>αὐτάρκης</td><td>autarkēs</td><td>自足的</td><td>斯多葛派的理想字；新約只此一處</td></tr></table>","gram":"<p><strong>4:10 是全信最遲來的「謝謝」，而且保羅用的動詞不是 εὐχαριστῶ（eucharistō），是 Ἐχάρην δὲ ἐν κυρίῳ μεγάλως（Echarēn de en kyriō megalōs）。</strong></p><p>學者注意到，這封感謝信裡，保羅從沒有直接說「謝謝你們的錢」。有人稱之為「沒有道謝的謝函」，推測是當時友誼與恩惠的習俗——受人恩惠者若明說感謝，等於承認欠了人情債；也有人認為保羅故意把感謝轉向神（1:3 他已為他們「感謝我的神」）。本講義採後者為主：他的喜樂是 ἐν κυρίῳ（en kyriō），他看見的不是一筆錢，是一群人的心又開花了。</p><p>ἀνεθάλετε（anethalete） 是農作字：枯過一季的樹又冒出新芽。保羅馬上補一句 ἐφʼ ᾧ καὶ ἐφρονεῖτε（eph' hō kai ephroneite），ἠκαιρεῖσθε δέ（ēkaireisthe de）——你們其實一直有這份心，只是 ἠκαιρεῖσθε（ēkaireisthe），缺一個時機。他不讓讀信的人覺得被責怪遲了。φρονεῖν（phronein） 在這裡又出現：為保羅「著想」，與 2:5 以基督的心為心是同一個字。奉獻是 φρονέω（phroneō） 的一種形狀。</p><p>4:11 的 οὐχ ὅτι（ouch hoti） 是防誤會的句式（4:17 會再用一次）。αὐτάρκης（autarkēs） 是斯多葛哲學的招牌：一個不受外物左右、自給自足的人。保羅借用這個字，卻換掉了它的心——斯多葛的自足靠自己，保羅的自足在 4:13 有答案：ἐν τῷ ἐνδυναμοῦντί με（en tō endynamounti me）。ἔμαθον（emathon） 是不定過去式，指一段學習的結果，不是天生的性情。</p>","exp":"<p><strong>「我並不是因缺乏說這話；我無論在甚麼景況都可以知足，這是我已經學會了。」（4:11）知足是一門課，不是一個開關。</strong></p><p>保羅收到了腓立比人的餽送，心裡「大大地喜樂」。他喜樂的不是錢，是「你們思念我的心如今又發生」（4:10）——一份停了一陣子的愛，又開花了。他連一句責怪也沒有：「你們向來就思念我，只是沒得機會。」好的感謝不會讓給的人覺得被算帳。</p><p>然後他怕人誤會：我說這些，不是在暗示我還缺。這是一位很少開口要錢的宣教士的分寸。接著他說出全卷第四篇的鑰句：「我無論在甚麼景況都可以知足」。這個字是當時哲學家最愛的理想：一個人修練到不需要任何外物。保羅借了字，換了心。哲學家的知足是把自己變成一座孤島；保羅的知足，是有一位主一路供應，所以有也好、沒有也好，他都站得住。</p><p>最安慰人的兩個字是「學會了」。保羅不是天生知足的人，他是在一次又一次的飽足與缺乏中學出來的。所以，一個還在為收入、房貸、病痛焦慮的人，不必因為還沒學會而自責；學習本來就需要時間，需要失敗，也需要一位老師。</p><p>也要分清楚：知足不是放棄一切合理的追求。保羅「知道怎樣處豐富」（4:12），他也在羅馬公堂上用公民權保護自己。知足不等於叫勞工不能爭取應得的工資，也不等於叫人留在不安全的處境。知足是心不被處境綁架，不是叫人對不公沉默。</p>"},{"a":12,"z":13,"star":3,"grk":"<p lang=\"grc\">οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·</p><p lang=\"grc\">πάντα ἰσχύω ἐν τῷ ἐνδυναμοῦντί με</p>","lit":"<p>我知道怎樣被降低，也知道怎樣有餘；在每一件事上和在一切事上，我已被引入了秘訣：吃飽和挨餓，有餘和缺乏。</p><p>一切事我都有力量應付，在那加給我力量的裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἶδα καὶ ταπεινοῦσθαι</td><td>oida kai tapeinousthai</td><td>我也知道怎樣被降低</td><td>與 2:8 ἐταπείνωσεν 同一個動詞 ταπεινόω</td></tr><tr><td>οἶδα καὶ περισσεύειν</td><td>oida kai perisseuein</td><td>我也知道怎樣有餘</td><td>知足不是拒絕豐富</td></tr><tr><td>ἐν παντὶ καὶ ἐν πᾶσιν</td><td>en panti kai en pasin</td><td>在每一件、在一切事上</td><td>隨事隨在</td></tr><tr><td>μεμύημαι</td><td>memyēmai</td><td>我已被引入奧秘</td><td>完成式被動；神秘宗教入門禮的字</td></tr><tr><td>χορτάζεσθαι καὶ πεινᾶν</td><td>chortazesthai kai peinan</td><td>吃飽和挨餓</td><td>三組對句的第二組</td></tr><tr><td>ὑστερεῖσθαι</td><td>hystereisthai</td><td>缺乏</td><td>與 4:11 ὑστέρησιν 同字根</td></tr><tr><td>πάντα ἰσχύω</td><td>panta ischyō</td><td>一切事我都有力量</td><td>πάντα 提前，回指 4:12 的清單</td></tr><tr><td>ἐν τῷ ἐνδυναμοῦντί με</td><td>en tō endynamounti me</td><td>在那一直加給我力量的裡面</td><td>現在分詞：力量是持續供應的</td></tr></table>","gram":"<p><strong>4:12 是三組對句，4:13 是一句結論；而 4:12 的第一個動詞 ταπεινοῦσθαι（tapeinousthai），正是 2:8 基督「自己卑微」的 ἐταπείνωσεν（etapeinōsen）。</strong></p><p>三組對句：ταπεινοῦσθαι（tapeinousthai）／περισσεύειν（被降低／有餘），χορτάζεσθαι καὶ πεινᾶν（吃飽／挨餓），περισσεύειν καὶ ὑστερεῖσθαι（有餘／缺乏）。中間夾著 ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι（en panti kai en pasin memyēmai）。μεμύημαι（memyēmai） 是 μυέω（myeō） 的完成式被動，原是神秘宗教入門禮的專門字：一個人被帶進一個只有入門者才知道的秘密。保羅用了這個字，他的「秘訣」卻不是一套儀式，是 4:13 的一位。</p><p>ταπεινόω（tapeinoō） 這個字群在全卷出現四次：2:3 τῇ ταπεινοφροσύνῃ（tē tapeinophrosynē），2:8 ἐταπείνωσεν ἑαυτὸν（etapeinōsen heauton），3:21 卑賤的身體，4:12 ταπεινοῦσθαι（tapeinousthai）。基督往下走（2:8），神將他升為至高（2:9）；保羅「處卑賤」（4:12），然後說 πάντα ἰσχύω（4:13）。地勢圖上 4:12（30）緊挨 4:13（94），是 2:8--9 的小型重演。保羅在 4:11 說 ἔμαθον（emathon），他學會的，就是第 2 章基督走過的形狀。</p><p>4:13 的 πάντα（panta） 是受詞放在句首，強調「這一切」；在上下文裡它指的就是 4:12 剛列出的那些處境。ἰσχύω（ischyō） 是「有力量應付」。ἐν τῷ ἐνδυναμοῦντί με（en tō endynamounti me） 是現在分詞，力量不是一次存進去的，是一直被加給的。提前 1:12 有幾乎相同的話：τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ（tō endynamōsanti me Christō Iēsou）。</p><p><strong>◆ 經文鑑別 4:13</strong>：SBLGNT 作 ἐν τῷ ἐνδυναμοῦντί με（en tō endynamounti me），沒有「基督」；RP（拜占庭本）在句末有 Χριστῷ（Christō），英文 KJV 因此作 through Christ which strengtheneth me。和合本「那加給我力量的」跟批判本。本講義的判斷：較短的讀法較早、較有力，抄寫者把「那一位」明說成「基督」比反過來刪掉容易得多；但兩種讀法意思相同，4:10「我靠主」、提前 1:12 都表明那加給力量的就是基督。講台上讀哪一個版本都不改變信息。</p>","exp":"<p><strong>「我知道怎樣處卑賤，也知道怎樣處豐富；或飽足，或飢餓；或有餘，或缺乏，隨事隨在，我都得了秘訣。」（4:12）秘訣不是一個方法，是一個人。</strong></p><p>保羅列出他的履歷，不是成就，是處境：卑賤、豐富、飽足、飢餓、有餘、缺乏。他兩邊都經歷過。有餘是一種試探，缺乏是另一種；很多人在缺乏時禱告，在有餘時忘了神。保羅說，兩邊他都學會了。「得了秘訣」是當時神秘宗教入門的用語：別人花錢參加儀式，想知道人生的秘密；保羅說，我也被帶進了一個秘密，而那個秘密是一位主。</p><p>這就帶出全卷最常被引用、也最常被誤用的一句：「我靠著那加給我力量的，凡事都能做。」（4:13）這句話被印在球衣上、考卷上、創業計畫書上，好像在說：有神幫忙，我想做甚麼都能成功。可是緊接在前面的是「或飽足，或飢餓；或有餘，或缺乏」。保羅說的「凡事」，就是這張清單：餓肚子的時候我也能撐下去，缺乏的時候我也能知足，被降到最低的時候我也不會失去自己。4:13 是知足的力量，不是必勝的保證。</p><p>所以，一位考試落榜的學生、一位比賽輸了的運動員、一位生意失敗的弟兄，同樣可以讀 4:13，而且讀得最準：「凡事都能做」包括失敗以後仍然知足、仍然站得住、仍然不離開主。若把 4:13 講成「信心夠就一定贏」，輸了的人就只剩下「我信心不夠」的罪疚——那正好把經文講反了。</p><p>更深的一層在動詞裡。「處卑賤」和第 2 章基督「自己卑微」是同一個字。基督往下走，神將他升為至高；保羅往下走，主加給他力量。保羅在監裡學會的，就是基督走過的那條路。這就是全卷「從活著就是基督到凡事都能做」的終點：靠主的人可以在飢餓與缺乏中仍然知足，因為他的力量不在處境，在那一位「一直加給」他力量的主。321 所說的「得勝者」，以此為準——不是凡事都成功的人，是在缺乏中仍然站得住的人。</p>"},{"a":14,"z":16,"star":2,"grk":"<p lang=\"grc\">πλὴν καλῶς ἐποιήσατε συγκοινωνήσαντές μου τῇ θλίψει.</p><p lang=\"grc\">Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,</p><p lang=\"grc\">ὅτι καὶ ἐν Θεσσαλονίκῃ καὶ ἅπαξ καὶ δὶς εἰς τὴν χρείαν μοι ἐπέμψατε.</p>","lit":"<p>然而你們做得好，與我的患難一同有分。</p><p>而你們自己也知道，腓立比人哪，在福音的起頭，當我從馬其頓出去的時候，沒有一個教會在給與受的帳目上與我合夥，只有你們而已；</p><p>因為就是在帖撒羅尼迦，你們也一次又兩次地差人送來，為我的需用。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πλὴν καλῶς ἐποιήσατε</td><td>plēn kalōs epoiēsate</td><td>然而你們做得好</td><td>πλήν 把話拉回來：我知足，但你們的愛不是多餘的</td></tr><tr><td>συγκοινωνήσαντές μου τῇ θλίψει</td><td>synkoinōnēsantes mou tē thlipsei</td><td>與我的患難一同有分</td><td>κοινωνία 字群；1:7 συγκοινωνούς</td></tr><tr><td>Φιλιππήσιοι</td><td>Philippēsioi</td><td>腓立比人哪</td><td>拉丁化的稱呼；殖民城的自我認同</td></tr><tr><td>ἐκοινώνησεν</td><td>ekoinōnēsen</td><td>一同有分、合夥</td><td>κοινωνία 的動詞</td></tr><tr><td>εἰς λόγον δόσεως καὶ λήμψεως</td><td>eis logon doseōs kai lēmpseōs</td><td>在給與收的帳目上</td><td>商業記帳用語</td></tr><tr><td>καὶ ἅπαξ καὶ δὶς</td><td>kai hapax kai dis</td><td>一次、兩次</td><td>成語：不只一次</td></tr><tr><td>εἰς τὴν χρείαν</td><td>eis tēn chreian</td><td>為了需用</td><td>4:19 會再用同一個字</td></tr></table>","gram":"<p><strong>4:14 以 πλὴν（plēn） 轉回：保羅剛說完自己知足，立刻不讓這句話把腓立比人的愛說成多餘。</strong></p><p>συγκοινωνήσαντές（synkoinōnēsantes） 是 κοινωνία（koinōnia） 字群再加上表示「一同」的前綴，意思是一同有分，受詞是 τῇ θλίψει（tē thlipsei）：他們分擔的不是一筆開銷，是保羅的患難。1:5 說 ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον（epi tē koinōnia hymōn eis to euangelion），1:7 說他們都是 συγκοινωνούς μου τῆς χάριτος（synkoinōnous mou tēs charitos）。全卷的 κοινωνία（koinōnia） 是一條合夥的線：與福音合夥、與恩典合夥、與患難合夥。</p><p>4:15 的稱呼 Φιλιππήσιοι（Philippēsioi） 是拉丁化的形式，近於拉丁文 Philippenses；這是殖民城居民對自己羅馬身分的稱法。保羅用他們自己喜歡的名字叫他們，然後提一段只屬於他們的歷史。εἰς λόγον δόσεως καὶ λήμψεως（eis logon doseōs kai lēmpseōs） 是記帳的語言：「給與受的帳戶」。λήμψεως（lēmpseōs） 在 SBLGNT 原檔緊接異文標記，未標 Strong 編號，字形本身無誤。保羅說，在這個帳戶上，ἐκοινώνησεν（ekoinōnēsen） 的只有 ὑμεῖς μόνοι（hymeis monoi）。</p><p>4:16 καὶ ἅπαξ καὶ δὶς（kai hapax kai dis） 是成語，「不只一兩次」。這與使徒行傳的時間表吻合：保羅離開腓立比，到帖撒羅尼迦只停留了「三個安息日」左右（徒 17:2），腓立比人卻已經送了不只一次。林後 11:9 也記得馬其頓弟兄的補足。</p>","exp":"<p>〔背景〕徒 16:40；徒 17:1--9（使徒行傳講義第 16、17 章）</p><p><strong>「然而，你們和我同受患難原是美事。」（4:14）知足的人，仍然會說「謝謝你們陪我」。</strong></p><p>保羅剛剛說他在任何景況都知足，下一句卻說：你們的幫助是美事。這是一個健康的人的樣子。知足不是說「我不需要任何人」；那是驕傲，不是知足。保羅會說出需要，也會收下別人的愛。他把那份餽送稱為「同受患難」——他們送來的不只是錢，是一份陪伴：你在監裡，我們和你一起在監裡。</p><p>然後他翻開一本舊帳簿。使徒行傳講義第 16、17 章講過那段路：保羅和西拉出了腓立比的監，「往呂底亞家裡去，見了弟兄們，勸慰他們一番，就走了」（徒 16:40）；接著到了帖撒羅尼迦，三個安息日之後，城裡就起了亂子（徒 17:5--9）。就在那短短幾週裡，腓立比這間剛剛出生、身上還帶著逼迫傷痕的教會，已經「一次兩次地打發人供給我的需用」（4:16）。保羅記得，「除了你們以外，並沒有別的教會供給我」（4:15）。他在哥林多也說：「因我所缺乏的，那從馬其頓來的弟兄們都補足了」（林後 11:9）。</p><p>「授受」是記帳的字。保羅不迴避錢的話題，也不把它講成交易；他說這是一個合夥的帳戶：你們出錢，我出力，福音是我們共同的事業。傳道人可以接受供給嗎？主「叫傳福音的靠著福音養生」（林前 9:14），保羅也常常自己做工以免累著人——兩者都在他身上，這一題在議題頁展開。</p><p>今天的腓立比教會在哪裡？就是那些自己也不寬裕，卻多年默默支持一位宣教士、一個植堂點的小教會。他們的名字很少出現在報告上，但保羅記得是「頭一天」就開始的，神也記得。</p>"},{"a":17,"z":18,"star":1,"grk":"<p lang=\"grc\">οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.</p><p lang=\"grc\">ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρʼ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.</p>","lit":"<p>不是說我尋求那禮物，而是我尋求那不斷增多、記入你們帳上的果子。</p><p>而我一切都已收足了，並且有餘；我已被充滿了，從以巴弗提收到了你們那裡來的東西，是馨香的氣味，是蒙悅納的祭物，是神所喜悅的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐχ ὅτι ἐπιζητῶ τὸ δόμα</td><td>ouch hoti epizētō to doma</td><td>不是我要求禮物</td><td>與 4:11 同樣的 οὐχ ὅτι 防誤會</td></tr><tr><td>τὸν καρπὸν τὸν πλεονάζοντα</td><td>ton karpon ton pleonazonta</td><td>那不斷增多的果子</td><td>利息不斷累積</td></tr><tr><td>εἰς λόγον ὑμῶν</td><td>eis logon hymōn</td><td>記在你們的帳上</td><td>4:15 的帳目字再出現</td></tr><tr><td>ἀπέχω</td><td>apechō</td><td>我已收足</td><td>商業收據用語：款項付清</td></tr><tr><td>πεπλήρωμαι</td><td>peplērōmai</td><td>我已被充滿</td><td>完成式被動；4:19 πληρώσει 的伏筆</td></tr><tr><td>ὀσμὴν εὐωδίας</td><td>osmēn euōdias</td><td>馨香的氣味</td><td>七十士譯本獻祭用語</td></tr><tr><td>θυσίαν δεκτήν</td><td>thysian dektēn</td><td>蒙悅納的祭物</td><td>奉獻被提升為敬拜</td></tr></table>","gram":"<p><strong>4:17--18 用兩套語言說同一份禮物：先是會計帳（δόμα（doma）、καρπὸν（karpon）、λόγον（logon）、ἀπέχω（apechō）），然後是聖殿的祭壇（ὀσμὴν εὐωδίας（osmēn euōdias）、θυσίαν δεκτήν（thysian dektēn）、εὐάρεστον（euareston））。</strong></p><p>οὐχ ὅτι ἐπιζητῶ τὸ δόμα（ouch hoti epizētō to doma），ἀλλὰ ἐπιζητῶ τὸν καρπὸν（alla epizētō ton karpon）——同一個動詞重複，受詞從「禮物」換成「果子」。τὸν πλεονάζοντα εἰς λόγον ὑμῶν（ton pleonazonta eis logon hymōn） 是金融比喻：像存款生利息，增長記在你們自己的帳戶上。ἀπέχω（apechō） 在當時的收據上常見，意思是「款項已全數收訖」。</p><p>ὀσμὴν εὐωδίας（osmēn euōdias） 是七十士譯本講燔祭的固定說法，這使我們想起出 29:18「獻給耶和華為馨香的火祭」（出 29:18）。弗 5:2 用同一片語說基督的捨己「當作馨香的供物和祭物」（弗 5:2）；2:17 保羅也說自己被澆奠在他們信心的祭物上。奉獻被放在基督與保羅的同一座祭壇上。</p>","exp":"<p><strong>「我並不求甚麼餽送，所求的就是你們的果子漸漸增多，歸在你們的帳上。」（4:17）保羅在乎的不是錢，是人。</strong></p><p>這一句是講奉獻最需要聽的一句。保羅收了錢，卻說他求的不是錢；他求的是給的人自己在神面前的果子增多。換句話說，奉獻最大的得益者，不是收的人，是給的人——不是因為給了會賺回更多錢，而是因為一顆願意給的心，本身就是神所喜悅的果子。321 說「人比事重要」，保羅連收奉獻都在看人。</p><p>接著他寫了一張收據：「但我樣樣都有，並且有餘。我已經充足」（4:18）。一個坐監的人說自己「樣樣都有」，這是 4:11 的知足活出來了。然後收據變成了祭壇：這份餽送是「極美的香氣，為神所收納、所喜悅的祭物」。腓立比人以為他們是寄錢給保羅，保羅告訴他們：你們其實是在向神獻祭。教會裡最平凡的一次奉獻，在神面前是馨香的敬拜。</p>"},{"a":19,"z":20,"star":2,"grk":"<p lang=\"grc\">ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ τὸ πλοῦτος αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.</p><p lang=\"grc\">τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.</p>","lit":"<p>而我的神必照著他在榮耀中的豐富，在基督耶穌裡，充滿你們一切的需用。</p><p>願榮耀歸給我們的神和父，直到眾世代的世代。阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ δὲ θεός μου</td><td>ho de theos mou</td><td>而我的神</td><td>個人的稱呼：我所認識的那一位</td></tr><tr><td>πληρώσει</td><td>plērōsei</td><td>必充滿</td><td>未來式直說語氣：應許，不是條件</td></tr><tr><td>πᾶσαν χρείαν ὑμῶν</td><td>pasan chreian hymōn</td><td>你們一切的需用</td><td>需要，不是想要；4:16 保羅的 χρείαν</td></tr><tr><td>κατὰ τὸ πλοῦτος αὐτοῦ</td><td>kata to ploutos autou</td><td>照著他的豐富</td><td>κατά：照著，不是「從中撥一點」</td></tr><tr><td>ἐν δόξῃ</td><td>en doxē</td><td>在榮耀中</td><td>豐富的性質是榮耀</td></tr><tr><td>εἰς τοὺς αἰῶνας τῶν αἰώνων</td><td>eis tous aiōnas tōn aiōnōn</td><td>直到眾世代的世代</td><td>永永遠遠</td></tr></table>","gram":"<p><strong>4:18 πεπλήρωμαι（peplērōmai），4:19 πληρώσει（plērōsei）：保羅說「我被充滿了」，下一節說「我的神必充滿你們」——同一個動詞，從保羅的帳戶移到腓立比人的帳戶。</strong></p><p>χρεία（chreia） 在這封信裡串起一條線：2:25 以巴弗提是 λειτουργὸν τῆς χρείας μου（leitourgon tēs chreias mou），4:16 腓立比人供給 εἰς τὴν χρείαν μοι（eis tēn chreian moi），4:19 神要充滿 πᾶσαν χρείαν ὑμῶν（pasan chreian hymōn）。他們照顧了保羅的需用，神要照顧他們的需用。這是應許，用的是未來式直說語氣，不是「如果你們……神就……」的條件句。</p><p>κατὰ τὸ πλοῦτος αὐτοῦ ἐν δόξῃ（kata to ploutos autou en doxē） 說明供應的尺度：不是從神的豐富裡撥出一點，是「照著」那豐富的規模。4:20 的頌讚緊接著把話題從錢轉向敬拜：ὁ θεός μου（4:19）擴大成 τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν（4:20），「我的神」成了「我們的父」。ἡ δόξα（hē doxa） 呼應 2:11 εἰς δόξαν θεοῦ πατρός（eis doxan theou patros）——全卷 321 第二個核心「使榮耀歸與父神」，在這裡再出現一次。</p>","exp":"<p><strong>「我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。」（4:19）這是對一間窮教會說的話。</strong></p><p>這一節常被讀成一條投資公式：你奉獻得越多，神就越使你富足。可是上下文正好相反。腓立比是馬其頓的教會，保羅在哥林多後書描寫過馬其頓眾教會：「在極窮之間還格外顯出他們樂捐的厚恩」（林後 8:2）。這不是一間有錢的教會在投資，是一間已經為福音奉獻到很窮的教會。保羅對他們說：你們顧了我的需要，我的神必顧你們的需要。</p><p>而且經文說的是「所需用的」，不是「所想要的」。神應許的是需要被供應，不是慾望被滿足；保羅自己在 4:12 就經歷過飢餓與缺乏，他沒有把那些日子說成神的失信。成功神學說「奉獻換富足」，本講義明確不採：4:17 保羅自己說「我並不求甚麼餽送」，他不會把奉獻講成一張回報的保單。4:19 是一位父親對孩子的承諾，不是一家銀行對客戶的利息表。</p><p>供應的尺度是「他榮耀的豐富」，供應的管道是「在基督耶穌裡」。然後保羅停下來，不再談錢，開始頌讚：「願榮耀歸給我們的父神，直到永永遠遠。阿們！」（4:20）談奉獻的段落以敬拜收尾，這本身就是一個教導：錢的話題若不能讓人更愛神，就是談錯了方向。321 的「讓耶穌得著一切的榮耀」，在這裡落在一筆餽送上。</p>"},{"a":21,"z":23,"star":2,"grk":"<p lang=\"grc\">Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.</p><p lang=\"grc\">ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.</p><p lang=\"grc\">ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν</p>","lit":"<p>你們要在基督耶穌裡問候每一位聖徒。與我在一起的弟兄們問候你們。</p><p>眾聖徒都問候你們，特別是那些出自凱撒家的人。</p><p>主耶穌基督的恩典與你們的靈同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀσπάσασθε πάντα ἅγιον</td><td>Aspasasthe panta hagion</td><td>要問候每一位聖徒</td><td>單數：一個一個地問候</td></tr><tr><td>οἱ σὺν ἐμοὶ ἀδελφοί</td><td>hoi syn emoi adelphoi</td><td>與我在一起的弟兄</td><td>身邊的同工</td></tr><tr><td>μάλιστα δὲ</td><td>malista de</td><td>特別是</td><td>保羅把這一群人放在最後強調</td></tr><tr><td>οἱ ἐκ τῆς Καίσαρος οἰκίας</td><td>hoi ek tēs Kaisaros oikias</td><td>那些出自凱撒家的人</td><td>皇室的奴僕、自由人與官員</td></tr><tr><td>μετὰ τοῦ πνεύματος ὑμῶν</td><td>meta tou pneumatos hymōn</td><td>與你們的靈同在</td><td>和合本意譯「常在你們心裡」</td></tr></table>","gram":"<p><strong>4:21 的 πάντα ἅγιον（panta hagion） 是單數：不是「眾聖徒」一個籠統的集合，是「每一位聖徒」——包括友阿蝶，也包括循都基。</strong></p><p>全卷開頭寫給 πᾶσιν τοῖς ἁγίοις（1:1），結尾卻用單數 πάντα ἅγιον（panta hagion），一個一個點過去。οἱ ἐκ τῆς Καίσαρος οἰκίας（hoi ek tēs Kaisaros oikias） 不是皇帝的親屬，是羅馬帝國行政體系裡的皇室家僕、自由人與文職人員，散布在帝國各大城。所以這句話支持寫於羅馬的說法，但不能單獨證明（以弗所、該撒利亞也有皇室家僕）；它與 1:13 ἐν ὅλῳ τῷ πραιτωρίῳ（en holō tō praitōriō） 一起看，羅馬說最自然。</p><p><strong>◆ 經文鑑別 4:23</strong>：SBLGNT 作 μετὰ τοῦ πνεύματος ὑμῶν（meta tou pneumatos hymōn），「與你們的靈同在」；RP（拜占庭本）作 μετὰ πάντων ὑμῶν（meta pantōn hymōn），「與你們眾人同在」，句末另有 ἀμήν（amēn）。本講義採 SBLGNT：較早的抄本支持「靈」，而且加 6:18 與門 25 都以同樣的 μετὰ τοῦ πνεύματος ὑμῶν（meta tou pneumatos hymōn） 收尾；「與你們眾人」是保羅書信更常見的結語（帖後 3:18 μετὰ πάντων ὑμῶν（meta pantōn hymōn）），抄寫者容易順手改成熟悉的句子。注意 ὑμῶν（hymōn） 是複數，πνεύματος（pneumatos） 是單數：眾人共有「一個靈」的層面，也可以讀作每一個人的靈。和合本「常在你們心裡」是意譯，把「靈」譯成「心」，意思是恩典與人最裡面的生命同在；講台上可以照和合本讀，但要知道原文寫的是靈。</p><p>全卷以恩開頭（1:2 χάρις ὑμῖν（charis hymin）），以恩結尾（4:23 ἡ χάρις（hē charis））；中間 1:7 說他們都與保羅 συγκοινωνούς μου τῆς χάριτος（synkoinōnous mou tēs charitos）。</p>","exp":"<p><strong>「眾聖徒都問你們安。在凱撒家裡的人特特地問你們安。」（4:22）鎖鍊沒有鎖住福音，它走進了皇帝的家。</strong></p><p>信的最後幾句是問安，卻藏著全卷最驚人的一行字。「凱撒家裡的人」不是皇帝的親戚，是皇宮體系裡的奴僕、管家、文書與官員——羅馬帝國運轉的齒輪。這些人裡面，有人信了主，而且特別託保羅向腓立比問安。1:12 保羅說「我所遭遇的事更是叫福音興旺」（1:12），1:13 說他的捆鎖「在御營全軍」中顯明是為基督；到了 4:22，我們看見那興旺一路走到了哪裡。腓立比是一座小羅馬；福音從這座小羅馬出發，回到了大羅馬的心臟。</p><p>保羅特別說這一句，也是一種安慰：腓立比人也在逼迫之中（1:28--30），他們的城是羅馬權力的縮影。保羅告訴他們：那個看起來最強大的權力，它的家裡已經有人在敬拜耶穌了。屬神的體系，不是在凱撒外面另築一座城牆，而是一路滲進凱撒的家。今天在政府、企業、醫院裡上班的基督徒，就是新的「凱撒家裡的人」。</p><p>「請問在基督耶穌裡的各位聖徒安」（4:21）——原文是單數，一個一個地問。保羅在信裡點名了兩位不和的姊妹，最後卻要每一個人都被問候到，沒有一個人被排除在外。</p><p>最後一句：「願主耶穌基督的恩常在你們心裡！」（4:23）原文是「與你們的靈同在」。這封信從「那在你們心裡動了善工的，必成全這工」（1:6）開始，到恩典與你們最裡面的生命同在結束。一個坐監的人沒有用命令收尾，他用恩收尾。常常喜樂、一無掛慮、都可以知足、凡事都能做——這一切的力量，最後都歸結在這一個字：恩。學會了在飢餓與缺乏中仍然知足的人，靠的不是自己的修練，是主耶穌基督的恩一直與他同在。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《我活著就是基督》"],["p","弟兄姊妹平安，今天我們一起讀腓立比書第一章。"],["p","請你跟我去一個地方。"],["q","羅馬，一間租來的屋子，午後。"],["p","屋子不大。窗外是街上的叫賣聲，馬車的輪子壓過石板路。"],["p","屋裡有兩個人，可是他們不能離開對方超過一條鍊子的長度。"],["p","一個是羅馬士兵。一個是猶太人，名叫保羅。"],["p","鍊子的一頭扣在士兵的手腕上，另一頭扣在保羅的手腕上。"],["q","「保羅蒙准和一個看守他的兵另住在一處」（徒 28:16）"],["p","這是軟禁。不是地牢，可是也走不出那扇門。"],["q","「保羅在自己所租的房子裡住了足足兩年」（徒 28:30）"],["p","那天下午，門外有人敲門。"],["p","進來的是一個風塵僕僕的人，從馬其頓一路走來，走了一千多公里。"],["p","他叫以巴弗提。他手上抱著一包東西。"],["p","保羅打開那一包東西的時候，士兵就站在旁邊看，因為他走不開。"],["p","然後保羅坐下來，開始口述一封信。"],["q","「我每逢想念你們，就感謝我的神」（1:3）"],["p","弟兄姊妹，這是一封從鍊子底下寫出來的感謝信。"],["p","寫這些喜樂的人，手腕上一直扣著一條鐵鍊。"],["p","可是保羅為甚麼一想到腓立比就感謝？"],["p","因為這間教會，是在監獄裡出生的。"],["p","使徒行傳講義第十六章講過那一夜。"],["q","「約在半夜，保羅和西拉禱告，唱詩讚美神，眾囚犯也側耳而聽。」（徒 16:25）"],["p","十年後，保羅又在鍊子裡。收信的人，也還記得那一夜的詩歌。"],["q","「從頭一天直到如今，你們是同心合意地興旺福音」（1:5）"],["p","「同心合意」，原文的意思是合夥。"],["p","他們不是坐在台下聽的觀眾，是和保羅一起出錢、出力、出禱告的夥伴。"],["p","從呂底亞打開家門那一天，到以巴弗提敲門這一天，十年沒有退股。"],["p","所以保羅對他們有一個把握。"],["q","「我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子」（1:6）"],["p","人蓋房子會爛尾。神開了工，不會停在一半。"],["p","這一章有三個字：鎖，活，稱。"],["p","我們今天沿著它走三步：捆鎖叫福音興旺，活著就是基督，與福音相稱。"],["q","第一步：捆鎖叫福音興旺。"],["p","腓立比人一定很想知道：保羅還好嗎？"],["p","保羅的報告，卻是這樣開頭的。"],["q","「弟兄們，我願意你們知道，我所遭遇的事更是叫福音興旺」（1:12）"],["p","「興旺」這個字，原文是 προκοπὴν。"],["p","它的意思，像軍隊行軍之前，先派工兵去砍樹開路。"],["p","保羅說，我的鍊子不是路障。我的鍊子是開路的斧頭。"],["p","他沒有說坐監不苦。他只是不讓苦作這個故事的主詞。"],["p","主詞是福音。"],["p","它怎麼開路？請你想一想那一條鍊子。"],["q","「以致我受的捆鎖在御營全軍和其餘的人中，已經顯明是為基督的緣故」（1:13）"],["p","看守保羅的兵，每隔幾個小時就換一班。"],["p","他被派來看一個囚犯，以為這是全營最無聊的差事。"],["p","結果這個囚犯一整天在禱告，在口述書信，在跟來訪的人講一位復活的主。"],["p","士兵想走也走不了。鍊子是扣在他自己手上的。"],["p","保羅沒有去找聽眾。聽眾是羅馬政府排班送來的。"],["p","一班接一班，一個接一個，御營全軍都聽說了。"],["p","還有第三件事，更出人意料。"],["q","「越發放膽傳神的道，無所懼怕」（1:14）"],["p","照理說，看見帶頭的人被抓，大家應該更怕才對。"],["p","可是羅馬的弟兄們看見保羅在鍊子裡還在唱，反而更敢了。"],["p","一個在鍊子裡喜樂的人，比十篇講台上的勸勉更有說服力。"],["p","弟兄姊妹，你今天手上，有沒有一條鍊子？"],["p","也許是一張病床，一份做不下去又辭不掉的工作。"],["p","這幾節經文不是要你假裝不苦。保羅也沒有假裝。"],["p","不只是問：這件事好不好？"],["q","也問：這件事裡，福音往哪裡走？"],["p","也許有一個護士，一個看護，一個同事，是被排班送到你身邊來的。"],["p","可是接下來，保羅說了一件更難的事。"],["p","第一個考驗是環境。第二個考驗，是人。"],["q","「有的傳基督是出於嫉妒紛爭，也有的是出於好意」（1:15）"],["p","這些人不是異端。他們傳的是基督，內容沒有錯。"],["p","錯的是心。他們嫉妒保羅，趁他被鎖住，想搶他的位子。"],["q","「意思要加增我捆鎖的苦楚」（1:17）"],["p","他們不只是自己想出頭。他們是故意要讓坐監的人更難受。"],["p","最深的傷，常常不是外人給的，是同一個陣營的人給的。"],["p","保羅沒有說「我一點都不在意」。他說，那是苦楚。"],["p","他也看得很清楚，誰是好意，誰是結黨。他分辨了，也說出來了。"],["p","以基督的心為心，不是看不見別人的錯。"],["p","可是他接下來那一句，是整段的轉彎。"],["q","「這有何妨呢？或是假意，或是真心，無論怎樣，基督究竟被傳開了。」（1:18）"],["p","「這有何妨呢」，原文只有兩個字，意思是：那又怎樣？"],["p","保羅看清了他們的心，卻不讓他們的心成為他生命的中心。"],["p","審判人心的事，他交給神。他只看一件事：基督有沒有被傳開。"],["p","加拉太書講義第一章講過，傳別的福音，保羅一步都不讓。"],["p","內容錯了，他不放。只是動機不純，他放手。"],["q","「為此，我就歡喜，並且還要歡喜」（1:18）"],["p","如果保羅的喜樂，要等那些嫉妒他的人悔改，他這輩子就喜樂不起來了。"],["p","別人的惡意是真的。可是別人的惡意，不能決定他的心。"],["p","弟兄姊妹，在教會服事，最常偷走我們喜樂的，不是魔鬼的大攻擊。"],["p","看清楚，是可以的。說出來，也是可以的。"],["p","然後，把眼睛轉回基督身上。"],["p","環境，他過了。別人，他也過了。"],["p","可是還有一個更大的問題，在等那一場審訊。"],["p","保羅會活下來，還是會死？"],["q","第二步：活著就是基督。"],["q","「這事藉著你們的祈禱和耶穌基督之靈的幫助，終必叫我得救」（1:19）"],["p","這一節有兩條水管，接在同一個人身上。"],["p","一條從腓立比來：一群人的禱告。"],["p","一條從天上來：基督之靈的供應。"],["p","保羅不是靠意志硬撐。他是被供應的。"],["p","那麼，保羅最怕的是甚麼？是死嗎？"],["p","第二十節說，他最怕的是羞愧。怕在審判台前，因為害怕而不認主。"],["q","「無論是生是死，總叫基督在我身上照常顯大」（1:20）"],["p","請你抓住這一句。這是整段生死經文的鑰匙。"],["p","審訊的結果，不在保羅手上。生死的主權，在神手上。"],["p","他只知道一件事：不論結果如何，他的身體，都是基督被看見的地方。"],["p","躺在病床上的弟兄姊妹，你的身體軟弱，不等於基督不能在你身上被看見。"],["p","但這也不是叫你放棄治療。身體被醫治、被好好照顧，基督一樣在其中顯大。"],["p","然後，保羅說出了全本新約最有名的句子之一。"],["q","「因我活著就是基督，我死了就有益處。」（1:21）"],["p","我們先聽前半句：活著就是基督。"],["p","原文沒有動詞，只是並排擺著兩樣東西：活著，基督。"],["p","保羅活著的內容，就是一個人。"],["p","在鍊子底下是基督，在審訊中是基督，寫信給腓立比人也是基督。"],["p","加拉太書講義第二章讀過那一句："],["q","「現在活著的不再是我，乃是基督在我裡面活著」（加 2:20）"],["p","請你聽清楚：這不是我消失了。是我被基督住滿了。"],["p","保羅的名字、保羅的個性、保羅的眼淚，都還在。只是中心換了。"],["p","後半句，「死了就有益處」。益處，原文是 κέρδος，是生意人的字，賺到。"],["p","賺到甚麼？請你不要自己填空。保羅在第二十三節自己說了。"],["q","「我正在兩難之間，情願離世與基督同在，因為這是好得無比的。」（1:23）"],["p","益處，不是解脫，不是逃離痛苦。益處是「與基督同在」。"],["p","益處是一個人，不是一個出口。"],["p","「離世」這個字，ἀναλῦσαι，是軍隊拔營，是船解開纜繩出航。"],["p","對保羅來說，死不是掉進黑洞，是收起帳棚，回到主人那裡。"],["p","可是不要拿這一節叫人不要哭。"],["q","「耶穌哭了。」（約 11:35）"],["p","盼望和眼淚，可以在同一張臉上。"],["p","弟兄姊妹，講到這裡，我必須很小心，也請你很小心。"],["p","如果我們在第二十一節停下來，這一段就會被讀錯。"],["q","「我就不知道該挑選甚麼」（1:22）"],["p","他說他兩難。原文的意思，是被兩邊同時夾住。"],["p","一邊是想見主。一邊是在肉身活著，還有果子可以結。"],["p","請你留意，他不是活膩了。他是看見兩邊都好。"],["p","然後，他說了這一段真正的結論。"],["q","「然而，我在肉身活著，為你們更是要緊的。」（1:24）"],["p","「然而」。整段經文，就轉在這兩個字上。"],["p","對他自己，離世好得無比。對腓立比人，他活著更是要緊。"],["p","他選了後者。決定他留下來的，是別人的需要。"],["q","「我既然這樣深信，就知道仍要住在世間，且與你們眾人同住」（1:25）"],["q","所以這不是一段羨慕死亡的經文。這是一段選擇活下去的經文。"],["p","留下來做甚麼？使他們「在所信的道上又長進又喜樂」。"],["p","然後保羅想到的，是一次見面。"],["q","「因我再到你們那裡去，就越發加增」（1:26）"],["p","一個剛剛談完生死的人，最後想的是回去和他們同在一個房間裡。"],["p","這一段生與死，不是落在墳墓上。是落在一次團聚上。"],["p","弟兄姊妹，我現在想對一些人講幾句話。"],["p","也許你今天坐在這裡，或者在螢幕前，心裡有一個說不出口的念頭。"],["p","你覺得很累，累到不想再活下去。"],["p","我要先對你說：你會這樣想，不是因為你信心不夠。"],["p","保羅自己也被夾在兩邊。掙扎本身不是罪。"],["p","可是我也要對你說，就像保羅說的那一句："],["q","你在肉身活著，對我們是要緊的。"],["p","請你不要一個人扛。今天就告訴一個你信得過的人。"],["p","散會以後來找我，或找一位你信任的同工，我們陪你。"],["p","也請你去找專業的協助。各地都有二十四小時的生命線和危機支援。"],["p","看醫生、找諮商、打電話求助，和禱告一點都不衝突。"],["p","如果你身邊有人說出這樣的念頭，請不要急著糾正他的神學。"],["p","先聽他，陪著他，保護他的生命，陪他去找專業的幫助。"],["p","你記得那個腓立比的禁卒嗎？地大震動，監門全開。"],["q","「以為囚犯已經逃走，就拔刀要自殺」（徒 16:27）"],["p","那一夜，保羅沒有先跟他講道。他先大聲喊了一句話。"],["q","「不要傷害自己！我們都在這裡。」（徒 16:28）"],["p","弟兄姊妹，這就是教會的第一句話。不要傷害自己。我們都在這裡。"],["p","神把你留在世間，是有意的。"],["p","保羅選擇留下來。那麼，留下來的人要怎樣過日子？"],["p","接下來，保羅用了一個腓立比人一聽就懂的字。"],["q","第三步：與福音相稱。"],["p","使徒行傳介紹腓立比，只用了一句話。"],["q","「也是羅馬的駐防城」（徒 16:12）"],["p","腓立比在馬其頓，可是它是一座小羅馬。"],["p","居民多是退伍軍人的後代，用羅馬的法律，穿羅馬的衣服。"],["p","他們離羅馬很遠，卻天天以身為羅馬公民為榮。"],["q","「只要你們行事為人與基督的福音相稱」（1:27）"],["p","「行事為人」，原文是 πολιτεύεσθε，像公民一樣過日子。"],["p","腓立比是羅馬放在馬其頓的一塊領土。"],["p","教會，是天國放在腓立比的一塊領土。"],["p","這就是我們常說的，在地上建立屬神的體系。"],["p","體系不是一套組織圖。是一群人，照著另一個國度的憲法過日子。"],["p","這個國度的憲法，就是基督的福音。"],["p","請你留意這個命令的次序。"],["p","保羅不是說：你們好好表現，才能成為天國的公民。"],["p","他是說：你們已經是了，就照這個身分過日子。"],["p","身分在先，行事在後。先知道自己屬於哪一國，才知道為這一國可以放下甚麼。"],["p","可是公民不是一個人當的。"],["q","「同有一個心志，站立得穩，為所信的福音齊心努力」（1:27）"],["p","「齊心努力」，原文是 συναθλοῦντες，同一隊的運動員。"],["p","可是不能各踢各的球門。"],["p","保羅為甚麼要特別寫這一句？因為這間很愛主的教會，開始有人各踢各的了。"],["p","第四章，他要點名兩位同工姊妹，請她們在主裡同心。"],["p","合一不是沒有意見。合一是朝同一個方向：福音。"],["p","中間還有一句，很容易被跳過。"],["q","「或來見你們，或不在你們那裡」（1:27）"],["p","保羅在不在場，他們都要一樣。"],["p","一間教會成不成熟，不是看牧師在的時候有多熱鬧。"],["p","是看牧師不在的時候，大家還是不是朝同一個方向站著。"],["p","一個屬神的體系，不倚靠一個人，倚靠同一位主。"],["p","然後，這一隊人面對的是一場真的比賽。"],["q","「凡事不怕敵人的驚嚇」（1:28）"],["p","腓立比滿城拜皇帝、拜城神，不會放過一群不肯拜的人。"],["p","保羅沒有叫他們去打敵人。只叫他們不要被嚇跑。"],["p","站著不動，本身就是見證。"],["p","不必驚慌，也不必報復。因為得救是出於神，不是出於我們吵不吵得贏。"],["q","「因為你們蒙恩，不但得以信服基督，並要為他受苦。」（1:29）"],["p","這一節很容易被講歪，所以我講慢一點。"],["p","「蒙恩」這個字，是白白給的禮物。保羅把受苦放在禮物底下。"],["p","意思不是苦難本身是好東西，也不是神喜歡看人痛。"],["p","是說，為基督受的苦，是和基督同行的一部分。受苦的人，沒有被神丟下。"],["p","所以這一節不能拿來叫病人不要看醫生，也不能叫受傷害的人留在危險裡。"],["p","保羅自己在腓立比被打以後，也亮出羅馬公民的身分，要官長親自來領他出去。"],["q","「你們的爭戰，就與你們在我身上從前所看見、現在所聽見的一樣。」（1:30）"],["p","他們從前「看見」過。十年前，有人親眼看見保羅的背被打開。"],["p","現在他們「聽見」了。以巴弗提會把羅馬的消息帶回去。"],["p","弟兄姊妹，我們回到那間租來的屋子。"],["q","羅馬，傍晚。士兵站在門口，鍊子還扣著。"],["p","這一章，保羅講了三件事。"],["p","鍊子扣著他，福音卻沒有被扣住。"],["p","死亡在門外等著，他卻選擇為別人活下去。"],["p","可是請你不要散會以後，只記得保羅很偉大。"],["p","因為保羅選擇留下來的那個樣子，是從另一位身上學來的。"],["p","保羅說：離世好得無比，然而，為你們，我留下。"],["p","下一章，他要告訴腓立比人，有一位走得比他更遠。"],["p","那一位本來就在父的榮耀裡，好得無比。"],["q","「你們當以基督耶穌的心為心」（2:5）"],["q","「反倒虛己，取了奴僕的形像，成為人的樣式」（2:7）"],["p","保羅是為了別人，留在一條鍊子底下。"],["p","基督是為了我們，從天上下來，把自己和我們扣在一起。"],["q","他甘心被扣上的那一條，是一個十字架。"],["p","所以「活著就是基督」，不是一句很高的口號。"],["p","是一個被他愛到這個地步的人，說：那我的日子，也給你。"],["p","你不必更佩服保羅。你只要更認識保羅所活的那一位。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，看看你手上那條鍊子，那個走不開的處境。"],["p","問主一句話：主啊，在這裡，福音可以往哪裡走？"],["p","第二件，想一個你在乎的人，告訴他一句：你活著，對我是要緊的。"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《以基督耶穌的心為心》"],["p","弟兄姊妹平安，今天我們一起讀腓立比書第二章。"],["p","今天我只想先給你一個希臘字。請你把它帶回家。"],["q","ἐκένωσεν。"],["p","這個字在第七節。和合本譯作兩個字：虛己。"],["q","「反倒虛己，取了奴僕的形像，成為人的樣式」（2:7）"],["p","它的字根是「空」。字面的意思，是把一個東西倒空。"],["p","所以請你想像一隻杯子。就是你家廚房裡那一隻。"],["p","一隻杯子，要怎樣才能倒空？"],["p","要有一隻手把它拿起來，傾過去。杯子自己不會倒空。"],["p","可是保羅在這個字前面，放了另一個字：ἑαυτὸν。他自己。"],["p","沒有人去傾那一隻杯子。是他自己傾過來的。"],["p","再問一句：杯子倒空了，它還是杯子嗎？"],["p","當然還是。它沒有碎，也沒有變成別的東西。"],["q","倒空了的杯子，還是杯子。"],["p","請你記住這一句。今天整篇講道，都要回到這一句。"],["p","因為有人會把這一章讀成：你要把自己打碎。"],["p","保羅沒有這樣說。打碎和倒空，是兩件很不一樣的事。"],["p","這一章有三個詞：心，空，光。"],["p","我們沿著它走三步：意念相同，往下走的心，學會了的人。"],["q","第一步：意念相同。"],["p","保羅為甚麼寫這一章？答案藏在第四章。"],["q","「我勸友阿蝶和循都基，要在主裡同心。」（4:2）"],["p","一封要在全教會朗讀的信，點名兩位姊妹。"],["p","她們不是壞人，在福音上曾與保羅一同勞苦。"],["p","好人也會吵架。而且常常吵在最熱心的地方。"],["p","詩班裡，探訪組裡，愛宴的廚房裡。"],["p","可是保羅一開口，沒有先下命令。他先打開一個抽屜。"],["q","「所以，在基督裡若有甚麼勸勉，愛心有甚麼安慰，聖靈有甚麼交通，心中有甚麼慈悲憐憫」（2:1）"],["p","四個「若有」，原文的意思更接近：既然有。"],["p","保羅在點名四樣他們早就嘗過的東西。全是從上面來的。"],["q","沒有源頭的合一，只能靠壓。有源頭的合一，才會長。"],["p","然後他說，你們就要意念相同，有一樣的心思。"],["p","這很容易聽成：大家的想法都要一模一樣。"],["p","「意念」，原文是 φρονέω。它不是意見，是心思朝著的方向。"],["p","兩個同工，可以對詩歌、預算、裝潢意見不同，"],["p","卻仍然朝著同一個方向。"],["p","合一不是意見相同，是心思朝著同一個方向。"],["p","那個方向是誰？保羅要留到第五節才說。"],["q","「凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強。」（2:3）"],["p","「結黨」，原本是城邦選舉的字：為自己拉票，為自己鋪路。"],["p","「虛浮的榮耀」，原文是空，加上榮耀。外面亮亮的，裡面是空的。"],["p","請你聽見那個「空」字。它和「倒空」，是同一個字根。"],["q","人想把空的榮耀裝進自己。基督卻把滿的自己倒出來。"],["p","藥方是：「各人看別人比自己強。」這也是最常被讀歪的一句。"],["p","它不是要你相信，每個人都比你能幹，或者你一文不值。"],["p","「看」這個字，原文是算帳的字。算的是次序。"],["p","在我的眼睛裡，你的需要排在前面。"],["p","一位外科醫生半夜被叫起來看急診。"],["p","他看病人比自己強，不是承認病人比他會開刀，"],["p","是把病人的需要，排在自己的睡眠前面。"],["q","「各人不要單顧自己的事，也要顧別人的事。」（2:4）"],["p","請你聽這一節裡最小的一個字：也。原文多放了一個 καὶ。"],["q","保羅沒有叫人不顧自己。他叫人不要只顧自己。"],["p","有些很愛主的人，以為自己不可以有需要。"],["p","不能累，不能病，不能說不，不能為家人留一點時間。"],["p","第四節先把這條路堵住了。那不是更屬靈，是失去了平衡。"],["p","所以這兩節要問的，不是「我要怎樣看輕自己」，"],["p","是「我的眼睛，最近一直盯著誰的事」。"],["p","講到這裡，保羅大可以列一張清單：開會不要拉票，服事不要搶功。"],["p","可是他沒有。他停下來，唱了一首歌。"],["q","第二步：往下走的心。"],["q","「你們當以基督耶穌的心為心」（2:5）"],["p","全本新約，「耶穌是我的榜樣」，沒有一句比這更直接。"],["p","可是榜樣不是一套技巧，是一個人。要學他的心，先要看他是誰。"],["p","所以，請你先不要想自己。先讓這首歌唱完，一直唱到萬膝跪拜。"],["p","這首歌分成兩半。前一半，主詞是基督，一步一步往下走。"],["p","後一半，主詞換成神，一步一步往上抬。"],["q","「他本有神的形像，不以自己與神同等為強奪的」（2:6）"],["p","第一句不是往下。第一句是身分。"],["p","「本有」，原文是一直是。從來是，現在也是。"],["p","他沒有身分危機。他從頭到尾知道自己是誰。"],["p","「強奪的」，是伸手去搶、抓住不放的東西。"],["p","學者有兩種讀法；既然前面說「一直是」，本講義取這一種："],["q","他不是沒有。他是不抓。"],["p","這使我們想起伊甸園裡蛇的那一句："],["q","「你們便如神能知道善惡。」（創 3:5）"],["p","亞當本來不是神，卻伸手要如神。基督本來與神同等，卻不伸手抓住。"],["p","腓立比書沒有明說亞當。這是我們讀到的對照。"],["p","然後，就是那個字。反倒，虛己。"],["p","他倒空了甚麼？保羅沒有說倒空了甚麼。他說怎麼倒：取了奴僕的形像。"],["p","請你聽那個動詞：取了。這就是杯子比方走不到的地方。"],["p","杯子倒空，是少了。基督倒空，卻是多取了一樣。"],["q","是加上人性，不是減去神性。"],["p","歷代也有別的讀法，議題頁有細講。本講義採教父與改教家的讀法。"],["p","倒空了的杯子，還是杯子。倒空了自己的基督，還是神。"],["p","而且他取的，是奴僕的形像。人裡面最低的那一級。"],["q","「既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。」（2:8）"],["p","請你一步一步跟著他走下去。"],["p","本有神的形像。不抓。倒空。取了奴僕的形像。"],["p","成為人。自己卑微。存心順服，以至於死。"],["p","然後保羅好像停不下來，又補了一句：且死在十字架上。"],["p","只說「死」還不夠低。要說是哪一種死。"],["p","腓立比是羅馬駐防城。羅馬公民有一項特權：不被釘十字架。"],["p","那是給奴隸和叛亂的人預備的死法。"],["p","保羅對這一城的人說：你們的主，死在那裡。"],["p","往下七步，停在十字架。全卷最低的地方。"],["p","也請你留意，第七節和第八節，各有一個「自己」。"],["p","自己倒空，自己卑微。沒有一步是被人推下去的。"],["q","「沒有人奪我的命去，是我自己捨的。」（約 10:18）"],["p","好，往下的路走完了。請你聽第九節的第一個字。"],["q","「所以，神將他升為至高，又賜給他那超乎萬名之上的名」（2:9）"],["p","所以。原文是 διὸ。"],["p","第八節最後一個字是十字架，第九節第一個字是所以。"],["p","全卷最低和最高的地方，中間只隔這一個字。"],["p","而且主詞換人了。往下的路，是他自己走的。"],["p","往上的路，不是他自己爬的。是神把他抬上去的。"],["p","以弗所書講義第一章讀過同一幅畫：萬有都服在他的腳下。"],["q","「叫一切在天上的、地上的，和地底下的，因耶穌的名無不屈膝」（2:10）"],["p","保羅在這裡，化用了以賽亞書的一句話。"],["q","「萬膝必向我跪拜」（賽 45:23）"],["p","在以賽亞書，說這話的是耶和華。前面才說：我是神，再沒有別神。"],["p","一個嚴守獨一神信仰的猶太人，把這句只屬耶和華的話，放在耶穌身上。"],["p","而被敬拜的這一位，正是那位倒空自己、死在十字架上的人。"],["q","神的榮耀，原來長得像十字架。"],["q","「無不口稱『耶穌基督為主』，使榮耀歸與父神。」（2:11）"],["p","在腓立比，「主」是凱撒的稱號。"],["p","一間小小的教會，在凱撒的城裡說：耶穌基督才是主。"],["p","而這首歌的最後一個字，是「父」。連得到的榮耀，他都歸給了父。"],["q","從十字架，到萬膝跪拜。歌，唱完了。"],["p","現在，只有現在，我們才可以回頭問：那我呢？"],["p","國度321空中團契常說「無己」。這兩個字，很容易被聽錯。"],["p","所以今天，我們用這首歌替它定一個準。"],["q","無己不是沒有自己，是不以自己為中心；不是自我消滅，是自我給出。"],["p","基督虛己的時候，沒有忘記自己是誰。倒空了的杯子，還是杯子。"],["p","所以學基督的心，不是從懷疑自己開始，是從確知自己開始。"],["p","你在基督裡是蒙愛的，是聖徒，是天上的國民。"],["p","越確知自己是誰，越不需要抓。越不需要抓，手越空得出來去愛。"],["p","321 說：驕傲是離開本位抓住權力，謙卑是放下權力回到本位。"],["p","全本聖經裡，這兩句話最精準的經文，就是第六節。"],["p","驕傲的人不一定大聲。常常只是抓得很緊：抓住位子，抓住「我是對的」。"],["p","那麼倒出來的，往哪裡去？回到第四節：也要顧別人的事。"],["p","落點不在倒空了多少，在為誰倒空。"],["p","所以我要很小心地說幾句話。也許今天正好有人需要聽。"],["p","經文說，是他自己倒空的。"],["q","被迫的不叫虛己，叫受害。"],["p","如果你在家裡被打，在職場被欺壓，在教會被人用屬靈的話控制，"],["p","你的痛苦不是因為「還有己」。你需要的是保護，是被聽見。"],["p","請你找一位信得過的人，說出來。"],["p","無己的人仍然有分辨，仍然可以說出需要，也仍然可以設界線。"],["p","把憂鬱、自我厭惡、不敢拒絕當成無己，是把病當成美德。"],["p","321 也說，無己不是沒有，乃是進入無限、活出無限。根據就是第九節的「所以」。"],["p","可是「所以」不是一套策略：先低頭，才能被抬高。"],["q","為了被高舉而謙卑，仍然是有己。只是把抓的手藏在背後。"],["p","往下走的人，不必替自己爭名。名，是神賜的。記帳的不是人。"],["p","歌唱完了。可是保羅沒有讓我們只是站著鼓掌。"],["p","他接著說了一個很不浪漫的詞：做工夫。"],["q","第三步：學會了的人。"],["q","「就當恐懼戰兢做成你們得救的工夫」（2:12）"],["p","這一句常被讀成兩種極端。"],["p","一種說：得救了還要拚命做，做不好就會掉下去。"],["p","另一種說：反正都是神作的，我們等著就好。"],["p","兩種都犯了同一個錯：只讀了半句。"],["q","「因為你們立志行事都是神在你們心裡運行，為要成就他的美意。」（2:13）"],["p","這兩節，原文是同一個句子，一定要一起讀。"],["p","「做成」，是做到底，活出來。不是做了才得到。"],["p","像農夫要澆水、拔草，可是叫種子發芽的生命，從來不是農夫造的。"],["q","「那在你們心裡動了善工的，必成全這工」（1:6）"],["p","連你心裡「想要和好」的那一點心意，都是神放進去的。所以你可以放膽去做。"],["p","「恐懼戰兢」也不是驚慌。是不敢輕忽，是怕辜負這麼大的愛。"],["q","「凡所行的，都不要發怨言，起爭論」（2:14）"],["p","這一句，在教會裡常被拿來叫人閉嘴。"],["p","可是「怨言」這個字，把我們帶回曠野。"],["q","「你們的怨言不是向我們發的，乃是向耶和華發的。」（出 16:8）"],["p","曠野的怨言是不信。所以這一節禁止的，是對神的不信，不是對不公的申訴。"],["p","看見同工受欺負、帳目不清，把它帶到該處理的地方，那不是發怨言，是愛。"],["p","第四章保羅沒有叫兩位姊妹閉嘴，他請第三個人來幫助她們。"],["p","合一，是把問題帶進主裡處理，不是把問題藏起來。"],["p","這樣的一群人，保羅說，「好像明光照耀」。夜越黑，星星越清楚。"],["p","然後，保羅又拿起了一隻杯子。"],["q","「我以你們的信心為供獻的祭物，我若被澆奠在其上，也是喜樂」（2:17）"],["p","澆奠，是獻祭時最後倒在祭物上的那一杯酒。"],["p","祭壇上的主角，是他們的信心。保羅只是那一杯酒。"],["p","可是他說的是「若」。他不是在羨慕死亡。"],["q","「然而，我在肉身活著，為你們更是要緊的。」（1:24）"],["p","他不是想死。他是不怕把自己用上。"],["p","歌唱完以後，保羅介紹了兩個人。好像在說：我給你們看兩個學會了的人。"],["p","第一個，是提摩太。"],["q","「因為我沒有別人與我同心，實在掛念你們的事。」（2:20）"],["p","「同心」，原文 ἰσόψυχον，同一個魂，分量一樣重的心。"],["p","「掛念」，和第四章「一無掛慮」是同一個字。在這裡，卻是美德。"],["p","牽掛本身不是罪。愛人的人一定會牽掛。問題是有沒有帶到神面前。"],["q","「別人都求自己的事，並不求耶穌基督的事。」（2:21）"],["p","這大概是新約對「有己」最短的定義。常常只是：我的事比較要緊。"],["p","提摩太，就是第四節活出來的樣子：顧別人的事，就是求耶穌基督的事。"],["q","「他興旺福音，與我同勞，待我像兒子待父親一樣。」（2:22）"],["p","使徒行傳講義第十六章講過，保羅帶著這個年輕人，一路走到腓立比。"],["p","那個半夜唱詩、地大震動的晚上，他也在。"],["p","原文說，他與我一同為福音作奴僕。和第七節「奴僕」同一個字根。"],["p","這是 321 說的「3」，屬靈父子。可是保羅不說他服事我，說他與我一同服事福音。"],["p","第二個，是以巴弗提。教會派他送禮物來，留下來照顧保羅。"],["q","「他是我的兄弟，與我一同做工，一同當兵」（2:25）"],["p","同工，是一起做事。同袍，是一起挨打。這是 321 說的「5」，屬靈戰友。"],["p","保羅說，我「想必須」打發他回去。這個「想」，又是那個算帳的字。"],["p","第三節，看別人比自己強；第六節，基督不以為強奪；"],["p","第二十五節，保羅把一個對自己很有用的戰友，送走了。"],["p","以巴弗提病得幾乎要死。最讓他難過的，卻是：你們聽見我病了。"],["q","「他實在是病了，幾乎要死；然而神憐恤他，不但憐恤他，也憐恤我，免得我憂上加憂。」（2:27）"],["p","保羅沒有醫好他，也沒有說他信心不夠。只說：神憐恤他。"],["p","寫「要靠主常常喜樂」的人，在這裡說：我會憂。"],["p","如果你正身陷焦慮、憂鬱，就醫、吃藥、諮商，和禱告並不衝突。"],["p","保羅在這一節，給了你一個說出來的許可。"],["p","他也沒有說「我就不憂愁了」，他說「少些憂愁」。無己的人，仍然可以說出需要。"],["q","「因他為做基督的工夫，幾乎至死，不顧性命」（2:30）"],["p","「幾乎至死」，和第八節基督「以至於死」，原文是同一個片語。"],["p","「不顧性命」，是賭桌上的字：全部押下去。"],["p","可是保羅接著做的，是送他回家休養，還吩咐教會要尊重這樣的人。"],["p","教會對押上性命的人，要接待、尊重、照顧，不是把他再推回前線。"],["p","弟兄姊妹，我們回到開頭那隻杯子。"],["p","這一章裡，有好幾隻被倒出來的杯子。"],["p","保羅，是倒在祭物上的一杯酒。提摩太，把牽掛倒給了遠方的教會。"],["p","以巴弗提，把性命押了上去。"],["p","可是他們沒有一個是第一隻杯子。他們都是從另一位那裡，學會了怎樣倒。"],["q","第一隻傾過來的杯子，是基督。"],["p","他本有神的形像，自己倒空，自己卑微，一直走到十字架。"],["p","倒出來的，流到了我們身上。"],["p","倒空了的杯子，還是杯子。倒空了自己的那一位，今天坐在最高處。"],["q","我們要學的，不是一個失敗者的心，是那位萬膝都要向他跪拜的主的心。"],["p","所以你不必更佩服誰，也不必更看輕自己。只要更愛這一位。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，早上起來對主說：主啊，我在你裡面是蒙愛的，所以今天我不必抓。"],["p","第二件，想一個人，替他的事放上一點你自己。一通電話，一頓飯。"],["p","如果你是那個一直被要求倒空、快要碎了的人，"],["p","今天請你先不要再倒。先讓這位主，把你接住。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《向著標竿直跑》"],["p","弟兄姊妹平安，今天我們一起讀腓立比書第三章。"],["p","請你伸出一隻手，五根手指，再加上另一隻手的兩根。"],["q","七。"],["p","第三章第五、第六節，保羅寫下了一張履歷表。一共七項。"],["p","我慢慢念，請你一項一項扳手指。"],["q","「我第八天受割禮；我是以色列族、便雅憫支派的人，是希伯來人所生的希伯來人。就律法說，我是法利賽人；」（3:5）"],["q","「就熱心說，我是逼迫教會的；就律法上的義說，我是無可指摘的。」（3:6）"],["p","第八天受割禮，一。以色列族，二。便雅憫支派，三。"],["p","希伯來人所生的希伯來人，四。法利賽人，五。"],["p","熱心到逼迫教會，六。律法上的義，無可指摘，七。"],["p","可是保羅寫這七項，不是為了應徵。"],["p","他是在做帳。"],["p","一本帳有兩欄。左邊是資產，右邊是負債。"],["p","這七項，原本整整齊齊地寫在左邊。"],["p","然後，保羅拿起筆，把它們一項一項，搬到右邊去。"],["q","七項資產，全部搬進了負債欄。"],["p","一個人為甚麼要這樣算帳？是算錯了，還是看見了甚麼？"],["p","這一章有三個詞：損，跑，國。"],["p","我們今天沿著它走三步：保羅的帳本，向著標竿直跑，天上的國民。"],["p","可是帳本還沒打開，保羅先說了一句很溫柔的話。"],["q","「弟兄們，我還有話說，你們要靠主喜樂。」（3:1）"],["p","「靠主」，原文是「在主裡」。喜樂有一個地址。"],["p","話才說完，下一節，語氣忽然變了。"],["q","「應當防備犬類，防備作惡的，防備妄自行割的。」（3:2）"],["p","語氣變了，愛沒有變。保羅說到喜樂，就想起會偷走喜樂的人。"],["p","「犬類」這兩個字很重，所以我們要讀準。"],["p","這不是罵猶太人。寫這句話的人，兩節以後就說自己是"],["q","「希伯來人所生的希伯來人」（3:5）"],["p","這也不是罵所有跟我們意見不同的人。"],["p","同一章，對看法不同的弟兄，保羅很溫和，說神會親自指示他們。"],["p","第二節針對的只有一件事：有人教外邦信徒，要先受割禮，才能得救。"],["p","本系列加拉太書講義第五章講過同一場仗。"],["q","「若受割禮，基督就與你們無益了。」（加 5:2）"],["p","這不是口味之爭，是福音的生死，所以保羅很兇。"],["p","可是那是醫生的兇，不是仇人的兇。等一下我們會看見，他說到敵人，是流著淚說的。"],["q","「因為真受割禮的，乃是我們這以神的靈敬拜、在基督耶穌裡誇口、不靠著肉體的。」（3:3）"],["p","不靠著肉體。請你記住「靠」這個字。帳本，就是從這個字打開的。"],["q","第一步：保羅的帳本。"],["q","「其實，我也可以靠肉體；若是別人想他可以靠肉體，我更可以靠著了。」（3:4）"],["p","論出身，論學歷，論熱心，論紀錄，你們沒有一樣比得過我。"],["p","請你留意，這七項本身都不是壞東西。"],["p","割禮是神設立的。律法是神賜的。熱心也不是罪。"],["p","今天換個名字，這張履歷照樣存在。"],["p","牧師世家。第三代基督徒。神學院畢業。服事二十年，聚會從來沒缺過。"],["p","這些都是好東西。問題不在東西，在那個字：靠。"],["p","七項裡面，有一項特別刺眼。第六項。逼迫教會。"],["p","保羅把它列在「熱心」底下。當年，這是他的功勞。"],["p","如今回頭看，這是他一生最痛的一件事。"],["q","熱心可以很真誠，也可以真誠地錯。"],["p","現在，帳本打開了。"],["q","「只是我先前以為與我有益的，我現在因基督都當作有損的。」（3:7）"],["p","「有益」和「有損」，是會計的字。一個是利潤，一個是虧損。"],["p","再聽動詞：「當作」。原文 ἡγέομαι，意思是算，算成。"],["q","「不但如此，我也將萬事當作有損的，因我以認識我主基督耶穌為至寶。」（3:8）"],["p","而且這裡的「當作」換成現在式：我今天，還是這樣算。"],["p","弟兄姊妹，這個「算」字，我們在第二章已經見過。"],["q","「不以自己與神同等為強奪的」（2:6）"],["p","第三節「看別人比自己強」的「看」，第六節「不以為強奪」的「以」，都是這同一個字。"],["p","基督怎樣看他的權利，保羅就怎樣看他的資歷。"],["p","生命的改變，常常不是先從行為開始，是先從換一把尺開始。"],["p","尺一換，資產欄和負債欄就對調了。"],["q","「我為他已經丟棄萬事，看作糞土，為要得著基督」（3:8）"],["p","「糞土」，原文 σκύβαλα。這是希臘文裡很粗的一個字。"],["p","可以指丟給狗吃的殘渣，也可以指糞便。"],["p","可是我要很小心地說：這一節不是叫我們看輕讀書、工作、家庭。"],["p","同一封信，第四章還叫我們思念可敬的、公義的、可愛的事。"],["p","糞土的比較，只在一個地方成立："],["p","當這些東西和基督放上同一個天平，要搶基督的位置的時候。"],["q","一張博士文憑放在書架上，是恩典；放在神的寶座上，就是糞土。"],["p","請你聽這句的最後幾個字：為要得著基督。"],["p","「得著」，原文就是第七節「有益」那個字，變成動詞。"],["p","資產欄清空了，最後只剩下一個名字。基督。"],["p","他不是在悲壯地犧牲，他是做了一生最划算的一筆交易。"],["p","所以第八節的糞土，和第一節的喜樂，是同一顆心。"],["q","「不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義」（3:9）"],["p","請你想像一個人要進宮見王。"],["p","他身上穿著自己一針一線縫的禮服，縫了三十年，針腳整齊，沒有人挑得出毛病。"],["p","可是到了宮門口，侍衛遞給他另一件袍子：這是王為你預備的。"],["p","他必須脫下自己那一件，才穿得上王給的那一件。"],["p","保羅換掉的，不是一套行為，是一件衣服。"],["p","「信基督的義」，學者有兩種讀法：我們對基督的信，或者基督自己的信實。"],["p","兩種讀法，落點一樣。義，不是自己的。"],["p","這對一個常常自責、覺得自己永遠不夠好的人，是好消息："],["p","你在神面前站得住，不建立在你今天的表現上。"],["p","可是帳算完了，故事並沒有結束。"],["p","保羅放下了帳本，站了起來，開始跑。"],["q","第二步：向著標竿直跑。"],["q","「使我認識基督，曉得他復活的大能，並且曉得和他一同受苦，效法他的死」（3:10）"],["p","請你留意：保羅已經認識基督三十年了，還說「使我認識基督」。"],["p","再留意這一節的次序。先是復活的大能，然後才是一同受苦。"],["p","基督徒不是靠咬緊牙關去忍受苦難。"],["p","是先被復活的生命充滿，才有力氣和基督一同走進苦難。"],["p","「效法他的死」，原文的意思是：被模成他死的形狀。"],["p","第二章，基督往下走。第三章，保羅說：我也願意被模成那個形狀。"],["q","「或者我也得以從死裡復活。」（3:11）"],["p","第十節往下，第十一節往上。就像第二章，第八節往下，第九節往上。"],["p","往上的那一段，主詞是神。"],["p","這個「或者」，不是保羅對得救沒把握。第一章他才說過，神必成全這工。"],["q","「這不是說我已經得著了，已經完全了；我乃是竭力追求，或者可以得著基督耶穌所以得著我的。」（3:12）"],["p","寫這句話的人，在半個羅馬帝國建立了教會，在監裡還帶人信主。"],["p","他說：我還沒有到。"],["p","教會裡最危險的人，不是軟弱的人，是覺得自己已經到了的人。"],["p","現在請你聽「竭力追求」的那個「追」字。原文 διώκω。"],["p","這個字，你剛剛聽過。在七項資歷的第六項。"],["p","就熱心說，我是逼迫教會的。那個「逼迫」，就是這個字。"],["q","從前他追的是教會。現在他追的是基督。"],["p","弟兄姊妹，你的性格不必被壓扁。它需要的，是被基督得著，換一個方向跑。"],["p","而這一節最重要的，是最後半句：基督耶穌所以得著我的。"],["p","原文這裡是同一個動詞，一次主動，一次被動。我想抓住，因為我已經被抓住了。"],["p","請你想像一個孩子在急流裡，被救生員一把抓住。"],["p","那個孩子會用盡全身的力氣，抱住救生員的手臂。"],["p","他用力，是因為已經被抓住了，不是為了被抓住。"],["q","神先抓住我，我才竭力抓住他。這是恩典與追求的次序。"],["p","然後，是這一章最有名的一句。"],["q","「我只有一件事，就是忘記背後，努力面前的，向著標竿直跑」（3:13–14）"],["p","這一句很美，也很常被用錯。所以我們先讀清楚：背後是甚麼？"],["p","請你回頭看那七根手指。"],["p","背後，就是第五、第六節那張履歷。割禮，支派，法利賽人，熱心，無可指摘。"],["p","保羅要忘記的，是他自己最引以為傲的東西。是他的獎盃。"],["q","忘記背後，是不再回頭欣賞自己的獎盃。"],["p","所以我要很清楚地說，這一節不是對受過傷的人說：過去的事就不要再提了。"],["p","一位被家暴、被欺負、被屬靈領袖傷害過的弟兄姊妹，"],["p","他的背後，不是他的成就。是別人加在他身上的傷。"],["p","第十三節沒有叫他壓抑，沒有叫他否認，也沒有叫他立刻放下。"],["p","請你分清楚兩件事：不被過去定義，和否認過去發生過。"],["p","前一件，是福音的自由。後一件，會造成第二次傷害。"],["p","傷需要被說出來，被聽見，被好好處理，有時候也需要專業的陪伴。"],["p","如果你身邊有這樣的人，請不要拿這一節去堵他的口。請你坐下來，聽他說。"],["p","保羅自己也沒有失憶。他在別的信裡，還提起自己逼迫過教會。"],["q","「我原是使徒中最小的，不配稱為使徒，因為我從前逼迫神的教會。」（林前 15:9）"],["p","他記得。只是那件事，不再定義他，也不再是他跑道上的倚靠。"],["p","然後是那四個字：我只有一件事。"],["p","保羅把一生收成一件。向著標竿直跑。"],["p","標竿是甚麼？"],["q","「要得神在基督耶穌裡從上面召我來得的獎賞。」（3:14）"],["p","獎賞不是一面獎牌。是那位從上面召我的主自己。"],["q","跑道的終點，不是一個成就，是一張臉。"],["p","基督，是我的標竿。"],["q","「所以我們中間，凡是完全人總要存這樣的心」（3:15）"],["p","你也許會問：保羅剛說自己還沒有完全，怎麼馬上又說「凡是完全人」？"],["p","第十二節是已經跑到終點。第十五節是成熟，像大人和嬰孩的分別。"],["q","成熟的人的記號，正是知道自己還沒有到。"],["p","照這幾節，321 說的得勝者，不是已經完全的屬靈精英，是知道自己還沒到、所以繼續跑的人。"],["q","「若在甚麼事上存別樣的心，神也必以此指示你們。」（3:15）"],["p","第二節，保羅很兇。這裡，他很寬。"],["p","福音的核心，一步都不能讓。其餘的事，可以等神親自教導。"],["q","「我們到了甚麼地步，就當照著甚麼地步行。」（3:16）"],["p","「行」這個字，原是軍隊排成行列前進。"],["p","不必每一個人跑得一樣快，可是要在同一條隊伍裡。"],["p","跌倒了，就從跌倒的那一步，再往前一步。"],["p","可是一個人怎麼知道該往哪裡跑？"],["p","標竿在很遠的地方。保羅說，你們先看前面跑的人。"],["q","第三步：天上的國民。"],["q","「弟兄們，你們要一同效法我，也當留意看那些照我們榜樣行的人。」（3:17）"],["p","可是保羅剛剛才說，我還沒有得著，我還在跑。"],["p","所以他叫你效法的，不是一個已經完全的人，是一個方向。"],["p","「我們」也是複數。第二章他剛介紹過提摩太和以巴弗提。"],["p","保羅說：去看那些這樣行的人。"],["p","321 的改變觀念八大步驟，最後一步叫繁殖。生命是從一個人，傳到一個人。"],["p","弟兄姊妹，我們教會的青年人，看得見誰？"],["p","不是要你完美。是要你誠實地，在跑道上。"],["p","然後保羅寫到一半，停下來了。"],["q","「因為有許多人行事是基督十字架的仇敵。我屢次告訴你們，現在又流淚地告訴你們」（3:18）"],["p","「流淚地」，原文的意思是：我現在一面寫，一面哭。"],["p","同一位使徒，可以大聲說「應當防備」，也可以流著淚說到仇敵。"],["q","清楚地說出真相，同時為他們流淚。"],["p","這些人是誰？「十字架的仇敵」不一定反對基督的名。"],["p","他們很歡迎基督的祝福，只是不要基督的十字架。"],["q","「他們的神就是自己的肚腹。」（3:19）"],["p","人生的方向，由慾望決定。吃，喝，享受，成功，凡事以滿足自己為中心。"],["p","保羅最後說他們「專以地上的事為念」。"],["p","這面鏡子也照我們。如果把我的手機打開，裡面全是地上的事，"],["p","我的國籍，可能早已悄悄地換掉了。"],["p","於是下一節，保羅說到了國籍。"],["q","「我們卻是天上的國民，並且等候救主，就是主耶穌基督從天上降臨。」（3:20）"],["p","請你聽這個「卻」。他們，以地上的事為念；我們，卻是天上的國民。"],["p","「國民」，原文 πολίτευμα。意思是一個城邦的公民團體。"],["q","馬其頓，腓立比城，一條羅馬大道從城中間穿過去。"],["p","使徒行傳說，腓立比是羅馬的駐防城。"],["q","腓立比，是羅馬放在馬其頓的一塊領土。教會，是天國放在腓立比的一塊領土。"],["p","這就是 321 說的，建立屬神的體系：在地上活出天國的法律和文化。"],["p","可是天上的國民，不是不顧地上的人。"],["p","分別在於最後的忠誠。地上的要求和天上的主衝突的時候，"],["p","我們知道，自己的護照是哪一國的。"],["q","「將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似。」（3:21）"],["p","這一節，請你帶到病床旁邊去讀。"],["p","這個會老、會病、會痛的身體，不是被丟掉，是被改變。"],["p","「卑賤」這個字，就是第二章基督「自己卑微」的那個字根。"],["p","基督先走進我們卑賤的形狀，為要把我們帶進他榮耀的形狀。"],["p","弟兄姊妹，我們回到開頭那七根手指。"],["p","保羅把七項資產，一項一項搬進了負債欄。"],["p","可是他怎麼學會這樣算帳的？"],["p","我們回到第二章，那個「算」字第一次落在基督身上的地方。"],["q","「他本有神的形像，不以自己與神同等為強奪的」（2:6）"],["p","保羅的帳本，不是他自己發明的。"],["p","在保羅算帳以前，基督已經先算過一次。"],["p","他知道自己是誰，卻沒有抓住不放。他往下走，"],["q","「自己卑微，存心順服，以至於死」（2:8）"],["p","保羅把他的資產搬進負債欄，為要得著基督。"],["p","基督卻甘心往下走，為要把我們這卑賤的身體，改成他榮耀的形狀。"],["p","還記得第十二節嗎？保羅說，他是被基督耶穌得著的。"],["q","保羅放下了七樣東西，為要得著基督。基督不抓住與神同等，卻得著了保羅。"],["p","也得著了今天坐在這裡的你。"],["p","所以你不必更佩服保羅。你只要更認識他所認識的那一位。"],["p","國度321空中團契常說：改變觀點，就改變觀念。"],["p","它的根不在我們的口號裡。在這裡：因我以認識我主基督耶穌為至寶。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，拿一張紙，寫下你最引以為傲的三樣東西。"],["p","然後問自己一句：如果它們明天都不見了，我在神面前還站得住嗎？"],["p","站得住，靠的就是基督。站不住，那三樣，就是我的割禮。"],["p","第二件，想一個在跑道上跑在你前面的人，這個禮拜去向他學一件事。"],["p","然後，請你不要回頭欣賞自己的獎盃。往前跑。"],["p","因為終點那裡，站著一位等候我們的救主。"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《要靠主常常喜樂》"],["p","弟兄姊妹平安，今天我們一起讀腓立比書第四章。"],["p","這一章裡有一句話，你一定聽過。"],["q","「我靠著那加給我力量的，凡事都能做。」（4:13）"],["p","你在哪裡見過它？"],["p","我見過它印在一件球衣上。一位籃球員，每次罰球前，都低頭親一下胸口。"],["p","我見過它寫在一張考卷的角落。一個高三的學生，鉛筆字，寫得很小。"],["p","我也見過它放在一份創業簡報的最後一頁，下面還畫了一條往上衝的線。"],["p","可是我想問一個問題：那一位球員輸了球，這句話還算不算數？"],["p","那一個學生落榜了，這句話是不是騙了他？"],["p","如果這句話的意思是「有神幫忙，我想做甚麼都會成功」，"],["p","那麼輸了的人、落榜的人、倒閉的人，就只剩下一個結論：我信心不夠。"],["q","一句本來要給人力量的話，最後變成了一根鞭子。"],["p","所以今天，我想請你做一件很簡單的事：往上看一節。"],["q","「我知道怎樣處卑賤，也知道怎樣處豐富；或飽足，或飢餓；或有餘，或缺乏，隨事隨在，我都得了秘訣。」（4:12）"],["p","你聽見了嗎？「或飽足，或飢餓」。"],["p","原來「凡事」，不是一張夢想清單。是一張處境清單。"],["q","保羅說的不是「我凡事都能贏」，是「我餓肚子的時候，也撐得住」。"],["p","這一章有三個字：樂，足，香。"],["p","我們沿著它走三步：在主裡同心，常常喜樂，知足的秘訣。"],["q","羅馬，一間租來的屋子。一條鎖鍊，一頭在保羅手上，一頭在一個羅馬兵手上。"],["p","一個沒有自由的人，在寫全本新約最喜樂的一封信。"],["q","第一步：在主裡同心。"],["q","「我所親愛、所想念的弟兄們，你們就是我的喜樂，我的冠冕。我親愛的弟兄，你們應當靠主站立得穩。」（4:1）"],["p","請你數一數，這一節有幾個命令。"],["p","只有一個：站穩。"],["p","可是保羅把這一個命令，用五句愛包起來。"],["p","親愛的。所想念的。我的喜樂。我的冠冕。最後又叫一聲：親愛的。"],["p","為甚麼這麼小心？因為下一節，他要點兩個人的名字。"],["q","在說難聽的話之前，他先讓每一個人知道：你們是我所愛的。"],["p","「冠冕」，原文 στέφανός，不是國王的王冠，是賽跑得勝的人頭上那一圈花冠。"],["p","第三章保羅說他「向著標竿直跑」。跑到終點，他手上的獎品是甚麼？"],["p","不是一本著作，不是一間會堂，也不是一個頭銜。"],["p","是一群人。一群他愛、也會讓他頭痛的人。"],["p","「站立得穩」，在哪裡站？原文是「在主裡」。"],["p","站得穩，不靠腿力，靠地面。"],["p","站在自己的資歷上，會滑倒；站在別人的掌聲上，會被推倒。站在主裡，地是不動的。"],["p","然後，那兩個名字出現了。"],["q","「我勸友阿蝶和循都基，要在主裡同心。」（4:2）"],["p","兩位姊妹。兩位同工。吵架了。"],["p","可是經文說了另一件事：她們不是壞人。"],["p","好人也會吵架。而且常常，是最肯擺上的同工，吵得最兇。"],["p","保羅怎樣處理？請你仔細聽原文。"],["p","Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ。"],["p","「我勸友阿蝶，我也勸循都基。」一個人一個「我勸」。"],["p","他不偏袒。他沒有在信裡審案。"],["p","他也沒有說：「為了合一，大家都不要再提了。」"],["p","他說：要在主裡同心。"],["p","「同心」，就是第二章「以基督耶穌的心為心」的那個「心」字。"],["p","意思是：把你們的問題，搬到基督的心這塊地上來，重新談。"],["p","然後保羅做了第三件事。他請了一個人。"],["q","「我也求你這真實同負一軛的，幫助這兩個女人」（4:3）"],["p","這個人是誰？我們不知道。有人說是一個名字，有人說是路加，議題頁有整理。"],["p","「幫助」這個字，原文是一起抓住，像兩個漁夫一起把網拉上船。"],["p","他不替任何一方打仗。他蹲下來，和兩邊一起負軛。"],["p","這兩節，在教會裡常常被用錯，我必須說清楚。"],["p","有人把「同心」講成：有意見就是不屬靈。發現問題，不要講出來。"],["p","甚至對受了委屈的那一位說：「不要再吵了，要合一。」"],["p","那不是腓立比書四章二節。那是把問題藏到地毯底下。"],["p","保羅的做法剛好相反。他公開承認問題存在，還請一位雙方都信得過的人進來。"],["p","合一，不是把問題藏起來；是大家一起，把問題帶進主裡處理。"],["p","如果問題牽涉到傷害、牽涉到不公，需要的是公平的處理，是保護，不是一句「要同心」。"],["p","第二章說「不要發怨言」，那是曠野裡對神的不信，不是對不公的申訴。"],["p","我們 321 說的「235」，那個「2」，是屬靈的同伴。"],["p","這位「真實同負一軛的」，就是一個「2」的樣子。"],["p","教會裡最寶貴的人之一，是吵架的兩邊，都願意讓他進門的人。"],["p","今天很多教會，不缺講道的人。缺的是一位肯蹲下來「幫助她們」的人。"],["p","可是兩個吵架的人，心裡多半不是只有生氣。"],["p","保羅好像知道。他下一句話，不是再勸她們，是對全教會說的。"],["q","第二步：常常喜樂。"],["q","「你們要靠主常常喜樂。我再說，你們要喜樂。」（4:4）"],["p","請你留意兩個字：「靠主」。原文是「在主裡」。"],["q","喜樂不是一種心情。喜樂是一個地址。"],["p","環境會變，可是你住在誰裡面，不會變。所以可以「常常」。"],["p","可是我要很小心地說下一句。"],["p","「常常喜樂」，不是「常常笑」。"],["p","同一封信裡，保羅說他寫到十字架的仇敵，是「流淚」地說的。"],["q","「現在又流淚地告訴你們」（3:18）"],["p","他說以巴弗提病了，幾乎要死，神憐恤他，"],["q","「免得我憂上加憂」（2:27）"],["p","寫「常常喜樂」的人，會流淚，也會憂上加憂。"],["p","喜樂可以和眼淚，坐在同一張椅子上。"],["p","所以，請不要拿這一節，對一位剛剛送走父親的人說：「聖經叫你要喜樂。」"],["p","那是把一個邀請，變成一根鞭子。"],["q","「當叫眾人知道你們謙讓的心。主已經近了。」（4:5）"],["p","「謙讓」，原文 ἐπιεικὲς，就是不堅持每一樣權利都要拿到。"],["p","「主已經近了」，不是叫我們去算日子。"],["p","是說：主來的日子近了，所以那件爭到底的事，沒有那麼重要。"],["p","也是說：主就在你身邊，所以下一句的那些掛慮，可以說給他聽。"],["q","「應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」（4:6）"],["p","這一節，在很多人耳朵裡，聽起來像一張罰單。"],["p","「你還在擔心？那就是你信心不夠。」"],["q","「因為我沒有別人與我同心，實在掛念你們的事。」（2:20）"],["p","保羅稱讚提摩太「實在掛念」，原文和四章六節的「掛慮」，是同一個字 μεριμνᾶτε。"],["p","同一個字，在第二章是美德，在第四章是要交出去的。"],["p","差別不在有沒有感覺，在有沒有帶到神面前。"],["p","保羅沒有說：「把擔心吞下去。」他說：「告訴神。」"],["p","禱告，祈求，和感謝。一件一件，具體地說出來。"],["p","如果你正在受焦慮症、憂鬱症的折磨，請你聽清楚："],["q","那不是你信心的成績單。那是一種需要治療的病。"],["p","看醫生，吃藥，接受專業的諮商，和禱告並不衝突。"],["p","以巴弗提生病，保羅沒有說他信心不足，也沒有說他不該被照顧。"],["p","如果有人對你說：「你多禱告就好，不用看醫生。」那是把四章六節用錯了。"],["p","四章六節給你的，是一個出口，不是一張罰單。"],["p","請你一邊把它告訴神，一邊也告訴一位信得過的人，去找專業的幫助。"],["q","「神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。」（4:7）"],["p","請你留意次序。經文沒有說：問題會先解決。"],["p","它說：心先被保守。"],["p","「保守」，原文 φρουρήσει，是一個軍事用語：駐軍把守。"],["p","保羅說：神的平安，也像一隊駐軍，站在你的心門口。"],["p","這平安「出人意外」，因為它不靠你看懂處境。處境還沒變，心已經被守住了。"],["p","我們 321 說「用心靠聖靈」，不是叫人不要用腦。是讓腦也住進平安的保護裡。"],["p","被平安守住的人，仍然會計畫，會求醫，會找人商量。只是不再被恐懼追著跑。"],["p","心守住了，意念就要開始做功課。"],["q","「凡是真實的、可敬的、公義的、清潔的、可愛的、有美名的，若有甚麼德行，若有甚麼稱讚，這些事你們都要思念。」（4:8）"],["p","這一節常被當成「正向思考」：只想好的，壞事就不會來。"],["p","可是清單的第一項，是「真實的」。不是「愉快的」，也不是「順利的」。"],["p","思念真實的事，就是不假裝沒事。"],["p","「思念」，原文 λογίζεσθε，是一個記帳的字。算進去，記進帳本。"],["p","保羅說：你可以選擇記甚麼。不是不記壞帳，是不要讓帳本上只剩壞帳。"],["q","「你們在我身上所學習的，所領受的，所聽見的，所看見的，這些事你們都要去行，賜平安的神就必與你們同在。」（4:9）"],["p","第七節說，神的平安保守你。第九節說，平安的神與你同在。"],["p","前面是禮物。後面，是送禮物的那一位，親自來了。"],["p","講到這裡，你也許會說：保羅，你講得真好。可是你有沒有試過缺錢？"],["p","保羅說：有。下一段，他就要打開他的錢包給你看。"],["q","第三步：知足的秘訣。"],["p","以巴弗提從腓立比走了一千多公里，帶來一份餽送。保羅「靠主大大地喜樂」，喜樂的不是錢，是一份愛又開花了。"],["q","「我並不是因缺乏說這話；我無論在甚麼景況都可以知足，這是我已經學會了。」（4:11）"],["p","「知足」，原文 αὐτάρκης，是當時哲學家最愛的一個字：修練到不需要任何外物。"],["p","保羅借了這個字，可是換了它的心。"],["p","這一節最安慰人的，是最後兩個字：「學會」。"],["p","知足是一門課，不是一個開關。"],["p","保羅不是天生知足的人。他是在一次又一次的飽足與缺乏裡，學出來的。"],["p","所以一個還在為房貸、為工作、為病痛擔心的人，不必因為還沒學會而責備自己。"],["p","我也要說清楚：知足，不是放棄一切合理的追求。"],["p","保羅說他「也知道怎樣處豐富」。知足不是叫勞工不能爭取應得的工資，也不是叫人留在不安全的地方。"],["p","知足，是心不被處境綁架，不是對不公沉默。"],["p","現在，我們回到開場的那一節。"],["p","「得了秘訣」，原文 μεμύημαι，是當時神秘宗教的入門用語。"],["p","保羅說：我也被帶進了一個秘密。"],["q","那個秘密，不是一個方法。是一個人。"],["q","「我靠著那加給我力量的，凡事都能做。」（4:13）"],["p","有的古卷在這裡多了「基督」兩個字；和合本跟著較早的抄本。可是意思不變，加給力量的就是主。"],["p","「凡事」，就是上一節那張清單：飽足，飢餓，有餘，缺乏。"],["q","餓肚子的時候，我也撐得住；缺乏的時候，我也能知足；被降到最低的時候，我也不會失去自己。"],["p","四章十三節是知足的力量，不是必勝的保證。"],["p","那位罰球沒進的球員、那個落榜的學生、那位生意倒了的弟兄，都可以讀四章十三節。"],["p","而且，他們讀得最準。"],["p","因為「凡事都能做」，包括輸了以後，仍然站得住，仍然不離開主。"],["p","如果把它講成「信心夠就一定贏」，輸了的人就只剩下罪疚。那正好把經文講反了。"],["p","還有更深的一層，藏在一個動詞裡。"],["p","第十二節「處卑賤」，原文 ταπεινοῦσθαι。"],["q","「既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。」（2:8）"],["p","「自己卑微」，和「處卑賤」，是同一個動詞。"],["p","基督往下走，神將他升為至高。保羅往下走，主加給他力量。"],["q","保羅在監牢裡學會的，就是基督走過的那條路。"],["p","我們 321 說的「得勝者」，就以這裡為準：不是凡事都成功的人，是在缺乏裡仍然站得住的人。"],["p","知足的保羅，下一句卻說：謝謝你們。"],["q","「然而，你們和我同受患難原是美事。」（4:14）"],["p","知足，不是說「我不需要任何人」。那是驕傲，不是知足。"],["p","保羅會說出需要，也會收下別人的愛。"],["q","「我並不求甚麼餽送，所求的就是你們的果子漸漸增多，歸在你們的帳上。」（4:17）"],["p","保羅收了錢，卻說他求的不是錢。他在乎的，是給的人自己。"],["p","一個坐監的人說：「我樣樣都有。」這就是第十一節的知足，活出來了。"],["p","他還說，這份餽送是「極美的香氣」，這使我們想起出埃及記壇上的燔祭。"],["p","腓立比人以為他們是在寄錢。保羅說：你們是在向神獻祭。"],["p","這就是這一章的第三個字：香。教會裡最平凡的一次奉獻，在神面前是馨香的敬拜。"],["q","「我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。」（4:19）"],["p","這一節，也常被講成一條投資公式：你奉獻越多，神就越使你富足。"],["p","哥林多後書描寫過馬其頓的教會，腓立比就是其中一間："],["q","「在極窮之間還格外顯出他們樂捐的厚恩」（林後 8:2）"],["p","這不是一間有錢的教會在投資。是一間已經為福音奉獻到很窮的教會。"],["p","而且經文說的是「所需用的」，不是「所想要的」。"],["p","四章十九節是一位父親對孩子的承諾，不是一家銀行給客戶的利息表。"],["p","然後保羅不再談錢，開始敬拜："],["q","「願榮耀歸給我們的父神，直到永永遠遠。阿們！」（4:20）"],["p","談錢的段落，用敬拜收尾。錢的話題若不能讓人更愛神，就是談錯了方向。"],["p","最後，是幾句問安。可是問安裡，藏著全卷最驚人的一行字。"],["q","「眾聖徒都問你們安。在凱撒家裡的人特特地問你們安。」（4:22）"],["p","「凱撒家裡的人」，不是皇帝的親戚，是皇宮裡的奴僕、管家、文書、官員。"],["p","第一章保羅說，他所遭遇的事，更是叫福音興旺。我們現在看見，興旺到了哪裡。"],["p","鎖鍊鎖住了保羅，卻沒有鎖住福音。它一路走進了皇帝的家。"],["p","今天在政府、在公司、在醫院裡上班的弟兄姊妹，你就是新的「凱撒家裡的人」。"],["q","「願主耶穌基督的恩常在你們心裡！」（4:23）"],["p","原文是「與你們的靈同在」，和合本譯成「常在你們心裡」。"],["p","一個坐監的人，沒有用命令收尾。他用恩收尾。"],["p","弟兄姊妹，最後，我們回到那件球衣。"],["p","如果你願意，你還是可以把四章十三節印在上面。"],["p","只是請你在它的上面，再印一行小字：「或飽足，或飢餓」。"],["p","因為那一位加給你力量的，自己先走過飢餓。"],["p","他取了奴僕的形像，自己卑微，一路往下，以至於死在十字架上。"],["q","加給你力量的那一位，是先走到最低處的那一位。"],["p","所以你在最低處的時候，他不是遠遠地替你加油。他就在那裡。"],["p","你可以靠主常常喜樂，因為你的地址在他裡面，不在處境裡面。"],["p","你可以把掛慮說給他聽，讓他出人意外的平安，守住你的心門。"],["p","你可以慢慢學會，在甚麼景況都可以知足。"],["p","你可以靠著那加給你力量的，凡事都能做，包括飢餓，包括缺乏，包括輸了以後再站起來。"],["p","而這一位的福音，連凱撒的家都擋不住，一定也走得進你的家、你的公司、你的病房。"],["p","你只要更認識那一位，先往下走、又被高舉、一直加給人力量的主。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，如果你心裡有一個掛慮，已經繞了很多圈，"],["p","今天晚上，一件一件，具體地說給神聽。需要的話，也說給一位信得過的人聽。"],["p","第二件，如果你身邊有兩個人不說話了，而他們都信得過你，"],["p","請你不要選邊，也不要叫他們閉嘴。蹲下來，做那一位「真實同負一軛的」。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——一封感謝信寫給誰？今天的腓立比在哪裡？","r":"1:3--11；2:25--30；4:2--3；4:10--20","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前 ISS00_1），本卷補述：一封感謝信的處境——一間與保羅合夥福音的教會，開始出現內部不和、外有逼迫。腓立比書沒有哥林多前書那一長串要回答的問題，也沒有加拉太書那樣的怒氣，於是常被讀成一篇沒有處境的喜樂小品；也有人只抓住第 4 章兩位姊妹的名字，把全卷讀成一封調解信。這封信為甚麼寫、寫給一間怎樣的教會、今天的腓立比在哪裡，必須在開卷講定，全卷四章的落點才不會飄在半空。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：保羅寫信給特定地區、特定年代、遇到特定問題的教會；讀信的人要先找出他的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：腓立比人遇到甚麼？保羅從福音推出甚麼原則？今天這原則落在哪裡？</p><p>本卷要補的只有一段：<strong>腓立比書是一封感謝信。</strong>腓立比教會派以巴弗提送來餽送——「因我從以巴弗提受了你們的餽送，當作極美的香氣」（4:18）；以巴弗提在保羅身邊病倒了，「他實在是病了，幾乎要死」（2:27）；痊癒以後，保羅打發他帶著這封信回去（2:25–30）。</p><p>可是這封感謝信裡也藏著別的事。這是一間與保羅「從頭一天直到如今」（1:5）同心合意興旺福音的教會；裡面卻開始有人結黨——「凡事不可結黨，不可貪圖虛浮的榮耀」（2:3），兩位同工姊妹不和——「我勸友阿蝶和循都基，要在主裡同心」（4:2）；外面有逼迫——「凡事不怕敵人的驚嚇」（1:28）；還有一股要外邦信徒受割禮的影響——「應當防備犬類，防備作惡的，防備妄自行割的」（3:2）。<strong>經文問的是：這封信的處境到底是甚麼？是一封謝函、一封調解信，還是一封警告信？今天的讀者要把它放在哪一間教會裡讀？</strong></p>"],["喜樂小品說（沒有特定處境，是一篇超越時空的喜樂靈修書）","","<p>認為腓立比書是保羅書信中最溫暖、最私人的一封，沒有大型的教義爭論，也沒有嚴重的道德問題，所以不必費力重建處境，直接當作一本喜樂的靈修書來讀就可以了。這派抓住了一件真實的事：「喜樂」在這四章裡出現了十六次，保羅對這間教會的語氣是全本新約最親的——「我所親愛、所想念的弟兄們，你們就是我的喜樂，我的冠冕」（4:1）。</p><p><strong>難處：</strong>這卷書的喜樂，是寫在捆鎖裡的（1:7、13）、寫在「無論是生是死」（1:20）的未知裡的、寫在一間有人結黨、有人吵架、外面有人恐嚇的教會面前的。把處境拿掉，喜樂就從「靠主」（4:4）變成一種心情，最後變成對受苦的人說「你要喜樂」的口號——這正是本卷紅線三要防備的（見 ISS00_5）。而且第 3 章「應當防備犬類」那樣嚴厲的話，喜樂小品說也很難安放。</p>"],["單一危機說（全卷是為了解決某一場危機而寫）","","<p>認為這封信背後有一場具體的危機，其他段落都是為它鋪路。有學者以 4:2–3 為全卷的目標：保羅先在第 2 章唱出基督之歌，用基督的心作根基，最後才點名勸兩位姊妹和好；也有學者以 3:2 的「妄自行割的」為主線，把腓立比書讀成一封較溫和的加拉太書。這派的優點是認真找處境，而且找到的線索都是真的：2:2「意念相同」與 4:2「同心」原文是同一組字（τὸ αὐτὸ φρονεῖν），前後確實呼應。</p><p><strong>難處：</strong>4:2–3 只有兩節，3:2 的人可能根本還沒有到腓立比——「應當防備」是預防，不像加拉太書那樣「你們這樣快離開」。若硬把全卷掛在某一場危機上，1:12–26 保羅自己的景況、2:19–30 提摩太與以巴弗提、4:10–20 的感謝，都會變成附件；而這幾段在信裡佔的篇幅，比任何一場「危機」都大。</p>"],["友誼與合夥書信說（一封寫給福音夥伴的友誼信）","","<p>認為腓立比書最接近古代的「友誼書信」：報告自己的景況、詢問對方的景況、介紹往來的人、感謝對方的情誼。更重要的是信裡一再出現的合夥語言：1:5「同心合意地興旺福音」原文是「在福音上的合夥」（κοινωνία）；4:15「論到授受的事」是當時帳目往來的用語；4:17「歸在你們的帳上」更是會計用詞。所以這是一封寫給生意夥伴——福音生意的夥伴——的信。這派的優點是同時接住了感謝、報告與勸勉，信裡的每一段都找得到位置。</p><p><strong>難處：</strong>古代友誼書信的格式套不套得上，學界仍有爭論；若只講成「友誼」，容易漏掉 2:6–11 那首高到萬膝跪拜的基督之歌，也會漏掉保羅刻意不讓這份情誼變成施恩與受恩的關係——「我並不是因缺乏說這話」（4:11），「我並不求甚麼餽送」（4:17）。合夥的中心不是彼此，是福音。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補一段：腓立比書是一封感謝信，寫給一間與保羅在福音上合夥的教會；處境是一間很愛主、很會奉獻、同工卻開始互相看不順眼的教會，外面還有逼迫與錯誤教導的壓力。</strong>本講義以「感謝與合夥」為框架，吸收單一危機說的觀察：不和是真的、割禮的壓力是真的，但它們是這間好教會身上的病，不是這封信唯一的主題。</p><p>所以全卷的四個動作都有地方落腳：<strong>活</strong>——一個在捆鎖裡的人說「我活著就是基督」（1:21）；<strong>心</strong>——對一間開始結黨的教會說「你們當以基督耶穌的心為心」（2:5）；<strong>跑</strong>——對一間被割禮派拉扯的教會說「向著標竿直跑」（3:14）；<strong>足</strong>——對一間奉獻到自己也缺乏的教會說「我無論在甚麼景況都可以知足」（4:11）。</p><p><strong>今天的腓立比，就是每一間很愛主、很會奉獻、同工卻開始互相看不順眼的華人教會。</strong>全卷四章的落點，都照這一條量：一個在捆鎖裡的人，怎樣在今天的家、教會、職場與病床旁，以基督的心為心？</p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，知道這封信的處境，正是一種安慰。這封信不是寫給一間完美的教會，是寫給一間保羅一想起來就感謝、卻也必須點名勸和的教會：「我每逢想念你們，就感謝我的神」（1:3），同一封信也說「我勸友阿蝶和循都基」（4:2）。保羅沒有因為她們不和，就收回對全教會的感謝；也沒有因為感謝，就假裝不和不存在。</p><p>如果你所在的教會也是這樣——很愛主、很肯付出、卻有幾位同工之間的話越說越少——腓立比書是寫給你們的。<strong>最高的神學（2:6–11），是為最實際的關係（4:2）寫的；那在你們中間「動了善工的，必成全這工」（1:6）。</strong></p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。腓立比書是一封感謝信，寫給一間與保羅在福音上合夥的教會；處境是一間很愛主、很會奉獻、同工卻開始互相看不順眼的教會，外有逼迫與割禮的壓力。今天的腓立比，就是每一間這樣的華人教會。","care":"牧養底線：講「今天的腓立比」時，不點名、不影射教會裡任何兩位同工，不把友阿蝶和循都基講成笑話——席上可能正坐著兩位彼此冷戰的同工，他們需要的是被帶進主裡同心，不是在台下被眾人猜是誰。也要想到像以巴弗提那樣默默付出、病倒了還怕別人擔心的人（2:26），對他們，要先講保羅怎樣「尊重這樣的人」（2:29）。不要借這封感謝信要求會眾更多奉獻：保羅自己說「我並不求甚麼餽送」（4:17）。"},{"id":"ISS00_2","t":"虛己與無己——基督倒空了甚麼？321 的「無己」是沒有自己嗎？","r":"2:1--11；2:19--30；3:7--10","ch":[],"why":"二、基督虛己是取了奴僕的形像，不是放棄神性；無己是不以自己為中心，不是沒有自己——本講義的全卷立場之二（本卷新立）。這是本卷最重要的一題，因為它直接定義 321 的「無己」。2:7「反倒虛己」是全本新約講基督下降最徹底的一句，也是教會歷史上被用得最多、也被用錯得最多的一句：有人據此說基督放下了神性，有人據此要求受委屈的人不可以說話、同工不可以有需要、會友要無條件順服領袖。基督倒空了甚麼、我們以他的心為心是要倒空甚麼、無己的人能不能有感受和界線，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「你們當以基督耶穌的心為心：他本有神的形像，不以自己與神同等為強奪的；反倒虛己，取了奴僕的形像，成為人的樣式」（2:5–7）。「虛己」原文 ἑαυτὸν ἐκένωσεν——「把自己倒空」。經文問的是：基督倒空了甚麼？我們「以基督耶穌的心為心」，是要倒空甚麼？321 的「無己」與這段經文是甚麼關係？「無己」的人可以有需要、有感受、有界線嗎？</p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、基督虛己時，沒有停止是神</strong>：「他本有神的形像」（2:6）——ὑπάρχων 是現在分詞，意思是<strong>一直是</strong>。<strong>二、虛己的方式是「取了」</strong>：「取了奴僕的形像」（2:7）——μορφὴν δούλου λαβών，<strong>是加上，不是減去</strong>；倒空的是「抓住不放」（2:6 ἁρπαγμός，「強奪的」），不是本質。<strong>三、虛己是主動的、自由的</strong>：ἑαυτὸν，「他自己」——不是被人倒空，是自己倒空；2:8「自己卑微」也是 ἑαυτὸν。<strong>被迫的不叫虛己，叫受害。</strong><strong>四、虛己有方向：為了別人</strong>——2:5 的上一節是「各人不要單顧自己的事，也要顧別人的事」（2:4），注意那個「也」。<strong>五、虛己的結局是被高舉</strong>：「所以，神將他升為至高」（2:9）——往下走不是消失，是神的路。</p>"],["古典讀法（教父、改教家：倒空的方式就是「取了」——加上人性，不是減去神性）","","<p>從早期教父到改教家的主流讀法：2:7 的「虛己」由後面的分詞來解釋——基督倒空自己的方式，就是「取了奴僕的形像，成為人的樣式」。他沒有放下神性，而是在神性之外取了人性；奧古斯丁說，他取了奴僕的形像，卻沒有失去神的形像。加克墩會議（451）宣告基督的神人二性「不相混亂、不相交換、不能分開、不能離散」，就是這個讀法的信經表述。這派最強的地方是緊貼 2:6 的現在分詞「本有」，也與「他本來富足，卻為你們成了貧窮」（林後 8:9）相合。</p><p><strong>難處：</strong>若講得太像教義公式，容易讓人覺得基督「只是多加了一樣東西」，好像沒有真正失去甚麼，於是 2:7–8 那一路往下、直到十字架的代價就被講輕了。所以古典讀法要同時講清楚：他放下的是榮耀的顯現與權利的使用——這使我們想起他在地上的禱告：「就是未有世界以先，我同你所有的榮耀」（約 17:5）——那份榮耀，他真的暫時沒有顯出來。</p>"],["虛己論（十九世紀德國與英國：基督在地上暫時放下全知、全能、無所不在）","","<p>十九世紀德國的托馬修斯（Gottfried Thomasius）等路德宗神學家，與英國的戈爾（Charles Gore）等人，認為「虛己」的意思是：基督成為人的時候，暫時放下了全知、全能、無所不在這些「相對的」神性屬性，只保留聖潔、愛、公義等「道德的」屬性。這派的心志是認真看待耶穌真實的人性：他會餓、會累、會哭，還說過「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道」（可 13:32）。</p><p><strong>難處：</strong>它與 2:6 的現在分詞「本有」（一直是）不合——經文沒有說他曾經停止是神。而且 ἐκένωσεν 在這裡沒有說「倒空了甚麼屬性」，經文自己的解釋是後面的「取了」；一位暫時不全能、不全知的神是否仍是神，三位一體在那段時間怎樣運作，虛己論都很難回答。本講義陳列，不採用。</p>"],["自限說（神性屬性都在，但基督自願不獨立使用，完全倚靠父與聖靈）","","<p>近代一些福音派神學家提出較溫和的讀法：基督的神性屬性一樣都沒有失去，但他在地上自願不獨立地使用它們，凡事順服父、倚靠聖靈。這使我們想起耶穌自己的話：「子憑著自己不能做甚麼，惟有看見父所做的，子才能做」（約 5:19）。這派的優點是同時接住了 2:6「本有神的形像」與福音書裡真實的人性，也把「虛己」講成一種關係裡的順服，而不是屬性的減少——這與 2:8「存心順服」很貼近。</p><p><strong>難處：</strong>各家用語不一致，有時講著講著又滑回虛己論；「不獨立使用」的界線經文沒有細說——他仍然平靜風浪、赦免人的罪、說「我與父原為一」。本講義把它陳列為溫和讀法，它的觀察可以補充古典讀法，但不取代古典讀法。</p>"],["屬靈操練傳統的應用（自我倒空、治死己、破碎、對付己）","","<p>教會歷史上許多靈修傳統，都從 2:7 汲取力量：天主教與東正教的「自我倒空」靈修，清教徒講「治死己」與治死罪（歐文 John Owen），中國教會傳統講「破碎」「對付己」（倪柝聲《屬靈人》、《釋放靈》等）。這些傳統嚴肅地對待人心裡的驕傲與自我中心——那正是腓立比書指名的病：「凡事不可結黨，不可貪圖虛浮的榮耀」（2:3），「別人都求自己的事，並不求耶穌基督的事」（2:21）。許多人在這些傳統裡真的被主改變，學會了不再凡事以自己為中心。</p><p><strong>難處：</strong>若「己」的定義不清楚，就容易把神所造的人格、情感、需要、界線，都當成要「對付」的己；在權力不對等的群體裡，「你還沒有破碎」「你的己太大」會被用來要求無條件順服、壓下受委屈者的聲音——那是屬靈虐待（回指哥林多後書立場三）。而且 2:7 的主詞是基督「自己」倒空自己，<strong>沒有一個人有權柄去倒空別人。</strong></p>"],["心理學與牧養學的提醒（健康的自我，才能真正給出）","","<p>近代心理學與牧養學提醒教會：憂鬱、低自尊、自我厭惡、不敢說「不」，不是謙卑，是需要被醫治的傷；一個沒有界線的人，往往不是愛得多，而是怕得多。有穩定身分感的人，才能自由地給出，而不是被榨乾。這個提醒在腓立比書裡找得到根：保羅坦白說自己「免得我憂上加憂」（2:27），也坦白說「然而，你們和我同受患難原是美事」（4:14）——他不假裝自己沒有需要；他也會說「應當防備」（3:2）——他會設界線。</p><p><strong>難處：</strong>若只講「健康的自我」，把自我實現當成目標，就會滑回 2:21 的「求自己的事」，與 2:3–4 背道而馳。2:5–8 的方向是往下、為了別人，不是自我成就。所以這個提醒是護欄，不是路線：它幫我們分辨甚麼不是無己，但無己本身的樣子，仍要由 2:5–8 來定。</p>"],["【三】本講義站在哪裡","","<p><strong>基督論：採古典讀法——基督虛己是取了奴僕的形像，不是放棄神性。</strong>第 2 章的原文解經畫出詩行骨架（往下七步、往上三步），三家並陳；虛己論陳列不採，自限說陳列為溫和讀法。講台的落點不在倒空了甚麼，在為甚麼倒空——為了別人（2:4）。</p><p><strong>321「無己」的定義，以 2:5–8 為準：無己是不以自己為中心（2:3–4、2:21 的反面），不是沒有自己；不是自我消滅，是自我給出。</strong>基督虛己的時候，完全知道自己是誰；我們無己，也是因為知道自己在基督裡是誰。無己的人：<strong>知道自己是誰</strong>——在基督裡蒙愛、蒙召、有身分（1:1「聖徒」；3:20「天上的國民」）；<strong>自由地給出</strong>——不是被逼、被操控、被剝奪；<strong>仍然有分辨</strong>（1:9–10；1:15–17；3:2）；<strong>仍然可以說出需要</strong>——保羅說「免得我憂上加憂」（2:27），也說「你們和我同受患難原是美事」（4:14）；<strong>仍然可以設界線</strong>——「應當防備」（3:2）。</p><p><strong>321 說「無己不是沒有，乃是進入無限、活出無限」——這句話的經文根據就是 2:9：往下走到底的人，神把他升為至高。</strong>而「舊人有己」被治死的，是以自己為中心的那個舊生命——「我們的舊人和他同釘十字架」（羅 6:6），「這舊人是因私慾的迷惑漸漸變壞的」（弗 4:22）——<strong>不是神所造的人格、情感、恩賜。</strong>加拉太書 2:20 是無己的宣告，腓立比書 2:5–8 是無己的樣子；先讓基督之歌唱完，321 才在末端接上去。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：基督為我們捨己，我們因著他的愛，也學習為人捨己。</strong>古典讀法、虛己論、自限說爭的是基督倒空的方式，沒有一派否認他「存心順服，以至於死，且死在十字架上」（2:8），也沒有一派否認「神將他升為至高」（2:9）。</p><p>如果你曾經被人用「無己」「破碎」壓過——被說你的感受不重要、你說出委屈就是還有己——請重新讀 2:6：那位倒空自己的主，自始至終知道自己是誰；他是自己選擇往下走，沒有任何人逼他。<strong>無己不是叫你消失，是叫你在基督裡站穩了，才自由地為人彎下腰。</strong>你在基督裡是「聖徒」（1:1），是「天上的國民」（3:20）——這是無己的起點，不是無己要倒掉的東西。</p>"]],"con":[],"say":"本講義的全卷立場：基督虛己是取了奴僕的形像，不是放棄神性（採古典讀法；虛己論陳列不採，自限說陳列為溫和讀法）。321 的「無己」以 2:5–8 為準：無己是不以自己為中心，不是沒有自己；不是自我消滅，是自我給出。無己的人知道自己在基督裡是誰、自由地給出、仍有分辨、仍可說出需要、仍可設界線；「舊人有己」被治死的，是以自己為中心的舊生命，不是神所造的人格、情感與恩賜。","care":"牧養底線：不對受虐者、受控制者說「你要更無己」「你的痛苦是因為還有己」（紅線一）；不用「無己」「破碎」「對付己」要求同工無條件順服領袖——那是把 321 變成屬靈虐待的工具（回指哥林多後書立場三）；不把憂鬱、低自尊、自我厭惡誤認為「無己」——那需要被醫治、必要時尋求專業協助，不是被稱讚。講無己，一定同時講身分：先講「你是誰」（1:1；3:20），才講「你可以為別人放下甚麼」。席上會有在家裡或教會裡長期不敢說話的人，講完這一題，他應該更知道自己在基督裡是誰，而不是更不敢開口；察覺有人正處在被控制或受虐的處境，會後單獨關心，協助他找到安全與可信任的幫助。"},{"id":"ISS00_3","t":"生與死：盼望、受苦與保護生命——「死了就有益處」怎樣讀？","r":"1:19--26；2:17；2:25--30；3:20--21","ch":[],"why":"三、1:21–24 是一段選擇活下去的經文；生死的主權在神；面對有輕生念頭的人，先陪伴、保護生命——本講義的全卷立場之三（本卷新立）。「我死了就有益處」「情願離世與基督同在」是全本新約最常在追思禮拜上被讀的經文，也是最可能被一位正在痛苦中、有輕生念頭的人讀錯的經文。講台上一句浪漫化死亡的話，對台下正在掙扎的人可能很危險；而人死後立刻到主那裡嗎，各宗派也有不同看法。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「因我活著就是基督，我死了就有益處」（1:21）；「我正在兩難之間，情願離世與基督同在，因為這是好得無比的」（1:23）。經文問的是：基督徒可以盼望死亡嗎？保羅想死嗎？人死後立刻到主那裡嗎？一位正在痛苦中、有輕生念頭的人讀到這兩節，該怎麼辦？</p><p>先讓經文自己說五件事。<strong>一、保羅的「死了有益」，是因為「與基督同在」</strong>（1:23）——益處是一個人，不是逃離痛苦。<strong>二、保羅選擇了活下去，而且理由是別人</strong>：「然而，我在肉身活著，為你們更是要緊的」（1:24）；「我既然這樣深信，就知道仍要住在世間，且與你們眾人同住」（1:25）。全段的結論不是「死」，是「活」。<strong>三、生死的主權在神</strong>：「無論是生是死，總叫基督在我身上照常顯大」（1:20）——保羅沒有替自己決定。<strong>四、神憐恤病人</strong>：「他實在是病了，幾乎要死；然而神憐恤他，不但憐恤他，也憐恤我，免得我憂上加憂」（2:27）——病得要死不是神要的，保羅也坦白說他「憂」。<strong>五、最後的盼望是身體復活</strong>：「將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似」（3:21）。</p>"],["居間狀態說（信徒死後靈魂立刻與基督同在，等候身體復活）","","<p>多數福音派與改革宗的讀法：信徒死的時候，身體歸於塵土，靈魂立刻與基督同在，有知覺、得安息，等候主再來時身體復活。根據是 1:23「離世與基督同在」——保羅把「離世」與「與基督同在」緊緊連在一起，中間沒有空檔；並見「我們坦然無懼，是更願意離開身體與主同住」（林後 5:8），以及耶穌對十字架上強盜說的「今日你要同我在樂園裡了」（路 23:43）。這派也保住了 3:21 的身體復活：居間狀態是「好得無比的」，卻還不是終點。</p><p><strong>難處：</strong>聖經對居間狀態說得很少，靈魂離開身體怎樣有知覺、與復活的身體怎樣接續，經文沒有細說；講得太滿，容易變成希臘式的「靈魂得釋放、身體不重要」，反而把 3:21 的身體復活講輕了。所以這派要同時說：今天「與基督同在」是真實的安慰，身體復活才是最後的盼望。</p>"],["靈魂睡覺說（死後無意識，直到復活那一刻）","","<p>部分重洗派傳統、基督復臨安息日會等主張：人死後進入無意識的狀態，好像睡著，直到復活。根據是新約常用「睡了」形容信徒的死——「那已經在耶穌裡睡了的人，神也必將他們與耶穌一同帶來」（帖前 4:14）；而且對死者本人來說，閉眼與復活之間沒有感覺到時間，所以保羅可以說「離世與基督同在」。這派的優點是很重視身體復活，不把人講成「暫住在身體裡的靈魂」。</p><p><strong>難處：</strong>1:23 說離世與基督同在「好得無比」，若死後只是無意識，很難說比在肉身裡事奉更好；「睡了」在新約多半是對死亡的溫柔說法，重點在「會醒來」，未必是在描述死後沒有知覺。林後 5:8「離開身體與主同住」也較難用這個讀法解釋。</p>"],["即時復活說（信徒一死，就領受復活的身體）","","<p>少數學者認為：信徒死的那一刻就進入復活的狀態，從死者的角度看，死亡與復活之間沒有間隔；有人以林後 5:1「我們若有地上的帳棚」接著說「必得神所造……的房屋」為根據。這派的優點是把 1:23 的「與基督同在」講得很完整，也避開了「沒有身體的靈魂」這個難題。</p><p><strong>難處：</strong>它很難與 3:20–21 對齊——保羅說我們「等候救主……從天上降臨」，身體的改變是在主降臨的時候；帖前 4 章與林前 15 章也把復活放在主再來的那一刻，「就在一霎時，眨眼之間，號筒末次吹響的時候」（林前 15:52）。把復活提前到每個人死的時候，等於把新約一同復活的盼望拆成了一個人一個人的事件。</p>"],["殉道選擇說（1:22「挑選」是保羅在考慮放棄申辯、迎向殉道）","","<p>有學者注意到 1:22「我就不知道該挑選甚麼」用了「挑選」這個字，認為保羅面對審判時，可能真的在考慮要不要放棄為自己申辯、接受死刑；也有少數學者把這段放進古代哲學討論「主動赴死」的背景裡讀。這派的優點是認真看待保羅的處境：他是一個隨時可能被判死刑的囚犯（1:13、20），這不是一段在書房裡寫的默想，是一個人在生死邊緣的真實掙扎。</p><p><strong>難處：</strong>經文自己給的答案非常清楚：保羅說的「挑選」，最後是被「為你們更是要緊的」（1:24）決定的，而且他「深信」自己「仍要住在世間」（1:25）；他在 1:20 已經把生死交在神手裡——「無論是生是死」，主詞是基督被顯大。<strong>這段經文從頭到尾沒有一個字鼓勵人自己結束生命，它的方向是把生命交給神、為別人活下去。</strong>本講義陳列這個觀察，是為了說清楚：保羅的掙扎是真的，他的結論是活。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：1:21–24 是一段選擇活下去的經文，不是一段羨慕死亡的經文。</strong>死後的狀態，居間狀態說、靈魂睡覺說、即時復活說並陳，<strong>採多數福音派讀法</strong>：信徒死後與基督同在（1:23；林後 5:8），等候身體復活（3:21）。</p><p><strong>基督徒可以盼望天家，但不可以自己結束生命——生命是神的</strong>（1:20「總叫基督在我身上照常顯大」）。<strong>面對有輕生念頭的人</strong>，教會的第一件事是陪伴與保護生命：不責備、不說「你信心不夠」、不說「自殺的人不能上天堂」——那不是陪伴，是定罪；要協助他連結專業協助與危機支援，並請家人或可信任的人陪著他。保羅自己也走過「甚至連活命的指望都絕了」（林後 1:8）的時候——想死的感覺不是罪，是需要被接住的痛。</p><p><strong>面對臨終與喪親的人</strong>，1:23 是安慰——「情願離世與基督同在，因為這是好得無比的」（1:23）；<strong>但不用它叫人「不要哭」</strong>：這使我們想起拉撒路的墳前，「耶穌哭了」（約 11:35）。講 1:21–23，一定讀到 1:24–25（紅線二）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：死亡不能使信徒與基督隔絕；基督要使我們的身體復活。</strong>「因為我深信無論是死，是生……都不能叫我們與神的愛隔絕」（羅 8:38–39）。死後的細節怎樣，學者還會討論下去；但「與基督同在」與「和他自己榮耀的身體相似」（3:21），各派都抓得住。</p><p>如果你此刻覺得活著很累，甚至想過不如不在，請先聽見 1:24 這一句：<strong>「然而，我在肉身活著，為你們更是要緊的」——你的活著，對身邊的人是要緊的，對神也是。</strong>請把這份重擔說出來，告訴一位你信得過的人、你的牧者，或當地的生命線與自殺防治專線；若你此刻有立即的危險，請馬上聯絡當地的緊急救援。保羅沒有獨自留在兩難之間，你也不必。</p>"]],"con":[],"say":"本講義的全卷立場：1:21–24 是一段選擇活下去的經文——保羅的結論是「我在肉身活著，為你們更是要緊的」（1:24）；生死的主權在神（1:20）。死後的狀態採多數福音派讀法：信徒死後與基督同在，等候身體復活（靈魂睡覺說、即時復活說並陳）。基督徒可以盼望天家，但不可以自己結束生命；面對有輕生念頭的人，先陪伴、保護生命，協助尋求專業協助。","care":"牧養底線：講 1:21–23 一定讀到 1:24–25（紅線二）；講台上不浪漫化死亡——「早點回天家多好」這種話，對台下正在掙扎的人很危險。若有人表達輕生念頭：認真看待，不追問細節、不說教、不責備，陪他、聽他，協助他連結當地的專業協助與危機專線，請家人或可信任的人陪著他，有立即危險時聯絡緊急救援，會後單獨關心、持續跟進；絕不說「你信心不夠」「自殺的人不能上天堂」。對因親人輕生而哀傷的家屬，不論斷逝者，把他交託給神的憐憫，先陪他們哭。1:23 可以安慰臨終與喪親的人，但不用它叫人不要哭；也不用 1:29「為他受苦」美化病痛或叫人放棄治療。"},{"id":"ISS00_4","t":"成聖與完全：做成得救的工夫——基督徒能在今生「完全」嗎？","r":"1:6；2:12--13；3:12--16","ch":[],"why":"四、得救本乎恩，做成是恩典的果效；完全在本卷是成熟，成熟的人知道自己還在跑——本講義的全卷立場之四（本卷新立）。2:12「恐懼戰兢做成你們得救的工夫」常被讀成靠行為保住救恩，叫人活在掉下去的恐懼裡；3:12「已經完全了」與 3:15「完全人」又牽動了教會歷史上「今生能否完全」的長久爭論，而 321 自己講「成為得勝者」，也要說清楚得勝者是誰。這一題關係到全卷第 2、3 章的落點，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「就當恐懼戰兢做成你們得救的工夫」（2:12）——得救不是本乎恩嗎？還要「做」？「這不是說我已經得著了，已經完全了」（3:12），兩節以後卻說「所以我們中間，凡是完全人總要存這樣的心」（3:15）——基督徒能在今生「完全」嗎？</p><p>先讓經文自己說四件事。<strong>一、2:12 與 2:13 必須一起讀</strong>：「做成」（κατεργάζεσθε）是把已經有的活出來、做到底；因為「你們立志行事都是神在你們心裡運行，為要成就他的美意」（2:13）。神在裡面作，我們在外面活。<strong>二、「得救的工夫」是複數的「你們」</strong>（τὴν ἑαυτῶν σωτηρίαν）——上下文是 2:1–4 的合一，是一起把得救的樣子活出來。<strong>三、3:12「還沒有完全」與 3:15「完全人」不矛盾</strong>：3:12 的 τετελείωμαι 是「已經到終點」，3:15 的 τέλειοι 是「成熟的人」——<strong>成熟的標記，正是知道自己還沒到終點、還在跑。</strong><strong>四、神會成全</strong>：「我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子」（1:6）。</p>"],["改革宗（成聖是一生漸進的，今生不會無罪）","","<p>改革宗與多數長老會、浸信會傳統認為：人得救時一次被稱義，成聖卻是一生的過程，聖靈在信徒裡面一點一點改變他，直到見主面那天才完全；今生的信徒仍會犯罪，「我們若說自己無罪，便是自欺，真理不在我們心裡了」（約壹 1:8）。這派最強的地方是緊貼 3:12–13 保羅自己的口吻：「我不是以為自己已經得著了」——連使徒都說自己還沒有到，也緊貼 2:13：成聖的動力是神，不是人的決心。</p><p><strong>難處：</strong>若只強調「今生不會完全」，容易滑成對罪的習以為常——「反正大家都會犯」；也容易讓 3:15 的「完全人」與「竭力追求」失去力量，好像成聖只是等候，不必用力。改革宗自己的優秀傳統也強調「竭力」，但講台上常被簡化成被動。</p>"],["衛斯理宗與聖潔運動（「完全的愛」「全然成聖」：心中的動機可以被愛充滿）","","<p>衛斯理約翰教導「基督徒的完全」：不是不再有軟弱、錯誤或試探，而是心中的動機可以被對神與人的愛完全充滿，不再故意犯已知的罪；十九世紀的聖潔運動把它發展成「第二次的恩典」「全然成聖」。根據之一是「願賜平安的神親自使你們全然成聖」（帖前 5:23），以及 3:15 的「完全人」。這派的優點是對恩典的能力有很大的盼望：神不只赦免罪，也能真正改變人心，而且是今生。</p><p><strong>難處：</strong>3:12 保羅明說「這不是說我已經得著了，已經完全了」，若有人宣稱自己已經到了「完全」，很難不與這節衝突；在實踐上，「全然成聖」若被當成一個可以宣告的屬靈等級，容易造成兩種傷害：一種是驕傲，一種是那些「還沒得到」的人的絕望。衛斯理自己對此很謹慎，後來的運動未必都如此。</p>"],["凱錫克運動（得勝生活：交出自己、讓基督在裡面活）","","<p>十九世紀英國凱錫克大會（Keswick）的教導：信徒不必靠自己的力氣與罪掙扎，而是在一次完全的「交出」之後，讓住在裡面的基督勝過罪，過「得勝的生活」；常引的經文包括加 2:20 與腓 2:13。這個運動影響了二十世紀許多宣教士與華人教會的培靈會，幫助許多疲累的信徒從「拼命」轉向「倚靠」。</p><p><strong>難處：</strong>若把「交出」講成一次性的關鍵經驗，容易忽略 3:12–14 那種一生「竭力追求」的用力；也容易讓還在掙扎的人以為自己「還沒有真正交出」，於是一次又一次地奉獻、一次又一次地失望。腓立比書同時說「神在你們心裡運行」（2:13）與「我乃是竭力追求」（3:12）——倚靠與用力不是二選一。</p>"],["中國教會的「得勝者」傳統（倪柝聲、宋尚節、聚會處）","","<p>中國教會二十世紀的復興傳統很重視「得勝」：宋尚節的佈道強調徹底悔改與聖潔的生活；倪柝聲與聚會處的教導中，「得勝者」常指在教會普遍軟弱的時候，回應神呼召、站在神一邊的一群人，並與國度的賞賜連在一起。321 講「成為得勝者」，與這個傳統有血緣關係，也承接了它的長處：不滿足於掛名的信仰，認真地背十字架、跟從主。</p><p><strong>難處：</strong>若把「得勝者」講成教會裡的一個等級，就會出現「你們還不是得勝者」的屬靈分級，有人因此驕傲，有人因此一輩子覺得自己是二等基督徒；這違背 3:12「這不是說我已經得著了」——連保羅都不把自己放在終點。部分講法把得勝與失敗、賞賜與管教排得很細，也超出了腓立比書自己說的範圍。</p>"],["【三】本講義站在哪裡","","<p><strong>得救本乎恩（回指加拉太書立場二）；「做成」是恩典的果效，不是條件。</strong>2:12 與 2:13 一起讀：神在裡面運行「立志」與「行事」，我們在外面恐懼戰兢地活出來——「恐懼戰兢」在保羅書信是敬畏與認真（這使我們想起「我在你們那裡，又軟弱，又懼怕，又甚戰兢」，林前 2:3），不是驚慌。這與以弗所書紅線五同一條線：不靠行為得救，也不被動等待。</p><p><strong>成聖是一生的跑道（3:12–14）；「完全」在本卷的意思是「成熟」（3:15）。</strong>改革宗、衛斯理宗與聖潔運動、凱錫克、中國教會的得勝者傳統並陳；各家的盼望與提醒都收下，但以腓立比書自己的定義為準：成熟的人知道自己還在跑。</p><p><strong>321「成為得勝者」的定義，以 3:12–14 為準：得勝者不是「已經完全」的人，是「竭力追求」「向著標竿直跑」的人；跌倒了，「我們到了甚麼地步，就當照著甚麼地步行」（3:16）。</strong>而得勝最深的樣子在 4:12–13：在飢餓、缺乏裡也能知足——不是凡事都成功。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：神在我們裡面動了善工，必成全這工；我們要竭力追求。</strong>改革宗與衛斯理宗爭的是今生能走到哪裡，不是神能不能改變人；凱錫克與得勝者傳統的提醒，也都指向同一位在我們心裡運行的神（2:13）。</p><p>如果你常常因為自己又跌倒了，就懷疑自己到底得救了沒有，請讀 1:6 的主詞：「那在你們心裡動了善工的」——<strong>是他開始的，也是他要成全的。</strong>保羅也還在跑，他「只有一件事，就是忘記背後，努力面前的」（3:13）——這裡的「背後」是他自己引以為傲的資歷（3:4–8），不是別人加給你的傷。你今天在跑道上的哪一個位置都不要緊，要緊的是你還朝著標竿。</p>"]],"con":[],"say":"本講義的全卷立場：得救本乎恩（回指加拉太書立場二），「做成得救的工夫」是恩典的果效，不是條件——2:12 與 2:13 一起讀；成聖是一生的跑道，「完全」在本卷是成熟，成熟的人知道自己還在跑（改革宗、衛斯理宗與聖潔運動、凱錫克、得勝者傳統並陳）。321 的得勝者以 3:12–14 為準：竭力追求、向著標竿直跑的人，不是已經完全的屬靈精英。","care":"牧養底線：不用 2:12「恐懼戰兢」叫人活在失去救恩的恐懼裡；不把「得勝者」講成屬靈精英，「你們還不是得勝者」這種分級違背 3:12；不用「完全」要求同工不能犯錯，也不用「反正不完全」為不悔改找理由（紅線五）。席上會有長期活在「我是不是又掉下去了」焦慮裡的人，對他們講 1:6 與 2:13；也會有在事奉裡被要求「要完全」而身心耗竭的同工，對他們講 3:16 的「到了甚麼地步」，鼓勵休息，必要時協助尋求專業協助。"},{"id":"ISS00_5","t":"喜樂、憂慮與知足：情緒、心理健康與金錢——「一無掛慮」「凡事都能做」怎樣讀？","r":"4:4--13；4:17--19；2:27","ch":[],"why":"五、情緒不是罪；焦慮與憂鬱需要時就醫，與禱告不衝突；4:13 是知足的力量，4:19 不是奉獻換富足——本講義的全卷立場之五（本卷新立）。第 4 章是全本新約被印在書籤、海報、球衣上最多的幾節：「常常喜樂」「一無掛慮」「凡事都能做」「一切所需用的都充足」。它們也最常被講錯：有人據此說憂鬱是因為不夠喜樂、焦慮是因為不信、吃藥就是不信神，有人據此說靠主一定考得上、奉獻越多神越使你富足。席上正在焦慮、憂鬱、缺乏的人最容易被這幾節壓傷，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「你們要靠主常常喜樂」（4:4）；「應當一無掛慮」（4:6）；「我無論在甚麼景況都可以知足」（4:11）；「我靠著那加給我力量的，凡事都能做」（4:13）；「使你們一切所需用的都充足」（4:19）。經文問的是：基督徒可以難過、焦慮嗎？焦慮症、憂鬱症是信心不足嗎？知足就不能追求更好嗎？奉獻會換來富足嗎？</p><p>先讓經文自己說六件事。<strong>一、喜樂的源頭是「主」</strong>：「靠主」（ἐν κυρίῳ）出現在 3:1、4:4、4:10——不是天生樂觀，不是心想事成。<strong>二、保羅自己會憂、會掛念</strong>：「免得我憂上加憂」（2:27）；「實在掛念你們的事」（2:20）——2:20 的「掛念」與 4:6 的「掛慮」原文是同一個字（μεριμνάω）。同一個字，2:20 是美德，4:6 是要交託的；差別不在有沒有感覺，在有沒有帶到神面前。<strong>三、4:6 的解藥是禱告，不是壓抑</strong>：「只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神」（4:6）——是說出來，不是吞下去。<strong>四、4:7 的平安「出人意外」</strong>——不是問題先解決，是心先被保守。<strong>五、知足是「學會了」的</strong>（4:11 ἔμαθον；4:12 μεμύημαι）——一個過程，不是一個開關；而且保羅「也知道怎樣處豐富」——知足不等於拒絕豐富。<strong>六、4:19 的上下文是一間已經為福音奉獻到「極窮」的教會</strong>（這使我們想起林後 8:2，同是馬其頓教會）；是神的應許，不是投資報酬率；而且是「所需用的」（χρείαν），不是「所想要的」。</p>"],["基督教心理輔導的整合派（信仰與專業心理學整合）","","<p>認為一切真理都是神的真理：醫學與心理學對人的研究，是神普遍恩典的一部分，可以與聖經的教導整合使用。焦慮症、憂鬱症有生理、心理、關係與屬靈多方面的成因，所以需要醫療、心理治療、教會關懷與禱告一起進行。這派的優點是保護了需要就醫的人：它與 2:27 一致——以巴弗提病得幾乎要死，保羅沒有說他信心不足，只說「神憐恤他」。</p><p><strong>難處：</strong>整合若不慎，聖經容易退到點綴的位置，信仰只負責「加一句禱告」，心理學的人觀（例如以自我實現為人生目標）卻沒有被檢驗就整套接受。所以整合派自己也強調：整合不是把兩樣東西放在一起，是用聖經的眼光去分辨、收下專業的幫助。</p>"],["聖經輔導派（以聖經為主要資源）","","<p>二十世紀後半由亞當斯（Jay Adams）等人開始的運動，認為聖經足以處理人心的問題，輔導應當以聖經與教會為主要資源；後來的承接者對醫療的態度更為細緻，承認身體的疾病需要醫治。這派的優點是認真對待人心與神的關係：4:6–7 確實是一個真實的出路，禱告、感謝、把心交給神，不是心理技巧的附屬品；它也提醒教會不要把屬靈的牧養全部外包出去。</p><p><strong>難處：</strong>早期的一些講法把幾乎一切情緒困擾都歸於罪或不信，對需要藥物與專業治療的人造成很大的傷害；若阻止人就醫，就與 2:27 的憐恤、與保羅叫提摩太「因你胃口不清，屢次患病……可以稍微用點酒」（提前 5:23）的實際關心背道而馳。聖經是足夠的準則，卻沒有叫我們拒絕神所賜的醫治。</p>"],["成功神學（信心與奉獻帶來健康與富足）——本講義明確不採","","<p>成功神學（又稱健康與財富福音、信心話語運動的一部分）主張：神的旨意是每一個信徒都健康、富足、成功；缺乏與疾病是因為信心不夠或奉獻不夠。腓立比書第 4 章常是它的主要經文：4:13「凡事都能做」被讀成「靠主一定成功」，4:19「使你們一切所需用的都充足」被讀成「奉獻就會蒙福致富」。它吸引人的地方是真實的：神確實是厚賜百物的神，確實垂聽禱告。</p><p><strong>難處：</strong>它把經文讀反了。4:13 的「凡事」，是 4:12 剛剛列出的「或飽足，或飢餓；或有餘，或缺乏」——保羅說的是在飢餓裡也能知足的力量；4:17 他說「我並不求甚麼餽送」；4:19 的應許是給一間奉獻到「極窮」的教會的（林後 8:2），不是給一間投資的教會的。成功神學還把病人與窮人推到「信心不足」的位置，加重他們的羞恥。<strong>本講義明確不採。</strong></p>"],["民間說法：「有信心就不會憂鬱」","","<p>這不是一個學派，卻是華人教會裡最常聽到的一句話：「基督徒不應該憂鬱」「吃抗憂鬱藥就是不信神」「你要喜樂，因為聖經說要常常喜樂」。說的人多半出於好意，想用信心把人拉出來，而且它抓住了一件真實的事：信仰確實帶來盼望，主確實「已經近了」（4:5）。</p><p><strong>難處：</strong>它與經文直接衝突。保羅會「憂上加憂」（2:27），會「流淚地告訴你們」（3:18）；耶穌在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38）——沒有人會說耶穌信心不足。這句話的實際效果是讓憂鬱的人更羞愧、更不敢說出來、更晚就醫，有時延誤到危險的地步。喜樂是聖靈的果子，不是一張用來檢查別人的考卷。</p>"],["【三】本講義站在哪裡","","<p><strong>情緒不是罪</strong>：基督徒可以難過、害怕、焦慮——保羅會，耶穌也會。<strong>4:6–7 是邀請，不是診斷：焦慮症、憂鬱症是需要治療的病，就醫、吃藥、心理諮商與禱告不衝突</strong>；以巴弗提生病，保羅沒有說他信心不足（2:27）。整合派與聖經輔導派並陳，各自的提醒都收下；<strong>成功神學明確不採</strong>，「有信心就不會憂鬱」的說法也不採。</p><p><strong>4:8 的「思念」不是正向思考或吸引力法則</strong>——是把「真實的、可敬的、公義的」放進心裡算（λογίζεσθε）；清單的第一項是「真實的」——不是假裝沒事。<strong>4:13 的「凡事」，是 4:12 列出的飽足、飢餓、有餘、缺乏</strong>——知足的力量，不是成功的保證；這也是 321「得勝者」最深的樣子（見 ISS00_4）。</p><p><strong>4:19 不是奉獻換祝福</strong>；4:17 保羅自己說「我並不求甚麼餽送」。4:11 的知足也不可以用來叫勞工放棄合理的權益，或叫受剝削的人不要爭取公道——保羅在腓立比也曾說「我們是羅馬人，並沒有定罪」（徒 16:37），他知道甚麼時候該為公義開口。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：主近了（4:5），我們可以把一切告訴他；他賜出人意外的平安。</strong>整合派與聖經輔導派爭的是怎樣幫助人，不是神愛不愛受苦的人；連成功神學的錯誤，也不能改變 4:19 那位「照他榮耀的豐富」供應的神。</p><p>如果你正在焦慮或憂鬱裡，請先聽見：<strong>你的感覺不是你信心的成績單。</strong>4:6 沒有說「不准有掛慮」，它說「將你們所要的告訴神」——你可以哭著說、斷斷續續地說；你也可以同時去看醫生、去找諮商師，那不是不信，是接受神透過人給你的幫助。<strong>那出人意外的平安，常常是在問題還沒解決的時候，先來守住你的心（4:7）。</strong></p>"]],"con":[],"say":"本講義的全卷立場：喜樂的源頭是主，不是心態；情緒不是罪——保羅會憂（2:27），耶穌也會。4:6–7 是邀請，不是診斷：焦慮症、憂鬱症是需要治療的病，就醫、吃藥、諮商與禱告不衝突。4:8 不是正向思考或吸引力法則；4:13 是知足的力量，不是成功的保證；4:19 不是奉獻換富足——成功神學明確不採。","care":"牧養底線：不說「憂鬱是因為不夠喜樂」「焦慮是因為不信」（紅線三）；不叫人停藥、不阻止人就醫，鼓勵有需要的人尋求專業協助。不用 4:4「常常喜樂」要求喪親、受傷的人立刻笑出來——喜樂可以和眼淚同在（3:18「流淚地告訴你們」）。不用 4:13、4:19 講成功神學（紅線四）；不用 4:11 叫勞工放棄合理權益。席上會有正在服藥、不敢讓教會知道的人，有考試落榜、生意失敗而覺得「凡事都能做」在嘲笑自己的人，有奉獻後仍然缺乏、懷疑神不守應許的人——對他們，先陪伴，不急著解釋；若憂鬱伴隨無望感或輕生念頭，會後單獨關心，協助就醫（見 ISS00_3）。"},{"id":"ISS00_6","t":"腓立比書是一封信還是幾封信合編？寫於何地何時？","r":"1:13；3:1--2；4:10--20；4:22","ch":[],"why":"全卷通用：完整性、寫作地點與年代。3:1「我還有話說，你們要靠主喜樂」之後，3:2 忽然轉成「應當防備犬類」；4:10–20 的謝函放在信末，好像收了禮物很久才道謝——於是有「兩信合編說」「三信合編說」。寫信的監獄在羅馬、以弗所還是該撒利亞，也影響全卷怎樣讀 1:13「御營全軍」、4:22「凱撒家裡的人」，以及腓立比書與使徒行傳、其他監獄書信的關係，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>信裡有幾處讓學者停下來的地方。一、3:1「弟兄們，我還有話說，你們要靠主喜樂」（3:1）——「我還有話說」原文 Τὸ λοιπόν，常譯作「最後」，好像信要結束了；下一節卻是「應當防備犬類，防備作惡的，防備妄自行割的」（3:2），語氣急轉。二、以巴弗提帶來的餽送，保羅在 2:25 已經提到，正式的道謝卻放在 4:10–20 信的最末。三、二世紀的坡旅甲寫信給腓立比教會時，說保羅曾給他們寫「書信」，用的是複數。</p><p>寫作地點也有線索：保羅在「捆鎖之中」（1:7），他的捆鎖「在御營全軍和其餘的人中，已經顯明是為基督的緣故」（1:13），信末又說「在凱撒家裡的人特特地問你們安」（4:22）。而從信裡看，保羅與腓立比之間已經有過幾趟往返：他們聽說保羅被囚、派以巴弗提來、以巴弗提病了、消息傳回腓立比、以巴弗提又知道他們聽見了（2:26）。<strong>經文問的是：這是一封信，還是幾封信合編？寫於何地？何時？</strong></p>"],["一封信說（教會的傳統與近年多數註釋的看法）","","<p>認為腓立比書從頭到尾就是一封信。所有現存的抄本都是現在這個樣子，沒有任何一份抄本支持分割；全卷的字彙與主題首尾呼應：φρονέω（意念、心思）從 1:7 一路到 4:10，喜樂、「一同」（συν-）、合夥（κοινωνία）四章都有；更明顯的是 2:6–11 與 3:20–21 用同一組字——形像（μορφή）與「改變形狀……相似」（σύμμορφον）、卑微（ταπεινόω）與「卑賤的身體」、主耶穌基督、萬有降服。3:1 的 Τὸ λοιπόν 在保羅書信裡也可以只是「此外」「再者」，未必是「最後」。</p><p><strong>難處：</strong>它仍要解釋 3:2 的語氣急轉，與謝函為甚麼放在最後。一封信說的回答是：保羅說到喜樂，想起會偷走喜樂的人——3:2 的嚴厲，是為了保護 3:1 的喜樂；謝函放在最後，可能是因為以巴弗提來時保羅已經口頭或短信道過謝，這裡是正式而鄭重的收尾。這些解釋合理，但不能說毫無疑問。</p>"],["合編說（兩信或三信被後人編成一卷）","","<p>二十世紀中葉以來，一些學者認為現在的腓立比書是由兩封或三封短信合編而成：常見的切法是一封謝函（4:10–20）、一封報告與勸勉的信（1:1–3:1，加上 4:4–7、21–23 的部分）、一封警告信（3:2–4:3）。理由是 3:1→3:2 的急轉、謝函的位置，以及坡旅甲用的複數「書信」。這派的優點是認真看待文本裡真實存在的接縫，不用一句「保羅想到就寫」帶過。</p><p><strong>難處：</strong>沒有任何抄本證據；坡旅甲的複數在希臘文裡也可以指一封重要的信，或指保羅寫給馬其頓眾教會的信。合編說也要回答：為甚麼編者要把謝函放在最後、把警告信塞在中間，又把每一封的開頭結尾剪掉？而且 2:6–11 與 3:20–21 的字彙呼應，橫跨了合編說切開的兩封信——這反而說明它本來是一個整體。近年多數註釋（如費依 Gordon Fee、奧布萊恩 Peter O'Brien、博克繆爾 Markus Bockmuehl）都回到一封信說。</p>"],["寫作地點：羅馬說（約主後 60–62 年）","","<p>傳統的看法：這封信寫於保羅在羅馬的軟禁中——「保羅在自己所租的房子裡住了足足兩年。凡來見他的人，他全都接待」（徒 28:30）。1:13 的「御營全軍」（πραιτώριον）最自然的意思是羅馬的御林軍，4:22「凱撒家裡的人」也最容易在羅馬找到；1:20「無論是生是死」顯示他正面臨可能判死刑的審判，這與上訴到凱撒的處境相合。這派也有早期教會的傳承支持，許多古抄本的附註都寫「從羅馬寄出」。</p><p><strong>難處：</strong>羅馬與腓立比相距約一千兩百公里，陸路加海路單程要好幾個星期；信裡卻至少有四趟消息往返（被囚的消息、以巴弗提前來、他生病的消息傳回、他知道他們聽見了），加上保羅還打算「快打發提摩太去」（2:19）、自己「也必快去」（2:24）——在羅馬寫，時間會很緊。不過兩年的軟禁足夠容納這幾趟往返，這個難處並非無法回答。</p>"],["寫作地點：以弗所說與該撒利亞說","","<p><strong>以弗所說</strong>（約主後 54–55 年）：以弗所離腓立比只要一個多星期的路程，最容易解釋多次往返；「御營」一詞也見於行省總督的府衙，「凱撒家裡的人」可以指在各省服事皇室的奴僕與官員；保羅說他在亞細亞「被壓太重，力不能勝，甚至連活命的指望都絕了」（林後 1:8），有學者推測那時他曾在以弗所坐監。<strong>該撒利亞說</strong>（約主後 57–59 年）：保羅在那裡被囚兩年（〔背景〕徒 23–26 章），住在「希律的衙門」，也是一處 πραιτώριον。</p><p><strong>難處：</strong>新約沒有任何一處明說保羅在以弗所坐過監，以弗所說要建立在推測的監禁上；在以弗所時保羅還可以上訴到凱撒，不太會面對 1:20 那樣「無論是生是死」的終審。該撒利亞說的難處是距離比羅馬更遠，而且保羅在那裡的目標是上羅馬，與 2:24「我也必快去」腓立比的盼望不太相合。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：照一封信讀；寫於羅馬的軟禁中，約主後 60–62 年。</strong>第 3 章的原文解經在 3:1→3:2 的急轉處陳列合編說，並說明本講義的理由；以弗所說作為重要的少數意見照實陳列，該撒利亞說一併交代。</p><p>理由有三：一、沒有任何抄本支持分割，而全卷字彙首尾呼應，2:6–11 與 3:20–21 用同一組字；二、1:13 的御營全軍、4:22 凱撒家裡的人、1:20 生死未卜的終審處境，在羅馬最自然；三、徒 28:30 的兩年軟禁，足以容納信裡的幾趟往返。<strong>講台只講一句：保羅說到喜樂，忽然想起會偷走喜樂的人——3:2 的嚴厲，是為了保護 3:1 的喜樂。</strong></p><p>各章碰到完整性、寫作地點與年代的問題，一句帶過，回指這裡；保羅在羅馬的軟禁見本系列使徒行傳講義第 28 章，羅馬監禁的判斷與以弗所書 ISS00_6 一致。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這封信是一封還是三封合編、寫於羅馬還是以弗所，爭的是這封信怎樣成形、從哪裡寄出，不是這封信說了甚麼。不論在哪一座監獄裡寫，寫信的人說的都是同一句話：「因我活著就是基督，我死了就有益處」（1:21）。學者把文本的每一道接縫都拿出來討論，正說明教會從來沒有把經文藏起來不讓人看。</p><p>這一題還有一層溫柔：不論地點在哪裡，<strong>寫信的人身上有鎖鍊</strong>。他不知道自己會活還是會死，卻寫了全本新約最喜樂的一封信，結尾還說「在凱撒家裡的人特特地問你們安」（4:22）——鎖鍊沒有鎖住福音，它一路走進了皇帝的家。</p>"]],"con":[],"say":"本講義的判斷：腓立比書照一封信讀——沒有抄本支持分割，全卷字彙首尾呼應；寫於羅馬的軟禁中，約主後 60–62 年。合編說、以弗所說、該撒利亞說照實陳列，不迴避。講台只講一句：3:2 的嚴厲，是為了保護 3:1 的喜樂。這個判斷不影響解經。","care":"這一題容易在查經班裡變成考據課，讓不熟悉學術的弟兄姊妹覺得自己讀不懂聖經，也可能讓剛聽到「有學者說是幾封信拼起來的」的年輕人突然不安。講台上一兩句帶過就好，不要把學者的名字當成炫耀的資本；遇到真心被這些問題困擾的人，會後單獨陪他讀，先肯定他願意誠實發問。也可以帶會眾留意 1:7、1:13：寫信的人在坐監——教會裡正在病床上、在受限制、覺得自己不能再事奉的人，需要聽見這一點。"},{"id":"ISS00_7","t":"腓立比教會的歷史——從使徒行傳十六章到這封信，這是一間怎樣的教會？","r":"徒 16:11--40；20:1--6；林後 8:1--5","ch":[],"why":"全卷通用：一間在監獄裡出生的教會。腓立比教會的誕生記在使徒行傳 16 章：河邊的禱告處、賣紫色布疋的呂底亞、被巫鬼所附的使女、半夜唱詩的監獄、全家信主的禁卒。十年後，保羅又在監裡，寫信給這間教會。這段歷史怎樣讀，決定讀者怎樣聽信裡的「捆鎖」「喜樂」「合夥」「天上的國民」，也解釋為甚麼保羅只接受這間教會的供給，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>這間教會的故事從一個異象開始：「有一個馬其頓人站著求他說：『請你過到馬其頓來幫助我們。』」（徒 16:9）保羅一行來到腓立比，「就是馬其頓這一方的頭一個城，也是羅馬的駐防城」（徒 16:12）。安息日在河邊的禱告處，呂底亞「聽見了，主就開導她的心」（徒 16:14）；保羅趕出使女身上的鬼，被人告到官長面前，被剝衣、棍打，下在內監；「約在半夜，保羅和西拉禱告，唱詩讚美神，眾囚犯也側耳而聽」（徒 16:25）。地大震動，禁卒問怎樣才可以得救，保羅說：「當信主耶穌，你和你一家都必得救。」（徒 16:31）</p><p>之後，腓立比人在保羅到帖撒羅尼迦時「一次兩次地打發人供給我的需用」（4:16）；保羅後來在第三次旅行中至少兩次經過馬其頓（〔背景〕徒 20:1–6），並稱讚馬其頓眾教會「在極窮之間還格外顯出他們樂捐的厚恩」（林後 8:2）。大約十年後，他從監裡寫了這封信。<strong>經文問的是：這是一間怎樣的教會？它為甚麼和保羅特別親？</strong></p>"],["殖民城身分說（羅馬駐防城的公民意識，是讀這封信的鑰匙）","","<p>認為腓立比的城市身分，深深影響了這間教會與這封信。腓立比是羅馬的駐防城，居民多是退伍軍人的後代，享有羅馬公民權、用羅馬法律，以身為羅馬人為榮；徒 16 章控告保羅的人就說他們傳的是「羅馬人所不可受不可行的規矩」（徒 16:21），保羅後來也亮出「我們是羅馬人」（徒 16:37）。所以保羅在信裡用公民的語言說話：1:27「行事為人」原文 πολιτεύεσθε，像公民一樣過日子；3:20「我們卻是天上的國民」，πολίτευμα 是一個城邦的公民團體。</p><p><strong>難處：</strong>這個背景非常有幫助，但若講得太滿，好像每一節都在影射羅馬，就會忽略信裡更多的內容其實是基督論、喜樂與同工關係。殖民城身分是舞台，不是劇本；而且教會裡也有不是羅馬公民的人——被巫鬼所附的使女就是奴隸，呂底亞是從推雅推喇來的外地人。</p>"],["合夥與贊助說（保羅與這間教會的財務往來，是一段特別的福音夥伴關係）","","<p>認為這間教會最特別的地方，是保羅願意接受它的供給。保羅在哥林多刻意不接受供給——「我們沒有用過這權柄，倒凡事忍受，免得基督的福音被阻隔」（林前 9:12）——卻說「論到授受的事，除了你們以外，並沒有別的教會供給我」（4:15），在哥林多缺乏時也是「那從馬其頓來的弟兄們都補足了」（林後 11:9）。古代社會的贊助關係是施恩者在上、受恩者在下，所以保羅在謝函裡刻意用合夥與帳目的語言，把這份供給講成「歸在你們的帳上」（4:17）的福音投資。</p><p><strong>難處：</strong>若只用財務關係讀這間教會，會把一段屬靈的情誼講成生意；保羅自己說「我並不求甚麼餽送，所求的就是你們的果子漸漸增多」（4:17），他在乎的是人，不是錢。而且古代贊助制度的模型，學界對它能套用到教會關係到甚麼程度，看法也不一。</p>"],["同受苦難說（這是一間從第一天就和保羅一起受苦的教會）","","<p>認為這間教會和保羅的親，是一起受苦受出來的。保羅在腓立比「被害受辱」（帖前 2:2），教會是在棍打、木狗與監獄裡生出來的；保羅寫信時說他們「無論我是在捆鎖之中，是辯明證實福音的時候，你們都與我一同得恩」（1:7），又說「你們的爭戰，就與你們在我身上從前所看見、現在所聽見的一樣」（1:30）——腓立比人也在受逼迫。馬其頓眾教會的奉獻，也是在「患難中受大試煉的時候」（林後 8:2）。</p><p><strong>難處：</strong>這派的觀察很美，但若把苦難講成這間教會的身分，容易滑向美化苦難，好像越苦越屬靈；保羅自己在信裡為以巴弗提病癒感謝神（2:27），也盼望自己被釋放（1:25）。受苦是他們一起走過的路，不是他們追求的目標。</p>"],["女同工與家庭教會說（這是一間由婦女開始、有女同工一同勞苦的教會）","","<p>認為這間教會的另一個特色是婦女的角色：教會從河邊「那聚會的婦女」開始（〔背景〕徒 16:13），第一位信主的是呂底亞，教會最早在她家裡聚會——保羅出監後「往呂底亞家裡去，見了弟兄們，勸慰他們一番，就走了」（徒 16:40）；十年後，保羅點名的友阿蝶和循都基「在福音上曾與我一同勞苦」（4:3）。有學者指出馬其頓婦女在社會與經濟上的地位相對較高，這也幫助解釋這間教會的樣貌。</p><p><strong>難處：</strong>從這幾處推論出這間教會的整體架構或婦女擔任的具體職分，經文沒有說得那麼多，講得太滿就是把自己的立場讀進經文。性別角色與女同工的爭議，本卷不另立說法，<strong>回指哥林多前書立場二與加拉太書立場四</strong>；本卷只照實說：保羅尊重她們的勞苦，也把她們的不和當真處理。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：腓立比教會是一間在監獄裡出生、在患難中奉獻、與保羅在福音上合夥的教會；殖民城的公民意識、合夥與供給、一同受苦、婦女的勞苦，四條線都是真的，交會的中心是 1:5 的「合夥」——「因為從頭一天直到如今，你們是同心合意地興旺福音」（1:5）。</strong></p><p>這條歷史線讓全卷的幾個字都有了重量：<strong>捆鎖</strong>——這間教會的第一夜就在監獄裡，現在保羅又在捆鎖中；<strong>喜樂</strong>——半夜唱詩的人，十年後寫了全本新約最喜樂的一封信；<strong>天上的國民</strong>——在一座以羅馬公民為榮的城裡，教會是天國放在腓立比的一塊領土；<strong>合夥</strong>——從帖撒羅尼迦一路到羅馬，他們一次兩次地供給，一路都在。</p><p>各章的〔背景〕互見行指向本系列使徒行傳講義第 16 章（腓立比教會的建立）與第 20 章（保羅經過馬其頓）；馬其頓眾教會的奉獻見哥林多後書講義第 8 章。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這段歷史是給信心的禮物。神在腓立比建立教會，用的是一位做生意的婦女、一個被鬼附又被主人剝削的使女、一位差點自殺的禁卒——這使我們想起禁卒拔刀要自殺時，保羅大聲呼叫說：「不要傷害自己！我們都在這裡。」（徒 16:28）這間教會從一開始就是由各種背景的人組成的，而他們的第一首詩歌是在監獄裡唱的。</p><p>如果你所在的教會很小、很苦、正在受壓，腓立比的故事對你說：<strong>神的工作常常從監獄開始，從半夜開始</strong>；十年後，那位曾在這城被打的使徒寫信回來說：「我每逢想念你們，就感謝我的神」（1:3）。那在你們心裡動了善工的，必成全這工（1:6）。</p>"]],"con":[],"say":"本講義的立場：腓立比教會是一間在監獄裡出生（徒 16 章）、在患難中奉獻（林後 8:1–5）、與保羅在福音上合夥的教會；殖民城的公民意識、合夥與供給、一同受苦、婦女的勞苦四條線都是真的，交會的中心是 1:5 的合夥。性別角色與女同工回指哥林多前書立場二與加拉太書立場四，本卷不另立。","care":"這一題容易被講成「腓立比教會很會奉獻，所以你們也要多奉獻」——不要這樣用；馬其頓眾教會的奉獻出於「在極窮之間」的厚恩，不是被催逼出來的，保羅也說他不求餽送（4:17）。席上會有經濟正在困難、覺得自己沒有東西可以給的人，對他們講以巴弗提——他給的是自己的時間與生命（2:30）。講到禁卒拔刀的那一夜，要記得席上可能有正在掙扎的人：保羅的第一句話是「不要傷害自己」，教會的第一件事也是保護生命（見 ISS00_3）。"},{"id":"ISS00_8","t":"監獄書信——腓立比書與以弗所書、歌羅西書、腓利門書是甚麼關係？","r":"1:7、13；4:22","ch":[],"why":"全卷通用：四封監獄書信。腓立比書、以弗所書、歌羅西書、腓利門書都提到保羅的捆鎖，傳統上合稱「監獄書信」。它們是寫於同一次監禁嗎？腓立比書在這四封裡站在哪裡？弗、西、門由推基古一同送去，腓立比書卻由以巴弗提送去，這說明甚麼？這一題決定全卷怎樣與本系列的以弗所書講義互見，也決定讀者怎樣聽保羅在鎖鍊裡說的「喜樂」，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>四封信都有保羅自述被囚的話。腓立比書：「無論我是在捆鎖之中」（1:7），「以致我受的捆鎖在御營全軍和其餘的人中，已經顯明是為基督的緣故」（1:13）。以弗所書：「因此，我－保羅為你們外邦人作了基督耶穌被囚的」（弗 3:1），「我為這福音的奧祕作了帶鎖鍊的使者」（弗 6:20）。歌羅西書：「你們要記念我的捆鎖」（西 4:18）。腓利門書：「為基督耶穌被囚的保羅，同兄弟提摩太寫信給我們所親愛的同工腓利門」（門 1:1）。</p><p>但四封信的送信人不同：以弗所書與歌羅西書由推基古帶去（弗 6:21；西 4:7），阿尼西謀與他同行（西 4:9），腓利門書正是為阿尼西謀寫的；腓立比書則由病癒的以巴弗提帶回（2:25–30）。<strong>經文問的是：四封信是同一次監禁寫的嗎？腓立比書與另外三封是甚麼關係？「監獄書信」這個分類有甚麼意義？</strong></p>"],["同一次羅馬監禁說（四封都寫於羅馬的兩年軟禁）","","<p>傳統的看法：四封監獄書信都寫於保羅在羅馬的兩年軟禁——「保羅在自己所租的房子裡住了足足兩年」（徒 28:30），那時他仍可以「放膽傳講神國的道，將主耶穌基督的事教導人，並沒有人禁止」（徒 28:31），所以能接待同工、寫信、差派人。弗、西、門三封由推基古一批送出，腓立比書另由以巴弗提送出。許多學者並認為腓立比書在四封中較晚：1:20「無論是生是死」顯示審判已近，2:23 也說「我一看出我的事要怎樣了結」。</p><p><strong>難處：</strong>它與羅馬說同樣要面對距離的問題（見 ISS00_6）；而腓利門書 22 節保羅請腓利門「給我預備住處」，表示他盼望不久到歌羅西去，從羅馬去小亞細亞是很遠的路，有學者認為從以弗所說比較自然。這些難處都可以回答，但需要承認推論的成分。</p>"],["分屬不同監禁說（以弗所或該撒利亞的監禁也可能是其中幾封的出處）","","<p>有學者主張四封未必寫於同一次監禁：腓立比書（甚至歌羅西書與腓利門書）可能寫於推測中的以弗所監禁，因為以弗所離腓立比與歌羅西都近，最能解釋多次往返與「預備住處」；也有學者主張部分書信寫於該撒利亞的兩年監禁。這派的優點是把每一封信的內部線索當真，不先預設四封必須綁在一起。</p><p><strong>難處：</strong>以弗所監禁在新約沒有明文記載；而且腓立比書與以弗所書、歌羅西書在基督論上的呼應很深——腓 2:9–11 基督「升為至高」、萬膝跪拜，與弗 1:20–22「遠超過一切」、萬有服在他的腳下，是同一個高度——這較支持它們寫於相近的時期。分開監禁說若成立，腓立比書的年代會提早到主後 50 年代中，全卷的許多判斷（例如 1:20 生死未卜的終審）都要重新解釋。</p>"],["分類本身的提醒（「監獄書信」是後人的分類，作者問題也不完全一樣）","","<p>有學者提醒：「監獄書信」是後人方便的分類，不是保羅自己的編排；四封信的性質很不一樣——以弗所書是寫給眾教會的傳閱信，歌羅西書處理一種錯誤的教導，腓利門書是為一個逃走的奴隸寫的私人信，腓立比書是一封感謝信。而且四封信的作者問題也不一樣：腓立比書與腓利門書幾乎沒有學者懷疑是保羅親筆，以弗所書與歌羅西書則有門徒託名說（見本系列以弗所書講義 ISS00_6、ISS00_7）。</p><p><strong>難處：</strong>這個提醒正確，但若因此不把四封信放在一起讀，就會失去它們之間真實的互相照亮：四封信都在捆鎖中寫，都高舉基督超乎萬有，都關心身體裡的關係——夫妻主僕（弗、西）、一個奴隸與主人（門）、兩位同工姊妹（腓）。分類是工具，用得好就能幫助讀經。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：四封監獄書信都寫於保羅在羅馬的那一次軟禁，約主後 60–62 年（與本系列以弗所書講義 ISS00_6 的判斷一致）；以弗所書、歌羅西書、腓利門書由推基古一批送出，腓立比書另由以巴弗提送出，很可能在四封中較晚。</strong>以弗所說與該撒利亞說照實陳列。</p><p>四封信的共同點有三：一、<strong>捆鎖叫福音興旺</strong>——「我所遭遇的事更是叫福音興旺」（1:12），以弗所書說他是「帶鎖鍊的使者」，腓利門書說他在捆鎖中生了阿尼西謀這個兒子；二、<strong>基督超乎萬有</strong>——腓 2:9–11 與弗 1:20–22 同一個高度；三、<strong>高的神學落在近的關係上</strong>——基督之歌落在兩位姊妹的和好上（4:2）。</p><p>各章的〔弗〕互見行指向本系列以弗所書講義（1:13↔弗 3:1；2:9–11↔弗 1:20–22）；作者與以弗所書、歌羅西書的關係，回指以弗所書講義 ISS00_6 與 ISS00_7，本卷不另立。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。四封信是在同一次監禁還是不同監禁寫的，爭的是年代與地點，不是信裡的福音。四封信用不同的口吻說同一件事：那位「升為至高」（2:9）的基督，是鎖鍊鎖不住的主。</p><p>這一題給今天的人一個很實際的安慰：<strong>保羅一生最有影響力的幾封信，是在他最不自由的時候寫的。</strong>如果你此刻被病床、輪椅、照顧家人、失業、或任何你沒有選擇的限制綁住，腓立比書對你說：「我所遭遇的事更是叫福音興旺」（1:12）——神沒有因為你被限制，就停止透過你作工。</p>"]],"con":[],"say":"本講義的立場：四封監獄書信都寫於保羅在羅馬的軟禁，約主後 60–62 年（與以弗所書講義 ISS00_6 一致）；弗、西、門由推基古一批送出，腓立比書另由以巴弗提送出，很可能較晚。以弗所說、該撒利亞說照實陳列；作者問題回指以弗所書講義 ISS00_6、ISS00_7。共同的線：捆鎖叫福音興旺，基督超乎萬有。","care":"這一題容易被講成「保羅坐監還能寫信，你沒有理由不事奉」——不要這樣用，那會壓傷正在病中、被限制、已經很累的人。席上會有長期臥病、照顧失智父母、剛失業、甚至正在服刑家人的弟兄姊妹，對他們，先講保羅坦白的「免得我憂上加憂」（2:27），再講神在捆鎖中仍然作工；限制裡的事奉可以很小——一個禱告、一封問安——不必和保羅比。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:9--11；3:15--16","ch":[],"why":"全卷通用：爭議與信心。這一卷的議題頁要陳列許多爭論：虛己的三種讀法、死後的狀態、今生能否完全、心理輔導的不同路線、3:9「信基督」的兩種讀法、一封信還是幾封信、羅馬還
