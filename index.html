<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321腓立比書講義">
<meta name="application-name" content="321腓立比書講義">
<meta name="description" content="321腓立比書講義：全書四章逐節原文解經、講章逐字稿與321生命應用。">
<title>321腓立比書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"我活著就是基督","sub":"鎖、活、稱","lv":"A","arc":"活","sec":[["1:1--2","寫信給凡住腓立比、在基督耶穌裡的眾聖徒：問安"],["1:3--11","我每逢想念你們，就感謝我的神：感恩與禱告"],["1:12--18","我所遭遇的事更是叫福音興旺：捆鎖與基督被傳開"],["1:19--26","我活著就是基督：生與死之間"],["1:27--30","只要你們行事為人與基督的福音相稱：齊心努力"]],"serm":{"pts":[["捆鎖叫福音興旺","1:12--18","「無論怎樣，基督究竟被傳開了」——監牢裡的人、故意為難他的人，都攔不住福音；焦點不在環境，不在別人"],["活著就是基督","1:19--26","「我活著就是基督，我死了就有益處」——生死之間，保羅選擇留下來，因為「為你們更是要緊的」"],["與福音相稱","1:27--30","「只要你們行事為人與基督的福音相稱」——像天國的公民一樣過日子，「為所信的福音齊心努力」"]]},"q":"如果有人問你：「你活著是為了甚麼？」你第一個念頭會是甚麼？為了孩子、為了把房貸還完、為了退休以後可以喘一口氣——還是，你其實已經很久沒有想過，只是每天醒來，把日子過完。\n也許你身邊有一位長輩，躺在病床上說「活著沒意思，只會拖累你們」；也許你自己在某一個深夜，也曾經想過「如果就這樣不醒來，也沒有關係」。\n這一章要問的是：一個戴著鎖鍊、等著判決、連自己會不會活下去都不知道的人，為甚麼能說出「我活著就是基督」——而且最後選擇留下來？","truth":"在捆鎖、惡意與生死未卜之間，保羅生命的內容只有一位：「我活著就是基督」；那在腓立比人心裡動了善工的，也必成全這工。\n生死的主權在神，保羅的結論卻是活下去——「為你們更是要緊的」；被基督住滿的生命，是為了別人留下來，並且照著天國公民的樣子過日子。","mv":{"t":"因我活著就是基督，我死了就有益處。","r":"腓1:21"},"card":["這一章說的是：基督是我的生命。一個在羅馬捆鎖中的人寫信給一間在監獄裡出生的教會，先為他們的合夥感謝，再告訴他們鎖鍊攔不住福音、別人的惡意偷不走他的喜樂；然後站在生與死中間說「我活著就是基督」，卻選擇為他們活下去，最後請他們照著福音的樣子一同站立。鎖住的是身體，活著的內容是一個人。","這一章最先動手的是神：是他「在你們心裡動了善工」，也是他「必成全這工」（1:6）；是他把保羅的捆鎖變成福音的路，連看守的兵、嫉妒的人都擋不住；是耶穌基督之靈供應一個坐監的人，叫他不至於羞愧；是神握著生死，叫基督在保羅的身體上照常顯大；也是神把信心和受苦一同賜給腓立比人，又把他們得救的確據握在自己手裡——「你們得救都是出於神」（1:28）。","1:10「能分別是非」，原文是 τὰ διαφέροντα（ta diapheronta），字面是「那些不同的事」，引申為「真正要緊的事」；和合本的註腳另譯「喜愛那美好的事」。保羅為一間很會愛的教會禱告，求的不是更熱，是愛要長出眼睛——在一堆都說得過去的事裡，認出哪一件真正要緊。這改變今天的讀法：分辨不是愛的反面，是愛的視力。保羅後來在生死之間的挑選，用的就是這雙眼睛：他看出甚麼「為你們更是要緊的」（1:24）。","這一章照出來的我，常常把自己放在故事的主詞上。環境不順，我就覺得是我的人生卡住了；有人搶功勞、說閒話，我就整個禮拜都在想他；講到生死，我想的是自己累不累、值不值得，很少問「誰需要我留下來」。保羅的處境比我難得多，他生命的中心卻不是自己的遭遇、自己的名聲、甚至不是自己的去留，而是基督有沒有被傳開、腓立比人有沒有長進。","「無論是生是死，總叫基督在我身上照常顯大。」（1:20）全章最該被記住的，是這一句把主權交出去的話。保羅不知道判決的結果，卻知道判決不是他人生的主詞；他不替自己決定生死，只求自己的身體成為基督被看見的地方。從這一句往下讀，才讀得懂 1:21；也只有讀到 1:24，才知道保羅的答案是活下去。","這一週，找出一位正在「生與死之間」的人：住院的長輩、剛失去家人的朋友、最近常說「好累、不想撐了」的同事或孩子。選定一天，親自去看他，或打一通不趕時間的電話；先聽他說完，不急著講道理。如果他說出不想活的念頭，不要驚慌也不要責備，陪著他，當天就一起聯絡可以幫忙的人和專業的協助。","最終整合：腓立比，呂底亞家裡，晚上。\n以巴弗提回來了。他瘦了很多，大家差一點就以為他回不來了。他從懷裡拿出一捲信，說：「保羅寫的。」\n屋子裡坐著賣紫色布的呂底亞，坐著那位從前被鬼附、如今穿著乾淨衣裳的使女，坐著那位十年前在監門口拔出刀來的禁卒，他的一家人擠在他旁邊。\n信讀到「我每逢想念你們，就感謝我的神」（1:3），呂底亞的眼眶紅了——那一筆錢，是大家從很窮的日子裡省下來的。\n讀到「我所遭遇的事更是叫福音興旺」（1:12），有人笑了：這就是保羅，鎖著也在講。\n讀到「我正在兩難之間，情願離世與基督同在，因為這是好得無比的」（1:23），屋子忽然很安靜。禁卒低下了頭。\n他知道想死是甚麼滋味。那一夜，他不是因為盼望，是因為害怕。\n以巴弗提停了一下，再讀下一句：\n「然而，我在肉身活著，為你們更是要緊的。」（1:24）\n禁卒抬起頭來。十年前，有人在監牢裡喊住他；十年後，同一個人在另一間監牢裡，為了他們，選擇留下來。\n屋子裡有人哭了。\n信還沒有讀完。下一章要告訴他們，有一位走得比保羅更遠。\n可是今夜，一屋子曾經被綁住、被鬼附、想過去死的人，第一次這樣清楚地聽見：\n活著，不是因為日子變輕了，是因為活著的內容是一個人。\n如果你今夜也覺得活著很重，請記得：有人需要你留下來。\n更有一位，先為你留下了。"],"self":"這一章照出來的「有己」，第一個樣子是把自己當成故事的主詞：處境好，就覺得神與我同在；處境壞，就覺得一切都停了；別人比我紅、搶我的位子，我的喜樂就被他拿走——我的心情交給了環境和別人掌管。\n第二個樣子更深：連生和死，我都想自己作主。有時想抓住，怕失去健康、失去控制；有時想放下，覺得自己沒有用、只是負擔。兩種樣子的中心都是我，而這一章給的另一個中心，是「總叫基督在我身上照常顯大」。","t321":{"k":"耶穌是我的榜樣：主耶穌在客西馬尼園說「我心裡甚是憂傷，幾乎要死」（太 26:38）——他沒有假裝不苦，卻說「然而，不要從我的意思，只要從你的意思」（可 14:36）。在最後的禱告裡，他沒有求父把門徒帶走，說的是「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15），又說「我為他們的緣故，自己分別為聖」（約 17:19）。保羅在生死之間為腓立比人留下，是從這一位身上學來的：把自己的去留交給父，把自己的日子給了別人。下一章，保羅要把這一位完整地唱出來。","g":"讓耶穌作王：這一章要人讓出三個位置。第一是「處境的主詞」——鎖鍊、病床、失業都是真的，但故事的主詞是福音，不是我的遭遇。第二是「審判人心的座位」——保羅看清了誰出於嫉妒，卻把那些人的心交給神，自己只問「基督有沒有被傳開」。第三是最深的一個：「生死的決定權」——「無論是生是死，總叫基督在我身上照常顯大」（1:20），連活多久、怎麼離開，都不是我替自己作主。讓耶穌作王，不是叫人不在乎自己的命，是承認這條命是他的，所以要好好守住。可以自己檢查：這一週我最常把心情交給誰掌管？","p":"建立屬神的體系：第 1 章給教會的第一個字是「合夥」——「從頭一天直到如今」（1:5），腓立比人出錢、出人、出禱告，把自己和一個囚犯綁在一起。第一，讓教會成為一張安全網：每一位住院的、坐困的、喪親的、說過不想活的弟兄姊妹，都有人知道、有人輪流探望，必要時一起陪他就醫、尋求專業協助，不讓任何人一個人扛。第二，讓同工在分辨中合一：看清動機、說出問題，卻不另起爐灶，眼睛一起轉回福音。第三，問安裡「眾聖徒」排在「諸位監督，諸位執事」前面（1:1）：領袖不在場時，群體照樣站立，這才是天國公民的樣子。"},"grp":["【一、破冰】說一次你「走不開」的經驗：陪家人住院的那幾天、被困在機場或家裡的一段時間、一份暫時辭不掉的工作……那段時間裡，你身邊出現過哪一個原本不會遇見的人？","【二、扎心】經文說：「有的傳基督是出於嫉妒紛爭」（1:15）。說出一次具體的經驗（不必說出對方的名字）：在職場、家裡或教會裡，有人故意搶你的位子、讓你更難受。那件事到今天還佔著你心裡多大的位置？你是怎樣分辨出來的，又是怎樣（或還沒有）把眼睛轉回來的？","【三、福音】「我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。」（1:6）說一個你最近覺得自己「爛尾」的地方——一個戒不掉的習慣、一段停下來的靈修、一份放棄了的服事。如果開工的是神、成全的也是神，那件事今天落在誰的手上？","【四、行動】說出一位這一週你要去探望或聯絡的人：住院的、喪親的、最近說「好累、不想撐了」的人（名字或關係）；說出哪一天、在哪裡、用甚麼方式（探病、一頓飯、一通電話）。也說出：如果他說出不想活的念頭，你會在當天聯絡哪一位同工或哪一個專業管道陪他一起面對？","【五、代禱】為三種人指名禱告：一位正在病床上、不知道自己還有多少日子的人，求主叫基督在他身上照常顯大，也賜他好的醫治與照顧；一位心裡有輕生念頭、還沒有說出口的人，求主差人到他身邊，讓他知道他活著是要緊的；一位因為信主在家裡或公司被為難的人，求主叫他站立得穩，不怕驚嚇。"],"prac":{"main":"這一週，把生命的主詞交還給基督——在鎖鍊裡看見福音的路，在生死之間為別人留下來。","items":["對神：每天早上用 1:20 禱告：「主啊，今天無論順不順，總叫基督在我身上照常顯大。」把一件你最近最想自己作主的事——健康、去留、一段關係的結果——指名交在他手中；每晚回想：今天哪一刻，我是被耶穌基督之靈供應著走過去的？","對自己：這七天，每當你發現自己整天在想某一個為難你的人，就記下時間和那件事；先誠實說出「這是在為難我」，再問 1:10 的那個問題：在這件事裡，甚麼才是真正要緊的？如果你自己有不想活的念頭，這一週就告訴一位信得過的人，並且聯絡專業的協助——這不是軟弱，是保護神交給你的生命。","對人：探望或聯絡一位正在生死之間、或在低谷裡的人：病床上的長輩、喪親的朋友、說過「好累」的同事。先聽，不急著勸；若他說「活著沒意思」，不要說「你要有信心」，告訴他你在乎他，並陪他一起找可以幫忙的人。也為一位在教會裡和你「不同一國」的同工，各為對方禱告一次。","對生活：看一看你手上那一條走不開的「鎖鍊」——一張病床、一份辭不掉的工作、一個長期照顧的家人。這一週不只問「這件事甚麼時候結束」，也記下一個因為這條鎖鍊才出現在你身邊的人：護理師、看護、同病房的家屬、新同事，為他的名字禱告，找一個機會關心他。","對使命：在小組或團契裡建立一張「同負一軛」的名單：誰住院、誰喪親、誰正在低谷，安排輪流探望、送餐、陪診；並且讓小組每一位都知道當地的危機支援與輔導管道。另外，為一位因信主而在家裡或公司被為難的弟兄姊妹每天指名禱告，這一週找機會站在他旁邊。"]},"safe":["① 把 1:21「死了就有益處」、1:23「情願離世與基督同在」講成「基督徒應該羨慕死亡」「越屬靈的人越想早點去天家」，或用詩意的語言浪漫化死亡。","保羅說的益處是「與基督同在」——益處是一個人，不是一個出口；而且這段經文的結論是 1:24--25「我在肉身活著，為你們更是要緊的」「仍要住在世間」。停在 1:21 或 1:23，就把一段選擇活下去的經文講成了一段羨慕死亡的經文（紅線二；全卷立場見 ISS00_3）。","檢驗標準：你有沒有一口氣讀到 1:24--25？一位正在痛苦裡的人聽完，是更想離開，還是更知道自己為甚麼要留下來？","② 對有輕生念頭的人說「你信心不夠」「你想死是因為不夠愛主」，或說「自殺的人不能上天堂」來嚇阻他。","保羅自己也被「兩難」夾住（1:23），掙扎本身不是罪；用定罪或地獄去嚇一個已經很痛的人，只會讓他更孤單、更不敢開口。面對輕生念頭，教會的第一步是陪伴、保護生命，並且協助他尋求專業協助（醫療、輔導、危機支援），而不是先糾正他的神學（紅線二）。","檢驗標準：你講完，一位心裡有這個念頭的人，是更敢在散會後找一個人說出來，還是更想把它藏起來？","③ 把 1:20「無論是生是死」講成「生死由神決定，所以不必看醫生、不必吃藥，信心夠就會好」，或叫病人放棄治療。","1:20 說的是生死的主權在神，不是叫人放棄神所賜的醫治與照顧；基督在身體上顯大，也包括這個身體被醫治、被好好照顧。保羅在 2:27 說以巴弗提「病了，幾乎要死；然而神憐恤他」，神憐恤病人，不叫人輕看身體。","檢驗標準：一位剛被診斷出重病的弟兄姊妹聽完，是更平安地接受治療，還是覺得接受治療就是信心不夠？","④ 用 1:23「好得無比」對喪親的人說：「他去天家了，你應該高興，不要再哭了。」","1:23 是給盼望的，不是給禁令的；保羅也沒有叫人不要憂傷，他在別處說的是不要「像那些沒有指望的人一樣」（帖前 4:13）——有指望的人也會憂傷。盼望和眼淚可以在同一張臉上，叫人不要哭，是把安慰變成了另一種重擔。","檢驗標準：你有沒有明說「哭不是信心不夠」？一位剛失去家人的人聽完，是覺得被陪伴，還是覺得自己的眼淚不屬靈？","⑤ 把 1:21「活著就是基督」講成「真正屬靈的人不應該有自己的喜好、需要和感受，你的一切都要消失」。","保羅寫這封信時，他的名字、個性、眼淚、對腓立比人的想念都還在（1:8）；「活著就是基督」是中心換了，不是人消失了。把它講成自我消滅，就把 321 的「無己」講成了沒有自己（紅線一；全卷立場見 ISS00_2）。","檢驗標準：會眾聽完，是更確知自己在基督裡是誰、更自由地為人而活，還是更看輕自己、覺得自己不該存在？","⑥ 把 1:18「這有何妨呢」講成「動機不重要，只要有在傳就好」，或叫被同工嫉妒、排擠、傷害的人「不要計較，閉嘴就好」。","保羅先分辨了，而且說出來了（1:15--17）——他說那是「苦楚」；他放手的是審判別人的心，不是放棄分辨，更不是叫人忍受傷害。同一封信 3:2 他說「應當防備」：福音的內容被改了，他一步都不讓（全卷判準見 ISS00_9）。","檢驗標準：你有沒有分清「動機不純但傳的是真福音」和「傳的是別的福音」？一位被同工傷害的人聽完，是更有出路，還是更不敢說？","⑦ 把 1:9--10「能分別是非」講成「愛心就是甚麼都說好、甚麼都包容」，或反過來講成「屬靈的人要到處審查別人」。","保羅禱告的是愛「在知識和各樣見識上多而又多」——愛要有眼睛；分辨的目的是認出 τὰ διαφέροντα（真正要緊的事），使自己「誠實無過」，不是去挑別人的錯。沒有分辨的愛會被利用，沒有愛的分辨會變成挑剔（立場二）。","檢驗標準：會眾聽完，是更會分辨甚麼才要緊，還是更會挑別人？","⑧ 把 1:29「並要為他受苦」講成「受苦就是蒙恩，所以病痛、家暴、職場霸凌都要甘心忍受，不要求助」。","1:29 說的是為基督的緣故受的苦，是和基督同行的一部分，不是說苦難本身是好東西，也不是神喜歡看人痛；保羅自己在腓立比被打以後，也亮出羅馬人的身分，要官長「自己來領我們出去」（徒 16:37）。用這一節叫人留在危險裡，是把恩典講成了枷鎖（全卷立場見 ISS00_3）。","檢驗標準：你有沒有明說「為基督受苦不等於留在不安全的地方」？一位正在受傷害的人聽完，是更敢求助，還是更覺得該忍？","⑨ 把 1:12--14「捆鎖叫福音興旺」講成「你遇到的每一件壞事都是神要你去傳福音的安排，所以不必難過、不必改變處境」。","保羅沒有說坐監不苦，他也在 1:19 盼望「得救」；他是在苦裡看見福音的路，不是把苦美化成好事。對正在受苦的人急著說「這是神的美意」，常常比苦本身更傷人。","檢驗標準：你有沒有先承認苦是真的？一位剛失業、剛確診的人聽完，是覺得被理解，還是覺得自己連難過的權利都沒有？","⑩ 把 1:28「你們得救都是出於神」「證明他們沉淪」講成在講台上咒詛反對信仰的家人、同事、政府，或鼓勵會眾和他們對立、報復。","保羅只叫腓立比人「不怕敵人的驚嚇」，沒有叫他們去打敵人；站立得穩本身就是見證，得救是出於神，不是出於我們吵不吵得贏。把這一節講成敵我對立，會叫信徒失去在家裡、在職場作見證的門。","檢驗標準：一位家人反對他信主的弟兄姊妹聽完，是更有勇氣也更溫柔地回家，還是更想回家吵一架？","⑪ 用處境取消原則：「保羅坐監、面臨死刑，那是使徒的特殊處境，和我們上班、帶孩子的人無關」；或把處境硬搬，說「你要像保羅一樣準備殉道」。","書信三問要走完：處境是一位在羅馬捆鎖中等候判決的使徒，和一間被逼迫、開始有人結黨的教會；原則是生命的中心是基督、生死主權在神、活著是為了別人的長進；今天的落點是病房、職場、家裡和教會裡那一條條走不開的鎖鍊（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，這原則今天落在會眾的哪一張病床、哪一間辦公室、哪一個家？","⑫ 先講 321 的「無己」「活著就是基督」，再拿 1:21 和加 2:20 來印證；或把這一章講成「保羅好偉大，我們要像他一樣」。","經文先講的是神：神動了善工、神必成全、基督之靈供應、基督在身體上顯大；保羅的生命是被基督住滿的結果，不是一項可以靠意志模仿的成就。先講口號再引經文，就把經文當成了 321 理念的插圖（鐵律五）；把保羅講成英雄，會眾就會更佩服作者，而不是更愛主。","檢驗標準：會眾走出去，記得的是「保羅很偉大」，還是「基督是我的生命」？321 是最後才接上去的嗎？"]},{"n":2,"t":"以基督耶穌的心為心","sub":"心、空、光","lv":"A","arc":"心","sec":[["2:1--4","在基督裡若有甚麼勸勉：意念相同、看別人比自己強"],["2:5--11","你們當以基督耶穌的心為心：基督之歌"],["2:12--18","就當恐懼戰兢做成你們得救的工夫：明光照耀與澆奠"],["2:19--24","提摩太的明證：待我像兒子待父親"],["2:25--30","我想必須打發以巴弗提到你們那裡去：幾乎至死"]],"serm":{"pts":[["意念相同","2:1--4","「只要存心謙卑，各人看別人比自己強」——教會裡開始有人結黨、貪圖虛浮的榮耀；保羅開的藥方不是規條，是一顆心"],["往下走的心","2:5--11","「反倒虛己，取了奴僕的形像」——基督本有神的形像，卻一路往下走到十字架；「所以，神將他升為至高」"],["學會了的人","2:12--30","「他興旺福音，與我同勞」——提摩太與以巴弗提，是基督的心活在兩個真實的人身上"]]},"q":"你上一次為了一件小事爭到底，是甚麼時候？也許是家族群組裡誰出錢、誰出力、誰陪爸媽去看病；也許是會議桌上那份企劃明明是你熬夜寫的，上台報告、被老闆記住的卻是別人；也許是服事表一排出來，你的名字又在別人後面。\n也有另一種人，從來不爭：誰開口都說好，累到在停車場的車裡哭，還覺得是自己不夠謙卑——因為有人告訴過你，這就叫無己。\n這一章要問的是：一位本有神的形像、卻自己一路往下走到十字架的主，他的心放進你裡面，會長成甚麼樣子？是更會抓，是更會被踩，還是更知道自己是誰，所以空得出一雙手來？","truth":"基督本有神的形像，卻不抓住與神同等，自己倒空、取了奴僕的形像，一路順服到十字架；所以，神將他升為至高，萬口要承認耶穌基督為主，使榮耀歸與父神（2:6–11）。\n以他的心為心，不是看輕自己，是在他裡面確知自己是誰，所以能放開抓住的手，也顧別人的事——而連這一份心意，都是神在我們心裡運行的。","mv":{"t":"你們當以基督耶穌的心為心：","r":"腓2:5"},"card":["這一章在講一顆心——基督是我的心。保羅面對一間開始結黨、貪圖虛浮榮耀的教會，沒有先開一張規條，先唱了一首歌：基督本有神的形像，不抓、倒空、取了奴僕的形像、順服至死，神將他升為至高。歌唱完，他給你看兩個學會這顆心的真實的人——提摩太和以巴弗提。全章拎起來就是一句：「你們當以基督耶穌的心為心」（2:5）。","這一章往下的七步，是基督自己走的；往上的三步，主詞換成了神：「所以，神將他升為至高」（2:9），賜他超乎萬名之上的名，叫萬膝向他跪拜。神也在我們裡面做工：「立志行事都是神在你們心裡運行」（2:13）。神還走到一張病床旁邊，憐恤幾乎要死的以巴弗提，而且「不但憐恤他，也憐恤我」（2:27）——連床邊那個擔心得睡不著的人，他也看見了。","2:26 說以巴弗提「極其難過」，原文 ἀδημονῶν（adēmonōn）。福音書寫耶穌在客西馬尼「就憂愁起來，極其難過」（太 26:37），用的就是這個字。那位虛己的主，自己也極其難過過；學會他的心的以巴弗提，也是。而以巴弗提難過的理由很特別：不是因為自己病了，是因為「你們聽見他病了」。這改變今天的讀法：無己不是把感受關掉，是讓感受朝向別人。一個會難過的人，不是不夠屬靈，可能只是愛得深。","這一章照出兩種走偏的我。一種是抓：抓住位子、抓住功勞、抓住「我是對的」，在會議桌、家族群組、服事表前，心裡默默算的都是自己排第幾。另一種是消失：不敢有需要、不敢說不，把被踩當成謙卑，把自我厭惡當成屬靈。兩種都不是基督的心。無己不是沒有自己，是不以自己為中心；不是自我消滅，是自我給出。基督虛己的時候，完全知道自己是誰；我們無己，也是因為知道自己在基督裡是誰。","「反倒虛己，取了奴僕的形像」（2:7）。全章最該被記住的動作是「取了」——取一個最低的位置。約翰福音記下這個動作的現場：「耶穌知道父已將萬有交在他手裡」（約 13:3），然後「就離席站起來，脫了衣服，拿一條手巾束腰」（約 13:4）。次序不能顛倒：先知道自己是誰，才拿起手巾。一個不知道自己是誰的人拿起手巾，是在討人喜歡；一個在父手裡站穩的人拿起手巾，才是在愛。","這一週做兩件事。第一，在一個你習慣抓住的地方鬆手一次：會議上把功勞說出同工的名字；家族群組裡先問「這一次誰最需要幫忙」；服事表上讓一位新人站你的位置，你在旁邊陪他。第二，在一個你習慣不敢說的地方開口一次：對一位信得過的人說出你真實的累，或對一個超過負荷的要求溫和地說「這一次我不行」。前一件是 2:4 的「不要單顧自己」，後一件是保羅說「免得我憂上加憂」（2:27）的誠實。","最終整合：腓立比，城外河邊，呂底亞家的一個晚上。\n以巴弗提回來了。比出發的時候瘦了一大圈，走幾步就要停下來喘。他從懷裡拿出一捲信。\n屋裡坐滿了人。那位賣紫色布的女主人，那個從前被鬼附、如今能好好說話的使女，那位多年前半夜「洗他們的傷」（徒 16:33）的禁卒，和他一家。\n友阿蝶坐在屋子這一頭，循都基坐在那一頭。這幾個月，她們沒有坐在一起過。\n信讀到第二章，讀信的人放慢了聲音：\n「他本有神的形像，不以自己與神同等為強奪的；反倒虛己，取了奴僕的形像，成為人的樣式」（2:6–7）\n屋子很安靜。這一城的人都知道，十字架是給奴隸的。\n「既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上」（2:8）\n停了一下，讀信的人說：「所以——」\n「無不口稱『耶穌基督為主』，使榮耀歸與父神」（2:11）。禁卒低下頭。他從前只認識一位主，在羅馬。\n這時以巴弗提咳了起來。走了幾百里路的腳，還沾著泥。\n兩個女人同時站起來，同時走向牆邊那一個水盆。\n她們的手碰在盆沿上。停了一下。\n一個端起盆，一個跪下來，解開以巴弗提的鞋帶。\n信還沒有讀到她們的名字。\n那一晚，沒有一個人變小了。友阿蝶還是友阿蝶，循都基還是循都基；她們都知道自己是誰——是主的人，名字在生命冊上。\n只是兩雙一直抓著的手，在同一個水盆邊，一起空了出來。\n這就是基督的心：知道自己是誰，所以彎得下腰。"],"self":"這一章照出來的「有己」，是一雙一直在抓的手：抓功勞、抓位子、抓「我是對的」。它在教會裡不一定大聲結黨，只是心裡默默記著誰沒有謝我、誰的名字排在我前面——「別人都求自己的事」（2:21），常常就是這麼小。\n可是有己也會穿上謙卑的衣服：不敢有需要、不敢說不，把自己縮到沒有，心裡卻在等人看見我的犧牲；為了被高舉而往下走，中心仍然是我。基督往下走的時候，眼睛不在自己身上，是在父和我們身上。","t321":{"k":"耶穌是我的榜樣：這一章的心，耶穌在客西馬尼活給我們看。他對門徒說「我心裡甚是憂傷，幾乎要死；你們在這裡等候，和我一同警醒」（太 26:38）——他沒有假裝不痛，還開口請朋友陪他。然後他俯伏在地禱告：「然而，不要照我的意思，只要照你的意思」（太 26:39）。「存心順服，以至於死」（2:8）不是沒有感受的順服，是把感受誠實說出來以後，仍然自由地選擇父的旨意。學他，是在說得出自己的軟弱之後，把自己交出去；不是先把自己麻木掉，再假裝交出去。","g":"讓耶穌作王：這一章要人讓出來的位置，是「中心」。2:11 說萬口要承認「耶穌基督為主」——在腓立比，「主」是凱撒的稱號；在我的家、我的公司、我的服事裡，「主」常常就是我自己：我的意見、我的功勞、我的面子。讓耶穌作王，是把這個位置還給他，所以我不必再搶第一，也不必再替自己記帳。也要看清另一面：讓耶穌作王，不是讓某一位領袖、配偶或長輩坐上那個位置，替他決定你沒有聲音。可以自己檢查：這一週我最不肯讓步的那一件事，坐在中心的是誰？","p":"建立屬神的體系：第 2 章不只給一個人一顆心，也給一群人一套活法。第一，帶門徒像保羅帶提摩太（2:22）——321 的「3」：屬靈父子最後是兩個並肩為福音作奴僕的人，不是「我帶出來的人就是我的人」。第二，同工像以巴弗提（2:25）——321 的「5」：一同做工、一同當兵；有人累倒了，教會要接他回家、讓他休息、「尊重這樣的人」（2:29），不是把他推回前線。第三，衝突有路可走：不讓嘀咕在背後發酵，也不叫受委屈的人閉嘴，像 4:3 那樣請一位信得過的第三者來幫助。這樣的一群人，才會在彎曲的世代裡「好像明光照耀」（2:15）。"},"grp":["【一、破冰】說一個你小時候和兄弟姊妹、表兄弟或同學搶東西的記憶：搶的是甚麼？最後是誰讓了？讓的那個人，後來在你心裡是甚麼樣子？","【二、扎心】經文說：「凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強」（2:3）。說出最近一次你心裡在排名次的場合——哪一天、在哪裡、和誰，你在算甚麼？或者反過來，說出最近一次你很想說「不」，卻說了「好」的時刻，那一次你怕的是甚麼？","【三、福音】讀 2:6：基督往下走之前，經文先說「他本有神的形像」——他完全知道自己是誰。說出一個神在基督裡已經給你的身分（例如 1:1 的「聖徒」、3:20 的「天上的國民」）。如果這個身分是真的，這一週哪一個場合，你可以不必再抓、也不必再縮？","【四、行動】說出一位這一週你要「顧他的事」的人（名字或關係），哪一天、在哪裡、做哪一件事（一通電話、陪他看一次醫生、替他分擔一件家事、把一次功勞說出他的名字）。也說出一件你這一週要誠實說出口的需要，要對誰說。","【五、代禱】為三種人指名禱告：一位正躺在病床上、或日夜守在病床旁的人，求神像憐恤以巴弗提那樣憐恤他，也憐恤他身邊的家人；一位在教會或職場服事累到快撐不住的同工，求主給他休息，也給我們看見他的眼睛；一位在家裡、教會或職場被要求「無己」而不敢說話的人，求主讓他知道自己在基督裡是誰，並為他預備安全的幫助。"],"prac":{"main":"這一週，在基督裡站穩自己是誰，然後空出一隻手，去顧一個人的事。","items":["對神：每天早上用 2:6–11 禱告，把這首歌慢慢唱一遍，唱到「耶穌基督為主」時停下來，說出今天你最想抓住的一件事，然後說：「主啊，你是主，這件事交給你。」每晚回想：今天有沒有哪一刻，我是從「已經被愛」的地方出發，而不是從「要被看見」的地方出發？","對自己：這七天，每當你發現自己在心裡比較、排名、記帳，就記下時間、場合和你想抓住的東西；每當你發現自己想說「不」卻說了「好」，也記下來。週末把兩張單子帶到主面前：前一張求主鬆開你的手，後一張求主讓你知道，在他面前你可以說出真實的需要。","對人：選一位身邊的人，這一週具體「顧他的事」：一通電話、一頓飯、陪他跑一次醫院、替他分擔一件雜事。也找一位信得過的弟兄姊妹，說出一件你最近真實的重擔，讓他為你禱告——保羅會說「免得我憂上加憂」（2:27），你也可以。","對生活：在職場或家裡，刻意把一次功勞說出別人的名字；在一場爭論裡，先問一句「你最在意的是甚麼」，再說自己的意見。同時檢查你的行事曆：如果已經滿到沒有一天能休息，求主給你勇氣婉拒一件事——以巴弗提病倒以後，保羅做的是送他回家。","對使命：在小組或事工團隊裡，提一個具體安排——為一位累倒或生病的同工排一次探訪與送餐；或像保羅帶提摩太那樣，邀請一位年輕的弟兄姊妹和你一起服事一次，讓他站前面、你在旁邊。並為一位還不認識主的家人或同事每天指名禱告，求主讓他有一天也口稱「耶穌基督為主」。"]},"safe":["① 把 2:7「虛己」與 321「無己」講成「你要把自己看成沒有價值」「你的感受和需要都是己，要對付掉」。","基督虛己的時候「本有神的形像」（2:6），ὑπάρχων 是現在分詞，一直是——他是知道自己是誰才往下走的。把無己講成自我否定、自我厭惡，會讓本來就低自尊、憂鬱的人以為自己的病是美德，也讓說出「免得我憂上加憂」（2:27）的保羅不及格（紅線一；全卷立場見 ISS00_2）。","檢驗標準：你講無己之前，有沒有先講身分——「你在基督裡是誰」？一位常常厭惡自己的弟兄姊妹聽完，是更恨自己，還是更知道自己被愛？","② 用 2:3「看別人比自己強」和「無己」要人不可以說不、沒有界線，對領袖、配偶或長輩無條件順服。","2:7、2:8 兩個 ἑαυτὸν：是他自己倒空、自己卑微，沒有一個人有權柄去倒空別人——被迫的不叫虛己，叫受害。2:4 的「也」沒有叫人不顧自己；寫這一章的保羅，也會說「應當防備」（3:2），也曾在腓立比要求官長親自來領他出監（徒 16:37）。用無己壓人，是屬靈虐待（紅線一；回指哥林多後書立場三）。","檢驗標準：一位正在家裡被打、在教會被控制的人聽完，是更敢找人求助、設下界線，還是更覺得說不就是有己？","③ 先講 321 的「無己」，再拿 2:5–8 來印證；把基督之歌講成一套「做到無己的方法」。","次序是先讓 2:6–11 把基督唱完——唱到萬膝跪拜、使榮耀歸與父神——321 才在末端接上去，而且接上去的是 2:4 的方向：為了別人。先講理念再引經文，是把經文當成 321 理念的插圖（鐵律五），會眾會更佩服這套理念，而不是更愛那位倒空自己的主。","檢驗標準：你講到 321 之前，會眾有沒有先看見十字架和萬膝跪拜？講完以後，他們記得的是一個口號，還是一位主？","④ 把 2:9「所以，神將他升為至高」講成成功策略：「先低頭，以後就會被抬高；你謙卑，神就讓你升職、被看見」。","基督往下走不是一筆為了被高舉的投資；為了被高舉而謙卑，仍然是有己，只是把抓的手藏在背後。高舉的主詞是神，時間也在他手中；有人一生往下走，要到見主那日才被看見（全卷立場見 ISS00_5）。","檢驗標準：會眾聽完，是更自由地去服事不被看見的位置，還是在心裡默默計算這一次的謙卑甚麼時候兌現？","⑤ 把 2:7「虛己」講成「基督在地上放下了神性，那時只是一個好人」，或為了講得生動說「耶穌那時也不知道自己是神」。","2:6 的「本有」是一直是；虛己的方式是「取了奴僕的形像」——加上人性，不是減去神性；2:10–11 化用賽 45:23，把只歸給耶和華的敬拜歸給了耶穌。講成放下神性，就把十字架講成一個好人的犧牲（全卷立場見 ISS00_2；議題見 ISS02_3）。","檢驗標準：你講完，會眾是否更確定：那位往下走到十字架的，就是萬膝要向他跪拜的主？","⑥ 把 2:12「做成得救的工夫」講成「得救以後要靠自己做到夠，不然會失去救恩」，用「恐懼戰兢」叫人活在怕裡。","2:12 與 2:13 原文是同一個句子：「立志行事都是神在你們心裡運行」（2:13）；1:6 說他「必成全這工」。做成是活出來、做到底，不是做了才得到；恐懼戰兢是敬畏與認真，不是怕被丟掉（紅線五；全卷立場見 ISS00_4；回指加拉太書立場二）。","檢驗標準：你有沒有把 2:12 和 2:13 一口氣讀完？會眾走出去，是更怕神把他丟掉，還是更敢放膽活出救恩？","⑦ 反過來，把 2:13「都是神在你們心裡運行」講成「反正神會作，我們等著就好」——不必和好、不必改變、不必操練。","保羅用的是命令式 κατεργάζεσθε，「做到底」；神運行，是為了叫人「立志」也「行事」，不是叫人停下來。把恩典講成被動等待，等於把 2:12 撕掉，也讓 2:14 以後那一群要在彎曲世代裡發光的人失去了腳（紅線五）。","檢驗標準：會眾聽完，這一週有沒有一件具體要去活出來的事——一次和好、一次認錯、一次服事？","⑧ 用 2:14「不要發怨言，起爭論」叫人閉嘴：同工受欺負、帳目不清、有人被傷害，說出來就被說成「發怨言」「破壞合一」。","2:14 的背景是曠野——「你們的怨言不是向我們發的，乃是向耶和華發的」（出 16:8）；被禁止的是對神的不信與背後的嘀咕，不是對不公的申訴。4:2–3 保羅請第三個人「幫助」兩位姊妹，合一是把問題帶進主裡處理，不是要求表面和諧（紅線八）。","檢驗標準：你的教會有沒有一條清楚、安全的管道，讓人可以提出申訴、舉報不當行為？講完這一節，受委屈的人是更敢說，還是更不敢說？","⑨ 用 2:2「意念相同」「有一樣的心思」要求所有人意見一致，把同工會上的不同意見當成不合一、不順服。","φρονέω 是心思朝著的方向，不是每一個意見都要一樣；保羅對動機不純的傳道人都還能說「這有何妨呢」（1:18）。把合一講成意見統一，會把正當的提問壓下去，換來表面和諧，也會讓某一個人的意見取代了基督的心（紅線八）。","檢驗標準：在你們的同工會上，有沒有人可以說「我不同意」而不被看成不屬靈？","⑩ 把 2:17「我若被澆奠在其上」與 2:30「不顧性命」講成「真正愛主的人不必顧身體、不必休息，累死在工場上最榮耀」。","保羅說的是「若」，同一封信裡他說「我在肉身活著，為你們更是要緊的」（1:24）；以巴弗提病倒以後，保羅做的是送他回家，吩咐教會「要尊重這樣的人」（2:29）。把耗竭講成獻祭，會叫同工病倒、家庭破碎，也是在浪漫化死亡（紅線二；全卷立場見 ISS00_3）。","檢驗標準：你的教會怎樣對待一位累垮的同工——接待、照顧、讓他休息，還是叫他「再撐一下」？","⑪ 把 2:27 以巴弗提的病講成「信心不夠」，或把保羅的「憂上加憂」講成軟弱的壞榜樣。","保羅沒有醫好他，也沒有責備他，只說「然而神憐恤他」（2:27）；寫「要靠主常常喜樂」的人，坦白說自己會憂。焦慮、憂鬱是需要治療的病，就醫、吃藥、諮商與禱告不衝突（紅線三；全卷立場見 ISS00_5）。","檢驗標準：一位正在吃藥治療憂鬱的弟兄姊妹聽完，是覺得被允許說出來，還是覺得自己又被定罪了一次？","⑫ 用處境取消原則：「那是一世紀腓立比人吵架的事」；或把處境硬搬：拿 2:3「結黨」在講台上影射今天教會裡某一群人、某一位同工。","書信三問要走完：處境是一間很愛主、很會奉獻、同工卻開始互相看不順眼的教會；原則是以基督耶穌的心為心；今天的落點是每一間這樣的華人教會——包括講道的人自己。在講台上影射「結黨」，講的人自己就在結黨（全卷立場見 ISS00_1）。","檢驗標準：你講完，會眾第一個想到要改變的，是「那些人」，還是自己？你自己呢？","⑬ 把 2:10–11「無不屈膝」「無不口稱」講成「到最後人人都得救」，或拿來恐嚇不信的家人：「你以後還是要跪。」","這是化用賽 45:23 的主權宣告，不是普救的保證；但保羅寫這一句是為了敬拜，不是為了威脅。兩頭講偏，一頭叫人輕忽福音，一頭叫人把福音當成要贏的辯論（議題見 ISS02_5）。","檢驗標準：會眾聽完，是更想在今天就屈膝敬拜，還是更想回家和家人爭誰對？"]},{"n":3,"t":"向著標竿直跑","sub":"損、跑、國","lv":"A","arc":"跑","sec":[["3:1--3","你們要靠主喜樂：應當防備犬類"],["3:4--11","我先前以為與我有益的，我現在因基督都當作有損的：保羅的帳本"],["3:12--16","向著標竿直跑：竭力追求"],["3:17--21","我們卻是天上的國民：效法與等候"]],"serm":{"pts":[["保羅的帳本","3:4--9","「我以認識我主基督耶穌為至寶」——七項資歷從資產欄搬到負債欄，「看作糞土，為要得著基督」"],["向著標竿直跑","3:10--16","「忘記背後，努力面前的，向著標竿直跑」——要忘記的是保羅自己的成就與資歷；被基督得著的人，才跑得動"],["天上的國民","3:17--21","「我們卻是天上的國民」——腓立比是羅馬放在馬其頓的殖民城，教會是天國放在腓立比的一塊領土"]]},"q":"你的履歷上，哪一行是你最捨不得刪的？學歷、職稱、年資、孩子考上的學校、在教會服事了幾年——嘴上說都不重要，可是同學會上、家長群組裡、同工會中，它總是第一個被問到，也是你第一個想說的。\n另一些人身後背著的不是獎盃，是傷：一段婚姻、一次被羞辱、一個再也回不去的家；有人拿這一章勸他「忘記背後」，他點了頭，夜裡卻更睡不著。\n這一章要問的是：一個身後同時有獎盃和傷口的人，要怎樣才跑得動——是靠自己忘記，還是靠一位先抓住他的主，帶著他往前？","truth":"保羅把一生的資產搬進負債欄，為要得著基督；他不靠自己的義，乃是在基督裡被找著，又是先被基督得著的人，所以竭力向著標竿直跑。\n跑道上的人不必回頭欣賞獎盃，也不必假裝沒有傷；他是天上的國民，等候救主把這卑賤的身體改成榮耀的形狀。","mv":{"t":"向著標竿直跑，要得神在基督耶穌裡從上面召我來得的獎賞。","r":"腓3:14"},"card":["這一章是保羅的帳本與跑道。他先防備那些要外邦信徒受割禮才能得救的教導，再把自己七項資歷一項一項攤開，從「有益」搬到「有損」；然後放下帳本，站起來跑——不是因為他已經完全，是因為基督耶穌先得著了他。最後他抬頭看終點：我們是天上的國民，等候救主。第一章說基督是我的生命，第二章說基督是我的心，這一章說：基督是我的標竿。","這一章的主詞，常常站在保羅背後。義是「因信神而來的義」，不是人自己縫的；復活的大能，是神的大能；保羅追求，是要得著「基督耶穌所以得著我的」——基督先伸了手；呼召是神「從上面」召；有人存別樣的心，「神也必以此指示」，不必靠人去壓；最後，主耶穌基督要按著那叫萬有歸服自己的大能，把卑賤的身體改變形狀。保羅跑的每一步，都踩在神先做完的事上。","第 13 節「努力面前的」，原文 ἐπεκτεινόμενος（epekteinomenos），是一個疊了兩個字首的字：往前、再往外伸——賽跑的人到了最後幾步，把胸膛和頸子往終點線伸出去的樣子。它是現在分詞，掛在第 14 節「直跑」底下：不是跑完一圈才伸，是一路都向前傾著。這改變今天的讀法：「努力」不是咬牙苦撐，是身體的重心放到前面去了。一個人的重心在哪裡，他就往哪裡倒；重心在基督身上的人，跌倒也是往前倒。","這一章照出來的我，手上有兩本帳。一本記著自己的好：服事幾年、奉獻多少、從來沒缺過聚會；嘴上說都是恩典，被人忽略的時候，卻馬上翻出來。另一本記著別人的不是：那個不夠屬靈的同工、那間作風不同的教會，我很快就替他們貼上標籤，卻從來沒有為他們流過一滴淚。我還有一個習慣：跑了幾步就停下來，回頭欣賞自己跑過的那一段。","「或者可以得著基督耶穌所以得著我的」（3:12）。全章最大的翻轉，藏在這半句的被動語態裡：保羅竭力追求，是因為他已經被基督抓住了，不是為了被抓住。所以追求不再是考核，是回應；跌倒了不是被淘汰，是一個被抓住的人再站起來。整章的「跑」，都從這一個「被」字起步。","這一週，挑一個你習慣先亮出資歷的場合——同學會、家長群組、公司會議、同工會。這一次刻意不說，把那三十秒用來問對方一句：「你最近過得怎樣？在主裡學到甚麼？」回家以後，記下你不說的時候心裡的感覺：是空虛、焦躁，還是輕鬆？那個感覺會告訴你，自己還「靠」著甚麼。","最終整合：腓立比，夜裡，呂底亞的家。\n以巴弗提病好了，從羅馬帶回一封信。屋裡點著燈，有人一句一句念出來。\n念到「第八天受割禮」，念到「無可指摘」，賣紫色布的呂底亞想起自己那本記得很整齊的帳簿。\n念到「看作糞土」，幾個年輕人想笑，又不敢笑。\n念到「忘記背後」，坐在門邊的禁卒低頭看自己的手——那雙手，曾經把寫信的人兩腳上了木狗。\n他不必假裝那一夜沒有發生過；寫信的人也沒有忘。只是那一夜，不再是他的名字。\n念到「我們卻是天上的國民」，窗外正好有一隊羅馬老兵沿著大道走回家，鎧甲在月光下作響。\n這座城很驕傲，它是羅馬放在馬其頓的一塊地。\n屋裡這幾個人也是一塊地——一個商人、一個獄卒、一個曾經被人當成搖錢樹的使女；他們的國，在天上。\n散會的時候，禁卒走在最後。他年紀大了，背有一點駝。\n他想起信裡說，主要把這卑賤的身體改變形狀。\n他沒有加快腳步，只是把身子往前傾了一點，\n像一個人，看見終點那裡，有一位先抓住他的主，正等著他。"],"self":"這一章照出來的「有己」，第一個樣子是靠：我嘴上說靠主，心裡卻收著一張隨時拿得出來的履歷——出身、學歷、職位、服事年資、奉獻紀錄；被肯定的時候它很安靜，被忽略的時候它就出聲。更隱密的是一張反向的履歷：「我這種人不配」，把過去的失敗當成身分，其實仍然是以自己為中心。\n第二個樣子是停：跑了幾步就回頭欣賞，覺得自己已經到了，開始看那些跑得慢的人不順眼；或者用「犬類」「十字架的仇敵」替別人貼標籤，眼裡沒有淚，只有分數。被基督得著的人，不必再替自己記帳，也不必替別人打分。","t321":{"k":"耶穌是我的榜樣：保羅說「效法他的死」（3:10），原文是被模成他死的形狀——這個形狀，是耶穌先走出來的。他「就定意向耶路撒冷去」（路 9:51），不回頭欣賞加利利的群眾與神蹟；「他因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難」（來 12:2）——他是第一位向著標竿直跑的人。他也是第一位流著淚說出真相的人：快到耶路撒冷，「看見城，就為它哀哭」（路 19:41），同一週卻潔淨了聖殿。他有可以誇口的一切，卻不靠它證明自己；他完全知道自己是誰，所以往前跑，為要把我們帶回父那裡。","g":"讓耶穌作王：這一章要人讓出「自己的義」那個位置。保羅說「不是有自己因律法而得的義」（3:9）——驕傲最後的地盤，不是財富，是覺得自己在神面前站得住；讓耶穌作王，是連這塊地也交出去，在他裡面被找著。第二個要讓出的，是跑道上裁判的位置：存別樣心的人，指示他的是神，不是我；我不必替每一個跑得慢的人打分數。最後，3:21 說他有叫萬有歸服自己的大能：我的身體、我的病、我的終局，也在他的權下。可以自己檢查：這一週，我在哪一件事上，還在當自己和別人的審判官？","p":"建立屬神的體系：經文先說完它的話——3:15--17 是一群人一起跑，不是一個人的獨跑。「凡是完全人總要存這樣的心」，動詞是「我們」；第 16 節的「行」是排成行列一起走。321 改變觀念八大步驟的後四步在這裡落地：存別樣的心時神指示，是修正；到了甚麼地步就照著甚麼地步行，是反覆；「一同效法我」，是繁殖。所以一個團契要問的，不是誰跑得最快，而是：有沒有人在前面，讓後面的人看得見？有沒有一個地方，可以誠實說「我還沒有到」而不被淘汰？有沒有人因為我們的樣子，開始跑？天上的國民，在腓立比是一個小小的公民團體；今天，就是你週五晚上的那個小組。"},"grp":["【一、破冰】你走過最難忘的一段長路是甚麼——運動會的接力、一次馬拉松、爬一座山、騎車環島，或是陪家人走完的一段路？最後那一段，是甚麼讓你沒有停下來？","【二、扎心】「只是我先前以為與我有益的，我現在因基督都當作有損的。」（3:7）說一樣具體的東西：學歷、職位、收入、孩子的表現、教會裡的位置——上一次你急著讓人知道它，是甚麼時候、在甚麼場合、對誰說的？說完以後，你心裡是甚麼感覺？","【三、福音】「或者可以得著基督耶穌所以得著我的。」（3:12）說一個時刻：哪一年、在哪裡，你清楚知道是基督先找到你、先抓住你，不是你先找到他？那個經驗，今天在你跌倒的時候，怎樣幫你站起來？","【四、行動】說出這一週你會在哪一個場合（同學會、家長群組、公司會議、同工會），刻意不亮出自己的資歷，先問對方一個關心他的問題；再說出一位比你年輕、或剛信主的人的名字，你要在哪一天、用甚麼方式（吃一頓飯、一通電話、一起禱告）陪他走一段——你也是別人看得見的榜樣。","【五、代禱】為三種人指名禱告：一位過去很成功、如今失去了職位或健康、覺得自己一無所有的人，求主讓他知道在基督裡被找著就站得住；一位身後背著很深的傷、常被人勸「忘記過去吧」的人，求主保護他、讓他被聽見，也有安全的陪伴與專業的協助；一位你心裡已經放棄、覺得他是「十字架的仇敵」的親人或朋友，求主給你為他流淚的心。"],"prac":{"main":"這一週，把重心放到前面：不靠身後的獎盃，不被身後的傷定義，向著基督再跑一步。","items":["對神：每天早上讀 3:12–14，用一句話向主承認「我還沒有到」，再說一句「謝謝你先抓住了我」；晚上讀 3:20–21，為自己的身體——連它的病痛與疲倦——向那位要改變它形狀的主感恩。","對自己：找一段安靜的時間，寫下兩樣「背後」：一樣是你常回頭欣賞的成就，一樣是你一直放不下的失敗或羞愧。前一樣，問自己：我是不是還靠著它？後一樣，問自己：它是不是在定義我？若你身後是別人加給你的傷，請不要逼自己忘記，把它告訴一位信得過的人或專業的輔導——這也是往前跑的一步。","對人：想一位你心裡已經替他貼上標籤的人——那位看法不同的同工、那位離開教會的朋友、那位你覺得只顧自己的親人。這一週為他禱告三次，每一次只求一件事：讓我看見他的時候，眼裡先有淚，不先有分數。若有機會，用一句真誠的關心開頭，不辯論。","對生活：攤開這一週的行事曆和帳單，用 3:19 照一照：哪一筆錢、哪一段時間，是被「肚腹」帶著走的——不是吃飯本身，是凡事以滿足自己為中心？選一小筆，轉去做一件天上國民會做的事：請一位剛來城市的新朋友吃飯、替一位病中的肢體送一次餐、捐一筆給團契的關懷基金。","對使命：在你的小組或服事團隊裡，選一位剛起步的人，這一週約他一次，讓他看見你怎樣讀經、怎樣禱告、怎樣處理一件難事——連你還沒做好的地方也讓他看見。3:17 的榜樣不是完美的展示，是誠實的跑道；繁殖從讓一個人看見開始。"]},"safe":["① 把 3:2「犬類」講成罵猶太人，或拿來罵別的宗派、別的宗教、跟我們意見不同的人：「保羅都叫他們狗了」。","保羅自己是「希伯來人所生的希伯來人」（3:5）；3:2 針對的是要外邦信徒受割禮才能得救的教導——福音被改了，不是一個民族，也不是口味之爭；教會史上反猶的罪，正是從這種讀法開始（紅線七；回指加拉太書立場四）。","檢驗標準：一位有猶太背景的弟兄姊妹、或一位從別的宗派來的朋友坐在台下，聽完是覺得被罵，還是聽懂了保羅防備的是一種教導？","② 只學 3:2 的「應當防備」，不學 3:18 的「流淚地告訴你們」：在講台或群組裡點名批判、冷嘲熱諷，還說「保羅也很兇」。","同一位使徒說到十字架的仇敵，是一面寫一面哭；他的嚴厲是醫生的嚴厲，為了保護 3:1 的喜樂，不是為了吵贏。只有防備沒有眼淚，會把會眾訓練成很會分辨、卻不會愛人的人（紅線七）。","檢驗標準：你說到那些錯了的人時，自己心裡是痛，還是痛快？會眾聽完，是更想為他們禱告，還是更想轉傳你的批評？","③ 用 3:13「忘記背後」對受過傷的人說「過去的事就不要再提了」「你要往前看」，叫被家暴、被性侵、被霸凌、被屬靈領袖傷害的人壓抑創傷、否認傷害、立刻放下。","上下文的「背後」是 3:4–8 保羅自己的資歷與成就，是他引以為傲的東西，不是別人加給他的傷；保羅自己也沒有失憶。把成就的經文用在創傷上，是第二次傷害；傷需要被說出、被聽見、被好好處理，有時需要專業的協助（紅線六；回指哥林多後書立場四）。","檢驗標準：一位身後背著傷的人聽完，是覺得自己又被叫閉嘴，還是第一次聽見「不被過去定義」與「否認過去發生過」是兩件不同的事？","④ 反過來，讓傷害人的一方拿 3:13 替自己脫身：「我已經忘記背後了，你也不要再翻舊帳」，用來逃避認錯、道歉與賠償。","保羅不再被逼迫教會的過去定義，卻從來沒有否認它，到老都說自己逼迫過神的教會；忘記背後是恩典的自由，不是免除責任的通行證，更不能變成叫受害者閉嘴的經文（紅線六）。","檢驗標準：會眾聽完，曾經傷害過人的一方，是更敢面對、更願意修補，還是多了一句叫對方安靜的經文？","⑤ 把 3:8「看作糞土」講成基督徒要看輕讀書、工作、家庭，或鼓勵人為了「服事」辭職、輟學、冷落配偶與孩子，還說這叫「丟棄萬事」。","σκύβαλα 是一個比較：好東西要搶基督的位置、成為人「靠」的對象時，才是糞土；同一封信 4:8 還叫人思念可敬的、公義的、可愛的事。把比較講成輕看，會讓人用屬靈的理由逃避責任。","檢驗標準：一位為家庭與工作盡心的弟兄姊妹聽完，是覺得自己屬靈不夠，還是更清楚哪一樣東西不可以放在基督的位置上？","⑥ 把 3:4–6 講成「保羅是因為活得太失敗、良心太痛苦才信主」，暗示福音只是給失敗者的安慰；或反過來，講員拿自己的資歷當見證的高潮。","經文說保羅就律法上的義是無可指摘的——他是在最成功的時候被基督攔住；福音不只是失敗者的拐杖，也是成功者的鏡子。講台上的人把自己的履歷講得比基督還亮，正是 3:4 的「靠肉體」。","檢驗標準：一位事業順遂的人聽完，是覺得這不關他的事，還是看見自己也有一張拿來「靠」的履歷？你自己的履歷有沒有比基督更亮？","⑦ 把 3:15「凡是完全人」講成教會裡有一群已經完全的屬靈精英，或把 321 的「得勝者」講成一個已經到了的階層，分出「得勝者」與「一般信徒」。","保羅在 3:12 剛說自己還沒有得著、還沒有完全；3:15 的 τέλειοι 是成熟，成熟的記號正是知道自己還沒有到；321 的得勝者以 3:12–14 為準，是竭力追求的人，不是屬靈貴族（全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是更想被列入某一個屬靈階層，還是更願意誠實承認「我還沒有到」，然後再跑一步？","⑧ 把「竭力追求」「向著標竿直跑」講成成績表與業績壓力：「你跑得不夠快」「你今年的屬靈進度落後了」，讓本來就自責、完美主義的人更不敢休息。","保羅的竭力，是被基督先得著的回應（3:12），不是為了被接納；3:16 讓每個人照著已經到的地步行，步伐可以不同。用跑道恐嚇人，是把恩典與追求的次序倒過來（立場四）。","檢驗標準：一位常覺得自己永遠不夠好的人聽完，是更焦慮，還是第一次覺得：我是被抓住了，所以可以跑，跌倒了也可以再起來？","⑨ 用 3:11「或者我也得以從死裡復活」說「連保羅都沒有把握，你更不能確定自己得救」，讓人活在失去救恩的恐懼裡。","εἴ πως 是謙卑的語氣，不是懷疑：同一封信 1:6 說神「必成全這工」，3:9 說義是從神來的，3:20 說我們等候救主；保羅不確定的是走向復活的路徑與時候，不是神的信實（全卷立場見 ISS00_4）。","檢驗標準：一位很怕自己不夠格得救的人聽完，是更恐慌，還是更有把握，因而更願意往前跑？","⑩ 用 3:17「你們要一同效法我」替講台上的人建立不可質疑的榜樣地位：「照我做就對了」「不要問為甚麼」。","說這句話的保羅，前一段剛說自己還沒有得著、還在跑；「我們」是複數，效法的是向著基督跑的方向，不是一個人的全部；把榜樣變成不可質疑，就從繁殖變成了控制（屬靈權柄回指哥林多後書立場三）。","檢驗標準：會眾聽完，是更依賴某一位領袖，還是更看得見那位領袖自己也在追的基督？","⑪ 把 3:19「他們的神就是自己的肚腹」講成攻擊愛吃的人、身材胖的人，或講成基督徒不可以享受美食、休閒與娛樂。","「肚腹」是一個生命以滿足自己為中心的畫面，與「十字架的仇敵」「專以地上的事為念」連在一起；保羅在 4:12 也學會了飽足。拿這一節羞辱人的身體，正好違背 3:21 神對這個身體的看重。","檢驗標準：會眾聽完，是開始審視自己的心被甚麼帶著走，還是開始打量別人的身材與餐桌？","⑫ 把 3:20「我們卻是天上的國民」講成基督徒不必關心社會、工作與公義；或反過來，在講台上把某一個國家、政黨、移民或不移民的選擇，講成「天國公民」的標準答案。","πολίτευμα 在腓立比的處境，是羅馬殖民城裡的公民團體：在當地生活、工作、守秩序，卻效忠另一座城；原則是忠誠的次序——最後的忠誠只歸給從天上降臨的主，不是撤離，也不是替任何地上的國家背書（全卷立場見 ISS00_1）。","檢驗標準：政治立場不同的兩位弟兄姊妹聽完，是更對立，還是更知道自己真正屬於哪一國，也更願意一同為所住的城求平安？","⑬ 把 3:21「卑賤的身體」講成身體骯髒、不重要；或用「主必改變我們的身體」叫病人不要就醫，保證今生一定得醫治。","ταπεινώσεως 是卑微、軟弱，與 2:8 基督「自己卑微」同字根，不是骯髒；改變形狀是復活的盼望，不是今生的保證；在等候的日子裡，照顧身體、看醫生、按時吃藥，都是尊重神所造的。","檢驗標準：一位長期病痛的人聽完，是覺得自己的身體被輕看、被要求要更有信心，還是得著了在病床旁也能盼望的安慰？","⑭ 用處境取消原則：「割禮是第一世紀的問題，跟今天無關」；或反過來，把今天教會的每一個習慣都叫作「割禮」，誰要求甚麼就說他是犬類。","書信三問的第三問要走完：處境是有人要外邦信徒受割禮才能得救；原則是在基督的義以外，再加上任何條件當作得救的門檻，就是改了福音。今天它落在「要先改掉某某、守某種規矩，才算真信徒」這類加添上——判斷的理由要說出來（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，今天在你的教會，甚麼是加在基督以外的「割禮」，並且說明為甚麼它是福音的問題，不只是習慣不同？","⑮ 把這一章講成 321 的插圖：先講「改變觀念八大步驟」或「得勝者」，再拿 3:7–17 一節一節去對號入座。","次序是經文先講：保羅的帳本、在基督裡被找著、被基督得著、向著標竿直跑、天上的國民，然後 321 才在末端接上；「當作」這個算法，是先落在基督身上（2:6），才落在保羅身上（鐵律五）。","檢驗標準：會眾聽完，記住的是一張八個步驟的表格，還是那位先得著保羅、也得著了他們的基督？"]},{"n":4,"t":"要靠主常常喜樂","sub":"樂、足、香","lv":"A","arc":"足","sec":[["4:1--3","你們應當靠主站立得穩：要在主裡同心"],["4:4--7","你們要靠主常常喜樂：出人意外的平安"],["4:8--9","這些事你們都要思念：都要去行"],["4:10--13","我無論在甚麼景況都可以知足：知足的秘訣"],["4:14--20","所求的就是你們的果子漸漸增多：極美的香氣"],["4:21--23","在凱撒家裡的人特特地問你們安：恩常在你們心裡"]],"serm":{"pts":[["在主裡同心","4:1--3","「我勸友阿蝶和循都基，要在主裡同心」——兩位一同勞苦的姊妹吵架了；保羅沒有叫她們閉嘴，是請「真實同負一軛的」幫助她們"],["常常喜樂","4:4--9","「你們要靠主常常喜樂」——喜樂的源頭是主；「應當一無掛慮」的出路是把一切告訴神，不是把憂慮吞下去"],["知足的秘訣","4:10--23","「我無論在甚麼景況都可以知足」——4:13 的「凡事」包括飢餓與缺乏；福音捆綁不住，一路走進了「凱撒家裡」"]]},"q":"你的喜樂，現在綁在甚麼上面？綁在孩子的成績、公司的業績、身體檢查的報告，還是教會裡那個人今天有沒有給你臉色？綁得越緊，日子就越像在走鋼索。\n也許你今晚口袋裡有一包藥，不敢讓小組知道；也許你手機裡有一個群組，兩位同工已經三個禮拜不互相回訊息；也許你剛剛被裁員，帳戶裡的數字一天比一天少。\n這一章是一個戴著鎖鍊的人寫的。他要問的是：當環境一樣也沒有改變，一個人還能從哪裡得著喜樂、平安、知足與力量？","truth":"基督是我的力量：靠主常常喜樂，因為喜樂的源頭是主不是處境；把掛慮說給神聽，出人意外的平安就守住心懷意念；在甚麼景況都可以知足，靠著那加給我力量的，凡事都能做——包括飢餓，包括缺乏。\n鎖鍊鎖住了保羅，鎖不住福音：它一路走進了凱撒家裡，也要走進今天每一個被環境捆住的人的家、職場與病床旁。","mv":{"t":"我靠著那加給我力量的，凡事都能做。","r":"腓4:13"},"card":["這一章說的是：基督是我的力量。保羅在鎖鍊裡寫完全卷最後一章——勸兩位吵架的同工在主裡同心，叫全教會靠主常常喜樂、把掛慮告訴神，再打開自己的錢包，說他在飽足與飢餓裡都學會了知足。活、心、跑、足，走到這裡是「足」：不是環境夠了，是那加給他力量的主夠了。所以全章的喜樂、平安、知足與奉獻，都不是靠人撐出來的，是從主裡流出來的。","這一章的神，一直在做事。他把同工的名字寫在生命冊上（4:3），不是照表現打分數；他就在近處，聽人把所要的一件一件說出來（4:5–6）；他賜下出人意外的平安，在基督耶穌裡守住人的心懷意念（4:7）；他是賜平安的神，親自與人同在（4:9）；他一直加給保羅力量（4:13）；他把一筆餽送收納成極美的香氣（4:18）；他照他榮耀的豐富，使人一切所需用的都充足（4:19）。人能喜樂、能知足、能給出去，全是因為神先在做。","4:13「那加給我力量的」，原文 ἐνδυναμοῦντί（endynamounti）是現在分詞：不是「那曾經給過我力量的」，是「那一直在加給我力量的」。力量不是一次充滿、自己帶著走的電池，是一條一直接著的管子。這改變今天的讀法：4:13 不是一句考前喊一聲就生效的話，而是一種每天的依靠——今天早上照顧失智的母親、今天下午面對失業的帳單，需要的是今天這一份；明天的那一份，明天他還會加給。所以軟弱的人不必先變強才來，他正是加給軟弱人力量的那一位。","這一章照出來的我，常常把喜樂寄放在別人手裡：業績好就開心，孩子考差就整個禮拜沉著臉。我把掛慮在心裡繞了一百圈，卻很少一件一件地說給神聽；我嘴上說知足，其實只是還沒有缺過；我把 4:13 貼在牆上，心裡想的是「我要贏」。在教會裡，我也很會選邊站，看見兩個人不說話，我不是去幫，是去傳。這一切的根，是我要自己掌握處境，不肯讓主當我的力量。","「我無論在甚麼景況都可以知足，這是我已經學會了。」（4:11）全章最大的翻轉在「學會了」三個字。知足不是天生的性格，也不是一咬牙就有的決心，是一個戴著鎖鍊的人，在飽足與飢餓之間一次一次學出來的功課。這句話把我從「我怎麼還不知足」的自責裡放出來：還在學的人沒有失敗，他正在上課；而這門課的老師，就是那一直加給人力量的主。","這一週做一件事：拿一張紙，寫下現在讓你最掛慮的三件事，一件一行。每天晚上睡前，照 4:6 的次序，一件一件說給神聽：先說出事實，再說出你要的，最後說一件今天可以感謝的小事。若其中一件已經壓得你睡不著、吃不下超過兩個禮拜，這一週就再加一個動作：把這張紙拿給一位信得過的人看，並且約一次門診或諮商。禱告和求助，可以在同一個禮拜發生。","最終整合：腓立比，呂底亞家裡，一個晚上。\n以巴弗提回來了，瘦了一圈，臉色還有點白，手上捧著一封從羅馬帶回來的信。\n那個當年在半夜拿著燈衝進監牢的禁卒，坐在門邊；織布的婦女們圍著油燈。\n屋子兩頭，各坐著一位姊妹。她們已經好幾個月沒有並肩坐過了。\n念信的人念到「我勸友阿蝶和循都基，要在主裡同心」，兩個名字一個接一個被念出來，屋裡忽然很安靜。\n一個人站起來，走到兩個人中間，坐下——他沒有替誰說話，只是坐在那裡，一手搭著一邊。\n念信的人接著念：「你們要靠主常常喜樂。」\n寫這句話的人，手上有一條鎖鍊；聽這句話的人，家裡沒有一個是有餘的。\n念到「出人意外的平安」，以巴弗提低下頭——他想起自己病得幾乎要死的那幾個夜晚。\n念到「都可以知足」「凡事都能做」，那幾個把最後一點積蓄都包進餽送裡的婦女，互相看了一眼：\n原來保羅說的「凡事」，也包括她們的缺乏。\n最後念到「在凱撒家裡的人特特地問你們安」，禁卒站了起來。\n皇帝的家裡，也有人跪下了。\n鎖鍊鎖住了一個人，卻鎖不住那一位，一直加給人力量的主。\n那一晚散會的時候，兩位姊妹是一起走出門的。\n她們的問題還沒有全部談完，可是她們的名字，本來就寫在同一本冊上。"],"self":"這一章照出來的「有己」，第一個樣子是要掌控：我的喜樂要處境配合才肯出現，我的平安要問題先解決才肯落下；掛慮我寧可自己扛、自己想辦法，也不肯一件一件交給神，好像說出來就輸了。\n第二個樣子是要贏：我把「凡事都能做」當成我的願望清單，缺乏的時候覺得神失約了，有餘的時候以為是我自己有本事；看見同工吵架，我急著判誰對誰錯，好讓自己站在對的那一邊。要掌控的我和要贏的我，都不肯讓主當我的力量。","t321":{"k":"耶穌是我的榜樣：保羅在 4:12 學會的「處卑賤」，是基督先走過的路（2:8 同一個動詞，見第 2 章）。主耶穌禁食之後「就餓了」（太 4:2），一生「沒有枕頭的地方」（路 9:58），也謙卑地收下婦女們「用自己的財物供給」（路 8:3）；他在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38），沒有把憂傷吞下去，是「大聲哀哭，流淚禱告」（來 5:7）——這就是 4:6 的樣子。他也是那一位真正同負一軛的：「你們當負我的軛，學我的樣式」（太 11:29）。他因那擺在前面的喜樂忍受了十字架；他的喜樂從不靠處境，靠的是父。","g":"讓耶穌作王：這一章要人讓出「處境的主人」那個位置。我想決定自己甚麼時候可以喜樂、要多少才算夠、誰對誰錯由我來判；4:5「主已經近了」，就是把這個位子還給他——他在近處，他會來，我不必每一件事都爭到底，這正是「謙讓」：不堅持自己的權利，因為我的安全不在那些權利上。4:19 保羅說「我的神」，不是「我的存款」；讓耶穌作王，就是讓他作我所需用的供應者，而不是讓帳戶作我的主。可以自己檢查：這一週，我把哪一件掛慮緊緊握在手裡，還在當它的王？","p":"建立屬神的體系：經文先說完它自己的話，321 才接上來。4:3 那一位「真實同負一軛的」，是 321「235」裡那個「2」的樣子；4:15「授受的事」是一間教會與宣教士之間的合夥帳，4:17「人比事重要」——保羅在乎的是給的人自己結果子；4:22「凱撒家裡的人」說明福音的網絡不在禮拜堂裡停下來。所以一個健康的體系，要有幾件具體的東西：同工起衝突時，有一位雙方都信得過的第三人可以請進來，而且有清楚、公平的申訴管道；有人陷在焦慮與憂鬱裡，教會知道怎樣陪他、也備好可以轉介的醫師與諮商名單；差出去的宣教士，有固定的代禱與供給；在醫院、學校、公家機關上班的弟兄姊妹，被看見、被差遣、被代禱。"},"grp":["【一、破冰】你最近一次「餓到不行」是甚麼時候？在哪裡、為了甚麼沒吃到飯？那時候你最想吃的是甚麼？後來是誰、用甚麼東西把你餵飽的？","【二、扎心】「應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」（4:6）說一件具體的事：現在在你心裡繞最多圈的那一個掛慮是甚麼？它是從哪一天開始的？你上一次把它一字一句說給神聽、或說給一個人聽，是甚麼時候？","【三、福音】「我靠著那加給我力量的，凡事都能做。」（4:13）說一段日子：哪一年、在哪裡，你在缺乏、失敗或病痛裡，處境沒有改變，卻發現自己竟然撐過來了？回頭看，那一份力量是從哪裡來的？那時候是誰把主的供應帶到你身邊？","【四、行動】說出這一週你要做的一件事：你身邊有沒有兩個人不說話了，而他們都信得過你？說出你要在哪一天、用甚麼方式（一通電話、一頓飯）去「幫助」其中一位，只聽不判；或者，說出你要在哪一天寫一張卡片、轉一筆錢，給一位你們教會差出去的宣教士或同工。","【五、代禱】為三種人指名禱告：一位正在吃藥治療焦慮或憂鬱、卻不敢讓教會知道的人，求主讓他在這裡被接納、不被論斷；一位剛失業、生意失敗或考試落榜的人，求主讓他在缺乏裡經歷那一直加給人力量的主；一位在醫院、政府或大公司裡上班的弟兄姊妹，求主使他成為今天的「凱撒家裡的人」。"],"prac":{"main":"這一週，把掛慮說出來，把喜樂的地基從處境挪到主身上：在缺乏裡學知足，在衝突裡做那一位同負一軛的人。","items":["對神：每天早上慢慢讀一次 4:4–7，用自己的話把一件掛慮說給神聽，說完加一句感謝；晚上讀 4:13，對主說：「今天你加給我的力量，夠我走完今天。」","對自己：這七天記下一個情緒——每天晚上寫一行：今天最掛慮的是甚麼、我有沒有說出來、說給誰聽。若發現自己已經連續兩個禮拜睡不好、吃不下、提不起勁，這一週就預約一次門診或諮商；這是照顧神所造的身體，不是不信。","對人：找一位你知道正在缺乏或正在掛慮的人，這一週約他吃一頓飯，只問一句「你最近最擔心的是甚麼」，然後聽完，不急著勸；若你身邊有兩位彼此不說話的同工，不選邊、不傳話，先為兩個人各禱告一次。","對生活：檢查你的「足」在哪裡——打開手機裡的購物車與記帳，刪掉一樣你其實不需要的東西；同時寫下一件你已經有、卻很久沒有為它感謝的東西（一張床、一份工作、一個會打電話來的朋友），為它謝恩。","對使命：這一週為一位宣教士或福音同工做一件具體的事：寫一封回信回應他的代禱信、轉一筆奉獻、或在小組裡為他禱告；並為一位在醫院、學校、公家機關或大公司上班的弟兄姊妹代禱，求主讓福音經過他走進那個地方。"]},"safe":["① 把 4:13 講成考試、比賽、生意的必勝口號：「靠主凡事都能做，所以你一定考得上、一定贏、生意一定成。」","4:13 的「凡事」就是上一節的「或飽足，或飢餓；或有餘，或缺乏」（4:12），是知足的力量，不是成功的保證；講成口號，落榜、輸球、倒閉的人只剩下「我信心不夠」這個結論，經文就被講反了（紅線四，全卷立場見 ISS00_5）。","檢驗標準：一位剛剛落榜或生意失敗的人聽完，是覺得 4:13 在嘲笑他，還是發現 4:13 正是寫給此刻的他？","② 把 4:6 講成「有焦慮症就是不夠信」「多禱告就好，不用看醫生、不用吃藥」。","保羅自己會「憂上加憂」（2:27），會「實在掛念」（2:20，與 4:6 同一個字）；4:6 的解藥是把掛慮說出來，不是壓下去。焦慮症、憂鬱症是需要治療的病，就醫、吃藥、諮商與禱告不衝突；阻止就醫，可能延誤到危險的地步（紅線三，全卷立場見 ISS00_5）。","檢驗標準：一位正在服藥、不敢讓教會知道的人聽完，是更羞愧、更想停藥，還是更敢說出來、也更安心地繼續治療？","③ 把 4:19 講成「奉獻越多，神越使你富足」，或把它當成募款的保證：「你今天奉獻，神明天就加倍還你。」","4:19 是寫給一間已經奉獻到「極窮」的教會的（林後 8:2），應許的是「所需用的」，不是「所想要的」；4:17 保羅自己說「我並不求甚麼餽送」。把奉獻講成投資，等於把敬拜變成交易，成功神學本講義明確不採（紅線四，全卷立場見 ISS00_5）。","檢驗標準：一位奉獻之後仍然缺乏的人聽完，是懷疑神不守應許，還是更確知那位父親知道他所需用的？","④ 用 4:2「要在主裡同心」壓制申訴：對受了委屈、指出問題的人說「不要再吵了，要合一」，或要求兩方當眾和好、維持表面和諧。","保羅一人一個「我勸」，不偏袒，也沒有叫她們閉嘴；他請第三個人「幫助這兩個女人」（4:3），把問題帶進主裡處理。若牽涉傷害或不公，需要的是公平的處理與保護，不是一句「要同心」（紅線八）。","檢驗標準：一位曾經在教會提出申訴卻被說成「破壞合一」的人聽完，是更不敢開口，還是知道教會願意請人進來公平地幫助？","⑤ 用 4:4「常常喜樂」要求喪親、生病、受傷的人立刻笑出來：「聖經叫你要喜樂，你還在哭就是不信。」","「靠主」才是喜樂的源頭，喜樂不是表情；同一封信裡保羅「流淚地告訴你們」（3:18），耶穌也哭了。把命令當成量情緒的尺，會讓流淚的人在教會裡藏起眼淚（紅線三）。","檢驗標準：一位剛送走親人的人聽完，是覺得自己可以帶著眼淚來到主面前，還是覺得要先擦乾眼淚才配進教會？","⑥ 用 4:11「知足」叫勞工放棄合理的工資與權益、叫受剝削或處在危險裡的人「忍一忍、要知足」。","知足是心不被處境綁架，不是對不公沉默；保羅「也知道怎樣處豐富」，在腓立比也曾說「我們是羅馬人，並沒有定罪」（徒 16:37），他知道甚麼時候要為公義開口。用知足替不公背書，是把經文借給壓迫的人用（全卷立場見 ISS00_5）。","檢驗標準：一位被拖欠薪水、或在不安全環境裡的人聽完，是更不敢爭取、更不敢離開，還是知道知足與追求公道可以同時存在？","⑦ 把 4:8「這些事你們都要思念」講成正向思考、吸引力法則：「只想好的，壞事就不會來」「說負面的話會招來厄運」。","清單的第一項是「真實的」，不是「愉快的」；λογίζεσθε 是把真實、公義、可敬的事放進心裡算，不是用念頭操控結果。講成心想事成，會讓人不敢承認痛苦，也把神降成一套心理技巧（全卷立場見 ISS00_5）。","檢驗標準：會眾聽完，是更敢誠實面對壞消息、再把心思放在真實美善的事上，還是更怕說出真話、更假裝沒事？","⑧ 把 4:5「主已經近了」講成末世倒數：推算日子，或說「主快來了，工作、讀書、看病都不重要」。","這四個字沒有動詞，時間與空間兩讀都在：主來的日子近，所以爭到底的事沒那麼重要；主就在身邊，所以掛慮可以說給他聽。本系列不套用末世時間表、不算日子（鐵律四）；果效是忍耐與謙讓，不是恐慌。","檢驗標準：會眾聽完，是更恐慌、更想丟下手上的責任，還是更能放下一件爭執、把一件掛慮交給近在身邊的主？","⑨ 用 4:3「生命冊」恐嚇人：「你再不服事、再吵架，名字就要從生命冊上被塗抹」，或拿它來排同工的名次。","保羅提生命冊，正是在勸兩位吵架的姊妹時：她們的名字都在冊上，所以要同心——這是安慰與身分，不是威脅。名字寫上去是神的恩典，不是表現的分數（回指以弗所書紅線五；全卷立場見 ISS00_4）。","檢驗標準：一位很怕自己不夠好的同工聽完，是更有得救的確據、更願意和好，還是更恐慌、更拚命表現？","⑩ 用 4:15–18 向會眾施壓：「你們不供養傳道人就是虧欠神」，或反過來說「真正屬靈的傳道人不該收錢」。","保羅收下餽送，稱它為「極美的香氣」，又說「我並不求甚麼餽送」（4:17）——收的人不操控，給的人甘心；他在乎的是給的人的果子。兩種講法都把「授受的事」從合夥變成了壓力或羞恥。","檢驗標準：會眾聽完，是因為被罪疚推著而奉獻，還是因為看見自己在福音上有分而甘心給出？傳道人聽完，是更敢誠實說出需要、也更不貪求嗎？","⑪ 把 4:2 講成「女人就是愛吵架」「女同工多就容易出事」，或藉此說女性不該在福音上一同勞苦。","保羅說這兩位姊妹「在福音上曾與我一同勞苦」，用的是 1:27 同一隊競技的字；吵架的是同工，不是性別。性別角色與女同工的議題，本講義回指哥林多前書立場二與加拉太書立場四，不在這一節另立說法。","檢驗標準：教會裡的姊妹同工聽完，是覺得自己被貼上標籤，還是更確知自己在福音上是保羅的同隊？","⑫ 用 4:13「得勝者」把人分等級：「能知足、不掛慮的才是得勝者，你還在焦慮，表示還沒過關。」","321 的得勝者以 3:12–14 為準——還在跑、還在學的人；4:11 說知足是「學會了」的，學的過程裡有飢餓、也有缺乏。把得勝講成已經完全的屬靈精英，等於把 4:13 從力量變回考試（全卷立場見 ISS00_4）。","檢驗標準：一位還在掙扎的人聽完，是覺得自己被排除在得勝者之外，還是知道自己正走在得勝者學習的路上？","⑬ 把這一章講成 321 的插圖：先講「235」的「2」，再拿 4:3 那位同負一軛的人來印證，或把 4:9 直接講成八大步驟的證明。","次序是經文先講：一人一個「我勸」、請人幫助、靠主喜樂、把掛慮告訴神、學會知足；說完了，321 才在末端接上去。經文不是理念的配圖（鐵律五）。","檢驗標準：會眾聽完，記住的是一套團契的術語，還是那一位一直加給人力量的主？","⑭ 用處境取消原則：「4:22 是第一世紀羅馬皇宮的事，跟今天無關」；或反過來把它講成「基督徒要攀附權貴、往權力核心擠」。","書信三問的第三問要走完：處境是一個戴著鎖鍊的使徒、一間奉獻到極窮的教會；原則是捆鎖叫福音興旺，福音走進最不可能的家，不靠人的位子，靠主的恩。今天它落在醫院、學校、公司與公家機關裡上班的弟兄姊妹身上——判斷的理由要說出來（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，這一章的原則今天在你的教會落在哪些人、哪些地方，並且說出判斷的理由？"]}],"txt":{"1":["基督耶穌的僕人保羅和提摩太寫信給凡住腓立比、在基督耶穌裡的眾聖徒，和諸位監督，諸位執事。","願恩惠、平安從神我們的父並主耶穌基督歸與你們！","我每逢想念你們，就感謝我的神；","每逢為你們眾人祈求的時候，常是歡歡喜喜地祈求。","因為從頭一天直到如今，你們是同心合意地興旺福音。","我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。","我為你們眾人有這樣的意念，原是應當的；因你們常在我心裡，無論我是在捆鎖之中，是辯明證實福音的時候，你們都與我一同得恩。","我體會基督耶穌的心腸，切切地想念你們眾人；這是神可以給我作見證的。","我所禱告的，就是要你們的愛心在知識和各樣見識上多而又多，","使你們能分別是非，作誠實無過的人，直到基督的日子；","並靠著耶穌基督結滿了仁義的果子，叫榮耀稱讚歸與神。","弟兄們，我願意你們知道，我所遭遇的事更是叫福音興旺，","以致我受的捆鎖在御營全軍和其餘的人中，已經顯明是為基督的緣故。","並且那在主裡的弟兄多半因我受的捆鎖就篤信不疑，越發放膽傳神的道，無所懼怕。","有的傳基督是出於嫉妒紛爭，也有的是出於好意。","這一等是出於愛心，知道我是為辯明福音設立的；","那一等傳基督是出於結黨，並不誠實，意思要加增我捆鎖的苦楚。","這有何妨呢？或是假意，或是真心，無論怎樣，基督究竟被傳開了。為此，我就歡喜，並且還要歡喜；","因為我知道，這事藉著你們的祈禱和耶穌基督之靈的幫助，終必叫我得救。","照著我所切慕、所盼望的，沒有一事叫我羞愧。只要凡事放膽，無論是生是死，總叫基督在我身上照常顯大。","因我活著就是基督，我死了就有益處。","但我在肉身活著，若成就我工夫的果子，我就不知道該挑選甚麼。","我正在兩難之間，情願離世與基督同在，因為這是好得無比的。","然而，我在肉身活著，為你們更是要緊的。","我既然這樣深信，就知道仍要住在世間，且與你們眾人同住，使你們在所信的道上又長進又喜樂，","叫你們在基督耶穌裡的歡樂，因我再到你們那裡去，就越發加增。","只要你們行事為人與基督的福音相稱，叫我或來見你們，或不在你們那裡，可以聽見你們的景況，知道你們同有一個心志，站立得穩，為所信的福音齊心努力。","凡事不怕敵人的驚嚇，這是證明他們沉淪，你們得救都是出於神。","因為你們蒙恩，不但得以信服基督，並要為他受苦。","你們的爭戰，就與你們在我身上從前所看見、現在所聽見的一樣。"],"2":["所以，在基督裡若有甚麼勸勉，愛心有甚麼安慰，聖靈有甚麼交通，心中有甚麼慈悲憐憫，","你們就要意念相同，愛心相同，有一樣的心思，有一樣的意念，使我的喜樂可以滿足。","凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強。","各人不要單顧自己的事，也要顧別人的事。","你們當以基督耶穌的心為心：","他本有神的形像，不以自己與神同等為強奪的；","反倒虛己，取了奴僕的形像，成為人的樣式；","既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。","所以，神將他升為至高，又賜給他那超乎萬名之上的名，","叫一切在天上的、地上的，和地底下的，因耶穌的名無不屈膝，","無不口稱「耶穌基督為主」，使榮耀歸與父神。","這樣看來，我親愛的弟兄，你們既是常順服的，不但我在你們那裡，就是我如今不在你們那裡，更是順服的，就當恐懼戰兢做成你們得救的工夫。","因為你們立志行事都是神在你們心裡運行，為要成就他的美意。","凡所行的，都不要發怨言，起爭論，","使你們無可指摘，誠實無偽，在這彎曲悖謬的世代作神無瑕疵的兒女。你們顯在這世代中，好像明光照耀，","將生命的道表明出來，叫我在基督的日子好誇我沒有空跑，也沒有徒勞。","我以你們的信心為供獻的祭物，我若被澆奠在其上，也是喜樂，並且與你們眾人一同喜樂。","你們也要照樣喜樂，並且與我一同喜樂。","我靠主耶穌指望快打發提摩太去見你們，叫我知道你們的事，心裡就得著安慰。","因為我沒有別人與我同心，實在掛念你們的事。","別人都求自己的事，並不求耶穌基督的事。","但你們知道提摩太的明證；他興旺福音，與我同勞，待我像兒子待父親一樣。","所以，我一看出我的事要怎樣了結，就盼望立刻打發他去；","但我靠著主自信我也必快去。","然而，我想必須打發以巴弗提到你們那裡去。他是我的兄弟，與我一同做工，一同當兵，是你們所差遣的，也是供給我需用的。","他很想念你們眾人，並且極其難過，因為你們聽見他病了。","他實在是病了，幾乎要死；然而神憐恤他，不但憐恤他，也憐恤我，免得我憂上加憂。","所以我越發急速打發他去，叫你們再見他，就可以喜樂，我也可以少些憂愁。","故此，你們要在主裡歡歡樂樂地接待他，而且要尊重這樣的人；","因他為做基督的工夫，幾乎至死，不顧性命，要補足你們供給我的不及之處。"],"3":["弟兄們，我還有話說，你們要靠主喜樂。我把這話再寫給你們，於我並不為難，於你們卻是妥當。","應當防備犬類，防備作惡的，防備妄自行割的。","因為真受割禮的，乃是我們這以神的靈敬拜、在基督耶穌裡誇口、不靠著肉體的。","其實，我也可以靠肉體；若是別人想他可以靠肉體，我更可以靠著了。","我第八天受割禮；我是以色列族、便雅憫支派的人，是希伯來人所生的希伯來人。就律法說，我是法利賽人；","就熱心說，我是逼迫教會的；就律法上的義說，我是無可指摘的。","只是我先前以為與我有益的，我現在因基督都當作有損的。","不但如此，我也將萬事當作有損的，因我以認識我主基督耶穌為至寶。我為他已經丟棄萬事，看作糞土，為要得著基督；","並且得以在他裡面，不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義，","使我認識基督，曉得他復活的大能，並且曉得和他一同受苦，效法他的死，","或者我也得以從死裡復活。","這不是說我已經得著了，已經完全了；我乃是竭力追求，或者可以得著基督耶穌所以得著我的。","弟兄們，我不是以為自己已經得著了；我只有一件事，就是忘記背後，努力面前的，","向著標竿直跑，要得神在基督耶穌裡從上面召我來得的獎賞。","所以我們中間，凡是完全人總要存這樣的心；若在甚麼事上存別樣的心，神也必以此指示你們。","然而，我們到了甚麼地步，就當照著甚麼地步行。","弟兄們，你們要一同效法我，也當留意看那些照我們榜樣行的人。","因為有許多人行事是基督十字架的仇敵。我屢次告訴你們，現在又流淚地告訴你們：","他們的結局就是沉淪；他們的神就是自己的肚腹。他們以自己的羞辱為榮耀，專以地上的事為念。","我們卻是天上的國民，並且等候救主，就是主耶穌基督從天上降臨。","他要按著那能叫萬有歸服自己的大能，將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似。"],"4":["我所親愛、所想念的弟兄們，你們就是我的喜樂，我的冠冕。我親愛的弟兄，你們應當靠主站立得穩。","我勸友阿蝶和循都基，要在主裡同心。","我也求你這真實同負一軛的，幫助這兩個女人，因為她們在福音上曾與我一同勞苦；還有革利免，並其餘和我一同做工的，他們的名字都在生命冊上。","你們要靠主常常喜樂。我再說，你們要喜樂。","當叫眾人知道你們謙讓的心。主已經近了。","應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。","神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。","弟兄們，我還有未盡的話：凡是真實的、可敬的、公義的、清潔的、可愛的、有美名的，若有甚麼德行，若有甚麼稱讚，這些事你們都要思念。","你們在我身上所學習的，所領受的，所聽見的，所看見的，這些事你們都要去行，賜平安的神就必與你們同在。","我靠主大大地喜樂，因為你們思念我的心如今又發生；你們向來就思念我，只是沒得機會。","我並不是因缺乏說這話；我無論在甚麼景況都可以知足，這是我已經學會了。","我知道怎樣處卑賤，也知道怎樣處豐富；或飽足，或飢餓；或有餘，或缺乏，隨事隨在，我都得了秘訣。","我靠著那加給我力量的，凡事都能做。","然而，你們和我同受患難原是美事。","腓立比人哪，你們也知道我初傳福音離了馬其頓的時候，論到授受的事，除了你們以外，並沒有別的教會供給我。","就是我在帖撒羅尼迦，你們也一次兩次地打發人供給我的需用。","我並不求甚麼餽送，所求的就是你們的果子漸漸增多，歸在你們的帳上。","但我樣樣都有，並且有餘。我已經充足，因我從以巴弗提受了你們的餽送，當作極美的香氣，為神所收納、所喜悅的祭物。","我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。","願榮耀歸給我們的父神，直到永永遠遠。阿們！","請問在基督耶穌裡的各位聖徒安。在我這裡的眾弟兄都問你們安。","眾聖徒都問你們安。在凱撒家裡的人特特地問你們安。","願主耶穌基督的恩常在你們心裡！"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Παῦλος καὶ Τιμόθεος δοῦλοι Χριστοῦ Ἰησοῦ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·</p><p lang=\"grc\">χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.</p>","lit":"<p>保羅和提摩太，基督耶穌的奴僕們，給所有在基督耶穌裡的聖徒，就是那些在腓立比的，連同監督們和執事們：</p><p>恩典給你們，和平安，從神我們的父和主耶穌基督。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δοῦλοι Χριστοῦ Ἰησοῦ</td><td>douloi Christou Iēsou</td><td>基督耶穌的奴僕們</td><td>複數：保羅與提摩太並列</td></tr><tr><td>τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ</td><td>tois hagiois en Christō Iēsou</td><td>在基督耶穌裡的聖徒</td><td>先說在誰裡，再說住哪裡</td></tr><tr><td>τοῖς οὖσιν ἐν Φιλίπποις</td><td>tois ousin en Philippois</td><td>那些在腓立比的</td><td>地上的地址</td></tr><tr><td>σὺν ἐπισκόποις καὶ διακόνοις</td><td>syn episkopois kai diakonois</td><td>連同監督們和執事們</td><td>新約問安裡唯一點名的職分</td></tr><tr><td>χάρις ὑμῖν καὶ εἰρήνη</td><td>charis hymin kai eirēnē</td><td>恩典給你們，和平安</td><td>先恩典，後平安</td></tr></table>","gram":"<p><strong>一封沒有「使徒」二字的開頭。</strong>保羅寫給加拉太、哥林多、以弗所，開口都先亮出 ἀπόστολος（apostolos） 的身分；這一封只說 Παῦλος καὶ Τιμόθεος δοῦλοι Χριστοῦ Ἰησοῦ（Paulos kai Timotheos douloi Christou Iēsou）。δοῦλοι（douloi） 是複數，把一位使徒和一位年輕同工放在同一個名分底下。腓立比人沒有質疑他的權柄，他不必自我辯護；而 δοῦλος（doulos） 這個字，2:7 要再出現一次，用在基督身上——μορφὴν δούλου（morphēn doulou）。信的第一個字，已經在替基督之歌鋪路。</p><p>收信人有兩個地址：τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ（tois hagiois en Christō Iēsou） 在前，τοῖς οὖσιν ἐν Φιλίπποις（tois ousin en Philippois） 在後。屬靈的地址先於地理的地址。πᾶσιν（pasin） 放在最前面，全卷一再出現「你們眾人」（1:4、7、8、25），在一間開始結黨的教會裡，這個「眾」字是有意的。</p><blockquote><p>σὺν ἐπισκόποις καὶ διακόνοις（syn episkopois kai diakonois） 兩個名詞都沒有冠詞，都是複數。新約書信的問安裡點名監督與執事，只有這一次。ἐπισκόποις（episkopois） 是「看顧的人」，徒 20:17、28 同一批人先稱長老、後稱監督；多數學者因此認為初代「監督」與「長老」是同一群人的兩個稱呼。二世紀以後一城一位主教的體制，這裡還看不到。σύν（syn） 把職分放在聖徒「旁邊」，不是「上面」。詳見本章議題頁。</p></blockquote>","exp":"<p>〔背景〕徒 16:11--15（使徒行傳講義第 16 章）</p><p>本系列使徒行傳講義第 16 章講過這間教會的出生：沒有會堂，只有河邊一個禱告的地方；第一個信主的是外地來的賣布商人呂底亞，「主就開導她的心」（徒 16:14）。接著是一個被鬼附的使女、一場鞭打、一間內監，和一個半夜差一點自殺的禁卒。十年後，寫信的保羅又在捆鎖中，收信的是一群從河邊、從監獄走出來的人。提摩太那一趟也在場（徒 16:1--3），所以他的名字寫在最前面。</p><p>「基督耶穌的僕人保羅和提摩太」（1:1）。保羅不先講自己的位分，只講自己屬於誰。一個在羅馬鎖鍊底下的人，自稱是另一位主人的奴僕：鎖他的是凱撒，他服事的是基督。這是全卷第一個「往下」的姿勢，也是一個知道自己是誰的人才說得出口的稱呼——奴僕不是沒有身分，是身分清楚地歸屬一位主人。</p><p>「凡住腓立比、在基督耶穌裡的眾聖徒，和諸位監督，諸位執事」（1:1）。聖徒不是死後被追封的少數人，是每一個在基督裡的人；這是全卷給人的第一個身分。講無己，要先講身分：先知道自己「在基督耶穌裡」，後面 2:5 的往下走，才不會變成自我消滅。監督與執事被點名，卻排在眾聖徒後面，用 σύν（syn） 連著——帶領的人和會眾站在同一排。</p><p>「願恩惠、平安從神我們的父並主耶穌基督歸與你們」（1:2）。次序不能倒：先有恩典，才有平安。這間教會後來要面對同工不和、外面逼迫，保羅一開口就把源頭指給他們：平安不是先把問題擺平，是先從父和主那裡領受。</p>"},{"a":3,"z":5,"star":2,"grk":"<p lang=\"grc\">Εὐχαριστῶ τῷ θεῷ μου ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν</p><p lang=\"grc\">πάντοτε ἐν πάσῃ δεήσει μου ὑπὲρ πάντων ὑμῶν, μετὰ χαρᾶς τὴν δέησιν ποιούμενος,</p><p lang=\"grc\">ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,</p>","lit":"<p>我感謝我的神，在對你們的每一次記念上，</p><p>在我每一次的祈求裡，總是為你們眾人，帶著喜樂作那祈求，</p><p>因著你們在福音上的合夥，從頭一天直到現在；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εὐχαριστῶ τῷ θεῷ μου</td><td>Eucharistō tō theō mou</td><td>我感謝我的神</td><td>「我的神」：私人的稱呼</td></tr><tr><td>ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν</td><td>epi pasē tē mneia hymōn</td><td>在對你們的每一次記念上</td><td>每想一次就謝一次</td></tr><tr><td>μετὰ χαρᾶς</td><td>meta charas</td><td>帶著喜樂</td><td>全卷「喜樂」第一次</td></tr><tr><td>ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον</td><td>epi tē koinōnia hymōn eis to euangelion</td><td>因你們在福音上的合夥</td><td>κοινωνία：合夥經營</td></tr><tr><td>ἀπὸ τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν</td><td>apo tēs prōtēs hēmeras achri tou nyn</td><td>從頭一天直到現在</td><td>十年沒有中斷</td></tr></table>","gram":"<p><strong>1:3--5 是一連串的「每」與「眾」。</strong>ἐπὶ πάσῃ τῇ μνείᾳ（epi pasē tē mneia）、ἐν πάσῃ δεήσει（en pasē deēsei）、ὑπὲρ πάντων ὑμῶν（hyper pantōn hymōn）、πάντοτε（pantote）——四個同字根的字擠在兩節裡。保羅的感謝不是偶爾，也不挑人。μετὰ χαρᾶς（meta charas） 是全卷 χαρά（chara）／χαίρω（chairō） 十六次裡的第一次，第一次就出現在禱告裡。</p><p>ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν（epi pasē tē mneia hymōn） 的屬格可以讀成「我對你們的記念」（多數譯本），也有學者讀成「你們對我的記念」——指他們送來的餽送（4:10）。兩讀都通；1:4 接著說「為你們眾人祈求」，主動記念的一方是保羅，本講義從多數讀法。</p><blockquote><p>1:5 ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον（epi tē koinōnia hymōn eis to euangelion），和合本意譯「同心合意地興旺福音」。κοινωνία（koinōnia） 在當時的商業文書裡是合夥關係，εἰς（eis） 指方向：你們向著福音的合夥。這合夥包括禱告、同工，也包括錢——4:15 說「論到授受的事，除了你們以外，並沒有別的教會供給我」，用的是同一個字根的 ἐκοινώνησεν（ekoinōnēsen）。κοινωνία（koinōnia） 這條追蹤線，本章在 1:5、1:7、1:27 三站。</p></blockquote>","exp":"<p>〔背景〕徒 16:25--34（使徒行傳講義第 16 章）</p><p>「我每逢想念你們，就感謝我的神」（1:3）。一個人在捆鎖中，想到一間教會就感謝，這間教會一定給過他甚麼。腓立比給他的，是使徒行傳講義第 16 章那一夜：「約在半夜，保羅和西拉禱告，唱詩讚美神」（徒 16:25）。那是一間在監獄裡出生的教會；如今保羅又在監裡，一想起他們，嘴裡又是讚美。</p><p>「常是歡歡喜喜地祈求」（1:4）。全卷的喜樂，第一次出現在代禱裡，不是在順境裡。保羅的處境沒有一樣值得高興，喜樂的根卻不在處境，在人與人之間、在神面前的那一份牽掛。喜樂在這裡不是個性，是一種禱告的方式：把人帶到神面前時，心是熱的。</p><p>「從頭一天直到如今，你們是同心合意地興旺福音」（1:5）。和合本的「同心合意」譯得溫暖，原文更具體：合夥。腓立比人不是坐在台下聽福音的觀眾，是和保羅一起出資、出力、出禱告的股東。從呂底亞打開家門那一天起，十年沒有退股。</p><p>今天的教會常把會眾當成服務的對象，把宣教士當成募款的人。1:5 給的是另一個圖像：<strong>一起承擔的夥伴</strong>。這是 321「關係比東西重要」的起點——保羅感謝的不是那筆錢，是那一份從頭一天就沒有斷過的同行。</p>"},{"a":6,"z":8,"star":2,"grk":"<p lang=\"grc\">πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας Χριστοῦ Ἰησοῦ ·</p><p lang=\"grc\">καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·</p><p lang=\"grc\">μάρτυς γάρ μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ.</p>","lit":"<p>我確信這一件事：那在你們裡面開始了美好工作的，必將它完成，直到基督耶穌的日子；</p><p>正如我為你們眾人這樣思想是公義的，因為我把你們放在心裡；無論在我的捆鎖中，或在福音的辯護與堅立中，你們眾人都是我在恩典上的同夥。</p><p>因為神是我的見證：我怎樣在基督耶穌的心腸裡渴想你們眾人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πεποιθὼς αὐτὸ τοῦτο</td><td>pepoithōs auto touto</td><td>確信這一件事</td><td>完成式分詞：已定的把握</td></tr><tr><td>ὁ ἐναρξάμενος</td><td>ho enarxamenos</td><td>那開始了的</td><td>主詞是神</td></tr><tr><td>ἔργον ἀγαθὸν</td><td>ergon agathon</td><td>美好的工作</td><td>沒有冠詞：一件好工</td></tr><tr><td>ἐπιτελέσει</td><td>epitelesei</td><td>他必完成</td><td>未來式：做到終點</td></tr><tr><td>συγκοινωνούς μου τῆς χάριτος</td><td>synkoinōnous mou tēs charitos</td><td>我在恩典上的同夥</td><td>連捆鎖也一起分</td></tr><tr><td>ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ</td><td>en splanchnois Christou Iēsou</td><td>在基督耶穌的心腸裡</td><td>不是我的心腸</td></tr></table>","gram":"<p><strong>1:6 的兩個動詞一頭一尾。</strong>ὁ ἐναρξάμενος（ho enarxamenos）……ἐπιτελέσει（epitelesei）：開始的是他，完成的也是他。這兩個字在加 3:3 也成對出現（「靠聖靈入門，如今還靠著肉身成全嗎」），在那裡是警告，在這裡是安慰。πεποιθὼς（pepoithōs） 是完成式分詞，保羅不是在打氣，是陳述一個已經定下的確信。ἔργον ἀγαθὸν（ergon agathon） 指甚麼？可以是救恩在他們裡面的工作，也可以是 1:5 那份合夥。兩者不必二選一：神在他們裡面開始的救恩，正是透過那份合夥長出來的。</p><p>1:7 φρονεῖν（phronein） 是 φρονέω（phroneō） 在全卷十次裡的第一次，2:5 就是同一個字。ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου（en te tois desmois mou kai en tē apologia kai bebaiōsei tou euangeliou）：ἀπολογίᾳ（apologia） 與 βεβαιώσει（bebaiōsei） 是法庭用語，辯護與證實，保羅可能在等候審訊。διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς（dia to echein me en tē kardia hymas） 的不定詞主詞可以是「我把你們放在心上」，也可以是「你們把我放在心上」；字序較順前者，和合本也譯「你們常在我心裡」。</p><blockquote><p>1:8 μάρτυς γάρ μου ὁ θεός（martys gar mou ho theos） 是起誓的語氣。σπλάγχνοις（splanchnois） 本指腹腔內臟，古人以為情感在那裡；保羅不說「在我的心腸裡」，說 ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ（en splanchnois Christou Iēsou）——他想念他們，用的是基督的心腸。這是 2:5「以基督耶穌的心為心」的預告。</p></blockquote>","exp":"<p>「我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子」（1:6）。這一節是全卷地勢圖第一個高處。保羅對腓立比人的信心，不是建立在他們表現好，而是建立在那位開工的。人蓋房子會爛尾，神不會。這一節也是 2:12「做成得救的工夫」的錨：做成的人是我們，成全的那一位是神；兩節要一起讀，人才不會活在怕掉下去的恐懼裡，也不會變成躺著等（立場四）。這一節是不是在講「一次得救，永遠得救」？保羅在這裡說的是對一群人的確信，不是一條系統神學的命題；各家討論見本章議題頁。</p><p>「無論我是在捆鎖之中，是辯明證實福音的時候，你們都與我一同得恩」（1:7）。很少人會把捆鎖叫做恩典，保羅卻說，連捆鎖他們也一起分。他們派人來、送錢來、為他禱告，就把自己和一個囚犯綁在一起。在羅馬的處境裡，和囚犯站在一起是有代價的。</p><p>「我體會基督耶穌的心腸，切切地想念你們眾人」（1:8）。保羅的想念不是鄉愁，是基督自己對這群人的牽掛，經過保羅流出來。一個領袖對會眾的感情，如果只是自己的心腸，會偏心、會疲乏、會受傷就收回；用基督的心腸，才愛得到「你們眾人」，連那兩位吵架的姊妹也在裡面（4:2）。</p>"},{"a":9,"z":11,"star":2,"grk":"<p lang=\"grc\">καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,</p><p lang=\"grc\">εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,</p><p lang=\"grc\">πεπληρωμένοι καρπὸν δικαιοσύνης τὸν διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.</p>","lit":"<p>而我禱告這件事：要你們的愛還要更多再更多地充溢，在真知識和一切的辨識裡，</p><p>使你們能試驗那些不同的事（或譯：那些真正要緊的事），好叫你們是純淨的、不絆人的，直到基督的日子，</p><p>被充滿了公義的果子，就是那藉著耶穌基督的，歸於神的榮耀和稱讚。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ</td><td>eti mallon kai mallon perisseuē</td><td>還要更多再更多地充溢</td><td>現在式：持續漫出來</td></tr><tr><td>ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει</td><td>en epignōsei kai pasē aisthēsei</td><td>在真知識和一切辨識裡</td><td>愛要有眼睛</td></tr><tr><td>δοκιμάζειν</td><td>dokimazein</td><td>試驗、驗明</td><td>鑄幣驗真的字</td></tr><tr><td>τὰ διαφέροντα</td><td>ta diapheronta</td><td>那些不同的／真正要緊的</td><td>cu89t 註：喜愛那美好的事</td></tr><tr><td>εἰλικρινεῖς καὶ ἀπρόσκοποι</td><td>eilikrineis kai aproskopoi</td><td>純淨而不絆人</td><td>向內與向外</td></tr><tr><td>καρπὸν δικαιοσύνης</td><td>karpon dikaiosynēs</td><td>公義的果子</td><td>單數：一串果子</td></tr></table>","gram":"<p><strong>禱告的內容是一條鏈：愛 → 分辨 → 純淨 → 果子 → 榮耀。</strong>ἵνα（hina） 帶出禱告的內容，εἰς τὸ δοκιμάζειν（eis to dokimazein） 帶出目的，第二個 ἵνα（hina） 再往前推，πεπληρωμένοι（peplērōmenoi） 收在果子，εἰς δόξαν καὶ ἔπαινον θεοῦ（eis doxan kai epainon theou） 收在神的榮耀。保羅沒有求他們的處境變好，他求他們的愛變得有眼睛。</p><p>ἔτι μᾶλλον καὶ μᾶλλον（eti mallon kai mallon） 是加重的疊字，περισσεύῃ（perisseuē） 是現在式假設語氣：不是一次加滿，是持續漫出來。ἐπιγνώσει（epignōsei） 與 αἰσθήσει（aisthēsei） 一個是認識，一個是感覺上的辨識（新約只在這裡出現），愛不是只靠熱情，要有判斷。</p><blockquote><p>τὰ διαφέροντα（ta diapheronta） 是本段的關鍵。字面是「那些不同的」，引申為「那些更重要、真正要緊的」（羅 2:18 同一片語）。cu89t 正文譯「能分別是非」，註腳另譯「喜愛那美好的事」。兩譯並不衝突：先分辨出甚麼最要緊，才會揀選它。εἰλικρινεῖς（eilikrineis） 有人解作「在日光下驗過的」，ἀπρόσκοποι（aproskopoi） 可主動（不絆倒人）可被動（自己不跌倒）。καρπὸν（karpon） 是單數，和加 5:22「聖靈所結的果子」一樣，是一整串，不是一顆一顆的成績；而且 τὸν διὰ Ἰησοῦ Χριστοῦ（ton dia Iēsou Christou），果子是「藉著耶穌基督」結的。</p></blockquote>","exp":"<p>「我所禱告的，就是要你們的愛心在知識和各樣見識上多而又多」（1:9）。腓立比人不缺愛，他們奉獻到極窮；保羅卻求他們的愛「多而又多」，而且多在「知識」和「見識」上。愛沒有分辨，會被利用；分辨沒有愛，會變成挑剔。保羅要的是一份有眼睛的愛。</p><p>「使你們能分別是非」（1:10）。這一節是 321「無己」的一道護欄。一個以基督的心為心的人，不是甚麼都說好、甚麼都忍的人。保羅自己就是例子：1:15--17 他分辨了傳道人的動機，3:2 他說「應當防備」。無己不是沒有判斷，是不以自己為中心來判斷；分辨的標準不是「對我有沒有利」，是 τὰ διαφέροντα（ta diapheronta）——在基督面前真正要緊的事（立場二）。</p><p>「並靠著耶穌基督結滿了仁義的果子，叫榮耀稱讚歸與神」（1:11）。這是 321 的 920 在本卷的原型：果子是單數，是一整串生命的樣子，不是一張成績單；而且是「靠著耶穌基督」結的。整段禱告最後落在「榮耀稱讚歸與神」——321 的核心二。一個好禱告的終點不是我被成全，是神得榮耀。</p><p>這也是今天教會可以拿來檢查禱告的尺。我們最常為處境禱告：病好、工作順、孩子乖。保羅在捆鎖中，卻為別人的愛、別人的分辨禱告。這不是說處境不重要，而是說處境不是禱告唯一的內容。</p>"},{"a":12,"z":14,"star":2,"grk":"<p lang=\"grc\">Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατʼ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,</p><p lang=\"grc\">ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,</p><p lang=\"grc\">καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν λόγον λαλεῖν.</p>","lit":"<p>弟兄們，我願意你們知道：那些關於我的事，反而臨到了福音的開路推進，</p><p>以致我的捆鎖在基督裡成為顯明的，在整個御營裡，也在其餘眾人中，</p><p>並且弟兄中的多數，在主裡因我的捆鎖而得了確信，更加敢於無懼地講說那道。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὰ κατʼ ἐμὲ</td><td>ta kat' eme</td><td>那些關於我的事</td><td>保羅輕輕帶過自己的遭遇</td></tr><tr><td>μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου</td><td>mallon eis prokopēn tou euangeliou</td><td>反而臨到了福音的推進</td><td>μᾶλλον：出人意料</td></tr><tr><td>ἐν ὅλῳ τῷ πραιτωρίῳ</td><td>en holō tō praitōriō</td><td>在整個御營裡</td><td>皇帝的近衛軍或總督府</td></tr><tr><td>φανεροὺς ἐν Χριστῷ</td><td>phanerous en Christō</td><td>在基督裡顯明的</td><td>人人知道他為誰坐監</td></tr><tr><td>τολμᾶν ἀφόβως</td><td>tolman aphobōs</td><td>無懼地敢於</td><td>鎖鍊反而壯了別人的膽</td></tr></table>","gram":"<p><strong>Γινώσκειν δὲ ὑμᾶς βούλομαι（Ginōskein de hymas boulomai） 是書信的轉段公式</strong>，從感恩轉入近況。腓立比人想知道他好不好，保羅回答的卻是福音好不好。τὰ κατʼ ἐμὲ（ta kat' eme） 只用一個籠統的片語帶過自己的處境；μᾶλλον（mallon） 是「反而」，暗示一般人以為會相反。προκοπὴν（prokopēn） 原是軍事與航海用語，指開路前進；1:25 再出現一次，這次是腓立比人「信心的推進」——福音的推進與信徒的推進是同一個字。</p><p>ἐν ὅλῳ τῷ πραιτωρίῳ（en holō tō praitōriō） 若在羅馬，指皇帝的近衛軍，輪班看守保羅的兵一個傳一個；若在以弗所或該撒利亞，指總督府。加上 4:22「在凱撒家裡的人」，多數學者主張羅馬（徒 28:16、30），以弗所說與該撒利亞說各有支持者，詳見本章議題頁。φανεροὺς ἐν Χριστῷ（phanerous en Christō） 字序把「在基督裡」夾在中間：他的鎖鍊被看出是「在基督裡」的鎖鍊。</p><blockquote><p>◆ 經文鑑別 1:14：SBLGNT（與 NA28、RP）作 τὸν λόγον λαλεῖν（ton logon lalein），沒有 τοῦ θεοῦ（tou theou）；WH 與 Tregelles 有 τοῦ θεοῦ（tou theou），和合本「傳神的道」跟 WH。抄本上兩邊都有早期見證，加上「神的」較像抄寫者補明的說法，短讀較可能是原文。本講義從 SBLGNT 短讀；但意思不變，「那道」在保羅筆下就是神的道。πεποιθότας τοῖς δεσμοῖς μου（pepoithotas tois desmois mou） 也值得一看：弟兄們的確信，竟然是「因著我的捆鎖」而來。</p></blockquote>","exp":"<p>「我所遭遇的事更是叫福音興旺」（1:12）。這是全卷第一個焦點考驗：<strong>環境</strong>。保羅坐監，福音照理該停；他卻說福音反而往前推。他沒有否認坐監是苦，他只是不讓苦成為故事的主詞。主詞是福音。</p><p>「以致我受的捆鎖在御營全軍和其餘的人中，已經顯明是為基督的緣故」（1:13）。看守他的兵每幾個小時輪一班，和他鎖在一起的人，一個接一個聽見了基督。鎖鍊把士兵綁在保羅身邊——福音的聽眾是被派來的。到了信末，「在凱撒家裡的人特特地問你們安」（4:22），福音一路進了皇帝的家。</p><p>「越發放膽傳神的道，無所懼怕」（1:14）。最出人意料的是第三個果效：別人看見保羅坐監，不是更怕，而是更敢。一個在鎖鍊裡仍然喜樂的人，比任何講台上的勸勉更有說服力。這使我們想起使徒行傳講義第 16 章的那一夜，眾囚犯「側耳而聽」。</p><p>今天在病床上、在失業中、在被冤枉的處境裡的弟兄姊妹，可以從這三節得到一個讀處境的角度：不是「這件事好不好」，是「這件事裡，福音往哪裡走」。這不是叫人假裝不苦，而是讓人在苦裡仍然看得見神的工作。</p>"},{"a":15,"z":17,"star":1,"grk":"<p lang=\"grc\">Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ διʼ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·</p><p lang=\"grc\">οἱ μὲν ἐξ ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι,</p><p lang=\"grc\">οἱ δὲ ἐξ ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου.</p>","lit":"<p>有些人固然也是因著嫉妒和紛爭，另一些人卻也是因著好意，傳揚基督；</p><p>這些是出於愛，知道我是為了福音的辯護而被安放的；</p><p>那些卻是出於自私的野心宣揚基督，不純潔地，以為要給我的捆鎖激起患難。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὰ φθόνον καὶ ἔριν</td><td>dia phthonon kai erin</td><td>因著嫉妒和紛爭</td><td>對保羅的嫉妒</td></tr><tr><td>διʼ εὐδοκίαν</td><td>di' eudokian</td><td>因著好意</td><td>願意保羅好</td></tr><tr><td>εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι</td><td>eis apologian tou euangeliou keimai</td><td>我為福音的辯護被安放</td><td>κεῖμαι：被放在這個崗位</td></tr><tr><td>ἐξ ἐριθείας</td><td>ex eritheias</td><td>出於自私的野心</td><td>2:3 再出現</td></tr><tr><td>θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου</td><td>thlipsin egeirein tois desmois mou</td><td>給我的捆鎖激起患難</td><td>他們以為能刺痛保羅</td></tr></table>","gram":"<p><strong>1:15--17 是一組交錯排列：</strong>1:15 先說嫉妒的、再說好意的；1:16 回頭先講好意的（οἱ μὲν ἐξ ἀγάπης（hoi men ex agapēs）），1:17 再講結黨的（οἱ δὲ ἐξ ἐριθείας（hoi de ex eritheias））。A—B—B—A，好意的一組被包在中間。ἐριθείας（eritheias） 原指受僱的人為自己謀利，引申為自私的野心、結黨，2:3「凡事不可結黨」是同一個字。οὐχ ἁγνῶς（ouch hagnōs） 說他們動機不純；οἰόμενοι（oiomenoi） 是「以為」——他們以為保羅會被刺痛，保羅卻不照他們的劇本反應。</p><blockquote><p>◆ 經文鑑別 1:16：RP（拜占庭本）與英文 KJV 把 1:16、1:17 次序對調——先講結黨，後講愛心，好與 1:15「嫉妒……好意」的次序平行。批判本（SBLGNT、NA28）與和合本是愛心在前、結黨在後。早期重要抄本支持批判本；調成平行，較像後來的抄寫者把交錯改順。本講義從批判本。讀英文 KJV 的會眾會以為節號錯了，其實是底本不同。</p></blockquote>","exp":"<p>「有的傳基督是出於嫉妒紛爭，也有的是出於好意」（1:15）。這是全卷第二個焦點考驗：<strong>別人</strong>。這些人不是異端，他們傳的是基督；問題在心——他們嫉妒保羅，趁他坐監，想搶他的影響力。最痛的攻擊，常常不是來自外人，是來自同一個陣營的人。</p><p>「這一等是出於愛心」（1:16）。保羅看得很清楚。他沒有假裝所有人都是好意，他分辨了，而且說出來了——這正是 1:10「能分別是非」的應用。以基督的心為心，不是看不見別人的錯；是看見了，卻不讓別人的錯成為自己生命的中心。</p><p>「意思要加增我捆鎖的苦楚」（1:17）。這是全卷地勢圖一個低處。保羅承認那是苦楚，沒有說「我不在意」。他接下來的反應，下一段才揭曉；但這裡已經先立下一件事：被人故意為難時，說出「這是在為難我」並不是沒有屬靈。</p>"},{"a":18,"z":18,"star":1,"grk":"<p lang=\"grc\">τί γάρ; πλὴν ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,</p>","lit":"<p>那又怎樣呢？只是無論用甚麼方式，或是藉口，或是真實，基督被宣揚了，我就在這事上喜樂；而且我還要喜樂。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τί γάρ;</td><td>ti gar</td><td>那又怎樣呢</td><td>一個短短的修辭問句</td></tr><tr><td>πλὴν ὅτι παντὶ τρόπῳ</td><td>plēn hoti panti tropō</td><td>只是無論用甚麼方式</td><td>πλὴν：把話題拉回重點</td></tr><tr><td>εἴτε προφάσει εἴτε ἀληθείᾳ</td><td>eite prophasei eite alētheia</td><td>或是藉口，或是真實</td><td>動機分辨了，卻不是重點</td></tr><tr><td>Χριστὸς καταγγέλλεται</td><td>Christos katangelletai</td><td>基督被宣揚</td><td>現在式：正在被傳</td></tr><tr><td>ἀλλὰ καὶ χαρήσομαι</td><td>alla kai charēsomai</td><td>而且我還要喜樂</td><td>從現在式跨到未來式</td></tr></table>","gram":"<p><strong>τί γάρ（ti gar） 只有兩個字</strong>，是保羅最典型的修辭問句，等於「那又怎樣」。接著 πλὴν ὅτι（plēn hoti） 把焦點拉回：只有一件事要緊。εἴτε προφάσει εἴτε ἀληθείᾳ（eite prophasei eite alētheia） 是一對反義詞，προφάσει（prophasei） 是「藉口、幌子」。主要子句 Χριστὸς καταγγέλλεται（Christos katangelletai） 用現在式被動，主詞是基督。</p><p>καὶ ἐν τούτῳ χαίρω（kai en toutō chairō）· ἀλλὰ καὶ χαρήσομαι（alla kai charēsomai）：先是現在式 χαίρω（chairō），再用 ἀλλὰ καὶ（alla kai） 推到未來式 χαρήσομαι（charēsomai）。很多註釋把 χαρήσομαι（charēsomai） 劃歸下一段，因為 1:19 的 γάρ（gar） 解釋的正是「我還要喜樂」的理由；和合本把它留在 1:18 句末，以分號接 1:19，也表達了這個銜接。</p>","exp":"<p>「這有何妨呢？或是假意，或是真心，無論怎樣，基督究竟被傳開了」（1:18）。保羅分辨了動機，卻不讓動機成為他的焦點。這不是說動機不要緊——保羅在 2:3 會嚴厲地說「凡事不可結黨」。這裡的分別是：他們傳的是真福音，只是心不正；保羅把審判他們心的事交給神，自己只看福音有沒有往前走。這與加拉太書講義第 1 章他對「別的福音」的態度完全不同：內容錯了，他一步不讓；只是動機不純，他放手。</p><p>「為此，我就歡喜，並且還要歡喜」（1:18）。保羅的喜樂不靠別人對他好。如果他的喜樂要等那些嫉妒他的人悔改，他就永遠喜樂不起來。這是 321「焦點在耶穌，不在別人」最具體的一幕：別人的惡意是真的，卻不能決定他的心情。</p><p>今天教會裡的同工，最常被偷走喜樂的地方，就是看見別人搶功勞、說閒話、拉人。1:18 不是要人裝作沒看見，而是給人一條出路：看清楚之後，把眼睛轉回基督身上。</p>"},{"a":19,"z":20,"star":2,"grk":"<p lang=\"grc\">οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,</p><p lang=\"grc\">κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλʼ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.</p>","lit":"<p>因為我知道，這事對我必要歸於得救，藉著你們的祈求和耶穌基督之靈的供應，</p><p>照著我的伸頸切望和盼望：我在任何事上都不會蒙羞，而是在一切的放膽中，像往常一樣，現在也是，基督要在我的身體上被尊為大，無論是藉著生，或是藉著死。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν</td><td>touto moi apobēsetai eis sōtērian</td><td>這事對我必歸於得救</td><td>與伯 13:16 七十士譯本字句相同</td></tr><tr><td>ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ</td><td>epichorēgias tou pneumatos Iēsou Christou</td><td>耶穌基督之靈的供應</td><td>包下全部開銷的贊助者</td></tr><tr><td>ἀποκαραδοκίαν</td><td>apokaradokian</td><td>伸長脖子的切望</td><td>羅 8:19 也用</td></tr><tr><td>ἐν πάσῃ παρρησίᾳ</td><td>en pasē parrēsia</td><td>在一切的放膽中</td><td>公開、坦然</td></tr><tr><td>μεγαλυνθήσεται Χριστὸς</td><td>megalynthēsetai Christos</td><td>基督要被尊為大</td><td>被動：主角是基督</td></tr><tr><td>εἴτε διὰ ζωῆς εἴτε διὰ θανάτου</td><td>eite dia zōēs eite dia thanatou</td><td>或藉著生，或藉著死</td><td>主權不在保羅</td></tr></table>","gram":"<p><strong>τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν（touto moi apobēsetai eis sōtērian） 與七十士譯本伯 13:16 的五個字一字不差。</strong>約伯在朋友的控告中說，神終必為他伸冤；保羅在被誤解、被為難的處境裡，借用了約伯的話。腓立比書沒有明文引用舊約，這是化用，不是「應驗」。σωτηρίαν（sōtērian） 指甚麼？一說是出監獲釋；一說是終末的救恩與伸冤（1:20「沒有一事叫我羞愧」與 1:28 的「得救」都是終末語言）。1:20 立刻說「是生是死」都可以，可見保羅不是在預告自己必然出監；本講義讀作終末的伸冤與救恩，出監是其中可能的一部分。</p><p>ἐπιχορηγίας（epichorēgias） 原指希臘城邦裡包下合唱團全部開銷的贊助；ἀποκαραδοκίαν（apokaradokian） 由「遠離」「頭」「等候」組成，伸長脖子張望。ἐν οὐδενὶ αἰσχυνθήσομαι（en oudeni aischynthēsomai） 與 ἀλλʼ ἐν πάσῃ παρρησίᾳ（all' en pasē parrēsia） 成對：不蒙羞，乃是放膽。μεγαλυνθήσεται（megalynthēsetai） 是被動，基督被尊為大；ἐν τῷ σώματί μου（en tō sōmati mou）——不是在我的思想裡，是在我這個戴著鎖鍊的身體上。</p>","exp":"<p>「這事藉著你們的祈禱和耶穌基督之靈的幫助，終必叫我得救」（1:19）。兩個管道並列：腓立比人的祈禱，和基督之靈的供應。一個在羅馬，一個在腓立比，中間隔著海，禱告卻把它們接在一起。這是 321「聖靈是我的引導」在本卷的第一站：保羅不是靠意志硬撐，是被供應的。</p><p>「照著我所切慕、所盼望的，沒有一事叫我羞愧」（1:20）。保羅最怕的不是死，是羞愧——在審判台前，因為怕而否認了主。他盼望的是「凡事放膽」。這份放膽不是天生膽大，是 1:19 那份禱告與供應的結果。</p><p>「無論是生是死，總叫基督在我身上照常顯大」（1:20）。這一句是整段生死經文的鑰匙：<strong>生死的主權不在保羅手裡</strong>。審訊的結果，他不知道；他只知道，不論結果如何，他的身體都是基督被看見的地方。所以接下來 1:21--24 的「挑選」，是在神主權底下的心聲，不是一個人替自己決定生死（立場三）。</p><p>一個在病床上的弟兄姊妹，可以從這一節領受很大的安慰：身體軟弱，不等於基督不能在這個身體上被看見。病床也可以是放膽的地方。但這不是叫人放棄治療——基督在身體上顯大，也包括這個身體被醫治、被照顧。</p>"},{"a":21,"z":21,"star":3,"grk":"<p lang=\"grc\">ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.</p>","lit":"<p>因為對我來說，活是基督，死是得益。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐμοὶ γὰρ</td><td>emoi gar</td><td>因為對我</td><td>放在句首：保羅的見證</td></tr><tr><td>τὸ ζῆν Χριστὸς</td><td>to zēn Christos</td><td>活是基督</td><td>沒有動詞：活＝基督</td></tr><tr><td>τὸ ἀποθανεῖν κέρδος</td><td>to apothanein kerdos</td><td>死是得益</td><td>κέρδος：帳上的盈餘</td></tr></table>","gram":"<p><strong>1:21 是兩行對句，中間沒有一個動詞。</strong>ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος（emoi gar to zēn Christos kai to apothanein kerdos）。ἐμοὶ（emoi） 放在最前面，是強調的與格：「對我來說」——這是保羅的見證，不是一條叫人照抄的口號。γὰρ（gar） 解釋 1:20：為甚麼生死都能叫基督顯大。</p><p>兩個不定詞的時態不同：τὸ ζῆν（to zēn） 是現在式，一段持續的生活；τὸ ἀποθανεῖν（to apothanein） 是不定過去式，一個點狀的事件。活是一條長路，死是一道門。κέρδος（kerdos） 是商業用語，帳上的盈餘；3:7「先前以為與我有益的」用的是同一個字的複數 κέρδη（kerdē），保羅把那些益處都搬到了損失欄。所以「死是得益」的「益」，在本卷有一個明確的內容：那就是基督自己（1:23「與基督同在」）。</p><blockquote><p>全卷的一條線從這一節出發：1:21 → 2:5--8 → 2:9--11 → 3:7--14 → 3:20--21 → 4:11--13。這裡的 Χριστὸς（Christos） 是主格述詞，不是「為基督而活」，是「活就是基督」；與加 2:20 並讀，一個是宣告，一個是定義。</p></blockquote>","exp":"<p>「因我活著就是基督，我死了就有益處」（1:21）。這是全卷地勢圖本章的山峰，也是本卷最需要保護人的一節。讀這一節，要先問：保羅說的「益處」是甚麼？不是逃離痛苦，不是解脫，是 1:23 說的「與基督同在」。益處是一個人，不是一個出口。保羅的生命早就被基督填滿了，所以死不能從他身上奪走甚麼，只會把他帶到那一位面前。</p><p>前半句同樣重要：「我活著就是基督」。活著的每一天，內容就是基督——在監裡、在審訊中、在給腓立比人寫信的時候。這和加拉太書講義第 2 章讀過的「現在活著的不再是我，乃是基督在我裡面活著」（加 2:20）是同一個生命：不是我消失了，是我被基督住滿了。這是 321 的「無己」最深的樣子，也是全卷四篇「基督是我的生命」的第一聲。</p><p><strong>這一節一定要和 1:24 一起讀。</strong>保羅說完「死了就有益處」，緊接著說「然而，我在肉身活著，為你們更是要緊的」（1:24）。1:21 不是一段羨慕死亡的經文，而是一段選擇活下去的經文的開頭。講台上若只讀 1:21，對一位正在痛苦中、有輕生念頭的人是危險的；完整的讀法是：活著是基督，所以活著有內容；死了有基督，所以死不可怕；而神既然把人留在世上，活下去就是此刻的呼召（立場三）。</p><p>若有人讀到這一節，說出想死的念頭，教會的第一件事不是糾正他的神學，是陪伴他、聽他、保護他的生命，並協助他連結專業協助與危機支援；不說「你信心不夠」，也不用天堂或地獄嚇他。保羅自己在下一節就在兩難中掙扎——掙扎本身不是罪，而他的掙扎最後選擇了留下。</p>"},{"a":22,"z":24,"star":3,"grk":"<p lang=\"grc\">εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·</p><p lang=\"grc\">συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ γὰρ μᾶλλον κρεῖσσον,</p><p lang=\"grc\">τὸ δὲ ἐπιμένειν ἐν τῇ σαρκὶ ἀναγκαιότερον διʼ ὑμᾶς.</p>","lit":"<p>但若是活在肉身裡，這對我是工作的果子——而我要選擇甚麼，我說不出；</p><p>我被兩邊緊緊夾住，有著那拔營離去、與基督同在的渴望，因為這是更好得多的；</p><p>但是留在肉身裡，為了你們的緣故更是必需的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰ δὲ τὸ ζῆν ἐν σαρκί</td><td>ei de to zēn en sarki</td><td>但若是活在肉身裡</td><td>句子沒有說完</td></tr><tr><td>καρπὸς ἔργου</td><td>karpos ergou</td><td>工作的果子</td><td>活著有收成</td></tr><tr><td>τί αἱρήσομαι οὐ γνωρίζω</td><td>ti hairēsomai ou gnōrizō</td><td>要選甚麼，我說不出</td><td>γνωρίζω：說不出、不宣告</td></tr><tr><td>συνέχομαι δὲ ἐκ τῶν δύο</td><td>synechomai de ek tōn dyo</td><td>我被兩邊緊緊夾住</td><td>兩股力量擠壓</td></tr><tr><td>ἀναλῦσαι</td><td>analysai</td><td>拔營、解纜</td><td>離開的比喻</td></tr><tr><td>ἀναγκαιότερον διʼ ὑμᾶς</td><td>anankaioteron di' hymas</td><td>為了你們更是必需的</td><td>比較級：勝過「好得無比」</td></tr></table>","gram":"<p><strong>1:22 是一個破碎的句子。</strong>εἰ δὲ τὸ ζῆν ἐν σαρκί（ei de to zēn en sarki）, τοῦτό μοι καρπὸς ἔργου（touto moi karpos ergou） 之後，SBLGNT 用破折號，句子沒有收好就轉到 καὶ τί αἱρήσομαι（kai ti hairēsomai）。文法的斷裂正是心境的寫照：保羅在信裡想到一半就停住了。οὐ γνωρίζω（ou gnōrizō） 在保羅書信多半是「宣告、讓人知道」，這裡可讀作「我不說」——選擇權不在他。</p><p>1:23 συνέχομαι（synechomai） 是被緊緊夾住、擠壓，路 12:50 耶穌說「我何等的迫切」也是這個字。ἀναλῦσαι（analysai） 可以是士兵拔營、水手解纜，都是「起程」的比喻，不是「消滅」。σὺν Χριστῷ εἶναι（syn Christō einai） 是離世的內容；πολλῷ γὰρ μᾶλλον κρεῖσσον（pollō gar mallon kreisson） 堆了三層比較，「好得無比」。這一節與林後 5:8 並讀，是多數福音派「居間狀態」讀法的經文根據；靈魂睡覺說與即時復活說，見本章議題頁。</p><blockquote><p>1:24 用 δὲ（de） 轉折：τὸ δὲ ἐπιμένειν ἐν τῇ σαρκὶ ἀναγκαιότερον διʼ ὑμᾶς（to de epimenein en tē sarki anankaioteron di' hymas）。1:23 是 κρεῖσσον（更好），1:24 是 ἀναγκαιότερον（更必需）。對保羅自己「更好」的，敗給了對別人「更必需」的。ἐπιμένειν（epimenein） 是「留下、持守在」，1:25 再用 μενῶ καὶ παραμενῶ（menō kai paramenō） 兩個同字根的字把「留下」說死。</p></blockquote>","exp":"<p>「但我在肉身活著，若成就我工夫的果子，我就不知道該挑選甚麼」（1:22）。保羅沒有把活著講成「還沒死」，他講成「有果子」。活在肉身裡，是有收成的日子。這個人不是活膩了，他是看見兩邊都好。</p><p>「我正在兩難之間，情願離世與基督同在，因為這是好得無比的」（1:23）。這是一個誠實的心聲：保羅想見主。基督徒可以盼望天家，這不是罪；面對臨終與喪親的人，這一節是很深的安慰。但這一節不能單獨讀——下一節他就說「然而」，選擇了活著。安慰喪親的人時，也不要拿這一節叫人「不要哭」；這使我們想起「耶穌哭了」（約 11:35）。</p><p>「然而，我在肉身活著，為你們更是要緊的」（1:24）。<strong>這是整段的結論。</strong>對保羅自己，離世「好得無比」；對腓立比人，他活著「更是要緊」。他選擇了後者。決定他留下的，不是他的感受，是別人的需要——這正是 2:4「也要顧別人的事」最早的樣子。所以 1:21--24 不是一段羨慕死亡的經文，而是一段選擇活下去的經文。</p><p>對一個在痛苦裡、覺得活著沒有意義的人，這一節說的是：你活著，對別人是要緊的。這句話不是壓力，是一個事實——你的家人、你的弟兄姊妹、你身邊的人，需要你在。若有人有輕生的念頭，請不要獨自承受：告訴一位可信任的人，尋求專業協助與危機支援；教會的責任是陪他走這段路，保護他的生命。神把人留在世間，是有意的。</p><p>還要留意保羅做決定的次序。他先說出自己的渴望，沒有假裝不想見主；再把渴望放在別人的需要旁邊衡量；最後交給神的主權（1:20）。這不是壓抑感受，是誠實地把感受帶到神面前，再讓愛來決定方向。一個人可以承認自己很累、很想離開，同時選擇為了所愛的人留下來——保羅就是這樣活下去的。</p>"},{"a":25,"z":26,"star":1,"grk":"<p lang=\"grc\">καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,</p><p lang=\"grc\">ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.</p>","lit":"<p>並且我確信這事，我知道我要留下，而且要與你們眾人一同留下，為了你們信心的推進和喜樂，</p><p>好叫你們的誇耀，在基督耶穌裡，因我而充溢，藉著我再次到你們那裡的同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μενῶ καὶ παραμενῶ</td><td>menō kai paramenō</td><td>我要留下，且要留在身邊</td><td>同字根疊用</td></tr><tr><td>εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως</td><td>eis tēn hymōn prokopēn kai charan tēs pisteōs</td><td>為了你們信心的推進和喜樂</td><td>1:12 的 προκοπὴν 回來了</td></tr><tr><td>τὸ καύχημα ὑμῶν</td><td>to kauchēma hymōn</td><td>你們的誇耀</td><td>在基督耶穌裡的誇耀</td></tr><tr><td>διὰ τῆς ἐμῆς παρουσίας πάλιν</td><td>dia tēs emēs parousias palin</td><td>藉著我再次的同在</td><td>盼望再見面</td></tr></table>","gram":"<p><strong>1:25 的 πεποιθὼς（pepoithōs） 回應 1:6 的 πεποιθὼς（pepoithōs）。</strong>1:6 他確信神必成全腓立比人，1:25 他確信自己要留下來幫助這個成全。μενῶ καὶ παραμενῶ（menō kai paramenō） 是文字遊戲：μένω（menō） 是留下，再加上表示「在旁邊」的字首，留下來，而且留在你們身邊。</p><p>εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως（eis tēn hymōn prokopēn kai charan tēs pisteōs）：一個冠詞統管兩個名詞，推進與喜樂是一組；προκοπὴν（prokopēn） 是 1:12 的字，福音的推進，現在是信徒的推進。1:26 καύχημα（kauchēma） 是正面的「誇耀」，ἐν Χριστῷ Ἰησοῦ（en Christō Iēsou） 定了它的範圍；παρουσίας（parousias） 在這裡是保羅本人的到訪，不是主的再來。</p>","exp":"<p>「我既然這樣深信，就知道仍要住在世間，且與你們眾人同住」（1:25）。保羅把「留下」講成了確信。這不是預言審訊的結果，是他在 1:24 的掙扎之後，降服在神的旨意裡得到的把握：神既然還需要他，他就活下去。</p><p>留下來做甚麼？「使你們在所信的道上又長進又喜樂」（1:25）。他活著的目的在別人身上。1:12 是福音的推進，1:25 是人的推進——福音往前走，人也要往前走。喜樂再出現一次，這次是腓立比人的喜樂。</p><p>「叫你們在基督耶穌裡的歡樂，因我再到你們那裡去，就越發加增」（1:26）。一個剛談完生死的人，最後想的是一次見面。這很像人：屬靈的盼望沒有讓保羅變得不食人間煙火，他仍然想念、仍然盼望和他們同在一個房間裡。生與死這一段，最後落在一頓團聚的飯上，不是落在死亡上。</p>"},{"a":27,"z":27,"star":3,"grk":"<p lang=\"grc\">Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,</p>","lit":"<p>只是要以配得上基督福音的方式過公民的生活，好叫我無論是來了見到你們，或是不在場，都能聽到關於你們的事：你們在一個靈裡站立，以一個魂一同為福音的信仰奮鬥，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μόνον</td><td>Monon</td><td>只要</td><td>放在句首：唯一要緊的</td></tr><tr><td>ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε</td><td>axiōs tou euangeliou tou Christou politeuesthe</td><td>以配得上基督福音的方式過公民
