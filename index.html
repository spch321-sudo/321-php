是以弗所。有些讀者會因此鬆一口氣，有些讀者卻會開始不安：連基督怎樣虛己都有爭論，我信的到底可不可靠？而腓立比書本身又是一封叫人「意念相同」、又叫人「應當防備」的信。甚麼可以有不同看法、甚麼不能讓，必須在開卷講清楚。","pos":[["【一】經文問的是甚麼","","<p>腓立比書裡有兩個場景，正好放在一起看。一個在第 1 章：有人傳基督是出於嫉妒紛爭，保羅卻說「這有何妨呢？或是假意，或是真心，無論怎樣，基督究竟被傳開了」（1:18）——動機不純，他可以忍。另一個在第 3 章：有人要外邦信徒受割禮才能得救，保羅說「應當防備犬類，防備作惡的，防備妄自行割的」（3:2）——福音被改了，他一步不讓。同一位使徒、同一封信，一處寬、一處嚴。</p><p>保羅為腓立比人禱告，也正是求這份分辨：「就是要你們的愛心在知識和各樣見識上多而又多，使你們能分別是非」（1:9–10）；對於還沒有看清楚的事，他說「若在甚麼事上存別樣的心，神也必以此指示你們。然而，我們到了甚麼地步，就當照著甚麼地步行」（3:15–16）。<strong>經文問的是：甚麼是不能讓的？甚麼是可以有不同看法、等候神指示的？知道了這麼多爭議以後，信心該建立在哪裡？</strong></p>"],["完美答案說（每一題都必須有唯一的標準答案，信心才站得住）","","<p>認為一位真正信靠聖經的人，在每一個議題上都應當有清楚而唯一的答案；承認有爭議，就是承認聖經不清楚，信心就會動搖。所以教會應當在虛己的方式、死後的狀態、成聖的程度、輔導的路線等每一題上都立好標準答案，要信徒照著相信。這派的心志是保護信徒不被錯誤的教導帶走，這份心是好的，也有 3:2「應當防備」的根據。</p><p><strong>難處：</strong>它把 3:2 的「妄自行割的」和教會內部敬虔的人之間的不同看法混在一起了。保羅自己對還沒看清的事說「神也必以此指示你們」（3:15），不是「照我的答案信」；他也承認「我們如今彷彿對著鏡子觀看，模糊不清」（林前 13:12）。把每一題都升格成不能讓的中心，合一就只剩下意見完全相同的人；而信心若建立在每一題都答對上，任何一題的答案一動，整個信仰就跟著倒。</p>"],["爭議即不可靠說（既然甚麼都有爭論，信仰就只剩個人意見）","","<p>認為既然學者們連基督怎樣虛己、死後怎樣、這封信是幾封都意見分歧，那就表示聖經沒有確定的教導，每個人照自己的感覺讀就好；合一就是不談真理、不說對錯。這派誠實地面對了爭議的存在，也提醒教會不要假裝一切都很簡單、不要用自己的答案壓人——那是 1:15–18 保羅的寬容。</p><p><strong>難處：</strong>它把爭議的「細節」與爭議的「範圍」混在一起了。古典讀法、虛己論、自限說爭的是基督怎樣虛己，沒有一派否認「耶穌基督為主」（2:11）；居間狀態與靈魂睡覺說爭的是死後的過程，沒有一派否認身體復活（3:21）；改革宗與衛斯理宗爭的是成聖能走多遠，沒有一派否認得救本乎恩。而且 3:2 明說有要防備的教導——真理不是可有可無的，沒有真理的合一，只是一群一起漂流的人。</p>"],["中心與邊緣說（福音的中心不能讓，其餘的事可以有不同看法）","","<p>認為腓立比書本身就劃出了一條線，就是 1:18 與 3:2 之間的那條線。<strong>不能讓的</strong>，是福音本身：基督「本有神的形像」、虛己、存心順服以至於死、被神升為至高，萬口承認「耶穌基督為主」（2:6–11）；人得的義「不是有自己因律法而得的義，乃是有信基督的義」（3:9）；基督要從天上降臨，「將我們這卑賤的身體改變形狀」（3:21）。<strong>可以有不同看法的</strong>，是在這中心之外的解釋、歷史與實踐的問題，以及人傳福音的動機與方式（1:15–18）。</p><p><strong>難處：</strong>中心與邊緣的界線本身有時也會被爭論——有人會說成聖的程度或輔導的路線就是中心。所以劃線的時候，要以經文自己最清楚、最反覆強調的事為中心，而不是以某一個宗派最在意的事為中心；也要記得，邊緣的事不等於不重要的事——它們常常牽動人的生命（例如 ISS00_3、ISS00_5），所以要謹慎、溫柔地處理。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採中心與邊緣的讀法，以 2:6–11 的基督之歌為中心。</strong>基督本有神的形像、虛己、存心順服以至於死、神將他升為至高、萬口承認「耶穌基督為主」、使榮耀歸與父神——這幾件事各派都同意，兩千年沒有被任何學術爭論動搖。加上腓立比書自己的福音：義不是自己的，是從神來的（3:9）；那動了善工的必成全這工（1:6）；我們是天上的國民，等候救主降臨、身體改變（3:20–21）。</p><p>其餘的事，本講義照鐵律三：先陳列各家、說出各自的難處、再給判斷，並且把判斷的理由講出來；講台與教學場上一句帶過，指向議題頁與 ISS00_1–5。3:9 的「信基督」兩種讀法、3:1 的接縫、4:23「心」與原文「靈」的差別，都照實交代，不講成懷疑。判斷的標準就是保羅自己的兩句話：動機與方式的不同，「這有何妨呢」（1:18）；福音被改了，「應當防備」（3:2）。</p><p>全卷的地勢最高點是 2:11，引它時一律引全句：「無不口稱『耶穌基督為主』，使榮耀歸與父神」（2:11）。爭議可以留在議題頁裡，這一節要帶回家。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。信心不是建立在「我對每一題都有答案」上，而是建立在那一位「在你們心裡動了善工的，必成全這工」（1:6）的神身上。學者的爭論會一直持續下去；但你可以在不知道虛己是古典讀法還是自限說、不確定這封信寫於羅馬還是以弗所的情況下，完全確定自己是「天上的國民」（3:20），因為那位存心順服以至於死的基督已經為你走完了往下的路。</p><p>這一卷要讀完的人，<strong>不是更會辯論，而是更能「以基督耶穌的心為心」（2:5）</strong>——在不同意彼此的時候，仍然「看別人比自己強」（2:3）；在必須防備的時候，仍然像保羅那樣「流淚地告訴你們」（3:18）。「我們到了甚麼地步，就當照著甚麼地步行」（3:16）。<strong>讀完這一卷的人，是更愛主，還是更佩服作者？</strong>若是更愛主，爭議就各歸其位了。</p>"]],"con":[],"say":"本講義的立場：以 2:6–11 的基督之歌為中心——基督虛己、順服至死、被神升為至高、萬口承認「耶穌基督為主」，加上義不是自己的（3:9）、神必成全（1:6）、身體復活（3:21）；其餘解釋、歷史與實踐的問題，先陳列各家、說出難處、再給判斷，講台一句帶過、指向議題頁與 ISS00_1–5。判準是保羅自己的兩句話：動機方式的不同「這有何妨呢」（1:18），福音被改了「應當防備」（3:2）。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也會有一聽到「學者有爭論」就不安、覺得教會怎麼甚麼都不確定的人，還有曾經在某一題上——無己、破碎、完全、喜樂、奉獻——被教會傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要急著用一堆答案堵住他，先陪他；對第二種人，指給他看 2:6–11 與 1:6 那幾件從來沒有被任何爭議動搖的事；對第三種人，讓他知道傷他的是人錯用了經文，不是那位為他虛己、存心順服以至於死的基督。疑惑若伴隨長期的失眠、無望感或輕生念頭，會後單獨關心，必要時協助尋求專業協助（見 ISS00_3）。"},{"id":"ISS01_1","t":"1:1「監督」「執事」——初代教會有哪些職分？監督與長老是同一種人嗎？","r":"1:1；徒 20:17；徒 20:28；提前 3:1--13；多 1:5--7","ch":[1],"why":"腓立比書是新約唯一在問安裡點名「監督」與「執事」的書信。今天的教會有主教制、長老制、會眾制，各自引用這些字為自己的體制背書；有人因此爭論誰才是「合乎聖經的教會」，也有人被頭銜壓過、傷過。這一題關係到教會怎樣看領袖，也關係到領袖怎樣看自己。","pos":[["【一】經文問的是甚麼","","<p>「基督耶穌的僕人保羅和提摩太寫信給凡住腓立比、在基督耶穌裡的眾聖徒，和諸位監督，諸位執事。」（1:1）<strong>σὺν ἐπισκόποις καὶ διακόνοις</strong>（syn episkopois kai diakonois）兩個字都是複數、都沒有冠詞。問題是：一間教會為甚麼有「諸位」監督？監督和使徒行傳、教牧書信裡的「長老」是不是同一批人？這兩個職分是正式的職位，還是功能的描述？</p>"],["同一職分說：監督就是長老，一間教會有多位","","<p>多數新約學者與長老制傳統：徒 20 章保羅「請教會的長老來」（徒 20:17），十一節後對同一批人說「聖靈立你們作全群的監督」（徒 20:28）；多 1:5--7 也是先說「設立長老」，接著說「監督既是神的管家」。「長老」說的是身分與成熟，「監督」說的是看顧的工作；腓 1:1 的複數正說明一間教會由一群人共同看顧，不是一人獨大。</p><p><strong>難處：</strong>這一說解釋了新約的用字，卻不能直接回答今天的體制問題；新約沒有給一張完整的組織圖，各地教會的做法也未必一致，硬把一種體制說成唯一合乎聖經，同樣超出經文。</p>"],["發展說：監督逐漸成為單一的主教職分","","<p>主教制傳統與部分教會史學者：一世紀末到二世紀初，伊格那丟的書信已經清楚區分一位監督（主教）、多位長老與執事；腓 1:1 代表的是較早、尚未定型的階段，教會在使徒之後為了保守真道與合一，逐漸發展出單一主教的體制，這發展本身是聖靈的帶領。</p><p><strong>難處：</strong>這一說承認新約時代監督與長老尚未分開，主教制的根據就主要落在教會傳統，而不是新約明文；如何判斷一項後來的發展是否合乎聖經，各宗派的答案不同。</p>"],["功能說：這兩個字描述的是服事，不是位階","","<p>一些學者與會眾制傳統：ἐπίσκοπος（episkopos）是「看顧的人」，διάκονος（diakonos）是「服事的人」，在當時的社團與城市裡都是普通字；保羅點名他們，很可能因為他們負責收集、送出那一筆餽送（4:18）。重點是功能，不是頭銜；全體聖徒才是主角。</p><p><strong>難處：</strong>這一說提醒我們不要神化頭銜，卻可能低估了初代教會已經有被設立、被承認的職分（提前 3:1--13；多 1:5）；完全只講功能，會讓教會在需要清楚負責的時候找不到負責的人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採同一職分說：新約的監督與長老是同一群人，一間教會由多位共同看顧；執事是被承認的服事職分。</strong>各宗派今天的體制可以按處境發展，但不可以拿任何一種體制宣稱自己才是真教會。</p><p>更要緊的是 1:1 的次序：「眾聖徒」排在前面，「諸位監督，諸位執事」排在後面；保羅自己也不稱使徒，只稱「僕人」。領袖是從聖徒中間被立起來服事聖徒的。女同工與性別角色的問題，回指哥林多前書立場二與加拉太書立場四；屬靈權柄回指哥林多後書立場三。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：教會的元首是基督，領袖是為了看顧群羊而設立，要向神交帳。爭的是職分怎樣命名、怎樣組織。</p><p>對你今天最重要的，不是你的教會用哪一種體制，而是你的領袖像不像 1:1 的保羅：先說自己是誰的僕人，再把「你們眾人」放在前面。也問自己：你是坐在台下等人看顧的觀眾，還是 1:5 那種一同合夥的聖徒？</p>"]],"con":[],"say":"本講義的立場：新約的監督與長老是同一群人，一間教會由多位共同看顧；體制可以按處境發展，但沒有一種體制可以自稱唯一合乎聖經。1:1 的次序是眾聖徒在前、監督執事在後——領袖是僕人。屬靈權柄回指哥林多後書立場三，女同工回指哥林多前書立場二。","care":"會眾席上可能有曾經被「長老」「主教」「屬靈遮蓋」的頭銜壓過、被要求絕對順服的人，也可能有正在服事卻被當作「只是執事」而輕看的同工。不要在講台上替任何一種體制打倒另一種，也不要嘲笑別的宗派。對受過屬靈權柄傷害的人，先聽他說完，肯定他說出來的勇氣，不要說「你要順服就好」；涉及控制或其他傷害，協助他找到安全的管道與專業協助。"},{"id":"ISS01_2","t":"1:6「動了善工的，必成全這工」——一次得救，永遠得救嗎？","r":"1:6；2:12--13；約 10:28--29；來 6:4--6","ch":[1],"why":"1:6 是許多信徒得救確據的經文，也是「一次得救，永遠得救」辯論裡最常被引用的一節。有人因此安心，也有人拿它當作放縱的理由；另一邊，有人讀到希伯來書的警告，就整夜害怕自己失去救恩。這一題直接關係到一個人怎樣面對自己的跌倒，也關係到牧者怎樣陪伴退後的人。","pos":[["【一】經文問的是甚麼","","<p>「我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。」（1:6）<strong>ὁ ἐναρξάμενος</strong>（ho enarxamenos）「那開始的」與 <strong>ἐπιτελέσει</strong>（epitelesei）「他必完成」一頭一尾，主詞都是神；πεποιθὼς（pepoithōs）是完成式分詞，保羅說的是已定的把握。問題是：這是對每一位信徒的應許，還是保羅對腓立比這一群人的信心？它能不能回答一個真信徒最後會不會失落救恩的問題？</p>"],["蒙保守說（改革宗）：神開始的，必保守到底","","<p>改革宗與許多福音派：救恩從頭到尾是神的工作，1:6 與「誰也不能從我手裡把他們奪去」（約 10:28）一致；真正被神動了善工的人，神必保守他到底。真信徒會跌倒，卻不會最終離棄；最後離開的人，顯明他們原本並沒有真正領受。</p><p><strong>難處：</strong>這一說給人確據，卻容易被簡化成「信過一次，怎麼活都可以」；而「最後離開的人原本不是真的」對牧養也有沉重的一面——人在今生很難斷定誰是真的。</p>"],["可失落說（阿米念與衛斯理傳統）：神信實，人仍可以離棄","","<p>阿米念派與衛斯理宗：神的保守是真實的，但不取消人的回應；來 6:4--6 說到「已經蒙了光照」的人「若是離棄道理」，新約許多警告都是對信徒說的。1:6 是保羅對一間正在合夥福音的教會的信心，不是一個不論人怎樣活都成立的保證。</p><p><strong>難處：</strong>這一說認真看待警告經文，卻容易讓敏感的信徒活在「我會不會已經失去救恩」的恐懼裡；1:6 的主詞明明是神，若最後的成全取決於人，確據就很難站穩。</p>"],["張力說：確據與警告都是神保守人的方法","","<p>不少新約學者主張：新約同時給確據與警告，兩者不是彼此抵銷，而是神保守信徒的兩隻手——確據叫人安心，警告叫人醒著；1:6 就緊接著 2:12--13：「做成你們得救的工夫」，「因為你們立志行事都是神在你們心裡運行」。神成全的方式，包括叫人持守。</p><p><strong>難處：</strong>這一說忠於經文的平衡，卻沒有回答系統神學最後的問題；講台上若說不清楚，會眾可能兩頭都聽不懂。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在 1:6 的明文上：救恩的開始與成全，主詞都是神。</strong>得救本乎恩，不靠行為，也不靠人自己保住（回指加拉太書立場二）；2:12 的「做成」與 2:13 一起讀，是恩典的果效，不是條件（全卷立場見 ISS00_4）。</p><p>在「真信徒最終能否失落救恩」的系統神學問題上，改革宗與阿米念傳統並陳，本講義不在講台上替任何一方打倒另一方；牧養上守住兩件事：不給放縱開門，也不叫人活在失去救恩的恐懼裡。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，而且應當叫你更安心。兩邊都同意：救恩是神開始的，神是信實的，人不能靠自己保住救恩。</p><p>如果你今天正在為自己的跌倒害怕，請先讀 1:6 的主詞：開工的不是你，成全的也不是你。害怕失去救恩的人，通常不是不在乎神的人；把那份害怕帶到他面前，說出來，回到他的恩典裡。</p>"]],"con":[],"say":"本講義的立場：救恩的開始與成全，主詞都是神；1:6 與 2:12--13 一起讀——不給放縱開門，也不叫人活在失去救恩的恐懼裡。本講義的全卷立場見 ISS00_4（因信稱義回指加拉太書立場二）。","care":"會眾席上可能有長期活在「我是不是已經失去救恩」恐懼裡的人，有些人的害怕已經接近強迫性的焦慮；也可能有家人離開信仰、正在追問「他還得救嗎」的父母。不要用這一題嚇人，也不要在家屬面前斷定誰得救、誰沒有。對害怕的人，陪他讀 1:6，讓他看見主詞是神；若他的恐懼已經影響睡眠與生活，溫柔地建議他同時尋求輔導或就醫。對家屬，先陪伴、一起為那位家人禱告。"},{"id":"ISS01_3","t":"1:9--10「能分別是非」——以基督的心為心、「無己」的人，也要分辨嗎？","r":"1:9--11；1:15--17；3:2；約壹 4:1","ch":[1],"why":"華人教會常把「愛心」講成甚麼都說好、甚麼都忍，把「無己」講成沒有意見、不可以說不。結果是有人被利用、被控制，還以為那是屬靈；另一邊，也有人以「分辨」為名到處審查別人。1:9--10 正好把愛和分辨放在同一個禱告裡，這一題決定 321 的「無己」會不會被講歪。","pos":[["【一】經文問的是甚麼","","<p>「我所禱告的，就是要你們的愛心在知識和各樣見識上多而又多，使你們能分別是非，作誠實無過的人，直到基督的日子。」（1:9--10）<strong>δοκιμάζειν</strong>（dokimazein）是驗明鑄幣真假的字，<strong>τὰ διαφέροντα</strong>（ta diapheronta）是「那些不同的事」，引申為「真正要緊的事」；和合本註腳另譯「喜愛那美好的事」。問題是：愛與分辨是甚麼關係？一個以基督的心為心的人，可以有判斷、說不、設界線嗎？</p>"],["包容優先說：愛心就是不判斷","","<p>一些敬虔傳統與民間講法：愛「凡事包容，凡事相信」（林前 13:7），基督徒不該論斷人；無己的人沒有自己的立場，別人怎麼對待我都要忍，有意見就是「還有己」。分辨是領袖的事，一般信徒只要順服與包容。</p><p><strong>難處：</strong>這一說把 1:9 的「知識和各樣見識」整個拿掉了；保羅自己在 1:15--17 分辨了傳道人的動機，在 3:2 說「應當防備」。把不分辨當作愛，會叫人留在被利用、被控制的關係裡，那不是無己，是受害。</p>"],["審查優先說：分辨就是揭發錯誤","","<p>另一種傾向把 1:10 讀成護教的命令：屬靈的人要時時檢驗別人的教導、動機與生活，指出錯誤，「一切的靈，你們不可都信，總要試驗」（約壹 4:1）；分辨能力越強，越屬靈。</p><p><strong>難處：</strong>1:9 的主語是「愛心」——分辨是從愛長出來的，不是取代愛；1:10 的目的是使「你們」誠實無過，首先檢驗的是自己。沒有愛的分辨會變成挑剔，叫教會充滿審查，而不是果子。</p>"],["有眼睛的愛：愛在知識和見識上長大","","<p>多數解經家：保羅求的不是減少愛、加上分辨，而是愛本身「多而又多」，而且多在知識和見識上——愛長出眼睛。分辨的對象是 τὰ διαφέροντα（ta diapheronta），在許多都說得過去的事裡認出真正要緊的；目的是自己「誠實無過」，並且「結滿了仁義的果子，叫榮耀稱讚歸與神」（1:11）。</p><p><strong>難處：</strong>這一說最貼近經文，但在實際處境裡仍需要智慧：甚麼時候該放手（1:18），甚麼時候該防備（3:2），需要群體一同分辨，不能只靠個人感覺。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「有眼睛的愛」：分辨不是愛的反面，是愛的視力。</strong>無己的人仍有分辨：保羅分辨了動機（1:15--17）、說出了苦楚（1:17）、對改變福音的人說「應當防備」（3:2）。</p><p>321 的「無己」以 2:5--8 為準：無己是不以自己為中心，不是沒有自己；無己的人知道自己是誰、自由地給出、仍有分辨、仍可說出需要、仍可設界線（全卷立場見 ISS00_2）。分辨的標準不是「對我有沒有利」，是甚麼對福音、對別人的長進真正要緊。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：愛是最大的誡命，分辨是為了保守愛、保守福音。爭的是兩者的比重與次序。</p><p>你可以從今天開始問一個問題：我的愛有沒有眼睛？我的眼睛有沒有愛？如果你一直以為說「不」就是不屬靈，請重讀 1:9--10——保羅正是為一間很會愛的教會，禱告求他們更會分辨。</p>"]],"con":[],"say":"本講義的立場：分辨不是愛的反面，是愛的視力；無己的人仍有分辨、仍可說出需要、仍可設界線，分辨的標準是甚麼真正要緊，不是對我有沒有利。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有長期被配偶、家人或屬靈領袖控制，卻被教導「你要更有愛心、更無己」而不敢說不的人；也可能有被人以「分辨」為名公開審查、羞辱過的人。不要對前者說「你還有己」，也不要叫他「再忍一忍」；先肯定他看見問題的眼睛是神給的，陪他想安全的界線，涉及控制或暴力時，協助他找到安全的地方與專業協助。對後者，先聽，不要再補一刀。"},{"id":"ISS01_4","t":"1:13「御營全軍」——保羅寫這封信時在哪裡坐監？","r":"1:12--14；4:22；徒 28:16；徒 28:30--31","ch":[1],"why":"腓立比書沒有明說寫信的地點，只說「御營全軍」和「凱撒家裡的人」。羅馬、以弗所、該撒利亞三說各有支持者，也牽動整封信的年代、以巴弗提往返的路程，以及這封信和其他監獄書信的關係。這一題不影響福音，卻幫助我們把信讀回它真實的處境裡。","pos":[["【一】經文問的是甚麼","","<p>「以致我受的捆鎖在御營全軍和其餘的人中，已經顯明是為基督的緣故。」（1:13）<strong>ἐν ὅλῳ τῷ πραιτωρίῳ</strong>（en holō tō praitōriō）可以指羅馬皇帝的近衛軍，也可以指各省總督的官邸。加上 4:22「在凱撒家裡的人特特地問你們安」，問題是：這是羅馬嗎？還是保羅在別處的一段監禁？</p>"],["羅馬說：徒 28 章的軟禁","","<p>多數學者與教會傳統：「御營」最自然的讀法是皇帝的近衛軍；「凱撒家裡的人」也以羅馬最合；使徒行傳說「保羅在自己所租的房子裡住了足足兩年」（徒 28:30），看守他的兵輪班，與 1:13 的畫面相合。年代約在主後 60--62 年。</p><p><strong>難處：</strong>羅馬離腓立比很遠，信中暗示的往返（消息傳去、以巴弗提生病的消息傳回、他們掛念）要好幾趟，需要較長的時間；2:24 保羅盼望再到腓立比，也和他原本要往西班牙去的計畫不太一致。</p>"],["以弗所說：一段使徒行傳沒有記載的監禁","","<p>一些學者主張：以弗所離腓立比近，往返頻繁較合理；保羅在以弗所遭遇大患難（林後 1:8），很可能坐過監；「御營」也可以指省城的總督府，「凱撒家裡的人」可以是各地為皇帝管產業的奴僕與自由人。年代就提前到主後 54--55 年左右。</p><p><strong>難處：</strong>新約沒有明文記載保羅在以弗所坐監；1:20 面對生死判決的口氣，像是向皇帝上訴之後的終審，以弗所的地方官較難有這樣的權柄。</p>"],["該撒利亞說：徒 23--26 章的兩年","","<p>少數學者主張：保羅在該撒利亞被關了兩年，住在「希律的衙門」，與 πραιτώριον（praitōrion）一字可以相合；年代約在主後 57--59 年。</p><p><strong>難處：</strong>在該撒利亞時，保羅還有向凱撒上訴這條路，不像 1:20--23 那樣面對生死未卜的判決；那裡的傳道環境也很難說是「那在主裡的弟兄多半……越發放膽」（1:14）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採羅馬說：腓立比書寫於保羅在羅馬的軟禁中，約主後 60--62 年。</strong>以弗所說與該撒利亞說照實陳列，不迴避它們的長處，例如往返距離的問題。</p><p>這個判斷與以弗所書講義的監獄書信立場一致（全卷立場見 ISS00_6、ISS00_8）。講台只需要一句話：一個鎖在兵丁旁邊的人，把福音傳進了看守他的人中間。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三說都同意：保羅寫信時真的在捆鎖中，福音真的透過他的捆鎖傳開了。爭的是地圖上的哪一點。</p><p>對你今天更要緊的問題是：你自己的「御營」在哪裡？神常把人放在一個走不開的地方，再把需要聽福音的人排班送到他身邊。</p>"]],"con":[],"say":"本講義的立場：腓立比書寫於保羅在羅馬的軟禁中，約主後 60--62 年；以弗所說、該撒利亞說照實陳列。這個判斷不影響解經。本講義的全卷立場見 ISS00_6、ISS00_8。","care":"這一題本身不容易傷人，但要小心兩種人：一種是被「學者說法不一」動搖、以為聖經不可信的初信者；另一種是正在坐監、或家人在獄中的弟兄姊妹。對前者，說清楚這是歷史細節的討論，不是福音的真偽；對後者，不要把坐監講成浪漫的宣教故事，先關心他和家人實際的需要，也讓他知道教會沒有因為這件事看輕他。"},{"id":"ISS01_5","t":"1:15--18「或是假意，或是真心」——動機不純的傳道可以接受嗎？","r":"1:15--18；加 1:8；可 9:38--39；太 7:16","ch":[1],"why":"教會裡最常見的傷，常常不是異端，而是同工之間的嫉妒、搶功、另起爐灶。1:18「這有何妨呢」被一些人拿來說「動機不重要」，也被一些人拿來叫受傷的人閉嘴。保羅在加拉太書寸步不讓，在這裡卻說「這有何妨」，這一題要說清楚他放手的是甚麼、守住的是甚麼。","pos":[["【一】經文問的是甚麼","","<p>「有的傳基督是出於嫉妒紛爭，也有的是出於好意。」（1:15）「那一等傳基督是出於結黨，並不誠實，意思要加增我捆鎖的苦楚。」（1:17）「這有何妨呢？或是假意，或是真心，無論怎樣，基督究竟被傳開了。」（1:18）<strong>τί γάρ</strong>（ti gar）只有兩個字。問題是：這些人是誰？保羅為甚麼對他們這樣寬，對加拉太的教師卻說「他就應當被咒詛」（加 1:8）？</p>"],["結果論：只要福音傳出去，動機不必追究","","<p>一些實用取向的講法：神可以用任何器皿，連不純的動機也能成就他的旨意；只要有人信主，傳道人的動機、方法、生活都不必太計較。</p><p><strong>難處：</strong>保羅並沒有說動機不重要——他明說那是「嫉妒紛爭」「結黨」「並不誠實」，2:3 更命令「凡事不可結黨」。把 1:18 讀成結果論，會讓教會容忍操控、虛假與自我膨脹，最後傷害福音的信用。</p>"],["內容與動機分開說：內容錯了不讓，動機不純交給神","","<p>多數解經家：1:15--18 的人傳的是同一位基督，福音的內容沒有錯，錯在心；加拉太的教師卻是傳「別的福音」，改了內容。保羅對前者把審判人心的事交給神，對後者寸步不讓——同一卷書的 3:2 也說「應當防備」。耶穌對那位奉他名趕鬼、卻不跟從門徒的人說「不要禁止他」（可 9:39），也是同樣的分別。</p><p><strong>難處：</strong>動機和內容在現實裡不容易完全分開；長期不純的動機，常常會漸漸改變內容，需要持續地分辨（1:9--10）。</p>"],["個人寬容說：保羅只是不為自己計較","","<p>另一些學者強調：「加增我捆鎖的苦楚」顯示這些人針對的是保羅個人；保羅的寬容主要是他不為自己的名聲計較，並不代表教會面對結黨的同工時不必處理。保羅在羅馬沒有教會治理的責任，他能做的就是不讓這件事奪走他的喜樂。</p><p><strong>難處：</strong>這一說提醒我們不要把個人的放手變成制度的放任，但若過度強調，就可能忽略 1:18 本身的福音重點——保羅真的為基督被傳開而喜樂。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採內容與動機分開說，並吸收個人寬容說的提醒。</strong>福音的內容被改了，「應當防備」（3:2）；傳的是真福音、只是動機不純，個人可以把審判交給神，不讓別人的惡意決定自己的喜樂。</p><p>但「這有何妨」不是叫受傷的人閉嘴，也不是叫教會對結黨、操控、說謊不聞不問——保羅先分辨了，也說出來了。判準就是保羅自己的兩句話：動機方式的不同「這有何妨呢」，福音被改了「應當防備」（全卷立場見 ISS00_9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：福音的能力不靠傳道人完美，神的工作也不被人的嫉妒攔阻。</p><p>如果你曾經被傳道人的動機傷過，請記得：你可以把那件事說出來，也可以分辨；但你的信心可以站在基督身上，不必站在任何一位傳道人身上。保羅的喜樂沒有被那些人拿走，你的也不必。</p>"]],"con":[],"say":"本講義的立場：福音的內容被改了，應當防備；傳的是真福音、只是動機不純，個人可以把審判人心的事交給神。「這有何妨」不是叫受傷的人閉嘴。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有被同工搶功、被教會裡的人刻意排擠、被傳道人利用過的人；也可能有剛經歷教會分裂、對所有傳道人都失去信任的人。不要對他們說「這有何妨，你要放下」，那會讓他覺得自己的傷不算數。先承認那是真的苦楚，陪他把事情說清楚；若涉及操控、欺騙或屬靈傷害，協助他走正式的處理管道，必要時尋求專業協助。"},{"id":"ISS01_6","t":"1:19「這事終必叫我得救」——是從監獄被釋放，還是終末的救恩？","r":"1:19--20；伯 13:16","ch":[1],"why":"σωτηρία 在新約多半指永遠的救恩，但這裡保羅正在等候判決，「得救」似乎也可以是出監。讀法不同，1:19 的安慰就不同：是保證苦難一定會結束，還是保證無論結果如何都不會蒙羞？對正在等檢查報告、等判決、等結果的人，這一題很實際。","pos":[["【一】經文問的是甚麼","","<p>「因為我知道，這事藉著你們的祈禱和耶穌基督之靈的幫助，終必叫我得救。」（1:19）<strong>τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν</strong>（touto moi apobēsetai eis sōtērian）與七十士譯本伯 13:16 的字句相同。下一節卻說「無論是生是死」。問題是：如果「得救」是出監，保羅怎麼又說可能會死？如果是永遠的救恩，他為甚麼需要腓立比人的禱告？</p>"],["釋放說：保羅深信自己會出監","","<p>一些解經家：在等候判決的處境裡，「得救」最自然的意思是被釋放；1:25「我既然這樣深信，就知道仍要住在世間」、2:24 盼望再去腓立比，都支持保羅預期自己會出監。腓立比人的禱告，就是為他的釋放禱告。</p><p><strong>難處：</strong>1:20 緊接著說「無論是生是死」，可見保羅並不把出監當作確定的事；若「得救」只是出監，「沒有一事叫我羞愧」的盼望就和判決結果綁在一起，與全段生死都交給神的口氣不合。</p>"],["終末救恩說：在神面前得蒙稱義、不至羞愧","","<p>多數學者：保羅借用約伯的話。約伯在朋友的控告中盼望神終必為他伸冤；保羅在審判與被人為難中，盼望的是在神的審判台前得蒙稱許、不至羞愧——無論人間的判決如何。禱告與聖靈的供應，是叫他在審訊中「凡事放膽」，不至因懼怕而否認主。</p><p><strong>難處：</strong>這一說貼近 1:20 與伯 13:16 的脈絡，但「終必叫我得救」若只指終末，1:25--26 那份對再見面的確信就要另作解釋。</p>"],["雙層說：此刻的保守與最終的伸冤","","<p>一些學者主張：σωτηρία（sōtēria）在這裡兩層都有——此刻在審訊中被保守、不至羞愧，最終在神面前被伸冤；保羅也盼望出監，但他的確據不建立在出監上。這樣讀，1:19--26 從盼望、生死兩難到「仍要住在世間」，是一條連貫的心路。</p><p><strong>難處：</strong>這一說較周全，卻需要講台說得清楚，否則容易被聽成「神一定會讓你的處境好轉」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採終末救恩說為主、吸收雙層說：</strong>保羅的確據是在神面前不至羞愧，「總叫基督在我身上照常顯大」（1:20），而不是保證判決一定對他有利；他也盼望出監，但盼望不是他的根基。</p><p>1:19 與伯 13:16 字句相同，本講義稱為「化用」，不稱「應驗」——腓立比書沒有明文引用舊約。這一節最要緊的是兩條供應：弟兄姊妹的禱告，和耶穌基督之靈的幫助。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：保羅的盼望在神，不在人間的判決；禱告和聖靈的供應是真實的。</p><p>如果你正在等一個結果——一份檢查報告、一場官司、一次面試——1:19 沒有保證結果一定如你所願，卻保證你不是一個人等：有人為你禱告，有一位靈供應你，而且無論結果如何，你不至羞愧。</p>"]],"con":[],"say":"本講義的立場：1:19 的「得救」首先是在神面前不至羞愧、得蒙伸冤，不是保證處境一定好轉；保羅也盼望出監，但盼望不是他的根基。1:19 化用伯 13:16，不說「應驗」。爭議與信心見 ISS00_9。","care":"會眾席上可能有正在等判決、等檢查報告、等移植名單的人，也可能有曾經被保證「神一定會醫治你」、結果至親離世而受傷的家屬。不要對等候中的人保證結果，也不要對失落的家屬說「是你們禱告不夠」。陪著等，陪著禱告；結果來的時候，不論好壞，都還在他身邊。長期焦慮、失眠的人，鼓勵他同時尋求專業的協助。"},{"id":"ISS01_7","t":"1:21--23「死了就有益處」「情願離世」——基督徒可以想死嗎？","r":"1:21--26；王上 19:4；林後 1:8；林後 5:8","ch":[1],"why":"這是本卷最需要保護人的經文。一位正在痛苦中的人讀到「死了就有益處」「情願離世」，可能把它當成許可；也有人反過來，因為自己曾經想死而覺得自己是罪人、不配信主。講台上的一句話，可能救一個人，也可能推一個人。這一題必須說清楚。","pos":[["【一】經文問的是甚麼","","<p>「因我活著就是基督，我死了就有益處。」（1:21）「我正在兩難之間，情願離世與基督同在，因為這是好得無比的。」（1:23）可是緊接著是：「然而，我在肉身活著，為你們更是要緊的。」（1:24）<strong>συνέχομαι δὲ ἐκ τῶν δύο</strong>（synechomai de ek tōn dyo）是被兩邊同時夾住。問題是：保羅在羨慕死亡嗎？基督徒心裡出現「不想活」的念頭，是罪嗎？</p>"],["盼望天家說：基督徒本來就該渴慕離世","","<p>一些敬虔傳統的講法：天家比地上好得無比，越屬靈的人越渴慕早日與主同在；保羅的「情願離世」是屬靈高度的表現，對世界留戀是信心不足，「我們坦然無懼，是更願意離開身體與主同住」（林後 5:8）。</p><p><strong>難處：</strong>這一說停在 1:23，沒有讀到 1:24--25 的結論；保羅最後選的是「仍要住在世間」。把渴慕天家講成屬靈高度，很容易被痛苦中的人聽成死亡的邀請，也把盼望浪漫化成了逃避。</p>"],["念頭即罪說：想死就是不信，基督徒不應有這種念頭","","<p>另一種講法把一切「不想活」的念頭都當作不信或撒但的攻擊：真基督徒有喜樂、有盼望，不應該想死；有這種念頭的人要悔改、加強信心。</p><p><strong>難處：</strong>聖經裡的屬神之人也曾經說過想死：以利亞在羅騰樹下說「耶和華啊，罷了！求你取我的性命」（王上 19:4），保羅自己說「甚至連活命的指望都絕了」（林後 1:8）。神對以利亞的回應是讓他睡覺、給他吃喝、親自對他說話，不是責備。把念頭定罪，只會讓人更不敢說出來。</p>"],["選擇活下去說：益處是一個人，結論是留下來","","<p>多數解經家：1:21 的「益處」由 1:23 定義——「與基督同在」，益處是一個人，不是逃離痛苦；而 1:20 先把生死的主權交給神，1:24--25 再說出結論：為了別人的長進，「仍要住在世間」。保羅的兩難不是活膩了，是兩邊都好；這是一段選擇活下去的經文。</p><p><strong>難處：</strong>這一說最貼近經文，但牧者仍要分清楚：保羅的「兩難」是盼望的張力，一個人因為痛苦、憂鬱、絕望而想結束生命，是另一種處境，需要的不是解經，是陪伴與醫治。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採選擇活下去說。</strong>1:21--23 一定讀到 1:24--25；生死的主權在神（1:20），基督徒可以盼望天家，但不可以自己結束生命。盼望與眼淚可以同在，不浪漫化死亡（全卷立場見 ISS00_3）。</p><p>面對有輕生念頭的人，先陪伴、保護生命，協助尋求專業協助；不說「你信心不夠」，不說「自殺的人不能上天堂」。掙扎本身不是罪，說出來是求生的第一步。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經想過不想活，你不是不配信主的人；以利亞、保羅都走過很暗的地方，神沒有離開他們。</p><p>如果你現在就有這樣的念頭，請今天就告訴一位信得過的人，並聯絡當地的危機支援或醫療協助。保羅說的那句話，也是對你說的：你在肉身活著，對我們是要緊的。</p>"]],"con":[],"say":"本講義的立場：1:21--23 一定讀到 1:24--25——這是一段選擇活下去的經文；益處是與基督同在，不是逃離痛苦；生死的主權在神。面對輕生念頭，先陪伴、保護生命、協助尋求專業協助。本講義的全卷立場見 ISS00_3。","care":"會眾席上很可能有人正有輕生的念頭而沒有說出口，也可能有家人死於自殺、多年來一直被「他能不能上天堂」折磨的人。講這一題時，不追問細節，不說「你要有信心」，不說「自殺的人不能上天堂」；明白地告訴會眾可以向誰求助，會後單獨關心。遇到有立即危險的人，不讓他獨處，當天陪他聯絡危機支援、就醫或專業協助。對自殺者的家屬，先陪伴他們的哀傷，把逝者交託在滿有憐憫的神手中，必要時協助尋求哀傷輔導。"},{"id":"ISS01_8","t":"1:23「離世與基督同在」——人死後立刻到主那裡，還是睡了等復活？","r":"1:23；路 23:43；林後 5:8；帖前 4:13--14；3:20--21","ch":[1],"why":"喪禮上最常被問的問題是：「他現在在哪裡？」1:23 是新約描寫信徒死後狀態最直接的經文之一，也是「居間狀態」與「靈魂睡覺說」爭論的焦點。這一題不只是教義，也直接關係到喪親的家屬怎樣得安慰、怎樣說再見。","pos":[["【一】經文問的是甚麼","","<p>「我正在兩難之間，情願離世與基督同在，因為這是好得無比的。」（1:23）<strong>εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι</strong>（eis to analysai kai syn Christō einai）一個冠詞帶兩個不定詞，「離世」和「與基督同在」綁在一起。問題是：信徒一死就與基督同在嗎？那 3:21 說的身體改變、帖前 4 章說的「睡了的人」又怎麼理解？</p>"],["居間狀態說：死後立刻與主同在，等候身體復活","","<p>多數福音派與歷代教會：信徒死後，靈魂立刻與基督同在，有知覺、得安息；身體則等候主再來時復活改變（3:20--21）。耶穌對十字架上的強盜說「今日你要同我在樂園裡了」（路 23:43），保羅也說「更願意離開身體與主同住」（林後 5:8）。</p><p><strong>難處：</strong>新約對這段「居間」的細節說得很少；若講得太滿，容易把身體復活講成可有可無，好像得救只是靈魂上天堂。</p>"],["靈魂睡覺說：死後無知覺，直到復活","","<p>一些宗派（如復臨安息日會）與部分學者：聖經常把信徒的死稱為「睡了」（帖前 4:13--14），人死後沒有知覺，直到主再來時復活；1:23 在保羅的主觀經驗裡，死後的下一刻就是與基督同在，中間的時間感覺不到。</p><p><strong>難處：</strong>「睡了」是新約常見的委婉語，不一定描寫死後的狀態；1:23 的「好得無比」與林後 5:8 的「與主同住」，都像是一種有意識的同在，比「沒有知覺」更積極。</p>"],["即時復活說：死時就領受新的身體","","<p>少數學者根據林後 5:1--4 主張：信徒死時，立刻領受屬天的身體，不需要等候將來的復活。</p><p><strong>難處：</strong>這一說和 3:21、林前 15 章以及帖前 4 章「主必親自從天降臨……那在基督裡死了的人必先復活」的群體、終末的復活不容易協調，也可能削弱了主再來的盼望。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採居間狀態說：信徒死後與基督同在，等候身體復活。</strong>靈魂睡覺說、即時復活說照實陳列（全卷立場見 ISS00_3）。</p><p>同時守住兩件事：1:23 的「好得無比」不是最終的結局，最終的盼望是 3:21 的身體改變；這節經文是給盼望的，不是給禁令的——不用它叫人不要哭。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：在基督裡死了的人沒有被丟棄，他們屬於主，將來必與我們一同復活——「我們或活或死總是主的人」（羅 14:8）。</p><p>如果你正在想念一位在主裡睡了的家人，你可以放心地說：他和基督在一起。你也可以哭，因為還沒有團聚；那一天，我們要一同被改變。</p>"]],"con":[],"say":"本講義的立場：信徒死後與基督同在，等候身體復活（多數福音派讀法；靈魂睡覺說、即時復活說並陳）；1:23 給的是盼望，不是叫人不要哭的禁令。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有剛失去配偶、父母、孩子的人，也可能有家人不信主就過世、不敢問「他在哪裡」的人。不要在喪禮或探訪時展開教義辯論，也不要對家屬說「他去天家了，你不要哭」；對未信主的逝者，不要在家屬面前斷定他的去處。先陪伴、聽他說逝者的故事，把逝者交在滿有憐憫的神手中；哀傷持續影響生活時，協助尋求哀傷輔導。"},{"id":"ISS01_9","t":"1:29「並要為他受苦」——受苦也是恩典嗎？這樣說會不會美化苦難？","r":"1:29--30；徒 5:41；徒 16:37；彼前 4:13；林後 12:9","ch":[1],"why":"1:29 把「為他受苦」放在「蒙恩」底下，這是新約最驚人的一句話之一。可是這一句也最容易被誤用：有人用它叫病人不要治療、叫受虐者留在家裡、叫被霸凌的人忍下來。另一邊，成功神學又說基督徒不該受苦。這一題要說清楚甚麼苦是為基督受的、受苦怎樣是恩典，又不美化苦難。","pos":[["【一】經文問的是甚麼","","<p>「因為你們蒙恩，不但得以信服基督，並要為他受苦。」（1:29）<strong>ἐχαρίσθη</strong>（echaristhē）與 χάρις（charis）同字根，是「白白賜給」；「為他」（ὑπὲρ αὐτοῦ，hyper autou）指明是為基督的緣故。下一節說「你們的爭戰，就與你們在我身上從前所看見、現在所聽見的一樣」（1:30）。問題是：所有的苦都是恩典嗎？神喜歡人受苦嗎？</p>"],["苦難即恩典說：一切苦都是神的祝福，應當甘心接受","","<p>一些敬虔傳統：苦難是神煉淨人的工具，一切病痛、逼迫、不幸都出於神的美意，基督徒應當甘心領受，不求脫離；越能忍受苦難的人越屬靈，門徒「心裡歡喜，因被算是配為這名受辱」（徒 5:41）。</p><p><strong>難處：</strong>1:29 說的是「為他」受的苦，不是一切的苦；保羅自己在腓立比被打以後，也亮出羅馬人的身分，要官長「自己來領我們出去」（徒 16:37）。把一切苦都講成恩典，會叫人放棄治療、留在暴力裡，也把神講成喜歡看人痛的神。</p>"],["成功神學說：基督徒不該受苦，受苦是信心不足","","<p>部分信心運動與成功神學：基督已經擔當了我們的痛苦與貧窮，有信心的人應當健康、富足、凡事順利；受苦是因為沒有認識或宣告自己的權柄。</p><p><strong>難處：</strong>1:29 明明說受苦是「蒙恩」的一部分，寫這句話的保羅正在捆鎖中；新約一再說跟隨基督的人會受苦（提後 3:12；彼前 4:13）。這一說會叫正在受苦的人自責，也和本卷 4:12 保羅「學得」飢餓與缺乏的見證不合（全卷立場見 ISS00_5）。</p>"],["同行說：為基督受的苦，是與基督相交的一部分","","<p>多數解經家：1:29 的恩典不是苦本身，而是「為他」——能和基督站在同一邊、與他的受苦有份，是一份尊榮（3:10）；神不喜歡人痛，卻在痛裡與人同在，「我的能力是在人的軟弱上顯得完全」（林後 12:9）。為信仰受的逼迫要站立得穩，一般的病痛與傷害則可以、也應當尋求醫治與保護。</p><p><strong>難處：</strong>「為基督受苦」與一般的苦難在生活裡不一定分得清楚；牧者需要陪人分辨，而不是替人判斷他的苦是哪一種。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採同行說。</strong>受苦本身不是好東西，神也不喜歡看人痛；為基督的緣故受苦，是與基督同行的一部分，受苦的人沒有被神丟下。成功神學明確不採（全卷立場見 ISS00_5）。</p><p>1:29 不用來美化病痛、不叫人放棄治療、不叫受害者留在危險裡；保守生命、尋求醫治與保護，和為基督受苦不衝突（全卷立場見 ISS00_3）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：基督是受苦的主，跟隨他的人不會在苦難中被遺棄。爭的是苦難的意義怎樣說、怎樣用。</p><p>如果你正在受苦，你不必假裝那是好事，也不必覺得是自己信心不夠。你可以求神挪去，可以就醫、可以求助；同時你也可以知道，在這條路上，有一位先走過，而且正和你一起走。</p>"]],"con":[],"say":"本講義的立場：為基督受的苦是與基督同行的一部分，受苦的人沒有被神丟下；但受苦本身不是好東西，1:29 不用來美化病痛、叫人放棄治療或留在危險裡。成功神學不採。本講義的全卷立場見 ISS00_3、ISS00_5。","care":"會眾席上可能有長期病痛、慢性疼痛的人，有正在家暴或職場霸凌裡的人，也可能有因為信主被家人逼迫、趕出家門的人。不要對他們說「這是神給你的恩典，要甘心忍受」，也不要說「你受苦是因為信心不夠」。先承認他的苦是真的，陪他禱告；涉及身體安全的，協助他找到安全的地方與專業協助；長期病痛的，鼓勵他持續治療，教會實際地陪伴、分擔照顧。"},{"id":"ISS02_1","t":"2:6--11 是保羅寫的，還是引用早期教會的詩歌？","r":"2:6--11；提前 3:16；西 1:15--20","ch":[2],"why":"2:6–11 的句子短、節奏齊、有對稱的上下兩半，和前後的書信文體很不一樣，所以二十世紀以來許多學者稱它為「基督之歌」。如果這是保羅引用的詩歌，表示在保羅寫信之前，教會已經在敬拜中稱耶穌為主；如果是保羅自己寫的，表示他在監裡為一場同工的不和寫出了新約最高的基督論。這一題關係到我們怎樣讀這段經文的權威，也關係到最早的教會怎樣敬拜耶穌。","pos":[["【一】經文問的是甚麼","","<p>保羅說「你們當以基督耶穌的心為心」（2:5），接著是六節排列整齊的句子：前一半主詞是基督，一步一步往下走——「他本有神的形像，不以自己與神同等為強奪的；反倒虛己」（2:6–7）；後一半主詞換成神，一步一步往上抬——「所以，神將他升為至高」（2:9）。問題是：這段文字是保羅當場寫的，還是他引用了腓立比人早已會唱、會背的一首詩歌？兩種答案，都不影響它是聖經。</p>"],["引用說：保羅之前的教會詩歌或信經","","<p>從二十世紀初的德國學者開始，許多人認為 2:6–11 是保羅之前就在教會中流傳的詩歌：句子分成詩節、用詞有好幾個保羅別處沒有用過的字（如 ἁρπαγμός、μορφή 的這種用法），以「所以」為轉折分成上下兩半。若是如此，它見證了在耶穌受死後短短二十多年內，教會已經在敬拜中把只屬耶和華的話歸給耶穌。</p><p><strong>難處：</strong>學者對怎樣分詩節沒有共識，有人分六節、有人分三節；「且死在十字架上」常被說成保羅「加進去」的句子，這種重建很難證實。保羅寫信本來就常有高度修辭的段落，文體特別不一定等於引用。</p>"],["保羅自寫說：保羅用詩的語言寫出自己的基督論","","<p>另一些學者認為這是保羅自己的作品，或至少是他親自寫成、為這封信量身打造的：2:6–11 的用字和前後文緊緊扣在一起——2:3 的「看」（ἡγέομαι）與 2:6 的「以……為」是同一個字，2:8 的「自己卑微」預備了 3:21 的「卑賤的身體」與 4:12 的「處卑賤」，2:7 的「奴僕」回到 1:1 的「僕人」。這麼多線穿過這一段，說明它是為這封信寫的。</p><p><strong>難處：</strong>這一說能解釋前後文的呼應，卻較難解釋為甚麼這段的用詞與節奏與保羅其他書信有明顯差別；也有可能是保羅先在別處教導過、腓立比人早已熟悉的內容，在這裡重新寫出，兩說的界線並不清楚。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義不在作者來源上下定論，稱它為「基督之歌」，並把它當作保羅在這封信裡親自採用、親自負責的話來讀。</strong>無論是保羅寫的，還是他引用了教會的詩歌，只要他放進這封信，就是他要腓立比人「以……為心」的內容；而經文前後那麼多字的呼應，說明它在這封信裡不是裝飾，是全卷的樞紐。</p><p>引用說若成立，給我們的是一份額外的安慰：最早的教會，在一間間家庭裡，已經唱著「耶穌基督為主」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩派都同意：這段經文是新約最早、最高的基督論之一；基督本有神的形像、虛己、順服至死、被神升為至高、萬口承認耶穌基督為主。爭的只是這首歌在寫進信以前有沒有一段歷史。</p><p>對你今天最重要的，不是知道是誰先寫下這幾行，而是讓它成為你的歌——從一位往下走的主，唱到萬膝跪拜。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:6–11 稱為「基督之歌」，作者來源（保羅自寫或引用早期教會詩歌）並陳不下定論；無論哪一說，它都是保羅放進這封信、要腓立比人以之為心的話，也是全卷的樞紐。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有剛接觸聖經研究、聽到「保羅引用了別人的詩」就以為聖經是拼湊出來的人，也可能有覺得這種討論太學術、和生活無關的人。不要在講台上把這一題講成炫耀學問，也不要嘲笑提問的人。對前者，陪他看見引用說反而見證了最早的教會就敬拜耶穌；對後者，帶他直接唱這首歌，讓經文自己說話。"},{"id":"ISS02_2","t":"2:6「不以自己與神同等為強奪的」——ἁρπαγμός 是要去搶的，還是抓住不放的？","r":"2:6；創 3:5","ch":[2],"why":"ἁρπαγμός 在新約只出現這一次，和合本譯「強奪的」。它是指基督「沒有去搶一樣本來沒有的東西」，還是「沒有緊緊抓住一樣本來就有的東西」，還是「沒有把本來就有的拿來為自己謀利」？三種讀法會決定我們怎樣理解基督的神性，也決定 321「驕傲是離開本位抓住權力；謙卑是放下權力回到本位」怎樣落在這一節上。","pos":[["【一】經文問的是甚麼","","<p>「他本有神的形像，不以自己與神同等為強奪的」（2:6）。原文 οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ——「他沒有把與神同等當作 ἁρπαγμός」。ἁρπαγμός 來自「搶奪」的字根。問題是：「與神同等」是基督本來就有的，還是他要去取得的？他不肯做的，是「搶」，是「抓住不放」，還是「拿來利用」？前面一句「本有」（ὑπάρχων，一直是）是理解這一題的關鍵。</p>"],["要去搶的（res rapienda）：基督沒有伸手去搶本來沒有的","","<p>有些學者把 ἁρπαγμός 讀成主動的「搶奪」：基督沒有去奪取與神同等的地位。這一讀常和亞當對照——這使我們想起伊甸園裡蛇的話：「你們便如神能知道善惡」（創 3:5）。亞當伸手要如神，基督卻沒有伸手。</p><p><strong>難處：</strong>若基督「沒有去搶」與神同等，似乎暗示他本來沒有，這與前一句「本有神的形像」的現在分詞（一直是）難以相合；而且腓立比書本身沒有明說亞當，亞當的對照是讀者的觀察，不能當作經文的明文。</p>"],["抓住不放的（res rapta）：基督沒有緊抓本來就有的","","<p>許多教父與現代學者讀成：與神同等是基督本來就有的，但他沒有把它當作一件要緊緊抓住、不肯放手的寶物。這一讀與「本有神的形像」相合，也與後面「反倒虛己」形成對比：不是「不抓」就停了，而是「不抓，反倒倒空」。</p><p><strong>難處：</strong>「抓住不放」容易被聽成基督真的放掉了與神同等的身分，又滑向虛己論（見 ISS02_3）；需要清楚說明：他沒有放掉本質，放下的是緊抓的姿態與權利的使用。</p>"],["拿來利用的（慣用語讀法）：基督沒有把神的身分拿來為自己謀利","","<p>二十世紀後期一些學者根據希臘文慣用語指出：「把某物當作 ἁρπαγμός」常常是「把某物當作可以佔便宜、可以利用的機會」。照這讀法，基督的神性從來沒有被質疑，問題是他怎樣使用它：他沒有把與神同等拿來為自己謀利，反而把它活成倒空與給出。這一讀把重點放在神的本性：真正的神性，原來長得像給出。</p><p><strong>難處：</strong>這一說倚重古典文獻中有限的平行用例，學者對這些例子是否足夠仍有爭論；它和「抓住不放」說其實很接近，只是角度不同。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「抓住不放」與「拿來利用」合併的讀法：與神同等是基督本來就有的，他沒有把它當作要緊抓、可以為自己利用的東西。</strong>理由是緊貼前一句「本有」——他一直是。亞當的對照可以當作「這使我們想起」來講，但不說腓立比書明說了亞當。</p><p>321 說「驕傲是離開本位抓住權力，謙卑是放下權力回到本位」，在這一節最精準；但要先讓經文講完基督，才接上 321（全卷立場見 ISS00_2）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法都同意：基督沒有用伸手、抓取、謀利的方式對待神的地位；他選擇了往下走。爭的是那個「地位」在他手裡的狀態。</p><p>對你今天最重要的是那一個動作：他不抓。你今天抓得最緊、最怕被別人拿走的是甚麼？這一節不是叫你丟掉身分，是讓你知道，一個確知自己是誰的人，可以鬆開手。</p>"]],"con":[],"say":"本講義的立場：與神同等是基督本來就有的（2:6「本有」，一直是），他沒有把它當作要緊抓、為自己利用的東西；亞當的對照當作「這使我們想起」，不說經文明說。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有在家族或職場裡一路「搶」才活下來的人，聽到「不抓」會覺得自己被定罪；也可能有一輩子不敢爭、被人奪走一切的人，聽到「不抓」會以為那是要他繼續被奪。不要用這一節叫受欺負的人放棄自己的權益。對前者，陪他看見在基督裡已經有的，不必再搶；對後者，先肯定他在基督裡的身分與尊嚴，「不抓」是自由的選擇，不是被奪走。"},{"id":"ISS02_3","t":"2:7「虛己」——基督倒空了甚麼？虛己論的爭議？","r":"2:7--8；林後 8:9；約 17:5","ch":[2],"why":"「反倒虛己」原文 ἑαυτὸν ἐκένωσεν，「把自己倒空」。這是全本新約講基督下降最徹底的一句，也是十九世紀以來一場重要神學爭論的中心：基督成為人的時候，是放下了某些神性屬性，還是在神性之外取了人性？這一題直接關係到耶穌是不是完全的神、也是完全的人，也決定我們以他的心為心時，到底要學甚麼。","pos":[["【一】經文問的是甚麼","","<p>「反倒虛己，取了奴僕的形像，成為人的樣式」（2:7）。保羅只說基督「倒空了自己」，沒有說倒空了甚麼；緊接著的分詞「取了」（λαβών）與「成為」（γενόμενος）說明倒空的方式。問題是：ἐκένωσεν 是在說基督失去了某些屬性，還是在說他倒空的方式就是「取了奴僕的形像」？這使我們想起以賽亞書說受苦的僕人「將命傾倒，以致於死」（賽 53:12）。</p>"],["古典讀法：加上人性，不是減去神性","","<p>教父與改教家的主流讀法：倒空的方式就是「取了」——基督在神性之外取了人性，沒有放下神性；加克墩會議（451）稱神人二性「不相混亂、不相交換、不能分開、不能離散」。這一讀緊貼 2:6 的「本有」（一直是），也與「他本來富足，卻為你們成了貧窮」（林後 8:9）相合。他放下的是榮耀的顯現與權利的使用，這使我們想起他的禱告：「就是未有世界以先，我同你所有的榮耀」（約 17:5）。</p><p><strong>難處：</strong>若講得太像公式，容易讓人覺得基督只是「多加了一樣東西」，2:7–8 一路往下、直到十字架的代價就被講輕了。</p>"],["虛己論：基督在地上暫時放下全知、全能、無所不在","","<p>十九世紀德國的托馬修斯等路德宗神學家，與英國的戈爾等人，認為基督成為人時暫時放下了全知、全能、無所不在等「相對的」屬性，只保留聖潔、愛、公義等「道德的」屬性。這派的心志是認真看待耶穌真實的人性：他會餓、會累、會哭，也說過有一個日子「子也不知道」。</p><p><strong>難處：</strong>它與 2:6 的現在分詞「本有」不合——經文沒有說他曾經停止是神；經文自己對「倒空」的解釋是後面的「取了」，不是「放下了某些屬性」。一位暫時不全能的神是否仍是神，虛己論很難回答。</p>"],["自限說：屬性都在，基督自願不獨立使用","","<p>近代一些福音派神學家提出較溫和的讀法：基督的神性屬性一樣都沒有失去，但他在地上自願不獨立使用它們，凡事順服父、倚靠聖靈。這與 2:8「存心順服」很貼近，也接住了福音書裡真實的人性與真實的神蹟，把「虛己」講成一種關係裡的順服，而不是屬性的減少。</p><p><strong>難處：</strong>各家用語不一致，講著講著容易滑回虛己論；「不獨立使用」的界線經文沒有細說——他仍然平靜風浪、赦免人的罪。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採古典讀法：基督虛己是取了奴僕的形像，不是放棄神性。</strong>虛己論陳列，不採用；自限說陳列為溫和讀法，它的觀察可以補充古典讀法，但不取代古典讀法。</p><p>講台的落點不在倒空了甚麼，在為甚麼倒空——為了別人（2:4）；也在誰倒空——ἑαυτὸν，是他自己。本講義的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三家都同意：基督是真神也是真人，他為我們存心順服，以至於死，且死在十字架上；神也將他升為至高。爭的是神性與人性在他身上怎樣同時存在，這是教會兩千年來敬畏地思想、而不能完全說盡的奧祕。</p><p>你不必先把奧祕想通才能敬拜。只要記得：那位倒空自己的，從來沒有停止是神；所以他的倒空，才救得了你。</p>"]],"con":[],"say":"本講義的立場：基督虛己是取了奴僕的形像——加上人性，不是減去神性（採古典讀法；虛己論陳列不採，自限說陳列為溫和讀法）。講台的落點不在倒空了甚麼，在為甚麼倒空。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有在網路上讀到「耶穌只是好人」「耶穌在地上不是神」而動搖的人，也可能有覺得神學爭論太遙遠、只想知道耶穌懂不懂他的人。不要用艱深的名詞把提問的人壓下去。對前者，陪他讀 2:6 與 2:9–11，看見經文怎樣同時說他是神、也真實地成為人；對後者，告訴他：正因為他真的成為人，他懂你的累與眼淚。"},{"id":"ISS02_4","t":"2:7「虛己」與 321「無己」——無己就是不能有自己的需要、感受與界線嗎？","r":"2:3--8；2:27；3:2；徒 16:37","ch":[2],"why":"國度321空中團契常說「無己」，而腓立比書 2:5–8 是無己最清楚的樣子。可是這兩個字很容易被聽錯：有人以為無己就是不可以累、不可以哭、不可以拒絕，有人用「你還有己」「你還沒破碎」叫受委屈的人閉嘴，也有人用它要求同工對領袖無條件順服。這一題是本卷最需要保護人的一題（紅線一）。","pos":[["【一】經文問的是甚麼","","<p>保羅說「你們當以基督耶穌的心為心」（2:5），前一節是「各人不要單顧自己的事，也要顧別人的事」（2:4）。基督「本有神的形像」（2:6）卻「反倒虛己」（2:7），「就自己卑微」（2:8）——兩次 ἑαυτὸν，「他自己」。問題是：以基督的心為心，是要我們沒有自己嗎？無己的人可以有需要、感受與界線嗎？同一章裡保羅說「免得我憂上加憂」（2:27），下一章又說「應當防備」（3:2），這些和無己怎樣同時成立？</p>"],["自我消滅說：無己就是不再有自己的需要、感受與意見","","<p>有些靈修與牧養傳統把無己理解為徹底的自我消滅：個人的感受、需要、意見都是「己」，要被對付、被破碎；真正屬靈的人不累、不抱怨、不拒絕，領袖說甚麼都順服。這一說的心志是嚴肅地對待人心的驕傲，那正是 2:3、2:21 指名的病。</p><p><strong>難處：</strong>它和經文本身衝突：基督虛己時「本有神的形像」，知道自己是誰；虛己是「自己」主動的，被迫的不叫虛己，叫受害；2:4 有一個「也」，沒有叫人不顧自己；保羅自己說出了憂愁、也設了界線。在權力不對等的群體裡，這一說常成為屬靈虐待的工具（回指哥林多後書立場三）。</p>"],["自我實現說：先愛自己、建立健康的自我，才談得上給出","","<p>另一端受現代心理學影響的讀法認為：人要先有健康的自尊與界線，才能真正給出；所以講 2:5–8 時，重點應放在自我價值與自我照顧。這一說提醒教會，憂鬱、自我厭惡、不敢說不，不是謙卑，是需要被醫治的傷。</p><p><strong>難處：</strong>若把自我實現當成目標，就會滑回「別人都求自己的事」（2:21），與 2:3–4 背道而馳；2:5–8 的方向是往下、為了別人。這個提醒是護欄，不是路線：它幫我們分辨甚麼不是無己，但無己的樣子仍要由 2:5–8 來定。</p>"],["身分給出說：知道自己是誰，所以自由地給出","","<p>許多解經家指出，2:6–8 的次序本身就是答案：先是「本有神的形像」（身分），才是「虛己」「卑微」（給出）。基督往下走，不是因為他不知道自己是誰，而是因為他完全知道。寫下這一段的保羅，也曾在腓立比被打、下監之後，對官長說「叫他們自己來領我們出去吧」（徒 16:37）——他知道自己的身分與權利，也知道甚麼時候放下、甚麼時候堅持。</p><p><strong>難處：</strong>「甚麼時候放下、甚麼時候堅持」需要分辨，沒有一條公式；講不清楚的話，會被兩頭各取所需。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採身分給出說。321 的「無己」以 2:5–8 為準：無己不是沒有自己，是不以自己為中心；不是自我消滅，是自我給出。</strong>基督虛己的時候完全知道自己是誰；我們無己，也是因為知道自己在基督裡是誰。無己的人知道自己是誰、自由地給出、仍有分辨（1:9–10）、仍可說出需要（2:27）、仍可設界線（3:2）。</p><p>「舊人有己」被治死的，是以自己為中心的那個舊生命，不是神所造的人格、情感與恩賜。講無己，一定同時講身分（全卷立場見 ISS00_2）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督為我們捨己，我們因著他的愛，也學習為人捨己；爭的是「己」是甚麼、捨己是甚麼樣子。</p><p>如果你曾經被人用「無己」「破碎」壓過——被說你的感受不重要、你說出委屈就是還有己——請重新讀 2:6：那位倒空自己的主，自始至終知道自己是誰，是自己選擇往下走，沒有任何人逼他。無己不是叫你消失，是叫你在基督裡站穩了，才自由地為人彎下腰。</p>"]],"con":[],"say":"本講義的立場：321 的「無己」以 2:5–8 為準——不是沒有自己，是不以自己為中心；不是自我消滅，是自我給出。無己的人知道自己在基督裡是誰、自由地給出、仍有分辨、仍可說出需要、仍可設界線。本講義的全卷立場見 ISS00_2。","care":"會眾席上會有在家裡被打、在職場被欺壓、在教會被屬靈的話控制的人，也會有憂鬱、自我厭惡、從來不敢說不的人。不要對他們說「你要更無己」「你的痛苦是因為還有己」，也不要用「破碎」「順服」要求同工無條件聽從領袖。先講他在基督裡是誰，再講可以為別人放下甚麼；察覺有人正處在被控制或受虐的處境，會後單獨關心，不追問細節，協助他找到安全的地方與可信任的幫助，必要時協助尋求專業協助。"},{"id":"ISS02_5","t":"2:10--11「無不屈膝」「無不口稱」——普救論嗎？","r":"2:9--11；賽 45:23；羅 14:11；西 1:20","ch":[2],"why":"2:10–11 說天上、地上、地底下的「無不屈膝」，萬口「無不口稱『耶穌基督為主』」。有人據此主張最後人人都會得救（普救論）；也有人把這一節拿來恐嚇不信的人。這一題關係到福音的迫切性，也關係到華人信徒心裡最痛的問題：沒有信主就過世的父母、祖父母，到底怎麼了？","pos":[["【一】經文問的是甚麼","","<p>「叫一切在天上的、地上的，和地底下的，因耶穌的名無不屈膝，無不口稱『耶穌基督為主』，使榮耀歸與父神」（2:10–11）。這是化用以賽亞書：「萬膝必向我跪拜；萬口必憑我起誓」（賽 45:23），羅 14:11 明文引用同一節來講審判台。問題是：「無不屈膝」「無不口稱」是所有人都心悅誠服地得救，還是所有受造之物最終都要承認耶穌的主權——包括不情願的？</p>"],["普救論：最終所有人都會與神和好","","<p>從早期教父俄利根開始，歷代有少數神學家主張，神的愛最後會勝過一切抗拒，所有人、甚至墮落的天使，最終都會與神和好。他們引用「無不口稱」，並引用「便藉著他叫萬有……都與自己和好了」（西 1:20）。這一說的心志是認真看待神的愛與基督的得勝。</p><p><strong>難處：</strong>賽 45:23 的上下文是審判與主權——「萬口必憑我起誓」之後是「凡向他發怒的必至蒙羞」（賽 45:24）；羅 14:11 也用同一節講「各人必要將自己的事在神面前說明」。新約多處清楚說到最終的分別，普救論很難與這些經文相合，歷代教會的主流也不採用。</p>"],["普遍承認說：萬口都要承認耶穌的主權，但不等於都得救","","<p>多數福音派學者讀成：在末日，所有受造之物都要承認耶穌是主——有人在敬拜中歡喜承認，有人在審判中不得不承認。「地底下的」包括已死的人與邪靈。這一讀與賽 45:23、羅 14:11 的審判語境相合，也保住了福音的迫切：今天在恩典中屈膝，與那日在審判中屈膝，是不同的。</p><p><strong>難處：</strong>2:11 的 ἐξομολογήσηται（口稱、承認）在七十士譯本常是讚美、稱謝的字，「使榮耀歸與父神」也帶著敬拜的語氣；把一部分人的屈膝讀成被迫，需要從新約其他經文補充，不能只從這一節得出。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採普遍承認說：萬口都要承認耶穌基督為主，但這不是普救的保證；普救論陳列，不採用。</strong>這一段在腓立比書裡的功用是敬拜：往下走到十字架的那一位，就是萬膝要向他跪拜的主——以賽亞書只歸給耶和華的敬拜，保羅歸給了耶穌。</p><p>講台上不用這一節恐嚇人，也不用它保證人人得救；把它講成一首今天就可以一起唱的歌（爭議與信心的全卷立場見 ISS00_9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：耶穌是主，最終的榮耀歸與父神，歷史的終點在基督手中。爭的是那一天每個人承認的方式。</p><p>你不需要先解決所有人最後的去處，才能在今天屈膝。對你最重要的是：你今天願不願意口稱「耶穌基督為主」——不是在那一天被迫承認，而是在今天甘心承認。</p>"]],"con":[],"say":"本講義的立場：2:10–11 化用賽 45:23，是耶穌主權的普遍承認，不是普救的保證（普救論陳列不採）；這一段的功用是敬拜，不是恐嚇。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上一定有父母、祖父母沒有信主就過世的人，這一題一碰就痛。不要在講台上斷言某一位過世的人在哪裡，也不要對正在哀傷的人展開普救論的辯論。陪他把那位家人交在滿有憐憫與公義的神手中，承認有些事我們不知道；也不要用「你家人以後還是要跪」去刺傷還沒信主的家人。"},{"id":"ISS02_6","t":"2:12「恐懼戰兢做成你們得救的工夫」——與「本乎恩」矛盾嗎？","r":"2:12--13；1:6；弗 2:8--10","ch":[2],"why":"保羅在別處說「你們得救是本乎恩，也因著信」（弗 2:8），這裡卻說要「恐懼戰兢做成你們得救的工夫」。有人據此說得救還要靠行為，有人活在會失去救恩的恐懼裡，也有人反過來說「都是神作的，我們等著就好」。這一題關係到每一個基督徒怎樣過每天的日子（紅線五）。","pos":[["【一】經文問的是甚麼","","<p>「就當恐懼戰兢做成你們得救的工夫。因為你們立志行事都是神在你們心裡運行，為要成就他的美意」（2:12–13）。κατεργάζεσθε 是「做到底、活出來」，τὴν ἑαυτῶν σωτηρίαν 的「你們」是複數。問題是：「做成」是做了才得到救恩，還是把已經得到的救恩活出來？「恐懼戰兢」是怕失去救恩，還是別的意思？2:12 與 2:13 原文是同一個句子，怎樣一起讀？</p>"],["行為補足說：救恩要靠持續的順服與行為才能保住或完成","","<p>有些傳統把「做成」讀成：神開始了救恩，人要用行為把它完成；做得不夠，救恩可能失去。「恐懼戰兢」就是怕自己做不夠而被丟棄。這一說的心志是嚴肅看待順服，不讓恩典成為放縱的藉口。</p><p><strong>難處：</strong>它把 2:13 切掉了——「立志行事都是神在你們心裡運行」；也與 1:6「那在你們心裡動了善工的，必成全這工」衝突。κατεργάζομαι 是把已有的做出來，不是把沒有的賺回來；這一說也常叫敏感的信徒活在長期的恐懼裡（回指加拉太書立場二）。</p>"],["被動等待說：既然都是神在運行，人只要等候","","<p>另一端的讀法強調 2:13：既然立志、行事都是神的工作，人就不必努力，只要安靜等候神改變自己；任何用力都是「靠自己」。這一說的心志是要守住恩典的主權，不讓人自誇。</p><p><strong>難處：</strong>它把 2:12 撕掉了——「做成」是命令式；神的運行是為了叫人「立志」也「行事」，不是叫人停下來。2:14 以後保羅還要他們不發怨言、在彎曲的世代裡發光，這些都是要去做的。</p>"],["恩典運行說：神在裡面運行，所以人可以放膽活出來","","<p>多數解經家讀成：2:12 的「做成」與 2:13 的「運行」是同一件事的兩面——神在裡面做工，人在外面活出來；人不是為了得救而做，是因為神在裡面做，所以能做。「恐懼戰兢」在舊約常是人面對神的作為時的敬畏與認真（「又當存戰兢而快樂」，詩 2:11），不是怕被丟棄。複數的「你們」也說明這是一群人一起活出救恩——在第 2 章的上下文，就是不結黨、看別人比自己強。</p><p><strong>難處：</strong>神的運行與人的責任怎樣同時成立，在神學上仍是奧祕；改革宗與衛斯理宗對成聖的過程與程度有不同說法（見 ISS00_4）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採恩典運行說：得救本乎恩，「做成得救的工夫」是恩典的果效，不是條件；2:12 與 2:13 一定一起讀。</strong>「恐懼戰兢」是敬畏與認真，是怕辜負這麼大的愛，不是怕失去救恩；也不講成被動等待。</p><p>本講義的全卷立場見 ISS00_4；恩典與行為回指加拉太書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：救恩的根源是神的恩典，信徒蒙召要過聖潔的生活。爭的是兩者之間怎樣接起來。</p><p>如果你常常怕自己做不夠、怕神把你丟掉，請把 2:13 和 1:6 一起讀：連你心裡「想要」的那一點，都是他放進去的，他必成全。所以你可以放膽去做，而不是戰戰兢兢地等著被判出局。</p>"]],"con":[],"say":"本講義的立場：得救本乎恩，「做成得救的工夫」是恩典的果效，不是條件；2:12 與 2:13 一起讀，恐懼戰兢是敬畏與認真，不是怕失去救恩，也不是被動等待。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有從小在「做不好就會下地獄」的教導裡長大、一犯錯就懷疑自己有沒有得救的人，也可能有強迫性地反覆認罪、無法安息的人。不要用「恐懼戰兢」加重他的恐懼，也不要輕描淡寫地說「別想太多」。陪他讀 1:6 與 2:13，讓他知道救恩的手在神那一邊；若他的恐懼已經影響睡眠與生活，協助他尋求專業協助。"},{"id":"ISS02_7","t":"2:14「都不要發怨言，起爭論」——基督徒不可以申訴、不可以舉報不公嗎？","r":"2:14--16；出 16:8；申 32:5；4:2--3","ch":[2],"why":"「凡所行的，都不要發怨言，起爭論」常在教會裡被拿來叫人閉嘴：對帳目有疑問、對領袖的作法有意見、看見同工被欺負，一說出來就被說成「發怨言」「破壞合一」。這一題關係到教會能不能保護受傷的人，也關係到合一是真的，還是表面的（紅線八）。","pos":[["【一】經文問的是甚麼","","<p>「凡所行的，都不要發怨言，起爭論，使你們無可指摘，誠實無偽，在這彎曲悖謬的世代作神無瑕疵的兒女」（2:14–15）。γογγυσμός 是嘀咕、私下的抱怨，七十士譯本用它描寫曠野的以色列人；「彎曲悖謬的世代」化用申 32:5。問題是：保羅禁止的是所有的不滿與異議，還是一種特定的怨言？基督徒可以申訴、可以舉報不公嗎？</p>"],["全面禁止說：基督徒對教會與領袖不應有任何抱怨或公開異議","","<p>有些教會把這一節讀成全面的禁令：凡對教會、領袖或決定表示不滿，都屬於「發怨言」；屬靈的人應當默默忍受、只在禱告裡交託，不公開提出。這一說的心志是保護教會的見證與合一，不讓嘀咕與分黨蔓延。</p><p><strong>難處：</strong>它忽略了曠野的背景——「你們的怨言不是向我們發的，乃是向耶和華發的」（出 16:8），曠野的怨言是對神的不信；也忽略了保羅自己的作法：他在安提阿當面抵擋彼得（加 2:11），在腓立比要求官長親自來領他出監（徒 16:37）。全面禁止會讓受害者噤聲、讓錯誤被掩蓋。</p>"],["曠野不信說：禁止的是對神的不信與背後的嘀咕，不是對不公的申訴","","<p>多數解經家讀成：2:14 的怨言是曠野式的——不信那位分開紅海的神會供應，在背後嘀咕、在群體裡散播不滿；「起爭論」（διαλογισμός）是心裡的爭辯與懷疑。這不同於把一個具體的不公、傷害或錯誤，帶到該處理的地方，按程序提出。保羅在 4:2–3 示範了處理衝突的方式：一人一個「我勸」，不偏袒，又請第三個人「幫助這兩個女人」。</p><p><strong>難處：</strong>「嘀咕」與「申訴」的界線在現實中不一定清楚；有人會把私下散播的不滿包裝成「申訴」，教會需要分辨，也需要清楚的程序。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採曠野不信說：2:14 禁止的是對神的不信與背後的嘀咕，不是對不公的申訴；合一不是壓制申訴、掩蓋問題、要求表面和諧。</strong>看見同工被欺負、帳目不清、有人受傷，把它說出來、帶到該處理的地方，不是發怨言，是愛。</p><p>教會應當有清楚、安全的申訴與舉報管道；涉及違法或人身安全的事，應依法通報，不以「家醜不外揚」為由壓下（書信的處境與原則見全卷立場 ISS00_1）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩派都同意：基督徒不應在背後散播不滿、分裂教會；也都同意神是公義的，看重被欺壓的人。爭的是界線畫在哪裡。</p><p>如果你曾經因為說出不公而被說成「發怨言」，請你知道：曠野裡被責備的，是不信神的人，不是說出真話的人。你可以帶著不嘀咕的心，把真話說到該說的地方。</p>"]],"con":[],"say":"本講義的立場：2:14 的怨言是曠野式的不信與背後的嘀咕，不是對不公的申訴；合一是把問題帶進主裡處理（4:2–3），不是要求表面和諧。書信的處境與原則，本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有曾經舉報教會裡的不當行為、反而被孤立、被說成破壞合一的人，也可能有正在被傷害、卻怕一開口就被說成發怨言的人。不要在講台上用這一節替任何一位領袖擋下質疑。先相信他、聽他說完，不追問細節；涉及性暴力、家庭傷害或其他違法的事，協助他找到安全的地方與正式的管道，必要時協助尋求專業協助，並在會後單獨關心。"},{"id":"ISS02_8","t":"2:17「我若被澆奠在其上」——保羅預知自己要殉道嗎？","r":"2:17--18；1:24--25；提後 4:6","ch":[2],"why":"「澆奠」是獻祭時倒在祭物上的酒，提後 4:6 保羅臨終前也用同一個字說「我現在被澆奠」。腓立比書這一句，是保羅預知自己要殉道，還是在說他目前的服事與受苦？這一題關係到我們怎樣讀保羅面對生死的態度，也關係到講台會不會把為主而死講得很浪漫（紅線二）。","pos":[["【一】經文問的是甚麼","","<p>「我以你們的信心為供獻的祭物，我若被澆奠在其上，也是喜樂，並且與你們眾人一同喜樂」（2:17）。σπένδομαι 是現在時態，「我正被澆奠」或「我若被澆奠」；前面有條件的「若」。後來提後 4:6 說「我現在被澆奠，我離世的時候到了」。問題是：腓 2:17 的澆奠是指將來的殉道，還是指保羅現在在監裡為他們的擺上？</p>"],["殉道預言說：保羅預見自己將要為主流血","","<p>有些學者認為，保羅在羅馬等候判決，知道自己可能被處死；「澆奠」在提後 4:6 明確指殉道，這裡也應該讀成他預備好為腓立比人的信心流血。這一說看重保羅真實的處境——他不知道判決會是生是死（2:23）。</p><p><strong>難處：</strong>2:17 用的是「若」，是假設不是預言；同一章他說「我靠著主自信我也必快去」（2:24），第 1 章也說「我既然這樣深信，就知道仍要住在世間」（1:25）。把它讀成預言，與他自己的盼望不合；講成殉道的嚮往，也容易浪漫化死亡。</p>"],["現時擺上說：澆奠是保羅目前在捆鎖中的擺上","","<p>另一些學者注意到現在時態，讀成：保羅此刻在監裡的受苦與服事，就是倒在腓立比人信心祭物上的酒；主祭是他們的信心，他自己只是配角。這一讀與 2:3「看別人比自己強」相合，也與緊接的喜樂相合——被倒出去的人不覺得虧，因為祭物蒙悅納。</p><p><strong>難處：</strong>「若」字通常帶出一個尚未發生的可能，完全排除死亡的含意，也不容易；提後 4:6 的平行用法也提醒我們，保羅心裡確實想過那一天。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義讀成：保羅在現時的擺上中，也坦然面對可能的死亡，但他不是預言自己殉道，更不是嚮往死亡。</strong>「若」字保留了生死的主權在神手中；同一封信的結論是「然而，我在肉身活著，為你們更是要緊的」（1:24）——這是一段選擇活下去的經文。</p><p>不怕把自己用上，不等於想死；本講義的全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩派都同意：保羅願意為福音擺上一切，而且在其中有喜樂；他的生死在神手中。爭的只是這一句的時間指向。</p><p>你不必為了證明愛主而嚮往受苦或死亡。保羅最後一句是邀請：「你們也要照樣喜樂，並且與我一同喜樂」（2:18）——在同一個祭壇上的人，一起歡喜。</p>"]],"con":[],"say":"本講義的立場：2:17 是保羅在現時擺上中坦然面對可能的死亡，不是殉道的預言，也不是嚮往死亡；「若」字把生死的主權留在神手中。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有正在長期病痛、長期無望感中，心裡偶爾閃過「早點走也好」的人，聽到「被澆奠也是喜樂」可能被誤導；也可能有失去在宣教工場殉職親人的家屬。不要把為主而死講成浪漫的事，也不要對正在流淚的人說「你要有信心」。察覺有人有輕生念頭，先陪伴、保護生命，協助他尋求專業協助；對喪親的家屬，不追問細節，會後單獨關心。"},{"id":"ISS02_9","t":"2:27「神憐恤他」——保羅為甚麼沒有醫治以巴弗提？神蹟醫治與醫療？","r":"2:25--30；徒 19:11--12；提前 5:23；提後 4:20","ch":[2],"why":"使徒行傳記載，神藉保羅的手行了非常的奇事，甚至手巾、圍裙放在病人身上，病就退了；可是保羅的同工以巴弗提病得幾乎要死，經文只說「神憐恤他」。這一題關係到今天的神蹟醫治、信心與醫療，也關係到每一位正在病床上、或守在病床旁、禱告了卻還沒有好的人（紅線三）。","pos":[["【一】經文問的是甚麼","","<p>「他實在是病了，幾乎要死；然而神憐恤他，不但憐恤他，也憐恤我，免得我憂上加憂」（2:27）。保羅沒有說他用神蹟醫好了以巴弗提，也沒有說以巴弗提信心不夠；他說「神憐恤他」。保羅也曾叫提摩太「可以稍微用點酒」（提前 5:23），把病了的特羅非摩留在米利都（提後 4:20）。問題是：神蹟醫治今天還有嗎？禱告與醫療是甚麼關係？</p>"],["神蹟止息說：使徒時代的醫治恩賜已經停止","","<p>有些傳統認為，使徒時代的神蹟醫治恩賜是為了印證福音的開始，隨著使徒時代結束而停止；以巴弗提、提摩太、特羅非摩的例子顯示，連保羅也不是隨時可以醫治人。今天神仍然垂聽禱告、施行醫治，但主要藉著一般的護理與醫療。</p><p><strong>難處：</strong>新約沒有明說醫治恩賜會在甚麼時候停止，雅 5:14 仍吩咐教會為病人禱告、用油抹他；這一說若講得太硬，容易讓人不敢為醫治禱告，也低估了神今天仍然行奇事的可能。</p>"],["信心醫治說：只要信心足夠，神必定醫治","","<p>部分信心運動認為，醫治是救恩的一部分，信徒只要有足夠的信心、正確地宣告，就一定得醫治；沒有好，往往是信心不足或有隱藏的罪。這一說的心志是相信神真的願意、也真的能夠醫治。</p><p><strong>難處：</strong>它無法解釋以巴弗提、提摩太、特羅非摩，也無法解釋保羅身上那根三次求主挪去、主卻說「我的恩典夠你用的」（林後 12:9）的刺。這一說常讓病人在病痛之上再背一層「信心不足」的罪疚，甚至延誤或拒絕就醫。</p>"],["主權憐恤說：醫治的主權在神，神蹟與醫療都是他的憐恤","","<p>多數福音派讀成：神今天仍可以、也確實會行神蹟醫治，教會應當為病人禱告；但醫治的主權在神，不在使徒或信徒的手；神可以用神蹟，也可以用時間、休養、醫藥與照顧。以巴弗提得好，經文歸給「神憐恤他」，保羅接著做的，是送他回家休養。就醫、吃藥、諮商與禱告不衝突，好撒馬利亞人「用油和酒倒在他的傷處」（路 10:34），正是當時的醫療。</p><p><strong>難處：</strong>這一說無法回答「為甚麼神醫治了這一位，沒有醫治那一位」；它承認奧祕，對正在等候的人，有時比一個明確的答案更難承受。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採主權憐恤說：神今天仍可以行神蹟醫治，教會要為病人禱告；但醫治的主權在神，就醫、吃藥、諮商與禱告不衝突。</strong>不把病沒有好講成信心不足；保羅自己會憂，也坦白說「免得我憂上加憂」（2:27）——情緒不是罪，喜樂可以和眼淚同在。</p><p>焦慮症、憂鬱症是需要治療的病；本講義的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：神是醫治的神，也是在病痛中與人同在的神；教會要為病人禱告，也要照顧病人。爭的是神今天通常用甚麼方式。</p><p>如果你禱告了很久，病還沒有好，請你知道：以巴弗提病到幾乎要死，保羅也沒有說他信心不夠。神的憐恤不只在病床上，也在床邊——「不但憐恤他，也憐恤我」。你的等候，神也算在他的憐恤裡。</p>"]],"con":[],"say":"本講義的立場：醫治的主權在神——神今天仍可以行神蹟，教會要為病人禱告；就醫、吃藥、諮商與禱告不衝突，病沒有好不等於信心不足。本講義的全卷立場見 ISS00_5。","care":"會眾席上一定有長期病痛、慢性病、身心障礙、正在接受治療的人，也有守在病床旁多年的家人，和為孩子、配偶禱告了卻沒有得醫治而失去他們的人。不要對他們說「你要有信心」「是不是有罪沒有認」，也不要勸人停藥、拒絕就醫。先陪伴、不追問，為他禱告，也具體幫忙——送餐、陪診、讓照顧者喘口氣；面對長期無望感或憂鬱，協助他尋求專業協助，並在會後單獨關心。"},{"id":"ISS03_1","t":"3:1--2 語氣急轉——腓立比書是一封信，還是幾封信合編？","r":"3:1--2；4:10--20","ch":[3],"why":"讀到 3:1「弟兄們，我還有話說，你們要靠主喜樂」，下一節卻是「應當防備犬類」，很多人會嚇一跳：怎麼才說完喜樂，就翻臉了？學者因此提出兩信說、三信說。這一題看起來是書房裡的問題，其實關係到講台怎樣讀第三章的嚴厲：它是另一封信的碎片，還是同一顆心的另一面？","pos":[["【一】經文問的是甚麼","","<p>3:1 的 <strong>Τὸ λοιπόν</strong>（To loipon）可以譯作「最後」，好像信要收尾了；和合本譯作「我還有話說」。接著 3:2 一連三個 Βλέπετε（Blepete）「應當防備」，語氣急轉直下。再加上 4:10--20 的謝函放在信末，有人覺得「收了禮物這麼久才道謝」不合常理。問題是：這些現象是幾封信被編在一起的痕跡，還是一封信本來的起伏？</p>"],["合編說（兩信說／三信說）","","<p>兩信說認為第 1--2 章加第 4 章是一封，3:2--4:3 是另一封論戰信；三信說再把 4:10--20 的謝函單獨分出，認為那是以巴弗提剛到時保羅最先寫的短箋。支持者也引第二世紀坡旅甲寫給腓立比人的信，提到保羅給他們寫過「書信」（複數）。</p><p><strong>難處：</strong>沒有任何一份抄本支持分割，現存抄本都是今天這一封信的樣子；坡旅甲的複數可以泛指保羅的書信，不能證明腓立比書被切開過；而且合編說要解釋：編者為甚麼偏偏把接縫做得這麼明顯？</p>"],["一封信說（字彙與主題首尾呼應）","","<p>認為全卷是一封信：φρονέω（存心）、χαρά（喜樂）、κοινωνία（交通）、συν-（同……）這幾條線從第 1 章穿到第 4 章；2:6--11 基督之歌與 3:20--21 用了同一組字——形像、樣子、卑微、榮耀、萬有歸服。Τὸ λοιπόν 在保羅書信裡常是「此外、還有」，不一定是收尾。至於謝函放在最後，可能正是保羅把最親密的話留到最後說。</p><p><strong>難處：</strong>這個說法必須承認 3:1--2 的轉折確實很急，不能說它很順；口述書信、寫作中斷、聽到新消息，都是推測，經文沒有明說。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義照一封信讀。</strong>抄本的證據與全卷的字彙呼應比語氣的轉折更有分量；而且 3:20--21 把第 2 章的基督之歌唱回來，這不像是兩封互不相干的信偶然併在一起。</p><p>講台的讀法只要一句：<strong>保羅說到喜樂，就想起會偷走喜樂的人。</strong>3:2 的嚴厲，是為了保護 3:1 的喜樂。一位父親在信裡寫「孩子，要快樂」，下一句寫「千萬小心那個騙子」，沒有人會說這是兩封信。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論學者怎樣看這封信的成書過程，正典裡的腓立比書就是今天這個樣子，教會兩千年來都這樣領受它。你可以照著它讀、照著它活：在喜樂裡防備，在防備裡仍然喜樂。這個判斷不影響任何一節的解經。</p>"]],"con":[],"say":"本講義的立場：腓立比書照一封信讀——沒有抄本支持分割，全卷字彙首尾呼應；講台只說一句：3:2 的嚴厲，是為了保護 3:1 的喜樂。本講義的全卷立場見 ISS00_6。","care":"會眾裡有人第一次在查經班聽到「合編說」，會以為「原來聖經是拼湊起來的」，信心被動搖；也有人覺得這種題目太學術，不想聽。牧者不必在講台上展開辯論，一句帶過、指向議題頁即可；會後若有人追問，先肯定他願意認真讀經，再陪他看抄本與字彙的證據。不要說「問這種問題就是不信」，也不要讓學者的假設聽起來像定論。"},{"id":"ISS03_2","t":"3:2「犬類」「妄自行割的」——保羅在罵猶太人嗎？","r":"3:2--3；3:5；3:18；加5:2--12","ch":[3],"why":"「犬類」是很重的字。教會歷史上，有人拿新約裡對猶太教的嚴厲話語來羞辱、排斥、甚至逼迫猶太人；今天也有人拿這一節去罵別的宗派、別的宗教，或任何跟自己意見不同的人。這一題關乎我們怎樣讀新約裡的嚴厲話語，而不讓它變成仇恨的藉口。","pos":[["【一】經文問的是甚麼","","<p>「應當防備犬類，防備作惡的，防備妄自行割的。」（3:2）<strong>κύνας</strong>（kynas）「犬類」在猶太人口中常用來指外邦人；<strong>κατατομήν</strong>（katatomēn）「妄自行割的」是和 περιτομή（peritomē）「割禮」作的文字遊戲——割禮被講成了割傷。緊接著保羅說：「因為真受割禮的，乃是我們這以神的靈敬拜、在基督耶穌裡誇口、不靠著肉體的。」（3:3）問題是：保羅防備的是誰？是一個民族，還是一種教導？</p>"],["反猶讀法（教會史上的誤用）","","<p>這種讀法把「犬類」「妄自行割的」直接套在猶太人身上，認為保羅在這裡否定了猶太民族，教會從此取代以色列，猶太人成了「福音的仇敵」。中世紀以來，這類讀法被用來合理化對猶太人的羞辱與迫害。</p><p><strong>難處：</strong>這個讀法與經文本身衝突：兩節以後，保羅說自己是「希伯來人所生的希伯來人」（3:5）；他在羅馬書說他為同胞「大有憂愁，心裡時常傷痛」。保羅攻擊的不是割禮本身——他自己第八天受割禮——而是把割禮當作得救的條件。把一節針對教導的話變成針對民族的話，是教會必須悔改的罪。</p>"],["猶太基督徒教師說（與加拉太書同一場仗）","","<p>認為 3:2 指的是一批自稱信耶穌、卻要外邦信徒先受割禮、守律法才能得救的教師，和加拉太書的情況相同：「我保羅告訴你們，若受割禮，基督就與你們無益了。」（加 5:2）保羅把他們平常罵外邦人的「犬類」反過來用：真正不潔的，是在基督以外另加條件的教導。</p><p><strong>難處：</strong>腓立比書沒有像加拉太書那樣說這些人已經進到教會裡，3:2 也可能是預防性的警告；我們無法確定他們的身分，只能從 3:3--9 的內容推知他們的主張。</p>"],["猶太教宣教者說（會堂的勸人入教）","","<p>認為 3:2 指的不是基督徒，而是勸外邦人歸入猶太教、受割禮的猶太宣教者；腓立比是羅馬殖民城，猶太人很少（徒 16:13 只有河邊的禱告處），外邦信徒若想得著「真正的」身分，可能被這樣的聲音吸引。</p><p><strong>難處：</strong>即使照這個讀法，保羅防備的仍是「要受割禮才算屬神的人」這個主張，不是猶太人這個民族；而且 3:18 的「十字架的仇敵」與 3:2 是否同一批人，學者也有不同看法，不能一併套上。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：3:2 針對的是「要外邦信徒受割禮才能得救」的教導，不是一個民族，也不是所有跟我們意見不同的人。</strong>這批人較可能是與加拉太書相同的猶太基督徒教師，但不論身分，保羅防備的都是同一件事：在基督的義以外，另加得救的條件。</p><p>證據就在同一章：寫這句話的人以自己的出身為榮過（3:5）；說到敵人時是「流淚地」說（3:18）；對看法不同的弟兄則說「神也必以此指示你們」（3:15）。福音的核心一步不讓，其餘的事可以寬容——這是保羅的分寸，也是講台的分寸。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而應該讓你更清楚福音。保羅的嚴厲不是出於民族的仇恨，而是因為有人要把恩典改成條件。如果你曾經聽人用這一節罵別人、甚至罵你，請知道：那不是保羅的意思，更不是基督的心。</p>"]],"con":[],"say":"本講義的立場：3:2「犬類」針對的是要外邦信徒受割禮才能得救的教導，不是罵猶太人，也不是罵所有跟我們意見不同的人；保羅自己是希伯來人所生的希伯來人，說到敵人是流淚地說。回指加拉太書立場四；割禮與因信稱義見加拉太書立場二。","care":"會眾席上可能有猶太背景的弟兄姊妹、有猶太朋友的人，也可能有曾經被別的教會叫作「不屬靈」「異端」「狗」的人。講台上不要用這一節影射任何宗派、族群或個人，也不要開「犬類」的玩笑。若有人因為被這樣罵過而受傷，會後單獨關心，先聽他說，承認那是錯誤的使用；不要急著替罵人的一方辯護。"},{"id":"ISS03_3","t":"3:6「就律法上的義說，我是無可指摘的」——保羅信主前良心不安嗎？","r":"3:4--6；羅7:7--25；加1:13--14；林前15:9","ch":[3],"why":"許多華人信徒的得救見證，都有一段「我很痛苦、良心不安、找不到出路，後來遇見了主」。於是有人以為保羅也是這樣：他守不住律法，良心痛苦，才轉向基督。可是 3:6 他說自己「無可指摘」。這一題關乎福音是只給失敗者的，還是也臨到那些自以為站得住的人；也關乎我們怎樣讀保羅的「因信稱義」。","pos":[["【一】經文問的是甚麼","","<p>保羅列出七項資歷，最後一項是「就律法上的義說，我是無可指摘的」（3:6）。<strong>ἄμεμπτος</strong>（amemptos）與 2:15 盼望腓立比人「無可指摘」是同一個字，說的是人眼前的守法紀錄。可是羅馬書第七章又有「我真是苦啊！」的呼喊。問題是：保羅信主以前，是一個良心痛苦的人，還是一個自信滿滿的人？他歸向基督，是因為罪疚，還是因為別的？</p>"],["傳統觀點（路德以來的內省讀法）","","<p>認為保羅信主前和路德一樣，努力守律法卻越守越絕望，良心不得平安；羅 7:7--25 就是他的自傳，因信稱義的好消息正是對這份罪疚的回答。3:6 的「無可指摘」只是外人看他，他自己心裡知道守不住。</p><p><strong>難處：</strong>3:6 是保羅自己的評估，不是別人對他的看法；加 1:14 也說他在猶太教裡「比我本國許多同歲的人更有長進」，看不出他曾經絕望。羅馬書第七章是不是保羅信主前的自傳，學者本身就有很大的爭議。把路德的掙扎套在保羅身上，可能是一種時代錯置。</p>"],["新觀點（Stendahl、Sanders、Dunn、Wright 等）","","<p>認為第一世紀的猶太教不是「靠行為賺得救恩」的宗教，而是在恩約裡守律法；保羅信主前沒有良心不安，他是在大馬士革路上看見復活的基督，才回頭發現自己的「義」原來站錯了地方。問題不是罪疚的心靈，而是「誰是神的子民」——是割禮的界線，還是在基督裡。</p><p><strong>難處：</strong>這個觀點幫助我們讀懂保羅的處境，但若推得太遠，容易把「因信稱義」只講成族群界線的問題，淡化了 3:9「自己的義」與「神而來的義」的對比；3:9 談的正是一個人在神面前憑甚麼站立。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：3:6 顯示保羅信主前不是一個絕望的失敗者，而是在人眼前無可指摘、在宗教上最成功的人；他是被基督攔住，才看見自己的義站錯了地方。</strong>新觀點提醒我們讀準處境，傳統觀點守住了 3:9 的核心：義不是自己的，是從神來的。兩者都有亮光，本講義的因信稱義立場回指加拉太書立場二。</p><p>這一節的牧養意義很大：福音不只是給失敗者的拐杖，也是給成功者的鏡子。一個人不必先跌到谷底、先覺得很痛苦，才能信主；一個看起來甚麼都好的人，同樣需要被基督找著。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的得救見證不必像別人一樣戲劇化。有人是在痛苦裡遇見主，有人是在一切順利時被主攔住；重要的不是你從哪裡來，而是你現在在誰裡面被找著。學者的爭論，不改變 3:9 那個簡單的事實。</p>"]],"con":[],"say":"本講義的立場：3:6 顯示保羅信主前是在人眼前無可指摘、宗教上最成功的人，不是良心絕望的失敗者；他是被基督攔住，才看見自己的義站錯了地方。新觀點與傳統觀點並陳；因信稱義回指加拉太書立場二。","care":"會眾席上有兩種人會被這一題碰到：一種是從小在教會長大、見證「不夠精彩」、懷疑自己是不是真的得救的人；另一種是事業成功、覺得福音是給失敗者的人。講台上不要把某一種信主經歷講成標準，也不要拿戲劇化的見證壓人。會後陪伴時，先聽他怎樣遇見主，肯定神在每個人身上的作法不同。"},{"id":"ISS03_4","t":"3:8「看作糞土」——基督徒要看輕學歷、事業、家庭嗎？","r":"3:7--8；4:8；提前5:8","ch":[3],"why":"華人父母很看重孩子的學歷，很多信徒在職場很拼；講台上一句「保羅都把這些看作糞土」，有人聽了覺得被定罪，有人卻拿它當作逃避讀書、工作或家庭責任的屬靈理由。這一題關乎我們怎樣讀保羅這個最粗的字，既不讓好東西搶了基督的位置，也不輕看神所賜的好東西。","pos":[["【一】經文問的是甚麼","","<p>「我為他已經丟棄萬事，看作糞土，為要得著基督」（3:8）。<strong>σκύβαλα</strong>（skybala）是希臘文裡很粗的字，可以指丟給狗的殘渣，也可以指糞便。保羅說的「萬事」，上文是 3:5--6 他的出身、學歷、宗教資歷。問題是：基督徒要把學歷、事業、家庭都看成糞土嗎？「丟棄萬事」是要人真的放下一切，還是另有所指？</p>"],["出世說（真正屬靈的人要放下一切）","","<p>認為保羅在這裡立下了屬靈的榜樣：真正愛主的人，要把世上的成就、學位、職位甚至家庭都放下，全時間服事主才是「丟棄萬事」；教會史上也有不少人照這樣進入修道生活或放下一切去宣教。</p><p><strong>難處：</strong>這個說法忽略了上下文：保羅丟棄的，是他「靠」的東西，是 3:9 那個「自己的義」；同一封信 4:8 叫人思念可敬的、公義的、可愛的事，保羅自己也沒有丟掉他的學問，照樣引用、辯論、寫信。保羅在別處還說，人若不看顧自己的家，就是背了真道。把比較講成輕看，會傷害家庭，也讓人用屬靈的理由逃避責任。</p>"],["內心態度說（心裡看輕就好，生活照舊）","","<p>認為「看作糞土」只是心態上的調整：只要心裡知道基督最重要，學歷、事業、家庭照樣追求，生活不必有任何外在的改變。</p><p><strong>難處：</strong>這個說法保護了生活的責任，卻容易把經文變得太輕：保羅不只是換了一種想法，他「已經丟棄萬事」，ἐζημιώθην（ezēmiōthēn）是真實的損失——他失去了地位、同伴與前途。若心態的改變從來不需要付代價，這個「看作」就可能只是一句漂亮話。</p>"],["比較說（與基督放上同一個天平時）","","<p>認為 σκύβαλα 是一個比較：這些東西本身是好的，割禮與律法都是神所賜；但當它們與「認識我主基督耶穌為至寶」放上同一個天平，要搶基督的位置、成為人誇口與倚靠的對象時，就是糞土。所以基督徒可以讀書、工作、愛家，只是不靠它們在神面前站立；當它們與跟隨基督衝突時，願意付代價放下。</p><p><strong>難處：</strong>甚麼時候算是「搶了基督的位置」，需要每個人在神面前誠實地分辨，沒有一條公式；這個說法也需要教會提供陪伴，而不只是一句提醒。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採比較說。</strong>「看作糞土」不是叫人看輕神所賜的學歷、工作與家庭，而是說它們一旦與基督放上同一個天平，就輕得像糞土；它們不可以成為我們在神面前站立的根據。這也是全卷立場二所說的：無己不是沒有自己，是不以自己為中心。</p><p>講台的落點：一張文憑放在書架上是恩典，放在寶座上就是糞土。基督徒照樣努力讀書、用心工作、好好愛家，只是在神面前，不再拿它們當作自己的義。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌，也不該讓你輕看自己的努力。你不必辭職才算愛主，也不必輕看孩子的學業才算屬靈。你只要誠實地問：如果這些明天都不見了，我在神面前還站得住嗎？能說「站得住，因為我在基督裡」的人，就已經懂了 3:8。</p>"]],"con":[],"say":"本講義的立場：「看作糞土」是一個比較——好東西與基督放上同一個天平、要搶基督的位置時，才是糞土；不是叫人看輕學歷、工作與家庭，也不是逃避責任的理由。無己的全卷立場見 ISS00_2。","care":"會眾席上可能有為了「服事」而冷落家庭、事後很後悔的人；有被父母逼著讀書、聽到這一節覺得被釋放或被定罪的年輕人；也有剛失去工作、事業垮掉的人。不要對失業或失去的人說「反正是糞土」，那是輕看他的失落。會後陪伴時，先承認失去是真的痛，再陪他看：在基督裡，他仍然站得住。"},{"id":"ISS03_5","t":"3:9「信基督的義」——是我們對基督的信，還是基督的信實？","r":"3:9；2:8；加2:16；羅3:22","ch":[3],"why":"πίστις Χριστοῦ 是近代新約研究最熱的語法爭議之一，加拉太書、羅馬書、腓立比書都有。一般信徒在讀書會、網路講座裡聽到「其實是基督的信實」，常會不安：是不是和合本譯錯了？我的信還算數嗎？這一題要把兩讀說清楚，也要讓人看見：兩讀都把焦點從我身上移到基督身上。","pos":[["【一】經文問的是甚麼","","<p>「不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義」（3:9）。原文 <strong>διὰ πίστεως Χριστοῦ</strong>（dia pisteōs Christou）直譯是「藉著基督的 πίστις」。πίστις 可以是「信心」，也可以是「信實」；屬格 Χριστοῦ 可以是「對基督的」，也可以是「基督自己的」。問題是：保羅說的是我們對基督的信，還是基督順服到死的信實？</p>"],["受格屬格（我們對基督的信）","","<p>和合本與多數中英譯本採這個讀法，改教家也這樣讀：義是藉著我們信基督而得的。同一節的後半「因信神而來的義」，ἐπὶ τῇ πίστει（epi tē pistei）明顯說的是人的信，前後呼應；保羅在別處也常把「信」與「律法的行為」對比，說的都是人怎樣領受義。</p><p><strong>難處：</strong>這樣讀，3:9 同一節裡會出現兩次「我們的信」，顯得有點重複；而且這個讀法若講不好，容易讓人把「信」當成另一種自己的功勞——好像我信得夠多，就換得到義。</p>"],["主格屬格（基督的信實）","","<p>近代部分學者（Hays 等）主張這是「基督的信實」：基督自己對父神的忠信、順服到死。在腓立比書裡它有一個很美的呼應：2:8 基督「存心順服，以至於死」，正是基督信實的樣子。照這個讀法，3:9 前半說基督（他的信實），後半說我們（我們的信），並不重複：義的根據是他的順服，領受的方式是我們的信。</p><p><strong>難處：</strong>希臘文的「信」與屬格名詞連用，在保羅書信裡多數明顯是人的信；早期希臘教父讀這些經文時，大多也讀成對基督的信。這個讀法很美，但語法上不能說已經定案。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義經文照和合本，採受格讀法為主，並承認主格讀法與 2:8 的呼應很美。</strong>加拉太書講義在加 2:16 已並陳兩讀，本卷與它一致，不另立說法。</p><p>講台的落點是兩讀共同的那一句：<strong>義不是自己的。</strong>一個讀法說「我信他」，一個說「他忠信」，兩者都把焦點從我身上移到基督身上。保羅在這一節脫下的，是自己縫了三十年的那件義袍。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你照哪一種讀法，你都是因為基督而被稱義，不是因為你的表現；你的信，也不是你換取義的錢幣，而是你伸手領受的那隻手。這個語法爭議只會讓你更清楚：你得救的根基在基督身上，比你的信心更穩。</p>"]],"con":[],"say":"本講義的立場：經文照和合本「信基督的義」，採受格讀法為主，承認主格讀法「基督的信實」與 2:8 存心順服的呼應；兩讀的落點一樣——義不是自己的。與加拉太書講義加 2:16 一致，本講義的全卷立場見 ISS00_9。","care":"會眾裡有人信心很軟弱，常怕「我的信不夠」；也有人剛聽了網路上「和合本譯錯了」的說法，對中文聖經失去信任。講台上不要把語法爭議講成誰對誰錯的戰場，也不要嘲笑學者。會後若有人不安，先讓他知道：兩種讀法都說義是從神來的，他的得救不建立在他信得多強，而建立在基督的順服上。"},{"id":"ISS03_6","t":"3:11「或者我也得以從死裡復活」——保羅對得救沒把握嗎？","r":"3:10--11；1:6；3:20--21","ch":[3],"why":"「或者」兩個字，常讓敏感的信徒不安：連保羅都不確定自己能不能復活，我怎麼敢說自己得救了？也有人拿這一節證明「人可能失去救恩」。這一題關乎得救的確據，也關乎一個人在神面前怎樣既有把握、又謙卑。","pos":[["【一】經文問的是甚麼","","<p>「或者我也得以從死裡復活。」（3:11）原文 <strong>εἴ πως καταντήσω</strong>（ei pōs katantēsō）是條件語氣，「若能以某種方式抵達」；<strong>τὴν ἐξανάστασιν</strong>（tēn exanastasin）在新約只出現這一次，強調從死人中出來。上一節剛說「效法他的死」，下一節說「這不是說我已經得著了」。問題是：這個「或者」是懷疑，還是別的語氣？</p>"],["不確定說（得救要到最後才知道）","","<p>有些傳統認為，保羅這裡承認自己的得救還沒有定局，要靠一生忠心到底才能確定；所以信徒不可以有「一次得救永遠得救」的把握，要活在警醒與敬畏中，否則可能失去救恩。</p><p><strong>難處：</strong>同一封信 1:6 說神「必成全這工」，3:9 說義是「因信神而來的義」，3:20--21 說我們等候救主、他要改變我們的身體——保羅對終局說得很有把握。把一個謙卑的語氣講成懷疑，會讓人活在恐懼裡，與全卷的喜樂背道而馳。</p>"],["謙卑語氣說（不把復活當成自己的成就）","","<p>認為 εἴ πως 是謙卑的條件語氣，不是懷疑：保羅確信神的信實，卻不把復活當成自己可以掌握的成就。就像一個被邀請赴宴的人說「但願我能趕上」，不是懷疑主人，是知道這份榮耀不在自己手裡。下一節馬上解釋：「這不是說我已經得著了」——他在跑，終點是神給的。</p><p><strong>難處：</strong>這個說法解釋了語氣，卻還沒有回答「以某種方式」指的是甚麼；若只說「謙卑」，可能被人誤解為客套話，削弱了保羅真實的盼望與迫切。</p>"],["路徑說（經由死亡或活到主來）","","<p>認為保羅不確定的不是結局，而是路徑：他在捆鎖中，可能殉道，也可能活到主再來（1:20--25 他正在想這件事）。εἴ πως 的「以某種方式」，是「不論經由甚麼樣的苦難與死亡」，他都要抵達那個復活；這與 3:10「效法他的死」連在一起——他願意走基督走過的路，到達基督到達的地方。</p><p><strong>難處：</strong>這個讀法很貼近上下文，但「路徑」並不是經文明說的字，是從 1:20--25 推出來的；仍需與謙卑語氣說一起讀，才完整。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採謙卑語氣說與路徑說並讀。</strong>保羅對終局有把握——神必成全、救主必降臨、身體必改變；他不確定的是走向復活的路徑與時候，也不把復活當成自己的成就。這不是對得救沒把握，是一個被恩典抓住的人在神面前的謙卑。</p><p>成聖與確據的全卷立場見 ISS00_4：做成得救的工夫是恩典的果效，不是條件；因信稱義回指加拉太書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。你的把握不在於你自己跑得多好，而在於那位「必成全這工」的神。你可以像保羅一樣，既有把握，又謙卑：知道終點一定在那裡，也知道自己還在跑。有把握，所以不必害怕；謙卑，所以不會停下來，也不會看不起還在後面跑的人。</p>"]],"con":[],"say":"本講義的立場：3:11 的「或者」是謙卑的語氣，不是懷疑得救——保羅對終局有把握（1:6；3:20--21），不確定的是走向復活的路徑，也不把復活當成自己的成就。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有長期缺乏得救確據、一讀到「或者」就失眠的人，也可能有從強調「會失去救恩」的教會出來、心裡仍然害怕的人。講台上不要用這一節恐嚇人，也不要嘲笑別的傳統。會後陪伴時，帶他慢慢讀 1:6 與 3:20--21，讓他看見保羅的把握在神身上；若他的焦慮已經影響睡眠與生活，也要溫和地鼓勵他尋求專業的協助。"},{"id":"ISS03_7","t":"3:12--15「已經完全了」「凡是完全人」——基督徒在今生可以完全嗎？","r":"3:12--16；約壹1:8；帖前5:23","ch":[3],"why":"同一段經文裡，保羅先說「這不是說我已經得著了，已經完全了」，三節以後又說「凡是完全人總要存這樣的心」。聖潔運動講「全然成聖」，有些教會講「得勝者」，也有人說基督徒今生不可能進步多少。這一題關乎一個人怎樣看自己的成聖：是活在完美的要求裡，還是活在不必進步的放任裡？","pos":[["【一】經文問的是甚麼","","<p>3:12 的 <strong>τετελείωμαι</strong>（teteleiōmai）是「已經被完成、到了終點」；3:15 的 <strong>τέλειοι</strong>（teleioi）是同一個字根的形容詞，可以譯作「完全的」，也可以譯作「成熟的」。問題是：保羅怎麼能在三節之內，先說自己不完全，又說「我們中間凡是完全人」？基督徒在今生可以完全嗎？如果可以，是甚麼意義上的完全？</p>"],["改革宗（今生不能無罪，成聖是一生的爭戰）","","<p>認為信徒在今生雖然被稱義、也在成聖，卻始終帶著殘存的罪性，不可能達到無罪的完全；「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（約壹 1:8）3:15 的「完全」只是相對的成熟。</p><p><strong>難處：</strong>這個說法誠實面對了人的軟弱，但若講不好，容易讓人對成聖失去盼望，把「反正不可能完全」當成不必追求的理由，與 3:12--14 那種竭力向前的姿態不合。</p>"],["衛斯理宗與聖潔運動（全然成聖、完全的愛）","","<p>衛斯理認為信徒在今生可以經歷「基督徒的完全」：不是不會犯錯，而是心中充滿對神與對人完全的愛，不再故意犯罪。聖潔運動發展出「第二次祝福」「全然成聖」的教導，引用「願賜平安的神親自使你們全然成聖」（帖前 5:23）。</p><p><strong>難處：</strong>3:12 保羅自己說「已經完全了」不是他的情況；把完全講成一次經歷，容易讓經歷過的人以為自己已經到了，沒經歷的人覺得自己是次等信徒。</p>"],["凱錫克與得勝者傳統（得勝的生活）","","<p>凱錫克大會強調交託與聖靈充滿，可以過「得勝的生活」，不是無罪，而是不被罪轄制；中國教會的得勝者傳統，也從啟示錄與本段經文講追求、得勝與獎賞，激勵了許多在逼迫中忠心的信徒。</p><p><strong>難處：</strong>這些傳統的激勵是真實的，但若把「得勝者」講成教會裡一個已經到了的屬靈階層，就與 3:12「這不是說我已經得著了」相衝突，也容易產生屬靈的驕傲與分級。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：3:12 的「完全」是已經到了終點，3:15 的「完全人」是成熟的人；兩者不矛盾。</strong>成熟的人的記號，正是知道自己還沒有到、所以繼續跑。成聖是一生的跑道，不是一個按鈕，也不是可以放棄的夢想。</p><p>321 的得勝者以 3:12--14 為準：竭力追求、向著標竿直跑的人，不是已經完全的屬靈精英。各傳統的亮光都值得珍惜，全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你還在跌倒，不表示你不是基督徒；你還沒有到，正是成熟的人會說的話。保羅說：「然而，我們到了甚麼地步，就當照著甚麼地步行。」（3:16）從你今天所在的那一步，再往前一步就好。</p>"]],"con":[],"say":"本講義的立場：3:12 的「完全」是到了終點，3:15 的「完全人」是成熟的人，兩者不矛盾；成熟的人知道自己還在跑。321 的得勝者以 3:12--14 為準，是竭力追求的人，不是屬靈精英。本講義的全卷立場見 ISS00_4。","care":"會眾席上有完美主義、常因自己不夠聖潔而自責的人，也有曾被說成「不是得勝者」「屬靈次等」的人，還有從不同傳統來、對「全然成聖」有不同經歷的人。講台上不要用「你還不夠完全」壓人，也不要嘲笑別的傳統。會後陪伴時，先肯定他追求的心，再陪他看 3:12 的被動語態：他是被基督得著的人。"},{"id":"ISS03_8","t":"3:13「忘記背後」——受過傷的人要忘記過去嗎？","r":"3:13--14；3:4--8；創50:20；林前15:9","ch":[3],"why":"「忘記背後，努力面前的」是教會裡最常被引用的經文之一，也是最常被誤用的一句。被家暴、被性侵、被霸凌、被屬靈領袖傷害的人，常常被勸「過去的就讓它過去吧」；傷害人的一方也可能拿它要對方不要再提。這一題關乎一節經文怎樣保護受傷的人，而不是讓他們再受一次傷。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，我不是以為自己已經得著了；我只有一件事，就是忘記背後，努力面前的，」（3:13）<strong>τὰ μὲν ὀπίσω ἐπιλανθανόμενος</strong>（ta men opisō epilanthanomenos）是現在分詞，與「努力面前的」一起掛在 3:14「直跑」底下。問題是：「背後」是甚麼？保羅要人忘記的是過去的一切——包括別人加給我們的傷——還是另有所指？「忘記」是記憶消失，還是不再讓它決定方向？</p>"],["立刻放下說（饒恕就是忘記）","","<p>這種讀法把 3:13 當成普遍的原則：基督徒對一切過去的事，都要「忘記」，不再提、不再想、不再難過，才能往前走；一直談過去的傷，就是活在過去、沒有信心、不肯饒恕。</p><p><strong>難處：</strong>上下文的「背後」是 3:4--8 保羅自己的資歷與成就——他引以為傲的東西，不是別人加給他的傷。而且保羅自己也沒有失憶：他後來仍說「我原是使徒中最小的，不配稱為使徒，因為我從前逼迫神的教會。」（林前 15:9）要受傷的人壓抑、否認、立刻放下，常常造成第二次傷害，也讓加害者逃避責任。</p>"],["上下文限定說（背後只指保羅的成就）","","<p>認為 3:13 的「背後」只指保羅的資歷、成就與宗教上的倚靠：他不再回頭欣賞自己的獎盃，也不再拿它當作跑道上的倚靠。這節經文本來就與創傷無關，不應該拿來對受傷的人說話。</p><p><strong>難處：</strong>這個說法守住了經文的原意，但若只停在這裡，會讓受過傷的人覺得這一節與自己毫無關係；其實保羅身後也有他造成的傷（逼迫教會）和他受過的傷（林後 11 章的鞭打、監禁），經文仍有一層可以小心延伸的亮光。</p>"],["不被定義說（記得，但不再被它決定方向）","","<p>認為「忘記」在聖經裡常常不是記憶消失，而是不再讓它決定你；保羅記得自己逼迫過教會，但那件事不再定義他，也不再是他的倚靠。延伸到受傷的人：福音的自由是「不被過去定義」，不是「否認過去發生過」。約瑟沒有忘記哥哥們的惡，他說「從前你們的意思是要害我，但神的意思原是好的」（創 50:20），這是在記得之中看見神。</p><p><strong>難處：</strong>這是一層延伸，不是 3:13 的直接意思；延伸時要很小心，不可以變成另一種催促——「你應該已經不被過去定義了」。醫治需要時間，有時需要專業的陪伴。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：3:13 的「背後」在上下文是保羅自己的資歷與成就，不是別人加給他的傷；這一節不可以用來叫受傷的人壓抑創傷、否認傷害、立刻放下。</strong>若要延伸到傷，只能延伸到「不被過去定義」，並且清楚分開它與「否認過去發生過」。</p><p>傷需要被說出、被聽見、被好好處理；饒恕可以先在神面前開始，也可能需要很長的時間；和好需要對方的悔改與安全。饒恕與受害者回指哥林多後書立場四。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你還記得、還會痛，不表示你沒有信心，也不表示你不肯往前跑。跑道上的人可以帶著傷跑，也可以停下來讓人包紮。那位從上面召你的主，沒有叫你假裝沒有受傷；他自己復活的身體，還帶著釘痕。</p>"]],"con":[],"say":"本講義的立場：3:13 的「背後」是保羅自己的資歷與成就，不是別人加給他的傷；不可用它叫受傷的人壓抑創傷、否認傷害、立刻放下。分清楚「不被過去定義」與「否認過去發生過」。饒恕與受害者回指哥林多後書立場四。","care":"會眾席上可能有正在或曾經經歷家暴、性侵、霸凌、屬靈操控的人，也可能有童年受傷、至今一想起就發抖的人。講台上不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」「忘記背後吧」。會後單獨關心，先聽他說、相信他的經歷；若仍在危險中，先協助他確保安全；必要時協助他尋求專業的諮商與協助，陪他走，不催促。"},{"id":"ISS03_9","t":"3:20「我們卻是天上的國民」——基督徒與地上國家是甚麼關係？","r":"3:17--21；1:27；徒16:12；耶29:7","ch":[3],"why":"華人教會的會眾，常常同時有幾種身分：移民、海外華人、拿兩本護照的人，對兩岸或所在國的政治立場也很不同。有人用「天上的國民」叫人不要碰政治，有人把愛國或某個政治立場講成信仰的標準，也有人用它為移民或不移民作屬靈判斷。這一題關乎教會怎樣在地上作天國的殖民地，而不被地上的立場撕裂。","pos":[["【一】經文問的是甚麼","","<p>「我們卻是天上的國民，並且等候救主，就是主耶穌基督從天上降臨。」（3:20）<strong>τὸ πολίτευμα</strong>（to politeuma）是一個城邦的公民團體；腓立比是羅馬的殖民城（徒 16:12），城裡的公民擁有羅馬公民權，效忠遠方的羅馬。1:27 的 πολιτεύεσθε（politeuesthe）也是同一個字根：「像天國公民一樣過日子」。問題是：天上的國民與地上的國家是甚麼關係？要撤離、要合一，還是另有次序？</p>"],["分離說（天上的國民不參與地上的事）","","<p>認為基督徒的國在天上，地上的政治、社會與國家事務都是屬世的，不應該參與；教會只要傳福音、等候主來，對社會議題保持距離，免得被世界玷污。</p><p><strong>難處：</strong>腓立比的殖民城並沒有撤離當地：羅馬公民在馬其頓生活、工作、守秩序，正是在那裡活出羅馬的樣子。先知也叫被擄的人「要為那城求平安，為那城禱告耶和華」（耶 29:7）。完全的分離，會讓教會對鄰舍的苦難冷漠。</p>"],["國族說（把地上的國家與天國混同）","","<p>這種讀法把愛國與愛主連在一起，認為某一個國家、民族或政治陣營特別蒙神揀選，支持它就是天國公民的責任；反過來，持不同立場的人就是不夠屬靈，甚至是「十字架的仇敵」。</p><p><strong>難處：</strong>3:20 的重點正是「我們卻是」：天上的國民最後的忠誠不屬於任何地上的國家。把地上的陣營講成天國，會讓教會被政治撕裂，也讓福音被綁在某一個立場上；這正是 3:19「專以地上的事為念」的另一種樣子。</p>"],["殖民地說（雙重身分、忠誠的次序）","","<p>認為 πολίτευμα 的圖畫就是答案：教會是天國放在地上的一塊殖民地。信徒在所住的城裡生活、納稅、守法、為城求平安、參與公共事務，也可以愛自己的家鄉；但最後的忠誠只屬於從天上降臨的主。地上的要求與主衝突時，「順從神，不順從人，是應當的」（徒 5:29）。</p><p><strong>難處：</strong>甚麼時候算是「衝突」，不同信徒、不同處境會有不同的判斷，經文沒有提供一張清單；這需要教會在差異中彼此尊重，而不是由講台替每個人下政治結論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採殖民地說。</strong>天上的國民不是撤離地上，而是在地上活出天國的樣子；最後的忠誠歸給主，所以不把任何地上的國家、政黨或移民選擇講成信仰的標準答案。處境是羅馬殖民城裡的一群信徒，原則是忠誠的次序；今天落在每一間有不同政治立場、不同護照的華人教會裡——全卷立場見 ISS00_1。</p><p>講台的落點：同一個小組裡，兩位立場不同的弟兄姊妹，可以為所住的城一同禱告，因為他們的護照，最後是同一國的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你可以愛你的家鄉，也可以為你移居的城市求平安；你可以有你的政治看法，也可以和看法不同的弟兄姊妹同坐一桌。這些不決定你是不是天上的國民——決定這件事的，是那位你正在等候的救主。</p>"]],"con":[],"say":"本講義的立場：教會是天國放在地上的殖民地——在所住的城裡生活、為城求平安，最後的忠誠只歸給從天上降臨的主；不撤離，也不把任何地上的國家、政黨或移民選擇講成信仰的標準。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有因為政治立場與家人、同工決裂的人，有被迫離開家鄉的人，有正在為移民與否掙扎的家庭，也有在所住之地受到歧視的少數族裔。講台上不替任何政黨或國家背書，也不嘲笑別人的立場；會後若有人因此受傷或憤怒，先聽他的處境，承認他的失落是真的，再陪他看：在基督裡，我們屬於同一國。"},{"id":"ISS04_1","t":"4:2--3 友阿蝶與循都基——女同工的地位；「同負一軛的」是誰？","r":"4:2--3；1:27；徒16:13--15；羅16:1--3","ch":[4],"why":"這是新約裡少數被點名的一場同工衝突，而且兩位當事人都是女性。有人拿它證明「女人不適合帶領」，也有人拿它證明女性在初代教會是核心同工；「真實同負一軛的」究竟是誰，也眾說紛紜。更要緊的是：華人教會處理同工衝突，常常不是公開處理，就是叫人閉嘴；這兩節正好給出第三條路。","pos":[["【一】經文問的是甚麼","","<p>「我勸友阿蝶和循都基，要在主裡同心。我也求你這真實同負一軛的，幫助這兩個女人，因為她們在福音上曾與我一同勞苦」（4:2–3）。原文 <strong>Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ</strong>（Euodian parakalō kai Syntychēn parakalō）一人一個「我勸」，<strong>συνήθλησάν μοι</strong>（synēthlēsan moi）與 1:27「同一隊競技」同字。經文引出兩個問題：這兩位姊妹在教會裡是甚麼角色？保羅請來幫忙的「真實同負一軛的」<strong>γνήσιε σύζυγε</strong>（gnēsie syzyge）是誰？</p>"],["領袖同工說（兩位是腓立比教會的帶領者）","","<p>認為腓立比教會在河邊婦女的禱告會裡出生（徒 16:13–15），第一位信主的是呂底亞，她的家成了聚會的地方；馬其頓的婦女在社會上本來就較有地位。保羅說她們「在福音上曾與我一同勞苦」，用的是運動員並肩競技的字，羅 16 章也問候許多女同工（非比、百基拉、土非拿氏）。所以她們很可能是家庭教會的帶領人，她們的不和才會影響全教會，要在公開宣讀的信裡處理。</p><p><strong>難處：</strong>經文沒有說她們擔任甚麼職分，「帶領人」是從背景推論；若把這兩節當成支持某一種教會治理立場的決定性證據，就把經文推得比它說的更遠。</p>"],["一般信徒說（兩位是熱心服事的會友）","","<p>認為「一同勞苦」可以指廣義的福音同工，像提供接待、探訪、奉獻；經文沒有她們講道或治理的記號。保羅點名，是因為兩人的衝突已經在教會裡造成裂痕，不一定表示她們有正式職分。</p><p><strong>難處：</strong>這個讀法容易低估保羅的用字：συναθλέω 在 1:27 是全教會「為所信的福音齊心努力」，在這裡則特別說她們「與我」一同勞苦，與革利免和其餘同工並列。把她們縮小成「愛吵架的兩位姊妹」，不合保羅自己對她們的評價。</p>"],["「同負一軛的」是誰：各家說法","","<p>有人說是以巴弗提（他正要帶信回去），有人說是路加（使徒行傳的「我們」段落在腓立比停過一段時間），有人說是提摩太、西拉，或腓立比教會的一位監督；也有人主張 Σύζυγος（Syzygos）是人名，γνήσιε（gnēsie）是文字遊戲——「名副其實的同軛者」。</p><p><strong>難處：</strong>每一說都有一點根據，卻都沒有直接證據；新約與當時文獻都找不到以 Σύζυγος 為名的人。保羅知道是誰，腓立比人也知道，我們不知道。爭論這個名字，容易錯過保羅真正示範的事：請一位雙方都信得過的第三人進來。</p>"],["【三】本講義站在哪裡","","<p><strong>女同工的地位，本講義回指哥林多前書立場二與加拉太書立場四，本卷不另立說法。</strong>這兩節可以確定的是：兩位是保羅看重的同工，名字在生命冊上；衝突的是同工，不是性別。</p><p><strong>「同負一軛的」是誰，本講義存而不論。</strong>本講義要講滿的是保羅處理衝突的方式：一人一個「我勸」，不偏袒；勸的內容是「在主裡同心」，把問題搬到 2:5 基督的心上重新談；再請一位第三人「幫助」（συλλαμβάνου，一起抓住）。合一不是叫她們閉嘴，是把問題帶進主裡處理（紅線八）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經沒有把初代教會描寫成沒有衝突的理想國；保羅最喜樂的一封信裡，就有兩位同工吵架。教會裡有衝突，不表示福音是假的；它表示福音正在一群真實的人中間做工。你今天能做的，是在你身邊兩個不說話的人中間，做那一位不選邊、肯蹲下來幫助的人。</p>"]],"con":[],"say":"本講義的立場：友阿蝶與循都基是與保羅在福音上一同勞苦的同工，衝突的是同工，不是性別；女同工的地位回指哥林多前書立場二與加拉太書立場四。「同負一軛的」是誰存而不論；保羅的做法是一人一個「我勸」、不偏袒、請第三人幫助——合一是把問題帶進主裡處理，不是叫人閉嘴。","care":"會眾席上可能有正在冷戰的同工，也可能有曾經在教會衝突裡被犧牲、被要求「顧全大局」先道歉的人，多半是比較沒有聲音的那一方；也會有姊妹因為「女人就是愛吵」這類話受過傷。講台上不點任何人的名，不把衝突講成性別問題。會後陪伴時，先分別聽兩邊，不傳話、不判案；若牽涉權力不對等或傷害，要啟動公平的處理與保護，不是只勸「要同心」。"},{"id":"ISS04_2","t":"4:3「生命冊」——名字會被塗抹嗎？","r":"4:3；出32:32--33；詩69:28；啟3:5；啟20:12；路10:20","ch":[4],"why":"「生命冊」在聖經裡出現好幾次，有的經文說名字會被塗抹，有的說永不塗抹。有人拿它恐嚇信徒「再不好好服事就被除名」，也有怕自己不夠好的人，一讀到這裡就失眠。保羅偏偏是在勸兩位吵架的姊妹時提到生命冊，這一題關乎得救的確據，也關乎怎樣讀這個安慰。","pos":[["【一】經文問的是甚麼","","<p>「還有革利免，並其餘和我一同做工的，他們的名字都在生命冊上。」（4:3）原文 <strong>ἐν βίβλῳ ζωῆς</strong>（en biblō zōēs）。舊約裡摩西說「求你從你所寫的冊上塗抹我的名」（出 32:32），神回答「誰得罪我，我就從我的冊上塗抹誰的名」（出 32:33）；詩人說「願他們從生命冊上被塗抹」（詩 69:28）；啟示錄卻說「我也必不從生命冊上塗抹他的名」（啟 3:5）。問題是：名字寫上了，還會被塗掉嗎？保羅在這裡提它，是要警告還是要安慰？</p>"],["永蒙保守說（改革宗為主）","","<p>認為生命冊是神在創世以前揀選的名冊，名字一旦寫上就不會被塗抹；主耶穌說「誰也不能從我手裡把他們奪去」（約 10:28）。舊約「塗抹」的經文多指從活人的名冊中除去（肉身的死亡或從百姓中剪除），不是指得救的人失去救恩；啟 3:5 用否定語氣，是給得勝者的保證。</p><p><strong>難處：</strong>這個說法給了堅固的確據，但若講得不好，會讓人以為「名字寫上了，怎麼活都可以」；而出 32 章與啟 3:5 的語氣，確實帶著要人認真回應的警醒，不能一筆帶過。</p>"],["可能失落說（衛斯理宗與阿民念傳統）","","<p>認為出 32:33 與啟 3:5 都暗示塗抹是真實的可能：神的恩典是真實的，人的回應也是真實的；一個人若持續、刻意地離棄基督，名字可能被塗抹。所以生命冊既是安慰，也是呼召人持守到底的警戒。</p><p><strong>難處：</strong>這個說法認真看待警戒，但若在講台上不小心，很容易讓敏感的人活在「我是不是已經被塗掉了」的恐懼裡；而腓立比書 4:3 的上下文完全沒有警戒的語氣，保羅是在肯定同工，不是在威脅她們。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_4：得救本乎恩，「做成得救的工夫」是恩典的果效，不是條件；並回指以弗所書紅線五（恩典與行為）。</strong>神學上兩派並陳；本章的讀法則很清楚：保羅說生命冊，是在勸兩位吵架的姊妹的同一口氣裡——她們的名字都在冊上，所以要同心。這是身分與安慰，不是排名與威脅。</p><p>主耶穌也說：「要因你們的名記錄在天上歡喜」（路 10:20）。名字寫上去，是神的恩典，不是表現的分數。所以本講義不用生命冊恐嚇人，也不用它排同工的名次。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。保羅提生命冊時，對象是兩位正在吵架、顯然還不完全的同工——她們的名字仍在冊上。如果你很怕自己的名字被塗掉，這份擔心本身就說明你在乎主；把這份擔心帶到 4:6 的禱告裡，說給那位寫下你名字的主聽，他「必成全這工」（1:6）。</p>"]],"con":[],"say":"本講義的立場：4:3 的生命冊是身分與安慰——保羅是在勸兩位吵架的同工時說她們的名字都在冊上，不是威脅；永蒙保守說與可能失落說並陳，講台不用生命冊恐嚇人、不用它排名次。本講義的全卷立場見 ISS00_4，並回指以弗所書紅線五。","care":"會眾席上可能有從小被「你會被神除名」嚇大的人，有強迫性懷疑、反覆擔心自己失去救恩的人，也有剛跌倒、覺得自己不配的人。講台上不要用「名字會被塗掉」來催逼服事或奉獻。會後若有人為此長期焦慮、反覆尋求保證，先陪他讀 1:6 與約 10:28，不爭論神學；若擔憂已經影響睡眠與生活，溫和地協助他尋求專業協助。"},{"id":"ISS04_3","t":"4:5「主已經近了」——保羅以為主很快就再來嗎？","r":"4:5；帖前4:15；羅13:11--12；雅5:8；彼後3:9；太24:36","ch":[4],"why":"「主已經近了」常被拿來推算末日，也常被批評者拿來說「保羅以為主會在他有生之年再來，結果他錯了」。兩種說法都會傷害信心：一種讓人恐慌，一種讓人懷疑聖經。而在本章的上下文裡，這四個字其實是一座橋——從謙讓走到禱告。","pos":[["【一】經文問的是甚麼","","<p>「當叫眾人知道你們謙讓的心。主已經近了。」（4:5）原文 <strong>ὁ κύριος ἐγγύς</strong>（ho kyrios engys）沒有動詞，只有「主」和「近」。ἐγγύς 可以指時間上的近（主來的日子近了），也可以指空間上的近（主就在身邊，這使我們想起詩 145:18 那位與求告他的人相近的神）。問題是：保羅說的是哪一種近？他是不是以為主一定會在他有生之年回來？</p>"],["時間說（主再來的日子近了）","","<p>認為這是初代教會的末世盼望：「主來的日子近了」（雅 5:8），「我們得救，現今比初信的時候更近了」（羅 13:11）；腓立比書本身也一再提到「基督的日子」（1:6、1:10、2:16）與「等候救主」（3:20）。所以主近了，是叫人在等候中謙讓、忍耐。</p><p><strong>難處：</strong>若只讀成時間表，就會引出「保羅算錯了」的質疑；其實新約一面說「近了」，一面說「那日子，那時辰，沒有人知道」（太 24:36），也說主「不是耽延，乃是寬容你們」（彼後 3:9）——「近」是盼望的姿態，不是倒數的時鐘。</p>"],["空間說（主就在身邊）","","<p>認為這四個字緊接著 4:6「應當一無掛慮」：主就在你身邊，所以可以把掛慮說給他聽；這使我們想起詩篇裡「耶和華靠近傷心的人」的語言。在監牢裡寫信的保羅，最真實的經驗就是主的同在。</p><p><strong>難處：</strong>這個讀法很能安慰人，但腓立比書確實帶著強烈的末世盼望（3:20–21），若完全拿掉時間的意思，就削弱了保羅要人「等候救主」的張力。</p>"],["保羅錯判說（批判學界）","","<p>部分學者認為保羅與初代信徒都以為主會在幾十年內再來（帖前 4:15「我們這活著還存留到主降臨的人」），後來的書信才慢慢調整；「主已經近了」反映的是一個沒有應驗的期待。</p><p><strong>難處：</strong>保羅在帖撒羅尼迦後書就已經提醒人不要以為主的日子現在就到了；在腓立比書裡他也同時考慮自己可能會死（1:20–23）。他盼望主來，卻從未定出日期。把「盼望」讀成「預測」，是讀者加給他的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩讀並收，不套用末世時間表、不算日子（鐵律四）。</strong>主來的日子近，所以那件爭到底的事沒有那麼重要——這是 4:5 前半的「謙讓」；主就在身邊，所以掛慮可以說給他聽——這是 4:6 的禱告。這四個字是一座橋，果效是忍耐與謙讓，不是恐慌。</p><p>保羅盼望主來，但他沒有預測日期，也沒有因此叫人放下工作與責任；在同一封信裡，他還在安排提摩太、以巴弗提的行程。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。主再來的日子還沒有到，不表示聖經錯了；兩千年來，每一代信徒都活在「主近了」的盼望裡，也每一天經歷主就在身邊。你不需要算出日子，只需要今天把一件爭執放下、把一件掛慮說給近在身邊的主聽。</p>"]],"con":[],"say":"本講義的立場：「主已經近了」時間與空間兩讀並收——主來的日子近，所以可以謙讓；主就在身邊，所以可以把掛慮告訴他。保羅盼望主來，卻沒有定日期；本講義不套用末世時間表、不算日子，果效是忍耐，不是恐慌。","care":"會眾席上可能有人曾經被末日預言嚇得辭職、賣房、不讓孩子上學，後來預言落空，連信仰也一起失落；也可能有容易焦慮的人，一聽到「主快來了」就心跳加速。講台上不要用末日催逼決志或奉獻。對曾經被末日團體傷害的人，先承認那份傷害是真的，不嘲笑他當年的天真，再陪他讀 4:5–6：近在身邊的主，是叫人放心的主。"},{"id":"ISS04_4","t":"4:6「應當一無掛慮」——焦慮症、憂鬱症是信心不足嗎？","r":"4:6--7；2:20；2:27；太26:38；王上19:4--7；提前5:23","ch":[4],"why":"華人教會裡，「你要有信心」「多禱告就好」常常是給焦慮與憂鬱的人唯一的回應；有人因此停藥、不敢就醫，或把病藏起來不敢讓小組知道，有時延誤到危險的地步。4:6 是最常被引用的一節，也最需要被讀準：它是一個邀請，不是一張診斷書。","pos":[["【一】經文問的是甚麼","","<p>「應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」（4:6）<strong>μηδὲν μεριμνᾶτε</strong>（mēden merimnate）的動詞，與保羅稱讚提摩太「實在掛念你們的事」（2:20）是同一個字；保羅自己也說「免得我憂上加憂」（2:27）。同一個字在第二章是美德，在第四章是要交出去的。問題是：4:6 是在說「有掛慮就是犯罪」嗎？焦慮症、憂鬱症這樣的疾病，是信心不足的結果嗎？基督徒可以看精神科、吃藥嗎？</p>"],["整合說（信仰與醫療、心理專業一起）","","<p>認為一切真理都是神的真理；焦慮症、憂鬱症有生理、心理、關係與屬靈多方面的成因，所以需要醫療、心理治療、教會關懷與禱告一起進行。以巴弗提病得幾乎要死，保羅沒有說他信心不足，只說「神憐恤他」；保羅也叫屢次患病的提摩太「可以稍微用點酒」（提前 5:23），實際地照顧身體。以利亞在羅騰樹下求死，神先差天使拍他說「起來吃吧」（王上 19:5），讓他睡、讓他吃，然後才對他說話。</p><p><strong>難處：</strong>整合若不慎，聖經會退到點綴的位置，心理學的人觀未經檢驗就整套接受；整合不是把兩樣東西擺在一起，是用聖經的眼光分辨、收下專業的幫助。</p>"],["聖經輔導說（以聖經與教會為主要資源）","","<p>認為聖經足以處理人心的問題，輔導應以聖經與教會為主要資源；4:6–7 確實是一個真實的出路，禱告、感謝、把心交給神，不是心理技巧的附屬品。後來的承接者對醫療的態度更細緻，承認身體的疾病需要醫治。</p><p><strong>難處：</strong>早期的一些講法把幾乎一切情緒困擾都歸於罪或不信，對需要藥物與專業治療的人造成很大的傷害；聖經是足夠的準則，卻沒有叫我們拒絕神透過醫生給的醫治。</p>"],["民間說法：「有信心就不會焦慮、憂鬱」","","<p>這不是一個學派，卻是最常聽到的一句話：「基督徒不應該憂鬱」「吃抗憂鬱藥就是不信神」。說的人多半出於好意，也抓住了一件真實的事：信仰確實帶來盼望。</p><p><strong>難處：</strong>它與經文直接衝突。耶穌在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38）——沒有人會說耶穌信心不足；保羅會憂上加憂。這句話的實際效果，是讓生病的人更羞愧、更不敢說出來、更晚就醫。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_5。</strong>情緒不是罪；4:6 的解藥是把掛慮說出來——禱告、祈求、感謝——不是壓下去。<strong>焦慮症、憂鬱症是需要治療的病，就醫、吃藥、諮商與禱告不衝突。</strong>整合說與聖經輔導說並陳，各自的提醒都收下；「有信心就不會憂鬱」不採（紅線三）。</p><p>4:7 的平安「出人意外」，常常是在問題還沒解決、病還在治療的時候，先來守住人的心懷意念。被平安守住的人，仍然會求醫、會吃藥、會找人商量——只是不再獨自一人被恐懼追著跑。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>你的病不是你信心的成績單。</strong>4:6 沒有說「不准有掛慮」，它說「將你們所要的告訴神」——你可以哭著說、斷斷續續地說，也可以同時去看醫生、去找諮商師。那不是不信，是收下神透過人給你的幫助。</p>"]],"con":[],"say":"本講義的立場：4:6 是邀請，不是診斷——解藥是把掛慮說給神聽，不是壓下去；保羅自己會掛念、會憂上加憂。焦慮症、憂鬱症是需要治療的病，就醫、吃藥、諮商與禱告不衝突。本講義的全卷立場見 ISS00_5。","care":"會眾席上一定有正在服藥、不敢讓教會知道的人，有家人罹患憂鬱症、被親友說「是你們禱告不夠」的家庭，也有恐慌發作時只聽過「要有信心」的人。講台上絕不說「憂鬱是因為不夠喜樂」「吃藥就是不信」，不叫人停藥，也不對正在流淚的人說「你要有信心」。會後單獨關心，不追問病情細節；若伴隨無望感或輕生念頭，先陪伴、保護生命，協助就醫與尋求專業協助（見 ISS00_3）。"},{"id":"ISS04_5","t":"4:8「這些事你們都要思念」——正向思考、心想事成與聖經的思念，有甚麼不同？","r":"4:8--9；3:7--8；西3:2；羅12:2；林後10:5","ch":[4],"why":"4:8 常被印在勵志書與正能量海報上，也被吸引力法則、「宣告就會得著」的講法借用：只要想好的，好事就會來；說負面的話，壞事就會發生。這種講法在職場、直銷與部分教會裡很流行，卻會讓人不敢承認痛苦。這一題關乎聖經的「思念」到底是甚麼。","pos":[["【一】經文問的是甚麼","","<p>「凡是真實的、可敬的、公義的、清潔的、可愛的、有美名的，若有甚麼德行，若有甚麼稱讚，這些事你們都要思念。」（4:8）清單的第一項是 <strong>ἀληθῆ</strong>（alēthē）「真實的」；動詞 <strong>λογίζεσθε</strong>（logizesthe）是算進去、放進心裡算的字，與 3:7–8 保羅「當作有損的」那本帳同一個家族。下一節接著說「這些事你們都要去行」（4:9）。問題是：4:8 是一種正向思考的技巧嗎？「思念」好的事，會讓好事發生嗎？</p>"],["正向思考與吸引力法則的讀法","","<p>二十世紀的「積極思想」與後來的吸引力法則，常引用 4:8 作支持：人的念頭有力量，正面的思想帶來正面的結果；部分「信心話語」的講法更說，口裡宣告甚麼就會得著甚麼。它吸引人的地方是真實的：人的思想確實影響情緒與行為，長期只盯著壞事的人，生活也會被拖垮。</p><p><strong>難處：</strong>它把主詞換掉了。4:8 沒有說思念會改變處境，它說的是讓心被真實美善的事塑造；清單的第一項是「真實的」，不是「愉快的」——不准承認壞消息，正好違反第一項。這種讀法也讓病人、窮人被指責「你想太多負面的事了」，加重羞恥。</p>"],["認知與品格塑造的讀法","","<p>認為 4:8 與希臘倫理學的德行清單有相似處（ἀρετή「德行」是哲學家的常用字），保羅借用了腓立比人熟悉的語言，叫信徒在外邦文化裡辨認一切真實美善的事，不論它出現在哪裡；心思的方向會塑造品格，這與「心意更新而變化」（羅 12:2）一致。</p><p><strong>難處：</strong>這個讀法很平衡，但若只停在「好習慣」，就會漏掉上下文的中心：4:7 的平安在「基督耶穌裡」，4:9 的榜樣是保羅身上可以看見的基督。思念不是自我修練的技巧，是讓基督的心成為我們算帳的標準。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_5：4:8 不是正向思考或吸引力法則。</strong>「思念」是把真實、可敬、公義的事算進心裡，第一項是「真實的」——不是假裝沒事；它不操控結果，它塑造人。</p><p>這也是 321「改變觀點就改變觀念」的經文：保羅在 3:7 重新算過一次帳，在 4:8 教人每天這樣算；而 4:9 立刻把思念接到行動——學習、領受、聽見、看見，然後去行。思念的終點不是好心情，是像基督的生活。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你可以誠實地說出壞消息，也可以誠實地哭；那不是「負面」，是 4:8 的第一項。然後，在真實的處境裡，再把心思放在那些同樣真實、卻常被忽略的美善上——一個陪你的人、一頓熱飯、一節經文。思念這些事，不是逃避現實，是看見現實的全部。</p>"]],"con":[],"say":"本講義的立場：4:8 的「思念」是把真實、可敬、公義的事算進心裡——清單的第一項是「真實的」，不是假裝沒事；它不是正向思考、吸引力法則或「宣告就得著」，也立刻接到 4:9 的去行。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有被說「你就是想太多負面的事才會生病」的病人，有被直銷或成功學團體影響、覺得自己失敗是因為念頭不夠正面的人，也有不敢說出家裡真實狀況、怕被說「沒有信心」的人。講台上不要把承認痛苦說成「負面」。會後陪伴時，讓人先把真實的事說出來，不急著叫他「往好處想」；陪他一起找出處境裡同樣真實的恩典。"},{"id":"ISS04_6","t":"4:11「知足」——知足就是不可以追求更好的生活、加薪、維權嗎？","r":"4:10--12；提前6:6--8；來13:5；徒16:37；雅5:4；利19:13","ch":[4],"why":"許多基督徒心裡有一個矛盾：想換一份薪水比較好的工作、爭取加薪、對老闆拖欠工資提出申訴，會不會就是「不知足」？也有雇主、長輩甚至教會用「要知足」叫人不要爭取應得的權益。這一題關乎知足與追求、知足與公義之間的界線。","pos":[["【一】經文問的是甚麼","","<p>「我並不是因缺乏說這話；我無論在甚麼景況都可以知足，這是我已經學會了。」（4:11）<strong>αὐτάρκης</strong>（autarkēs）是斯多葛哲學的核心字：修練到不需要任何外物的「自足」；保羅借了這個字，卻把它的心換成「我靠著那加給我力量的」（4:13）。他也說「我知道怎樣處卑賤，也知道怎樣處豐富」（4:12）。問題是：知足是叫人停止一切追求嗎？爭取加薪、換工作、維護權益，算不算不知足？</p>"],["靜默順受說（知足就是安於現狀）","","<p>認為基督徒應當安於神所安排的位置，「只要有衣有食，就當知足」（提前 6:8）；爭取更多常常出於貪心，所以與其抗爭，不如忍耐、感恩、等候神。這個說法在重視和諧、怕得罪人的華人文化裡很有吸引力。</p><p><strong>難處：</strong>它把「知足」和「對不公沉默」混在一起。聖經一面叫人知足，一面嚴厲責備扣工錢的人：「雇工人的工價，不可在你那裡過夜，留到早晨」（利 19:13），「這工錢有聲音呼叫」（雅 5:4）。保羅自己在腓立比被非法鞭打後，也說「我們是羅馬人，並沒有定罪」（徒 16:37），要官長親自來領他出去。</p>"],["斯多葛式自足說（不依賴任何外物）","","<p>認為知足是一種內在的修練：不讓外物、他人或處境影響自己，情緒淡泊、需要越少越好。這在當時的哲學裡是最高的德行，今天也以「斷捨離」「極簡」等形式流行。</p><p><strong>難處：</strong>保羅借了字，卻沒有借它的心。他的知足不是不需要任何人：下一節他就說「你們和我同受患難原是美事」（4:14），收下餽送、說出需要；他的力量也不在自己裡面，在「那加給我力量的」。斯多葛的自足是靠自己，保羅的知足是靠主。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_5。</strong>知足是心不被處境綁架，不是對不公沉默，也不是放棄一切合理的追求。保羅兩邊都知道：「處卑賤」與「處豐富」都是要學的功課；有餘的時候不被財富擄去，缺乏的時候不被缺乏擊倒。</p><p>所以基督徒可以換工作、爭取合理的薪資、為被剝削的同事發聲、離開不安全的環境；判斷的標準不是「我有沒有要更多」，而是「我的心是被貪心推著，還是被公義與愛帶著」（提前 6:6「敬虔加上知足的心便是大利了」）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你罪疚。想要過得好一點，本身不是罪；為公義開口，更不是不知足。知足是保羅「學會了」的，你也可以慢慢學：在申請新工作、等待加薪、甚至打一場勞資官司的過程裡，讓心安穩在主裡，不被結果綁架。</p>"]],"con":[],"say":"本講義的立場：4:11 的知足是心不被處境綁架，不是對不公沉默，也不是放棄合理的追求；保羅借了斯多葛的「自足」，換成了靠主的心。基督徒可以爭取合理的權益、離開不安全的環境。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有被拖欠工資、在工廠或家庭幫傭中受剝削的人，有被雇主或長輩用「要知足」壓下來的人，也有因為想換工作而被說「你太屬世」的年輕人。講台上不要用知足替不公背書。會後陪伴時，先聽他的處境，若牽涉安全或違法的剝削，協助他找到可以求助的管道；不要只對他說「忍一忍，要知足」。"},{"id":"ISS04_7","t":"4:13「凡事都能做」——成功神學、運動員的口號、考試前的禱告，可以這樣用嗎？","r":"4:13；4:11--12；2:8；林後12:9--10；約16:33","ch":[4],"why":"4:13 可能是被印在最多球衣、筆記本與創業簡報上的一節經文。考試、比賽、面試前，許多人用它禱告；成功神學則把它讀成「靠主一定成功」。可是輸了的人、落榜的人、倒閉的人怎麼辦？這一題關乎「凡事」到底包括甚麼，也關乎失敗的人在教會裡還有沒有位置。","pos":[["【一】經文問的是甚麼","","<p>「我靠著那加給我力量的，凡事都能做。」（4:13）原文 <strong>πάντα ἰσχύω ἐν τῷ ἐνδυναμοῦντί με</strong>（panta ischyō en tō endynamounti me）。抄本上，SBLGNT 沒有「基督」，拜占庭傳統（RP、KJV「through Christ」）有；和合本跟批判本作「那加給我力量的」，意思不變——加給力量的就是主。上一節說：「或飽足，或飢餓；或有餘，或缺乏」（4:12）。問題是：「凡事」指的是甚麼？可以拿來為考試、比賽、生意的成功禱告嗎？</p>"],["成功神學的讀法（靠主一定成功）——本講義明確不採","","<p>主張神的旨意是每一個信徒都健康、富足、成功；4:13 被讀成「只要有信心，沒有做不到的事」，失敗、疾病與缺乏被歸因於信心不夠。它吸引人的地方是真實的：神確實是大能的神，確實垂聽禱告。</p><p><strong>難處：</strong>它把「凡事」從上下文裡拔出來。4:13 的「凡事」，就是 4:12 剛剛列出的飽足、飢餓、有餘、缺乏；說這句話的人正戴著鎖鍊。成功神學讓輸了的人只剩下罪疚，正好把經文講反了。</p>"],["激勵讀法（一般基督徒的考前、賽前禱告）","","<p>這不是一個學派，是許多真誠信徒的習慣：在重要的時刻求主加力，相信神會幫助他盡力發揮。這份依靠本身是好的：「我的恩典夠你用的」（林後 12:9），神確實在人的軟弱上顯出能力。</p><p><strong>難處：</strong>問題不在禱告，在期待：若把 4:13 當成「求了就會贏」的保證，結果不如預期時，人很容易覺得神失約、聖經騙人。運動員可以讀 4:13，但要讀到「輸了也撐得住」那一層。</p>"],["知足的力量讀法（上下文的讀法）","","<p>認為 4:13 是 4:11–12 的結論：保羅在一切景況裡「學會了」知足、「得了秘訣」，秘訣就是那加給他力量的主。「凡事」包括飢餓與缺乏；4:12「處卑賤」ταπεινοῦσθαι 與 2:8 基督「自己卑微」ἐταπείνωσεν 是同一個動詞——保羅學會的，是基督往下走過的形狀；地勢從 4:12 的低谷直接升到 4:13 的山峰。</p><p><strong>難處：</strong>這個讀法若講得太窄，可能讓人以為 4:13 只能用在苦難裡、不能在任何努力中求主加力；其實保羅說「凡事」，豐富的時候也需要力量——不被成功擄去，同樣是一門功課。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_5：4:13 是知足的力量，不是成功的保證；成功神學明確不採（紅線四）。</strong>考前、賽前、面試前都可以禱告，求主幫助你盡力、守住你的心；但 4:13 最準的讀者，是輸了以後仍然站得住的人。</p><p>321 的「得勝者」以這裡為準：不是凡事都成功的人，是在缺乏裡仍然知足、在失敗後仍然不離開主的人（見 ISS00_4）。主耶穌說：「在世上，你們有苦難；但你們可以放心，我已經勝了世界」（約 16:33）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經靠著 4:13 去考試卻落榜、去比賽卻輸了，神沒有騙你；是有人把這句話的範圍講錯了。今天的你，正是 4:13 原本寫給的那一種人：處境不如意，卻仍然被那一直加給人力量的主扶著。</p>"]],"con":[],"say":"本講義的立場：4:13 的「凡事」就是 4:12 的飽足、飢餓、有餘、缺乏——知足的力量，不是成功的保證；成功神學明確不採。可以為考試比賽禱告，但 4:13 包括「輸了以後仍然站得住」。本講義的全卷立場見 ISS00_5。","care":"會眾席上有剛落榜的考生、剛失業或生意失敗的人、輸掉關鍵比賽的孩子，也有花了很多錢參加成功學課程、最後負債的家庭；有人會覺得 4:13 在嘲笑自己。講台上不要說「你信心夠就會贏」。會後陪伴時，先陪他承認失落是真的，不急著說「神有更好的安排」；若失敗帶來長期的無望感或輕生念頭，單獨關心並協助尋求專業協助。"},{"id":"ISS04_8","t":"4:15--18 奉獻與宣教士的支持——傳道人可以收錢嗎？","r":"4:14--18；林前9:12--18；林後11:8--9；帖前2:9；加6:6；路10:7","ch":[4],"why":"保羅在哥林多拒收供給、親手做帳棚，在腓立比卻收下餽送，還稱它為極美的香氣。華人教會對錢很敏感：有人覺得傳道人談錢就不屬靈，宣教士不敢寫出自己的需要；也有人用「供養神僕」向會眾施壓。這一題關乎教會與傳道人之間的「授受的事」怎樣才健康。","pos":[["【一】經文問的是甚麼","","<p>「論到授受的事，除了你們以外，並沒有別的教會供給我。」（4:15）原文 <strong>εἰς λόγον δόσεως καὶ λήμψεως</strong>（eis logon doseōs kai lēmpseōs）是商業的帳目用語：給與受的帳。保羅收了，稱它為「極美的香氣，為神所收納、所喜悅的祭物」（4:18），卻又說「我並不求甚麼餽送，所求的就是你們的果子漸漸增多，歸在你們的帳上」（4:17）。問題是：保羅在哥林多說「這權柄我全沒有用過」（林前 9:15），在這裡卻收錢——傳道人到底可不可以收錢？</p>"],["自養說（傳道人應當自食其力）","","<p>以保羅在哥林多與帖撒羅尼迦「晝夜做工」（帖前 2:9）、做帳棚為業（徒 18:3）為模式，認為傳道人最好有自己的職業，不靠教會供養，免得福音被錢財拖累、被人懷疑動機；今天的「帶職事奉」與部分宣教模式都承接這個精神。</p><p><strong>難處：</strong>保羅自己說這是他放棄的「權柄」，不是給所有人的規矩：「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14）；他也收下腓立比的供給，甚至說「我虧負了別的教會，向他們取了工價來給你們效力」（林後 11:8）。把自養當成唯一屬靈的方式，會讓需要被供養的同工活在羞恥裡。</p>"],["供養說（傳道人應當得著供給）","","<p>以「工人得工價是應當的」（路 10:7）與「在道理上受教的，當把一切需用的供給施教的人」（加 6:6）為根據，認為教會有責任供養全職同工與宣教士，讓他們專心傳道；腓立比教會正是這樣的榜樣。</p><p><strong>難處：</strong>這個說法若被濫用，就會變成向會眾施壓：「不奉獻就是虧欠神僕」；或讓傳道人把供給當成理所當然，甚至藉信仰斂財。保羅明說「我並不求甚麼餽送」，他在乎的是給的人的果子，不是自己的收入。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「兩者都是保羅的做法，原則是福音不被阻隔」。</strong>保羅在哥林多拒收，是「免得基督的福音被阻隔」（林前 9:12）；在腓立比收下，是因為這是一份從「頭一天」就開始的福音合夥（1:5）。所以傳道人可以收錢，也可以為了福音的緣故選擇不收。</p><p>判準在 4:17–18：收的人不操控、不貪求，能誠實說出需要，也能說「我樣樣都有」；給的人甘心，不被罪疚推著；這筆錢在神面前是馨香的祭物（這使我們想起出 29:18），在給的人帳上是果子。這也是 321「人比事重要」的樣子：保羅收了錢，在乎的是人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你也許看過藉信仰斂財的人，也許被奉獻的壓力傷過，這些都是真實的錯誤，不是福音本身。腓立比教會給我們看見另一幅畫面：一間不富有的教會，一次兩次地打發人供給一位坐監的使徒；他們給的，在神面前是極美的香氣。</p>"]],"con":[],"say":"本講義的立場：傳道人可以收錢，也可以為福音選擇不收——保羅兩種都做過，原則是福音不被阻隔。健康的「授受」是收的人不操控、能誠實說出需要，給的人甘心；奉獻在神面前是極美的香氣，不是交易，也不是罪疚。","care":"會眾席上可能有曾經被要求「不奉獻就不蒙福」而受傷的人，有自己薪水很低、不敢開口的傳道同工與師母，也有在異鄉、靠代禱信維生的宣教士家庭。講台上談奉獻時，不點名、不公開比較奉獻的數字，不用罪疚或恐嚇推人。會後陪伴時，對被奉獻傷過的人，先承認那份傷害；對有需要的同工，讓教會有安全、體面的方式知道並回應。"},{"id":"ISS04_9","t":"4:19「使你們一切所需用的都充足」——奉獻換祝福嗎？","r":"4:19--20；4:17；林後8:1--5；林後9:6--8；瑪3:10；提前6:9--10","ch":[4],"why":"4:19 是許多奉獻呼籲最後引用的一節：「你奉獻越多，神越使你富足。」可是也有人奉獻之後仍然缺乏，開始懷疑神不守應許，或被說「是你奉獻得不夠」。這一題關乎 4:19 寫給誰、應許的是甚麼，也關乎教會怎樣談錢才不變成交易。","pos":[["【一】經文問的是甚麼","","<p>「我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。」（4:19）<strong>πληρώσει πᾶσαν χρείαν ὑμῶν</strong>（plērōsei pasan chreian hymōn）：χρεία 是「需要」，與 4:16 保羅的「需用」同一個字。上一節保羅說他自己「已經充足」（4:18），同一個動詞；下一節他立刻轉入敬拜：「願榮耀歸給我們的父神，直到永永遠遠。阿們！」（4:20）問題是：4:19 是一條奉獻的回報公式嗎？</p>"],["回報公式說（奉獻多，得著多）——本講義明確不採","","<p>常與瑪 3:10「以此試試我，是否為你們敞開天上的窗戶」和林後 9:6「少種的少收，多種的多收」並用，主張奉獻是一種屬靈投資：給神越多，神回報越多，而且多半指金錢與物質。它吸引人的地方是真實的：神確實厚賜，奉獻的人確實蒙福。</p><p><strong>難處：</strong>4:19 寫給的是一間「在極窮之間還格外顯出他們樂捐的厚恩」（林後 8:2）的教會——不是一間有錢的教會在投資；應許的是「所需用的」，不是「所想要的」；林後 9:8 說的豐富，目的是「能多行各樣善事」，不是自己致富。把奉獻講成投資，等於把敬拜變成交易，也把仍然缺乏的人推到「奉獻不夠」的羞恥裡。</p>"],["屬靈化說（4:19 只指屬靈的需要）","","<p>為了避開成功神學，有人主張 4:19 的「需用」只指屬靈的需要：恩典、平安、忍耐，與物質無關。</p><p><strong>難處：</strong>上下文談的正是很實際的錢：腓立比人寄來的餽送，供給保羅的「需用」（4:16，同一個字）。保羅說他「已經充足」，指的是有東西吃、有地方住。神是顧念人身體需要的神，「我們日用的飲食，今日賜給我們」（太 6:11）；把 4:19 完全屬靈化，也削弱了它的安慰。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_5：4:19 不是奉獻換富足，成功神學明確不採（紅線四）。</strong>4:19 是一位父親對一群已經為福音奉獻到很窮的孩子說的話：你們照顧了我的需要，我的神必照顧你們的需要——包括身體與屬靈的需要，而且是「照他榮耀的豐富」「在基督耶穌裡」，不是照我們奉獻的數目。</p><p>保羅說「我的神」，這是他在鎖鍊裡親身試過的神；這一段談錢的話，用敬拜收尾（4:20）。錢的話題若不能讓人更愛神，就是談錯了方向。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你奉獻之後仍然缺乏，神沒有失約；他的應許從來不是一張利息表。腓立比人奉獻之後也沒有變富，可是他們的帳上有了果子（4:17），他們的餽送成了神喜悅的香氣（4:18）。你可以把你的需要誠實地說給「我的神」聽，也讓教會知道；神常常是透過一群人，把所需用的送到你手上。</p>"]],"con":[],"say":"本講義的立場：4:19 是給一間奉獻到極窮的教會的應許，應許的是「所需用的」，不是「所想要的」，而且照神榮耀的豐富、不照奉獻的數目；奉獻換富足、成功神學明確不採。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有把房貸、學費都奉獻出去卻仍然困頓的家庭，有被「奉獻就蒙福」的講法誘導而負債的人，也有因為奉獻不多、一聽到奉獻呼籲就低下頭的長者與學生。講台上不要承諾奉獻會帶來金錢回報，也不要把缺乏說成奉獻不夠。會後陪伴時，先關心他實際的需要，教會能幫的就具體地幫；不要只對一個缺乏的人引用 4:19 就離開。"}],"terrain":{"points":[[0.683,72,6,"動了善工的，必成全這工",null],[1.05,28,17,"意思要加增我捆鎖的苦楚",null],[1.183,90,21,"我活著就是基督","top"],[1.75,4,8,"以至於死，且死在十字架上","bot"],[1.85,98,11,"無不口稱「耶穌基督為主」","top"],[2.383,26,27,"他實在是病了，幾乎要死",null],[2.857,82,8,"以認識我主基督耶穌為至寶",null],[3.333,14,18,"是基督十字架的仇敵","bot"],[3.429,92,20,"我們卻是天上的國民","top"],[3.565,36,2,"我勸友阿蝶和循都基",null],[4.0,30,12,"我知道怎樣處卑賤","bot"],[4.043,94,13,"凡事都能做","top"]]},"tracks":[{"gk":"χαρά／χαίρω","tr":"chara / chairō","gl":"喜樂、歡喜、一同喜樂","code":"G5479","root":"χαρά——喜樂；χαίρω——歡喜、喜樂（也是希臘人見面、寫信的問安語）；συγχαίρω——一同喜樂。全卷 16 次，平均每六節半一次；寫信的人在監裡。路加福音講義已立此字（天上的喜樂），本卷是監裡的喜樂","ins":"喜樂是腓立比書的簽名，而寫信的人身上有鎖鍊。第一站是禱告裡的喜樂：「常是歡歡喜喜地祈求」（1:4）。1:18 是第一個翻轉：有人故意傳基督來為難他，保羅說「無論怎樣，基督究竟被傳開了。為此，我就歡喜，並且還要歡喜」——喜樂變成一個選擇。他留在世上，是要「使你們在所信的道上又長進又喜樂」（1:25）；他的喜樂繫在別人的合一上：「使我的喜樂可以滿足」（2:2）。2:17 是最深的一站，面對可能的殉道：「我若被澆奠在其上，也是喜樂」，而且馬上是「一同」——「你們也要照樣喜樂，並且與我一同喜樂」（2:18）。以巴弗提病好回家，「叫你們再見他，就可以喜樂」（2:28），「你們要在主裡歡歡樂樂地接待他」（2:29）。3:1 喜樂第一次成為命令，而且有地址：「你們要靠主喜樂」。4:1 喜樂是一群人：「你們就是我的喜樂，我的冠冕」。4:4 是頂點：「你們要靠主常常喜樂」，再說一次。最後一站是為一份餽送：「我靠主大大地喜樂」（4:10）。喜樂從情感變成選擇，從選擇變成獻上，最後成為命令——每一次轉折的支點都是「在主裡」。","stops":[["1:4","常是歡歡喜喜地祈求",""],["1:18","為此，我就歡喜，並且還要歡喜","top"],["1:25","使你們在所信的道上又長進又喜樂",""],["2:2","使我的喜樂可以滿足","top"],["2:17","我若被澆奠在其上，也是喜樂","top"],["2:18","你們也要照樣喜樂，並且與我一同喜樂",""],["2:28","叫你們再見他，就可以喜樂",""],["2:29","你們要在主裡歡歡樂樂地接待他",""],["3:1","你們要靠主喜樂","top"],["4:1","你們就是我的喜樂，我的冠冕",""],["4:4","你們要靠主常常喜樂","top"],["4:10","我靠主大大地喜樂",""]]},{"gk":"φρονέω","tr":"phroneō","gl":"意念、心思、存心、思念、以……為念、同心","code":"G5426","root":"φρονέω——想、存心、以……為念；不只是腦子裡的念頭，是一個人整個心的方向。字根 φρήν 原指橫膈膜、心胸。全卷 10 次；2:3 ταπεινοφροσύνη（存心謙卑）是同一個字根","ins":"φρονέω 是腓立比書的心。第一站是保羅對他們的心：「我為你們眾人有這樣的意念，原是應當的」（1:7）。2:2 變成合一的命令，一節兩次：「有一樣的心思，有一樣的意念」；怎樣才能？「只要存心謙卑」（2:3）——謙卑原文就是一種低下來的心思。2:5 是全卷的樞紐：「你們當以基督耶穌的心為心」，心的樣本是那一位倒空自己的主。3:15 成熟的心是還在追求的心：「凡是完全人總要存這樣的心」。3:19 是翻轉：十字架的仇敵「專以地上的事為念」——心朝下，不是朝上。4:2 這個字落在兩位吵架的姊妹身上：「要在主裡同心」，原文就是「想同一件事」。最後一站，心化成了行動：「因為你們思念我的心如今又發生」（4:10），一份餽送從腓立比走到羅馬。改變觀念就改變生命——φρονέω 是心與腦合在一起的那個字。","stops":[["1:7","我為你們眾人有這樣的意念，原是應當的",""],["2:2","有一樣的心思，有一樣的意念","top"],["2:3","只要存心謙卑",""],["2:5","你們當以基督耶穌的心為心","top"],["3:15","凡是完全人總要存這樣的心",""],["3:19","專以地上的事為念","bot"],["4:2","要在主裡同心","top"],["4:10","因為你們思念我的心如今又發生","top"]]},{"gk":"εὐαγγέλιον","tr":"euangelion","gl":"福音","code":"G2098","root":"εὐαγγέλιον——好消息；在羅馬世界原指皇帝登基、打勝仗的捷報。保羅在一座羅馬殖民城裡，宣告另一位主的捷報。全卷 9 次","ins":"福音在腓立比書裡是一門合夥的事業。第一站：「你們是同心合意地興旺福音」（1:5），原文是「在福音上的合夥」。1:7 福音進了法庭：「辯明證實福音的時候」。1:12 是翻轉：捆鎖沒有關住福音，「我所遭遇的事更是叫福音興旺」，興旺原文是開路的工兵。1:16 坐監是一個任命：「知道我是為辯明福音設立的」。1:27 福音變成一種過日子的方式：「只要你們行事為人與基督的福音相稱」，同一節還有「為所信的福音齊心努力」。2:22 福音在一對屬靈父子之間：「他興旺福音，與我同勞」。4:3 福音在兩位吵架的姊妹身上：「她們在福音上曾與我一同勞苦」。最後一站，福音和一筆錢連在一起：「我初傳福音離了馬其頓的時候」，只有腓立比人供給他。建立屬神的體系，就是一群人合夥興旺福音。","stops":[["1:5","你們是同心合意地興旺福音","top"],["1:7","辯明證實福音的時候",""],["1:12","我所遭遇的事更是叫福音興旺","top"],["1:16","知道我是為辯明福音設立的",""],["1:27","只要你們行事為人與基督的福音相稱","top"],["2:22","他興旺福音，與我同勞",""],["4:3","她們在福音上曾與我一同勞苦",""],["4:15","我初傳福音離了馬其頓的時候",""]]},{"gk":"κοινωνία／συν-","tr":"koinōnia / syn-","gl":"同心合意、一同得恩、交通、一同受苦、一同做工、一同當兵、同負一軛、授受","code":"G2842","root":"κοινωνία——合夥、共享、團契（κοινός：共同的）；συν-——「一同」。腓立比書幾乎每一章都有人被稱作「同」甚麼的：同得恩、同隊、同工、同袍、同軛、同效法、同受患難","ins":"κοινωνία 不是聚會後喝咖啡，是合夥做同一件事。第一站是福音的合夥：「同心合意地興旺福音」（1:5）；所以保羅說「你們都與我一同得恩」（1:7），連他的捆鎖都是合夥的。1:27 合夥的人是同一隊的運動員：「為所信的福音齊心努力」。2:1 指出合夥的源頭：「聖靈有甚麼交通」。2:25 以巴弗提是「與我一同做工，一同當兵」的同袍。3:10 是最深的一站，與基督合夥受苦：「曉得和他一同受苦」。3:17 合夥也是學習：「你們要一同效法我」。4:3 是同一頭軛下的兩頭牛：「這真實同負一軛的」。4:14 苦難也是合夥的：「你們和我同受患難原是美事」。最後一站是一筆奉獻：「論到授受的事」，原文就是「在給與受的事上合夥」。321 的 235——同伴、父子、戰友——在這卷書裡都是 συν-。","stops":[["1:5","同心合意地興旺福音",""],["1:7","你們都與我一同得恩","top"],["1:27","為所信的福音齊心努力",""],["2:1","聖靈有甚麼交通","top"],["2:25","與我一同做工，一同當兵",""],["3:10","曉得和他一同受苦","top"],["3:17","你們要一同效法我",""],["4:3","這真實同負一軛的","top"],["4:14","你們和我同受患難原是美事",""],["4:15","論到授受的事",""]]},{"gk":"ἡγέομαι／λογίζομαι／σκοπέω","tr":"hēgeomai / logizomai / skopeō","gl":"看、以為、當作、看作、留意看、思念","code":"G2233","root":"ἡγέομαι——算為、看作（會計與判斷的字）；λογίζομαι——計算、算進去；σκοπέω——注目、看準（σκοπός 就是 3:14 的「標竿」）。三個字講同一件事：一個人怎樣看、怎樣算","ins":"改變觀點就改變觀念；這一條追蹤看一個人怎樣「看」、怎樣「算」。第一站是我們看人：「各人看別人比自己強」（2:3），而且「各人不要單顧自己的事，也要顧別人的事」（2:4）——眼睛要抬起來看別人。2:6 是全條的樞紐，基督怎樣看自己的權利：「不以自己與神同等為強奪的」。保羅也這樣看同工：病好的以巴弗提很想家，「我想必須打發以巴弗提到你們那裡去」（2:25），他把自己的需要放在後面。3:7 是保羅的會計帳：「我現在因基督都當作有損的」，3:8 整本帳翻過來：「看作糞土，為要得著基督」。他也這樣看自己：「我不是以為自己已經得著了」（3:13）。他要教會看對人：「也當留意看那些照我們榜樣行的人」（3:17）。最後一站，把對的東西算進心裡：「這些事你們都要思念」（4:8）。基督怎樣看，保羅就怎樣看，我們就學著怎樣看。","stops":[["2:3","各人看別人比自己強","top"],["2:4","各人不要單顧自己的事，也要顧別人的事",""],["2:6","不以自己與神同等為強奪的","top"],["2:25","我想必須打發以巴弗提到你們那裡去",""],["3:7","我現在因基督都當作有損的","top"],["3:8","看作糞土，為要得著基督","top"],["3:13","我不是以為自己已經得著了",""],["3:17","也當留意看那些照我們榜樣行的人",""],["4:8","這些事你們都要思念","top"]]}],"lesson":{"1":{"no":1,"vol":"《321腓立比書講義》第一課·腓立比書第一章","title":"呂底亞家裡讀出來的那一封信——鎖、活、稱","chars":5153,"min":60,"deep":8,"dchars":1737,"tchars":1375,"blocks":[["h","一、一封信在呂底亞家裡打開"],["p","弟兄姊妹平安。這是一封信，原本不是寫來給一個人安靜地讀的，是寫來給一屋子的人一起聽的。請你想像腓立比，呂底亞家裡，晚上，油燈點起來了。以巴弗提回來了，聽說他在羅馬病得幾乎要死；現在他瘦了一圈，從懷裡拿出一捲羊皮紙，說：保羅寫的。"],["p","屋裡的人只想問一句：他還活著嗎？可是讀信的人念出來的第一行，不是近況，是一個身分：「基督耶穌的僕人保羅和提摩太寫信給凡住腓立比、在基督耶穌裡的眾聖徒，和諸位監督，諸位執事。」（1:1）保羅寫給加拉太、哥林多，開口都先說自己是使徒；這一封沒有。他和年輕的提摩太站在同一個名分底下：奴僕。"],["p","接著，屋裡每一個人都聽見了自己。「眾聖徒」排在最前面，「監督」「執事」排在後面。賣紫色布的呂底亞，從前被鬼附的使女，十年前在監門口拔刀的禁卒，全都被叫作聖徒。聖徒不是死後被追封的少數人，是每一個在基督耶穌裡的人。請記住這個次序，這一課到最後都會用到：先知道自己是誰，才知道為別人可以放下甚麼。"],["p","然後讀信的人念到：「我每逢想念你們，就感謝我的神」（1:3），又說他「常是歡歡喜喜地祈求」。全卷講喜樂十六次，第一次是在代禱裡。理由在下一節：「因為從頭一天直到如今，你們是同心合意地興旺福音。」（1:5）「同心合意」原文是生意場上的字：合夥。腓立比人不是台下的觀眾，是一起出錢、出力、出禱告的股東。從呂底亞在河邊打開家門那一天起，十年沒有退股。"],["p","於是有了這一章最穩的一句：「我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。」（1:6）開工的是他，完工的也是他。人蓋房子會爛尾，神開的工不會停在一半。保羅對這間教會有把握，不是因為他們表現得好，是因為他認得那一位開工的。這一章的第一個主詞是神。"],["p","他的禱告沒有求處境變好，求的是：「要你們的愛心在知識和各樣見識上多而又多」（1:9），「使你們能分別是非，作誠實無過的人」（1:10）。這間教會很會愛，保羅卻求他們的愛長出眼睛：愛沒有分辨會被利用，分辨沒有愛會變成挑剔。禱告落在「叫榮耀稱讚歸與神」（1:11）。用書信三問來讀，第一問的答案在這幾行裡：腓立比人正為一個坐監的人擔心，裡面也開始有人互相看不順眼。這一課我們跟著那一晚的讀信聲，走完第一章：鎖、活、稱。"],["d",["保羅在這封信開頭為甚麼不稱自己是使徒，只說是「僕人」？","保羅寫給加拉太、哥林多、以弗所，開口都先說自己是使徒，因為那幾間教會有人質疑他的權柄，或需要他用權柄說話。腓立比人沒有質疑他，他不必替自己辯護，所以只說「僕人」，而且是和年輕的提摩太並列的複數。這個字在 2:7 要再出現一次，用在基督身上：「取了奴僕的形像」。信的第一個字，已經在替基督之歌鋪路。可是請留意，奴僕不是沒有身分，是身分清楚地歸屬一位主人；保羅知道自己是誰，才說得出這個稱呼。帶領者可以問自己：我先說頭銜，還是先說我屬於誰？"]],["d",["「動了善工的，必成全這工」是不是保證一次得救、永遠得救？","這一節給的是確據，不是隨便活的許可。保羅在這裡說的是他對一群人的確信，不是一條系統神學的命題；歷代教會對「一次得救，永遠得救」有不同的理解，改革宗強調神的保守，衛斯理宗強調人要持續回應，各家討論見本章議題頁。本講義的讀法是：1:6 要和 2:12--13 一起讀，做成的是我們，成全的是神，人才不會活在怕掉下去的恐懼裡，也不會變成躺著等。對一位覺得自己靈命爛尾的人，這一節的意思很簡單：那件事今天不是落在你的意志上，是落在開工的那一位手上（全卷立場見 ISS00_4）。"]],["h","二、鍊子和那些人：焦點的兩次考驗"],["p","信讀到第十二節，屋裡的人終於等到近況了。可是保羅的報告是這樣開頭的：「弟兄們，我願意你們知道，我所遭遇的事更是叫福音興旺」（1:12）。腓立比人問的是他好不好，他回答的是福音好不好。他沒有說坐監不苦；他只是不讓苦成為這個故事的主詞。"],["p","然後他說了兩件出人意料的事。第一件，他的捆鎖在御營全軍和其餘的人中，「已經顯明是為基督的緣故」（1:13）。看守他的兵一班一班地換，每一個都聽見了這個囚犯整天在講的那一位。第二件，羅馬的弟兄們看見帶頭的人被鎖住，照理該更怕，結果卻「越發放膽傳神的道，無所懼怕」（1:14）。這是全卷焦點的第一次考驗：環境。"],["p","第二次考驗更難，是人。「有的傳基督是出於嫉妒紛爭，也有的是出於好意」（1:15）。這些人不是異端，他們傳的是基督；錯的是心。他們趁保羅被鎖住，想搶他的影響力，保羅說他們的「意思要加增我捆鎖的苦楚」（1:17）。請留意，保羅沒有說我一點都不在意，他說那是苦楚；他也沒有假裝大家都是好意，他分辨了，而且說出來了。這正是第十節那雙有眼睛的愛。"],["p","接下來那一句，是整段的轉彎：「這有何妨呢？或是假意，或是真心，無論怎樣，基督究竟被傳開了。」（1:18）保羅看清了他們的心，卻不讓他們的心坐在自己生命的中心。審判人心的事，他交給神；他只看一件事：基督有沒有被傳開。所以他說：「為此，我就歡喜，並且還要歡喜」（1:18）。如果他的喜樂要等嫉妒他的人先悔改，他這輩子就喜樂不起來了。"],["p","這裡要分清楚兩件事。動機不純，保羅放手；內容錯了，他一步也不讓。加拉太書講義第 1 章講過，傳別的福音的，保羅說「他是可詛咒的」；第 3 章他也要說「應當防備」。所以「這有何妨」不是甚麼都可以，也不是叫被傷害的人閉嘴，是把審判的座位讓出來。"],["d",["動機不純的人傳道也可以接受嗎？那我是不是不該分辨別人的動機？","保羅分清楚了兩件事。第一，內容。那些人傳的是基督，是真福音，所以保羅說「這有何妨」；如果內容被改了，像加拉太那些要外邦人受割禮才能得救的教導，他一步也不讓。第二，動機。保羅看出來了，也說出來了，他沒有假裝看不見；他放手的是審判那些人內心的座位，交給神。所以分辨不是錯，1:10 正是求愛心「能分別是非」。只是分辨之後，不讓別人的動機佔據你生命的中心。若那已經是欺壓或傷害，請找一位信得過的牧者一起處理，不要一個人忍（全卷判準見 ISS00_9）。"]],["h","三、原文亮光：被夾住的人，挑了更要緊的"],["p","然後信讀到了全章最安靜的一段。保羅先說他知道這一切「藉著你們的祈禱和耶穌基督之靈的幫助，終必叫我得救」（1:19）。一邊是一群人的禱告，一邊是基督之靈的供應，他不是靠意志硬撐。他真正怕的不是死，是羞愧；他只求：「無論是生是死，總叫基督在我身上照常顯大」（1:20）。審訊的結果不在他手上，生死的主權在神手上。請你先抓住這一句，它是這一整段的鑰匙。"],["p","第一個原文字，在全新約最有名的一句裡：「因我活著就是基督，我死了就有益處。」（1:21）前半句原文是 ἐμοὶ γὰρ τὸ ζῆν Χριστὸς（emoi gar to zēn Christos），沒有動詞，只是並排擺著兩樣東西：對我來說，活著，基督。保羅活著的內容是一個人。這不是保羅消失了；他的個性、想念和眼淚都還在，只是中心換了。後半句的「益處」是生意人的字，賺到。賺到甚麼？請不要自己填空，保羅在第二十三節自己說了。"],["p","第二個原文字：συνέχομαι（synechomai）。「我正在兩難之間，情願離世與基督同在，因為這是好得無比的。」（1:23）「兩難」這個字是被兩邊同時壓住、夾住，像人被人群擠在中間動不了。一邊是想見主，「離世」原文 ἀναλῦσαι（analysai）是拔營、解纜，收起帳棚回到主人那裡；一邊是「我在肉身活著，若成就我工夫的果子」（1:22）。請留意：保羅說死了的益處，是「與基督同在」。益處是一個人，不是一個出口；他不是活膩了，他是兩邊都看見了好。"],["p","第三個原文字，是這一段真正的結論：「然而，我在肉身活著，為你們更是要緊的。」（1:24）「更是要緊的」原文是 ἀναγκαιότερον（anankaioteron），「必要的」比較級：比較起來，更非如此不可。對他自己，離世好得無比；對腓立比人，他活著更不可少。他挑了後者，而決定他留下來的，是別人的需要。所以他接著說：「我既然這樣深信，就知道仍要住在世間，且與你們眾人同住，使你們在所信的道上又長進又喜樂」（1:25）。"],["p","所以這不是一段羨慕死亡的經文，是一段選擇活下去的經文；教這一段，一定讀到第二十四、二十五節。停在第二十一或二十三節，就把保羅自己關上的門重新打開了。第二十六節更溫柔：一個剛談完生死的人，最後想的是「因我再到你們那裡去，就越發加增」。這一段生與死，不是落在墳墓上，是落在一次團聚上。"],["p","那一晚屋裡坐著一個人，十年前在監門口聽見保羅大喊：「不要傷害自己！我們都在這裡。」（徒 16:28）十年後，同一個人在另一間監牢裡寫信說：為你們，我留下。如果你今天心裡有一個說不出口、不想再活下去的念頭，我要先說：這不是因為你信心不夠，保羅也被夾在兩邊。我也要照著第二十四節說：你在肉身活著，對我們是要緊的。請今天就告訴一位信得過的人，也去找醫生、輔導或危機支援，那和禱告不衝突。"],["d",["保羅說「情願離世」，那麼基督徒心裡有想死的念頭，是罪嗎？","先說清楚：保羅的「情願離世」是想與基督同在，不是想逃離痛苦；而且他的結論是活下去，1:24 說「為你們更是要緊的」。至於一個人心裡出現不想活的念頭，那本身不是罪，也不是信心不夠。以利亞曾在羅騰樹下求死，保羅也說過「甚至連活命的指望都絕了」（林後 1:8），神的回應是供應與陪伴，不是責備。可是這個念頭需要被說出來、被陪伴、被保護。如果你有，請今天就告訴一位信得過的人，也請去看醫生、找輔導，或打當地的危機支援電話；如果你身邊的人說出這樣的話，先聽，不說教，不離開他，陪他一起找專業協助（全卷立場見 ISS00_3）。"]],["d",["「離世與基督同在」是說人死後立刻到主那裡，還是睡了等復活？","1:23 把「離世」和「與基督同在」緊緊連在一起，中間看不出一段沒有知覺的空白；路加福音 23:43 主對十字架上的強盜說「今日」，林後 5:8 說「離開身體與主同住」，多數福音派因此讀成：信徒死後，靈魂立刻與主同在，身體等候將來的復活。也有傳統主張靈魂睡覺說。本講義採多數福音派的讀法，但兩邊都同意最後的盼望是身體復活，3:21 說我們卑賤的身體要改變形狀，和他榮耀的身體相似。這一節可以安慰喪親的人，卻不可以拿來叫人不要哭；耶穌在拉撒路的墳前也哭了（全卷立場見 ISS00_3）。"]],["h","四、天國放在腓立比的一塊領土"],["p","信讀到第二十七節，屋裡的人都會心一笑，因為保羅用了一個只有腓立比人最懂的字。使徒行傳介紹這座城只用一句話：「也是羅馬的駐防城」（徒 16:12）。腓立比是一座小羅馬：居民多是退伍軍人的後代，以羅馬公民為榮。保羅寫：「只要你們行事為人與基督的福音相稱」（1:27）。「行事為人」原文是 πολιτεύεσθε（politeuesthe），像公民一樣過日子。腓立比是羅馬放在馬其頓的一塊領土；教會，是天國放在腓立比的一塊領土。"],["p","請留意這個命令的次序。保羅不是說，你們表現好，才能成為天國的公民；他是說，你們已經是了，就照這個身分過日子。和第一節一樣，身分在先，行事在後。「相稱」像秤的兩邊：你的日子放上去，要和你所信的福音一樣重。"],["p","然後是公民不是一個人當的：「同有一個心志，站立得穩，為所信的福音齊心努力」（1:27）。「齊心努力」是同一隊的運動員。因為這間教會已經有人各踢各的球門了。他還加了一句容易被跳過的話：「或來見你們，或不在你們那裡」。教會成不成熟，是看帶領的人不在的時候，大家還朝不朝同一個方向站。"],["p","這一隊人面對的是真的比賽。保羅沒有叫他們去打敵人，只說「凡事不怕敵人的驚嚇」（1:28），又說「你們得救都是出於神」（1:28）。站著不動，本身就是見證；不必驚慌，也不必報復，因為得救不是出於我們吵不吵得贏。"],["p","最後一句最需要講慢：「因為你們蒙恩，不但得以信服基督，並要為他受苦。」（1:29）「蒙恩」是白白給的禮物，保羅把為基督受的苦也放在禮物底下。意思不是苦難本身是好東西，是說為基督受苦的人沒有被神丟下。所以這一節不能拿來叫病人不去看醫生，也不能叫受傷害的人留在危險裡；保羅自己在腓立比被打以後，也亮出羅馬公民的身分，要官長「自己來領我們出去」（徒 16:37）。"],["p","這一章收在一句話：「你們的爭戰，就與你們在我身上從前所看見、現在所聽見的一樣。」（1:30）從前看見的是十年前保羅被打；現在聽見的，就是這一晚讀出來的信。書信三問的第二問到這裡有了答案：生命的內容是基督，生死的主權在神，活著是為了別人的長進，日子照天國公民的身分過。第三問，落在今天的病床、職場、家裡和教會。"],["d",["「蒙恩……並要為他受苦」，是不是表示病痛和被欺負都要甘心忍受？","不是。1:29 說的是「為他」受苦，就是因為信基督、跟隨基督而付的代價，像腓立比人因不拜皇帝被城裡的人為難。保羅把這種苦放在「蒙恩」底下，意思是受苦的人沒有被神丟下，他正和基督同行；不是說苦難本身是好東西，也不是神喜歡看人痛。所以病痛要治療，家暴和霸凌要尋求保護與法律的幫助。保羅自己在腓立比被打以後，也用羅馬公民的身分保護自己，要官長親自來領他出去。說「這是蒙恩，你要忍」，是把恩典講成了枷鎖。若有人正處在危險中，先保護安全，再談其他（全卷立場見 ISS00_3）。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是停在 1:21 或 1:23，把這一章講成越屬靈的人越想早點離開，或用很美的話浪漫化死亡。保羅說的益處是一個人，不是一個出口；這一段的結論是 1:24--25：他選擇住在世間，為了別人。"],["p","第二個偏差，是對說出不想活的人說「你信心不夠」，或用「自殺的人不能上天堂」來嚇他。定罪只會讓他更孤單、更不敢開口。教會的第一句話，是禁卒聽見的那一句：不要傷害自己，我們都在這裡；然
